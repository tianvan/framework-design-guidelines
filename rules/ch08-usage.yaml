- id: FDG8103
  strength: DO
  text: implement `operator==` with the mathematical reflexive and transitive properties.
  context: null
  section: 8.13 Equality Operators
  anchor: sec8_13
  body:
    - kind: paragraph
      text: The mathematical reflexive property states that when `a == b`, then `b == a`. To maintain the reflexive property when you define the equality operator against another type, you need to define it twice—once with this type as the first parameter, and once with this type as the second parameter. You also need to ensure that the values are the same, of course.
    - kind: code
      text: |-
        // Bad: (int == SomeType) is not defined when (SomeType == int) is
        public partial struct SomeType {
         public static bool operator==(SomeType left, int right){ ... }
        }

        // OK: Both (int == SomeType) and (SomeType == int) are defined
        // OK: Both operators return the same answer for the same values
        // Bad: Not transitive (the next explanation)
        public partial struct SomeType {
         public static bool operator==(SomeType left, int right){ ... }

         public static bool operator==(int left, SomeType right)
           => right == left;
        }
    - kind: paragraph
      text: The mathematical transitive property states that when `a == b` and `b == c`, then a `== c`. To maintain the transitive property when you define the equality operator against another type, you need to also define an overload that compares two instances of the defining type.
    - kind: paragraph
      text: In the previous example, if we had two `SomeType` instances, we could compare them against each other by indirectly comparing them against some Int32 value that returns true for at least one instance, but we should be able to directly compare the two `SomeType` instances.
    - kind: code
      text: |-
        // OK: Now == is both transitive and reflexive.
        // Defining operator!= is an exercise left to the reader.
        public struct SomeType {
         public static bool operator==(SomeType left, int right){ ... }

         public static bool operator==(int left, SomeType right)
           => right == left;
         public static bool operator==(SomeType left, SomeType right) { ... }
        }
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG8103
    coverage: partial
  autofix: no
  severity:
    library: warning
    application: warning
    test: warning
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: operator ==({0}, {1}) needs the overload operator ==({2}, {3})
    category: Usage
  notes: FDG8103 reports an operator == whose parameter types differ (a Nullable<T> counting as its T) when the reversed overload is not declared in the declaring type or either parameter type (the reflexive property of the body), and, on the first such operator only, when the declaring type has no operator == taking two of its own instances (the transitive property). Whether the overloads return the same answer is not checked, so coverage is partial. Adding operators adds to the public API without changing a signature; there is no code fix.
- id: FDG8104
  strength: AVOID
  text: defining `operator==` with arguments of different types.
  context: null
  section: 8.13 Equality Operators
  anchor: sec8_13
  body:
    - kind: paragraph
      text: The addition of one different-type equality operator should be accompanied by the reflexive variant, the instance `Equals` method in the defining type, the instance (or extension) method for the comparison type, and both non-equality operators.
    - kind: paragraph
      text: Instead of defining six methods, consider defining a conversion operator (section 5.7.2) or exposing the compared value via a property. For example, equality between a `DateTime` and a `DateTimeOffset` value is possible because of a conversion operator from `DateTime` to `DateTimeOffset`, or more explicitly because `DateTimeOffset` has a property to return an equivalent `DateTime` value (`UtcDateTime`).
    - kind: code
      text: |-
        // Why do this much work?
        public partial struct DateTimeOffset {
         public static bool operator==(
           DateTimeOffset left, DateTime right) => left.Equals(right);

         public static bool operator==(
           DateTime left, DateTimeOffset right) => right.Equals(left);

         public static bool operator!=(
           DateTimeOffset left, DateTime right) => !left.Equals(right);

         public static bool operator!=(
           DateTime left, DateTimeOffset right) => !right.Equals(left);

         public bool Equals(DateTime other) { ... }
        }
        public static partial class DateTimeOffsetComparisons {
         public static bool Equals(
           this DateTime left, DateTimeOffset right)=> right.Equals(left);
        }

        // When you instead can do this much work?
        public partial struct DateTimeOffset {
         public DateTime UtcDateTime { get { ... } }
        }

        // Or this much work?
        public partial struct DateTimeOffset {
         public static implicit operator DateTimeOffset(DateTime value) { ... }
        }
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG8104
    coverage: full
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: warning
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Avoid operator == with arguments of different types ({0} and {1})
    category: Usage
  notes: "FDG8104 reports an operator == declared in source whose two parameter types differ; a Nullable<T> of the other parameter's type counts as the same type. The body's alternatives (a conversion operator or a property) replace the operator, which removes a public member, so the fix is breaking; there is no code fix. FDG8104 reports the OK examples of FDG8103 too: they show how to define such operators when a type does, which AVOID allows."
