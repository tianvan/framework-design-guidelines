- id: FDG8086
  strength: AVOID
  text: using serialization attributes or interfaces on public types in a general-purpose library, except for types that need to support serialization across AppDomains—such as Exception types.
  context: null
  section: 8.10 Serialization
  anchor: sec8_10
  body:
    - kind: paragraph
      text: In general, if your type needs attributes on the type, or any of its members, to work well with a specific serialization technology, then your type will need attributes for most of the other serialization technologies. This can provide significant frustration for your users when you support some serialization technology that they don’t (or can’t) use, and don’t support the technology that they are using.
    - kind: paragraph
      text: Supporting particular serializers will also frequently require adding assembly references you otherwise wouldn’t need. That can lead to unnecessary application bloat for applications that don’t use your chosen serializer.
    - kind: paragraph
      text: General-purpose types within general-purpose libraries should concentrate on functionality and usability within a programming context, and leave the decisions on serialization technologies to the application developer.
    - kind: paragraph
      text: Exception types and other types that explicitly support serialization across AppDomain boundaries—in the .NET runtimes that support multiple AppDomains per process—should continue to use the `[Serializable]` attribute.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: the text scopes it to public types in general-purpose libraries. Analyzer candidate rejected: whether a library is general purpose cannot be told from its code, and the serialization attributes and interfaces of the different serializers are an open set. The exception for types serialized across application domains, such as exception types, is FDG7058 (CA2237).'
- id: FDG8087
  strength: DO
  text: consider backward and forward compatibility when creating or changing serializable types.
  context: null
  section: 8.10 Serialization
  anchor: sec8_10
  body:
    - kind: paragraph
      text: Keep in mind that serialized streams of future versions of your type can be deserialized into the current version of the type, and vice versa.
    - kind: paragraph
      text: Make sure you understand the versioning semantics of your serializer. For example, some serializers use reflection to serialize fields. If your type supports one of those serializers, then renaming (and possibly reordering) even private fields can cause errors when deserializing data from a previous version of your library.
    - kind: paragraph
      text: Forward compatibility is also important, but is an often overlooked area. When an unknown property is encountered, should you ignore it, or should the application fail? Unfortunately, the answer is usually context-specific and depends on what the property represented. The most conservative answer is to fail on unknown data and to take the stance that once you’ve released a serializable type, you can’t ever add to it.
    - kind: paragraph
      text: Test compatibility of serialization when making changes to serializable types. Try deserializing the new version into an old version, and vice versa, across as broad a range as you expect your users to need.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: warning
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: compatibility across versions of a serialized stream is behavior that needs tests, as the body says.'
