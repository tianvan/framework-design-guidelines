- id: FDG8012
  strength: DO
  text: seal custom attribute classes, if possible. This makes the look-up for the attribute faster.
  context: null
  section: 8.2 Attributes
  anchor: sec8_2
  body:
    - kind: code
      text: 'public sealed class NameAttribute : Attribute { ... }'
    - kind: annotation
      text: In the exception section, I cautioned against the reuse of somebody else’s exception type. Here I am going to do the same for custom attributes. Reuse of somebody else’s custom attribute, unless it means exactly the same thing, puts your mutual clients in the awkward position of having to choose between avoiding your API and applying the co-opted attribute, which involves the risk of unexpected or expected (but undesirable) side effects from the original code that used the attribute.
      author: Jason Clark
  status: draft
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1813
    coverage: full
  autofix: breaking
  severity:
    library: warning
    application: warning
