    message: Avoid overloading equality operators on the mutable reference type '{0}'
    category: Usage
  notes: 'FDG8106 reports the first operator == declared in a class when the class or one of its base classes declared in source has an instance field that is neither readonly nor const (the field of an auto-property with a set accessor counts; an init accessor does not, and neither does the field of an event), the same mutability test as FDG8070. Immutable types are not reported, as the body allows. State that is mutable through a readonly field of a mutable type is not seen, so coverage is partial. CA1046 is mapped to FDG8100 instead: it reports immutable types too and leaves out types that override Equals. Removing the operators changes the public API, so the fix is breaking; there is no code fix.'
