- id: FDG8098
  strength: DO NOT
  text: subclass `XmlDocument` if you want to create a type representing an XML view of an underlying object model or data source.
  context: null
  section: 8.12 System.Xml Usage
  anchor: sec8_12
  body:
    - kind: paragraph
      text: This guideline means that `XmlDataDocument` is an example of what not to do.
    - kind: annotation
      text: |-
        There are several problems with implementations like `XmlDataDocument`. One is inefficiency. Because `XmlNodes` need to be distinct objects, such implementations result in large memory consumption. A second problem is that the data model of the `DataSet` does not map 1:1 with that of XML. There are all sorts of edge cases when one does things like insert comments, PIs, or CDATA sections into an `XmlDataDocument`.

        Implementing a custom `XPathNavigator` gets around the inefficiency problems because the navigator is a cursor; there is no need to create objects for each node in the tree. It also reduces the data/XML impedance mismatch. Because the main goal of `XmlDataDocument` was to enable users to either write out the `DataSet` as XML or query it with `XPath`, there is no need to support editability via the DOM. In addition, the simpler data model of the `XPathNavigator` leads to fewer edge cases in mapping your data model to XML.
      author: Dare Obasanjo
  status: draft
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1058
    coverage: full
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: warning
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA1058 reports a type derived from XmlDocument and suggests decoupling the XmlDocument representation from the type (probe with SDK 10.0.402). It cannot tell whether the type is an XML view of an object model or data source, the case the text names; a report on another kind of subclass is outside this rule. Changing the base type of a public type changes its public API, so the fix is breaking; CA1058 has no code fix.
