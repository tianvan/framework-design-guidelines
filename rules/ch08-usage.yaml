- id: FDG8002
  strength: DO
  text: remember that arrays are mutable types—even arrays of immutable types.
  context: null
  section: 8.1 Arrays
  anchor: sec8_1
  body:
    - kind: paragraph
      text: It’s easy to fall into the logical fallacy that “one `Int32` is immutable, so `new Int32[] { 1, 2 }` is also immutable,” especially when it comes to the `readonly` field modifier. But the `readonly` field modifier only prevents replacing the entirety of the array; changing element values via the indexer is still possible.
    - kind: paragraph
      text: 'This example demonstrates the pitfalls of using read-only array fields:'
    - kind: code
      text: |-
        //bad code
        public sealed class Path {
          public static readonly char[] InvalidPathChars =
            { '\"', '<', '>', '|'};
        }
    - kind: paragraph
      text: 'This allows callers to change the values in the array as follows:'
    - kind: code
      text: Path.InvalidPathChars[0] = 'A';
    - kind: paragraph
      text: Instead, you can either use a read-only collection (only if the items are immutable) or clone the array before returning it.
    - kind: code
      text: |-
        public static ReadOnlyCollection<char> GetInvalidPathChars() {
          return Array.AsReadOnly(badChars);
        }

        public static char[] GetInvalidPathChars() {
          return (char[])badChars.Clone();
        }
    - kind: paragraph
      text: Another option available to immutable element types is `ReadOnlySpan<T>`. The Span types, and the trade-offs that come from them, are discussed in section 9.12.
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG8002
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: warning
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Callers can change the elements of the read-only array field '{0}'
    category: Usage
  notes: 'FDG8002 reports an externally visible readonly field, static or instance, whose type is an array, as for Path.InvalidPathChars in the body: readonly protects the field, not the elements. Other ways of handing out an internal array (a method or property that returns it) are not seen, so coverage is partial; array properties are CA1819 (FDG8003). Replacing the field with a read-only collection or a method that returns a copy changes the public signature, so the fix is breaking; there is no code fix.'
- id: FDG8003
  strength: AVOID
  text: array properties.
  context: null
  section: 8.1 Arrays
  anchor: sec8_1
  body:
    - kind: paragraph
      text: 'Array-based property get methods can be implemented in one of four basic ways: direct state return, direct unauthoritative return, shallow-copy, and deep-copy. The distinction between the four implementations only matters when a caller writes to the returned array, or modifies an object exposed via the array.'
    - kind: list
      text: |-
        - Direct return is used by `ArraySegment<T>.Array`. This is in keeping with the purpose of `ArraySegment`, which effectively is to associate bounds with an array.
          ```
          public T[] Array => _array;
          ```
        - Direct unauthoritative return means the property uses a computed array, and returns the same array for two successive calls—assuming no object modification occurred between them. A caller writing back to the array doesn’t alter the behavior of other properties and methods on the object, but does corrupt the property for other callers. This technique is used by `NameValueCollection.AllKeys`.
          ```
          public string[] AllKeys {
           get {
             if (_allKeys == null) {
               _allKeys = new string[_entries.Count];
               for (int i = 0; i < _entries.Count; i++) {
                 _allKeys[i] = _entries[i].Key;
               }
             }
             return _allKeys;
           }
          }
          ```
        - Shallow-copy properties return a new array on every call, but reference types are not duplicated to make the new array. Object state can still be modified if the element type is a mutable reference type, but replacing values within the array has no effect on the object. This technique is used by `DataTable.PrimaryKey`.
          ```
          private List<Calendar> _calendars;
          public Calendar[] ShallowCalendars => _calendars.ToArray();
          ```
        - Deep-copy properties return a new array on every call, and the array contains new instances of any reference type values. The intent of a deep-copy is usually to completely avoid caller modifications affecting object state. Deep-copies are rare in .NET. Indeed, the few properties that technically perform deep-copy do so as a side effect of using `String.Substring` in the accessor method.
          ```
          public Calendar[] DeepCalendars {
           get {
             Calendar[] calendars = new Calendar[_calendars.Count];
             for (int i = 0; i < _calendars.Count; i++) {
               calendars[i] = (Calendar)_calendars[i].Clone();
             }
             return calendars;
           }
          }
          ```
        - When the array element type is fully immutable, a shallow-copy is as effective as a deep-copy for protecting the object state with a lower memory and CPU cost. The “value copy” deep-copy/shallow-copy hybrid technique is used by `NumberFormatInfo.NumberGroupSizes`.
          ```
          private int[] _numberGroupSizes;
          public int[] NumberGroupSizes {
           get => (int[])_numberGroupSizes.Clone();
          }
          ```
    - kind: paragraph
      text: Set methods can similarly be implemented in any of the four ways.
    - kind: paragraph
      text: Per the guidance that properties should be almost as fast as a field access (section 5.1.3), the direct and unauthoritative direct returns are the only techniques that should be used by properties. Nevertheless, the implementation for a little more than half of the array-based properties in .NET Standard 2.0 returns a copy of one form or another. Given the inconsistency with arrays, the recommendation is to use collection-based properties, `ReadOnlyMemory<T>` (see section 9.12), or methods— where a name like “GetRawBuffer” can convey that the array is being returned directly.
    - kind: paragraph
      text: If you’re defining an array transport type, like `ArraySegment<T>`, then a property directly returning the array is the most natural way of exposing the array back out.
  status: draft
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1819
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: warning
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA1819 reports an externally visible property that returns an array; in a probe with SDK 10.0.402 it did not report the array property of an attribute class, so coverage is partial. The body allows an array transport type such as ArraySegment<T> to return its array directly from a property; a report on such a type is not a violation and can be suppressed. CA1819 has no code fix, and turning the property into a method or a collection property changes the public signature, so the fix is breaking. CA1819 is shared with FDG5025 and FDG8032.
- id: FDG8004
  strength: CONSIDER
  text: using jagged arrays instead of multidimensional arrays.
  context: null
  section: 8.1 Arrays
  anchor: sec8_1
  body:
    - kind: paragraph
      text: A jagged array is an array with elements that are also arrays. The arrays that make up the elements can be of different sizes, leading to less wasted space for some sets of data (e.g., sparse matrix) compared to multidimensional arrays. Furthermore, the CLR optimizes index operations on jagged arrays, so they might exhibit better runtime performance in some scenarios.
    - kind: code
      text: |-
        // jagged arrays
        int[][] jaggedArray = {
           new int[] {1,2,3,4},
           new int[] {5,6,7},
           new int[] {8},
           new int[] {9}
        };

        // multidimensional arrays
        int [,] multiDimArray = {
          {1,2,3,4},
          {5,6,7,0},
          {8,0,0,0},
          {9,0,0,0}
        };
    - kind: annotation
      text: In general, I have found that usage of non-SZ (one dimension, zero lower bound) arrays in mainstream public APIs is very rare. Their usage should be constrained to problem areas that inherently lend themselves to multidimensional cases (such as matrix multiplication). All other usages should prefer defining a custom data structure or passing multiple arrays.
      author: Brad Abrams
  status: draft
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1814
    coverage: full
  autofix: breaking
  severity:
    library: suggestion
    application: suggestion
    test: suggestion
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA1814 reports multidimensional arrays in parameters, return types, fields and local variables (probe with SDK 10.0.402). The Abrams annotation limits them to problem areas that are multidimensional by nature, such as matrix multiplication; such reports are acceptable and can be suppressed. CA1814 has no code fix, and changing a parameter, return or field type of a public member changes its signature, so the fix is breaking.
