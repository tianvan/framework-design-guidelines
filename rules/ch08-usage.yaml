- id: FDG8018
  strength: DO
  text: use the least-specialized type possible as a parameter type. Most members taking collections as parameters use the `IEnumerable<T>` interface.
  context: null
  section: 8.3.1 Collection Parameters
  anchor: sec8_3_1
  body:
    - kind: code
      text: |-
        public void PrintNames(IEnumerable<string> names){
          foreach(string name in names){
            Console.WriteLine(name);
          }
        }
    - kind: annotation
      text: |-
        In design meetings, we would often describe this set of guidelines with the statement that you should “require the weakest thing you need, and return the strongest thing you have.”

        A nonobvious example that people sometimes miss is “out” parameters, which are really more like return values than input parameters and thus work a little better with the stronger typed objects.

        A less clear case is properties on return values on interfaces or abstract base types. In this case, they are both input and output. These usually work better with the weak types because they leave more options to the implementation.
      author: Anthony Moore
    - kind: annotation
      text: Of course, the strongest thing you have is often a type like `T[]` or `List<T>`, which previous guidelines have suggested not returning. It’s a balance.
      author: Stephen Toub
    - kind: annotation
