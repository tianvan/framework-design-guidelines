- id: FDG8022
  strength: DO
  text: use `ReadOnlyCollection<T>`, a subclass of `ReadOnlyCollection<T>`, or in rare cases `IEnumerable<T>` for properties or return values representing read-only collections.
  context: null
  section: 8.3.2 Collection Properties and Return Values
  anchor: sec8_3_2
  body:
    - kind: code
      text: public ReadOnlyCollection<Session> Sessions { get; }
    - kind: paragraph
      text: In general, prefer `ReadOnlyCollection<T>`. If it does not meet some requirement (e.g., the collection must not implement `IList`), use a custom collection by implementing `IEnumerable<T>`, `ICollection<T>`, or `IList<T>`. If you do implement a custom read-only collection, implement `ICollection<T>.ReadOnly` to return false.
    - kind: code
      text: |-
        public class SessionCollection : IList<Session> {

           bool ICollection<Session>.IsReadOnly { get { return false; } }
           ...
        }
    - kind: paragraph
      text: In cases where you are sure that the only scenario you will ever want to support is forward-only iteration, you can simply use `IEnumerable<T>`.
    - kind: annotation
      text: |-
        One of my favorite implementations of `IEnumerable<T>` is sometimes known as a generator. A generator is an iterator class or method that generates collection members on the fly, which is really useful when you’d prefer not to precompute something and then buffer it simply for convenient access. For example, the following is a generator method that computes as many numbers from the Fibonacci sequence as you care to ask for, wrapped in an `IEnumerable` for easy access via `foreach` or for passing to methods that take `IEnumerable` as input:

        ```
        class FibonacciGenerator{
          public static IEnumerable<long> GetSequence(int count){
            long fib1 = 0;
            long fib2 = 1;
            yield return fib1;
            yield return fib2;
            // assume they want at least 2, else what
            //fun are they?
            while(--count!= 1) {
              long fib3 = fib1 + fib2;
              yield return fib3;
              fib1 = fib2;
              fib2 = fib3;
            }
          }
        }
        class Program {
         static void Main() {
           foreach(long fib in FibonacciGenerator.GetSequence(100)){
             Console.WriteLine(fib);
          }
        }
        ```
      author: Chris Sells
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: warning
  config: []
