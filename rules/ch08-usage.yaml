- id: FDG8076
  strength: DO
  text: override `ToString` whenever an interesting human-readable string can be returned.
  context: null
  section: 8.9.3 Object.ToString
  anchor: sec8_9_3
  body:
    - kind: paragraph
      text: The default implementation is not very useful, and a custom implementation can almost always provide more value.
    - kind: annotation
      text: I consider `ToString` an especially dangerous method to provide for UI-generic types, because it’s likely to be implemented with some specific UI in mind, making it useless for other UI needs. To avoid tempting myself in this way, I prefer to make my `ToString` output as geeky as possible to emphasize that the only “humans” who should ever see the output are “developer humans” (a subspecies all their own).
      author: Chris Sells
    - kind: annotation
      text: 'I tend to be very careful with `ToString`. I treat it as a diagnostic API and seldom use it for presentation to users unless I know exactly how it works. Back when I was working with the source code to Expression Blend and had an instance of an object that represented a value converted to a string, there was no obvious API to return the string—but what do you know, `ToString` had just what I needed! It turned out I was wrong: `ToString` was returning debugging information that looked just like the value I wanted most of the time. Other times, however, it returned different diagnostic information and broke my code. The moral is use `ToString` only for diagnostics and define a separate method for end-user presentation.'
      author: Brian Pepin
    - kind: annotation
      text: The most important value of `ToString` is that the debugger uses it as the default way of displaying the object. This is really valuable and is well worth doing. Sadly, all too often we don’t do this and the debuggability of our code suffers. In my own code, for nontrivial types, I found that writing something that looked like an XML fragment was quite useful (it is unambiguous, and programmers understand its syntax).
      author: Vance Morrison
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: warning
  config: []
