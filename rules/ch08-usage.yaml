  section: 8.9.2 Object.GetHashCode
  anchor: sec8_9_2
  body:
    - kind: paragraph
      text: Note that there are several related guidelines throughout the book. In particular, some guidelines advise against mutable value types, and others advise against mutable reference types implementing value equality. See sections 8.9.1.2 and 4.7.
    - kind: annotation
      text: 'This has tripped me up more than once: Make sure `GetHashCode` always returns the same value across the lifetime of an instance. Remember that hash codes are used to identify “buckets” in most hashtable implementations. If an object’s “bucket” changes, a hashtable may not be able to find your object. These can be very hard bugs to find, so get it right the first time.'
