- id: FDG8106
  strength: AVOID
  text: overloading equality operators on mutable reference types.
  context: null
  section: 8.13.2 Equality Operators on Reference Types
  anchor: sec8_13_2
  body:
    - kind: paragraph
      text: Many languages have built-in equality operators for reference types. The built-in operators usually implement the reference equality, and many developers are surprised when the default behavior is changed to the value equality.
    - kind: paragraph
      text: This problem is mitigated for immutable reference types because immutability makes it much harder to notice the difference between reference equality and value equality.
