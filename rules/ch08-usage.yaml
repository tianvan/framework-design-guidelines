- id: FDG8073
  strength: DO
  text: make every effort to ensure that `GetHashCode` generates a uniform distribution of numbers for all objects of a type.
  context: null
  section: 8.9.2 Object.GetHashCode
  anchor: sec8_9_2
  body:
    - kind: paragraph
      text: This will minimize hashtable collisions, which degrade performance.
    - kind: paragraph
      text: For example, two strings will return the same hash code if they represent the same string value, as defined by the `String.Equals` implementation. Also, the method uses all the characters in the string to generate reasonably uniformly distributed output, even when the input is clustered in certain ranges (e.g., many users could have strings that contain only the lower 128 ASCII characters, even though a string can contain any of the several thousand Unicode characters).
    - kind: paragraph
      text: The built-in `HashCode` class allows for easy implementations of `GetHashCode()` that have good distribution characteristics.
    - kind: code
      text: |-
        public partial struct Size {
          public override readonly int GetHashCode() =>
             HashCode.Combine(Width, Height);
        }
