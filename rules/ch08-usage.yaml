      text: Types that do not follow this guideline will not work correctly when used as hashtable keys.
    - kind: annotation
      text: This means that if `obj1.Equals(obj2)` returns true, both of the objects should have the same hash code. If the objects aren’t equal, they might or might not have the same hash code. Strictly speaking, all objects could have a hash code of 1. This would really be terrible from a performance point of view when looking up such items in a hashtable, of course.
