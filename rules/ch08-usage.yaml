  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'CA1813 reports every attribute class that is neither abstract nor sealed, public or internal (probe with SDK 10.0.402), including one that other attributes derive from. The text says "if possible": an attribute that is meant to be a base class is a reason to keep it unsealed, and such a report can be suppressed. The SDK code fix seals the class (probe), and sealing a public class stops callers from deriving from it, which changes the public API, so the fix is breaking.'
- id: FDG8013
  strength: DO NOT
  text: use weakly typed collections in public APIs.
  context: null
  section: 8.3 Collections
  anchor: sec8_3
  body:
    - kind: paragraph
      text: The type of all return values and parameters representing collection items should be the exact item type, not any of its base types (this applies only to public members of the collection). For example, a collection storing Components should not have a public `Add` method that takes an `object` or a public indexer returning `IComponent`.
    - kind: code
      text: |-
        // bad design
        public class ComponentDesigner {
          public IList Components { get { ... } }
          ...
        }
        // good design
        public class ComponentDesigner {
          public Collection<Component> Components { get { ... } }
          ...
        }
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: the text scopes it to public APIs. Analyzer candidate rejected: the non-generic interfaces are accepted as inputs by FDG8019 and as extra interfaces by FDG8035, so whether a non-generic type in a signature is weakly typed depends on what the member does with it. CA1010 reports a collection type that implements only the non-generic interfaces (FDG8034), and CA1002, FDG8014 and FDG8015 report the concrete types.'
- id: FDG8014
  strength: DO NOT
  text: use `ArrayList` or `List<T>` in public APIs.
  context: null
  section: 8.3 Collections
  anchor: sec8_3
  body:
    - kind: paragraph
      text: These types are data structures designed to be used in internal implementation, not in public APIs. `List<T>` is optimized for performance and power at the cost of cleanness of the APIs and flexibility. For example, if you return `List<T>`, you will never be able to receive notifications when client code modifies the collection. Also, `List<T>` exposes many members, such as `BinarySearch`, that are not useful or applicable in many scenarios. Sections 8.3.1 and 8.3.2 describe types (abstractions) designed specifically for use in public APIs.
    - kind: paragraph
      text: Instead of using these concrete types, consider `Collection<T>`, `IEnumerable<T>`, `IList<T>`, `IReadOnlyList<T>`, or other collection abstractions.
    - kind: code
      text: |-
        // bad design
        public class Order {
          public List<OrderItem> Items { get { ... } }
          ...
        }
        // good design
        public class Order {
          public Collection<OrderItem> Items { get { ... } }
          ...
        }
        // also good design
        public class Order {
          public IList<OrderItem> Items { get { ... } }
          ...
        }
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG8014
      - CA1002
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Do not use ArrayList in the signature of '{0}'
    category: Usage
  notes: 'Library only: the text scopes it to public APIs. CA1002 reports List<T> as the type of a parameter, return value, property or field of an externally visible member (probe with SDK 10.0.402; an override was not reported). FDG8014 reports System.Collections.ArrayList in the same places: the type of a parameter, a return value or the result of a returned Task<T> or ValueTask<T>, a property or indexer, or a field of an externally visible member. Overrides and interface implementations are not reported, since their signature comes from another member. Types that only use ArrayList or List<T> as a type argument (IEnumerable<List<T>>) are not seen, so coverage is partial. Changing the type changes the public signature, so the fix is breaking; there is no code fix.'
