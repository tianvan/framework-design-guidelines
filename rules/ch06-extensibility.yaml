- id: FDG6016
  strength: CONSIDER
  text: providing reference tests for concrete implementations of abstractions. Such tests should allow users to test whether their implementations correctly implement the contract.
  context: null
  section: 6.1.5 Abstractions (Abstract Types and Interfaces)
  anchor: sec6_1_5
  body:
    - kind: annotation
      text: 'I like what the Windows Forms team did: They defined an interface called `System.ComponentModel.IComponent`. Of course, any type can implement this interface. But the Windows Forms team also provided a `System.ComponentModel.Component` class that implements the `IComponent` interface. So a type could choose to derive from `Component` and get the implementation for free, or the type could derive from a different base class and then manually implement the `IComponent` interface. By having available an interface and a base class, developers get to choose whichever works best for them.'
      author: Jeffrey Richter
    - kind: annotation
      text: Before shipping an abstraction, you should plan to validate it by building at least two or three distinct implementations and by using the abstraction in at least two or three distinct consumers. Those tests will provide you with a lot more confidence that you’ve built something that will actually be usable, and in my experience, will most likely help you to find issues that need to be addressed before you ship.
      author: Stephen Toub
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: the reference tests are for users who implement the abstractions of a framework. Not machine-checkable: tests shipped to users are outside the code that is analyzed.'
