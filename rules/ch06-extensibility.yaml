- id: FDG6007
  strength: AVOID
  text: using callbacks in performance-sensitive APIs.
  context: null
  section: 6.1.3 Events and Callbacks
  anchor: sec6_1_3
  body:
    - kind: annotation
      text: Delegate calls were made much faster in CLR 2.0, but they are still about two times slower than direct calls to virtual members. In addition, delegate-based APIs are generally less efficient in terms of memory usage. Having said that, the differences are relatively small and should only matter if the API is called very frequently.
      author: Krzysztof Cwalina
    - kind: annotation
      text: In a performance-critical method, you want to think about all forms of extensibility and what kind of impact they may have on throughput. This goes beyond delegates. In fact, in some situations it may actually be better for your common case to use delegates instead of virtual methods. For example, consider a design where you want a default behavior that can then be potentially replaced if a delegate is provided. If you made the functionality virtual, you’d be paying for the virtual dispatch (unless the JIT could devirtualize the call) regardless of whether a replacement was provided. But with a delegate, you could have a nonvirtual, inlineable implementation that just does a null check on the delegate instance and only pays the delegate invocation costs if there is something else to do instead of the default behavior.
      author: Stephen Toub
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: which APIs are performance-sensitive is intent, and the Toub annotation says that a delegate can cost less than a virtual member when it only replaces a default behavior.'
- id: FDG6008
  strength: DO
  text: use the `Func<...>`, `Action<...>`, or `Expression<...>` types instead of custom delegates when possible, when defining APIs with callbacks.
  context: null
  section: 6.1.3 Events and Callbacks
  anchor: sec6_1_3
  body:
    - kind: paragraph
      text: '`Func<...>` and `Action<...>` represent generic delegates. The following is how .NET defines them:'
    - kind: code
      text: |-
        public delegate void Action()
        public delegate void Action<T1, T2>(T1 arg1, T2 arg2)
        public delegate void Action<T1, T2, T3>(T1 arg1, T2 arg2, T3 arg3)
        public delegate void Action<T1, T2, T3, T4>(T1 arg1, T2 arg2,
         T3 arg3, T4 arg4)
        public delegate TResult Func<TResult>()
        public delegate TResult Func<T, TResult>(T arg)
        public delegate TResult Func<T1, T2, TResult>(T1 arg1, T2 arg2)
        public delegate TResult Func<T1, T2, T3, TResult>(T1 arg1, T2 arg2,
         T3 arg3)
        public delegate TResult Func<T1, T2, T3, T4, TResult>(T1 arg1, T2 arg2,
         T3 arg3, T4 arg4)
    - kind: paragraph
      text: 'They can be used as follows:'
    - kind: code
      text: |-
        Func<int,int,double> divide = (x,y)=>(double)x/(double)y;
        Action<double> write = (d)=>Console.WriteLine(d);
        write(divide(2,3));
    - kind: paragraph
      text: '`Expression<...>` represents function definitions that can be compiled and subsequently invoked at runtime but can also be serialized and passed to remote processes. Continuing with our example:'
    - kind: code
      text: |-
        Expression<Func<int,int,double>> expression =
         (x,y)=>(double)x/(double)y;
        Func<int,int,double> divide2 = expression.Compile();
        write(divide2(2,3));
    - kind: paragraph
      text: Notice how the syntax for constructing an `Expression<>` object is very similar to that used to construct a `Func<>` object. In fact, the only difference is the static type declaration of the variable (`Expression<>` instead of `Func<...>`).
    - kind: annotation
      text: In general, if these generic delegate types *can* be used, they *should* be used. However, there are some relatively rare situations where these generic delegates can’t be used. One such category is when the types being passed as arguments or return values can’t be used as generic type parameters, such as pointer types or `ref struct` types. Another category is when arguments or return values need to be passed as something other than by value—for example, when you want an argument to be `ref`. In such situations, you will need to find an existing delegate (generic or otherwise) that’s been declared with an appropriate signature, or else define a new one.
      author: Stephen Toub
    - kind: annotation
      text: The `Action` and `Func` delegates do not allow naming arguments. That makes it impractical to use these delegates for callbacks with more complex signatures where the meaning of the arguments is not obvious and it is important to name the arguments for clarity. For example, the `System.Runtime.InteropServices.DllImportResolver` delegate violates this rule for this reason.
      author: Jan Kotas
    - kind: annotation
      text: Most times you’re going to want `Func` or `Action` if all that needs to happen is to run some code. You need `Expression` when the code needs to be analyzed, serialized, or optimized before it is run. `Expression` is for thinking about code; `Func`/`Action` is for running it.
      author: Rico Mariani
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: "Analyzer candidate rejected: an externally visible delegate type whose signature fits Func or Action can be found, and the exceptions of the Toub annotation (pointer and ref struct types, arguments passed other than by value) can be read from symbols, but the Kotas annotation accepts a custom delegate whose arguments need names for clarity, which is a matter of meaning, so no report could be judged a violation from the code. Delegates of events are FDG5057's (CA1003)."
- id: FDG6009
  strength: DO
  text: measure and understand the performance implications of using `Expression<...>`, instead of using `Func<...>` and `Action<...>` delegates.
  context: null
  section: 6.1.3 Events and Callbacks
  anchor: sec6_1_3
  body:
    - kind: paragraph
      text: '`Expression<...>` types are, in most cases, logically equivalent to `Func<...>` and `Action<...>` delegates. The main difference between them is that the delegates are intended to be used in local process scenarios; expressions are intended for cases where it’s beneficial and possible to evaluate the expression in a remote process or machine.'
    - kind: annotation
      text: |-
        The remoteness of the evaluation is sort of incidental. The main thing about `Expressions` is that you use them when you are going to need to reason over the code to be executed, often over a composition of expressions such as in a LINQ query, and then, having considered the whole and the execution options, you create some kind of optimized plan for doing the work. This is how LINQ to SQL is able to create a single SQL fragment from a composition of loose-looking expressions.

        This plan could easily go wrong. You could do too much analysis of expressions or too little. You could use up too much space holding expression trees, or you could avoid all the trees but then find you have bad performance because you have so many small anonymous delegates.

        If you look at the patterns used in the LINQ implementations in .NET, you’ll see several good ways to make use of these constructs:

        - Use expressions only if you need to “think” about the code and not just run it.
        - Don’t blindly compose and run code that could be meaningfully optimized if you “thought” about it before running it.
        - Don’t create systems that optimize the code so much before running it that it would have been faster to just run it directly without optimizing.
        - Optimization isn’t the only use for expression trees, but it is an important one.
      author: Rico Mariani
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: measuring performance is a practice, not a property of the code.'
- id: FDG6010
  strength: DO
  text: understand that by calling a delegate, you are executing arbitrary code, and that could have security, correctness, and compatibility repercussions.
  context: null
  section: 6.1.3 Events and Callbacks
  anchor: sec6_1_3
  body:
    - kind: annotation
      text: |-
        The Windows Forms team bumped up against this issue when writing some of the low-level code in `SystemEvents`. `SystemEvents` defines a static API and therefore needs to be threadsafe. Internally, it uses locks to ensure thread safety. Early code in `SystemEvents` would grab a lock and then raise an event. Here’s an example:

        ```
        lock(someInternalLock) {
          if(eventHandler!=null) eventHandler(sender, EventArgs.Empty);
        }
        ```

        This is bad because you have no idea what the user code in the event handler is going to do. If the user code signals a thread and waits on its own lock, you might have just introduced a deadlock. This would be better code:

        ```
        EventHandler localHandler = eventHandler;
        if(localHandler != null) localHandler(sender, EventArgs.Empty);
        ```

        This way, the user’s code will never deadlock due to your own internal implementation. Note that because assignments in managed code are atomic, I didn’t need a lock at all in this case. That won’t always be true. For example, if your code needed to check more than one variable, you’d still need a lock:

        ```
        EventHandler localHandler = null;
        lock(someInternalLock) {
          if (eventHandler != null && shouldRaiseEvents) {
              localHandler = eventHandler;
           }
        }
        if(localHandler!=null) localHandler(sender,EventArgs.Empty);
        ```
      author: Brian Pepin
    - kind: annotation
      text: |-
        The null-conditional operator introduced in C# 6 can simplify the event invocation.

        ```
        eventHandler?.Invoke(sender, EventArgs.Empty);
        ```

        This has the same effect as Brian’s second example (invoking outside the lock), including only ever reading from the “eventHandler” value once:

        ```
        EventHandler localHandler = eventHandler;
        if(localHandler != null) localHandler(sender, EventArgs.Empty)
        ```
      author: Jeremy Barton
    - kind: annotation
      text: |-
        In addition to deadlock, invoking a callback under a lock like this can cause reentrancy. Locks on the CLR support recursive acquires, so if the callback somehow manages to call back into the same object that initiated the callback, the results are often not good. Locks are typically used to isolate invariants that are temporarily broken, yet this practice can expose them at the reentrant boundary. Needless to say, this is apt to cause weird exceptions and unexpected behavior.

        That said, sometimes this practice is necessary. If the callback is being used to make a decision—as would be the case with a predicate—and that decision needs to be made under a lock, you will have no choice. When invoking a callback under a lock is unavoidable, be sure to carefully document the restrictions (no inter-thread communication, no reentrancy). You must also ensure that, should a developer violate these restrictions, the result will not lead to security vulnerabilities. The risk here is usually greater than the reward.
      author: Joe Duffy
    - kind: annotation
      text: |-
        From an API design perspective, this whole discussion is really interesting as it applies to compatibility. You may find yourself in a situation where you’ve invoked a user-supplied callback while holding a lock, and you decide to “fix” it by employing approaches like that outlined. In doing so, however, you’re impacting potentially visible behaviors. The invocation will no longer be synchronized with whatever else might be using the same lock. It’s possible the user’s callback was actually relying on that synchronization for safety, whether they knew it or not.

        Extensibility is hard.
      author: Stephen Toub
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: the rule asks for an analysis of each callback. The case of the Pepin annotation, a delegate invoked under a lock, can be found in code, but the Duffy annotation says that it is sometimes unavoidable (a predicate that must run under the lock), so a report could not tell a violation from that case. Not library only: deadlocks and reentrancy (the Pepin and Duffy annotations) affect any code that invokes a delegate it does not control.'
- id: FDG6011
  strength: DO NOT
  text: make members virtual unless you have a good reason to do so and you are aware of all the costs related to designing, testing, and maintaining virtual members.
  context: null
  section: 6.1.4 Virtual Members
  anchor: sec6_1_4
  body:
    - kind: paragraph
      text: Virtual members are less forgiving in terms of changes that can be made to them without breaking compatibility. Also, they are slower than nonvirtual members, mostly because calls to virtual members are not inlined.
    - kind: annotation
      text: Be sure you understand your extensibility requirements completely before you make decisions in the name of extensibility. A common mistake is sprinkling classes with virtual methods and properties, only to find that the needed extensibility still can’t be realized and everything is now (and forever) slower.
      author: Rico Mariani
    - kind: annotation
      text: 'The peril: If you ship types with virtual members, you are promising to forever abide by subtle and complex observable behaviors and subclass interactions. I think framework designers underestimate their peril. For example, we found that `ArrayList` item enumeration calls several virtual methods for each `MoveNext` and `Current`. Fixing those performance problems could (but probably doesn’t) break user-defined implementations of virtual members on the `ArrayList` class that are dependent on virtual method call order and frequency.'
      author: Jan Gray
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: "Not library only: the body's cost that virtual members are slower because calls to them are not inlined (and the Mariani annotation), and the cost of designing and testing members that can be overridden in unpredictable ways, apply to virtual members in any code, as for FDG5004 and FDG6007. Not an analyzer candidate: whether there is a good reason is a matter of intent. FDG6013 reports public virtual members, and FDG5004 virtual shorter overloads."
