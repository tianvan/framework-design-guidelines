- id: FDG6019
  strength: AVOID
  text: naming base classes with a “Base” suffix if the class is intended for use in public APIs.
  context: null
  section: 6.2 Base Classes
  anchor: sec6_2
  body:
    - kind: paragraph
      text: For example, despite the fact that `Collection<T>` is designed to be inherited from, many frameworks expose APIs typed as the base class, not as its subclasses, mainly because of the cost associated with a new public type.
    - kind: code
      text: |-
        public Directory {
          public Collection<string> GetFilenames(){
             return new FilenameCollection(this);
             }

          private class FilenameCollection : Collection<string> {
             ...
          }
        }
    - kind: paragraph
      text: The fact that `Collection<T>` is a base class is irrelevant for the user of the `GetFilename` method, so the “Base” suffix would simply create an unnecessary distraction for the user of the method.
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG6019
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Remove the 'Base' suffix from '{0}', which a public API uses as a type
    category: Extensibility
  notes: 'Library only: the text is about classes intended for use in public APIs. FDG6019 reports an unsealed, externally visible class whose name ends with the word Base (FooBase, not Database) when an externally visible member, delegate or generic type of the same compilation uses it in its signature: the return, parameter, property, indexer, field or event type, or a constraint of a type parameter, also as an array element type or a type argument, the way the GetFilenames method of the body returns Collection<string>. A class that the compilation uses only as a base class is not reported, nor one that only a constraint of its own type parameters names (EntityBase<TSelf> where TSelf : EntityBase<TSelf>), nor uses in other assemblies, and members that the compiler declares do not count. A class counts as a base class when it is abstract, declares a protected or virtual member, or another class of the compilation derives from it (section 6.2: a class designed for inheritance); an unsealed class whose name only ends in the word Base, such as KnowledgeBase, is not reported. Overrides do not count toward a class designed for inheritance, since they implement the design of the class they override, and a subclass that exists only in generated code does not count either. CA1711 does not report the Base suffix (probe with SDK 10.0.402). Renaming a public class breaks callers, so the fix is breaking; there is no code fix.'
- id: FDG6020
  strength: DO NOT
  text: seal classes without having a good reason to do so.
  context: null
  section: 6.3 Sealing
  anchor: sec6_3
  body:
    - kind: paragraph
      text: Sealing a class because you cannot think of an extensibility scenario is not a good reason. Framework users like to inherit from classes for various nonobvious reasons, such as adding convenience members. See section 6.1.1 for examples of nonobvious reasons users want to inherit from a type.
    - kind: paragraph
      text: 'Good reasons for sealing a class include the following:'
    - kind: list
      text: |-
        - The class is a static class. For more information on static classes, see section 4.5.
        - The class inherits many virtual members, and the cost of sealing them individually would outweigh the benefits of leaving the class unsealed.
        - The class is an attribute that requires very fast runtime look-up. Sealed attributes have slightly higher performance levels than unsealed ones. For more information on attribute design, see section 8.2.
    - kind: annotation
      text: Having classes that are open to some level of customization is one of the core differences between a framework and a library. With an API library (such as the Win32 API), you basically get what you get. It is very difficult to extend the data structures and APIs. With a framework such as MFC or AWT, clients can extend and customize the classes. The productivity boost from this flexibility is obvious.
      author: Brad Abrams
    - kind: annotation
      text: People often ask about the cost of sealing individual members. This cost is relatively small, but it is nonzero and should be taken into account. There is development cost (typing in the overrides), testing cost (have you called the base class from the override?), assembly size cost (new overrides), and working set cost (if both the overrides and the base implementation are ever called).
      author: Krzysztof Cwalina
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: users of a framework inherit from its classes for nonobvious reasons; in an application sealing is safe, and CA1852 suggests it for internal types. Not an analyzer candidate: the body introduces its good reasons with "include the following", so the list is open, and one of them (many inherited virtual members that would cost more to seal one by one) is a judgment, so a sealed class cannot be judged a violation from symbols. CA1813 (unsealed attributes) and CA1852 (internal types) are not mapped: they ask for sealing, which the body allows for attributes, and internal types are not public API.'
- id: FDG6021
  strength: DO NOT
  text: declare protected or virtual members on sealed types.
  context: null
  section: 6.3 Sealing
  anchor: sec6_3
  body:
    - kind: paragraph
      text: By definition, sealed types cannot be inherited from. This means that protected members on sealed types cannot be called, and virtual methods on sealed types cannot be overridden.
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not checked: the C# compiler reports a new protected member of a sealed type (warning CS0628, protected internal and private protected included) and rejects a new virtual member of a sealed type (error CS0549), a protected member of a struct (error CS0666) and a protected member of a static class (error CS1057); a probe with SDK 10.0.402 showed this for sealed classes and sealed records. Overrides, which the compiler allows, declare no new protected or virtual member.'
- id: FDG6022
  strength: CONSIDER
  text: sealing members that you override.
  context: null
  section: 6.3 Sealing
  anchor: sec6_3
  body:
    - kind: code
      text: |-
        public class FlowSwitch : SourceSwitch {
          protected sealed override void OnValueChanged() {
            ...
          }
        }
    - kind: paragraph
      text: Problems that can result from introducing virtual members (discussed in section 6.1.4) apply to overrides as well, although to a slightly lesser degree. Sealing an override shields you from these problems starting from that point in the inheritance hierarchy.
    - kind: paragraph
      text: In short, part of designing for extensibility is knowing when to limit it, and sealed types are one of the mechanisms by which you do that.
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: sealing an override shields the class from the problems of virtual members (section 6.1.4) for subclasses outside the library. Not an analyzer candidate: whether an override stays an extension point for further subclasses is a design decision; in the dispose pattern of section 9.4, for example, subclasses override Dispose(bool) again.'
