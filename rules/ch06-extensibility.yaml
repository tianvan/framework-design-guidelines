- id: FDG6001
  strength: CONSIDER
  text: using unsealed classes with no added virtual or protected members as a great way to provide inexpensive yet much appreciated extensibility to a framework.
  context: null
  section: 6.1.1 Unsealed Classes
  anchor: sec6_1_1
  body:
    - kind: paragraph
      text: Developers often want to inherit from unsealed classes so as to add convenience members such as custom constructors, new methods, or method overloads.<sup>1</sup> For example, `System.Messaging.MessageQueue` is unsealed and thus allows users to create custom queues that default to a particular queue path or to add custom methods that simplify the API for specific scenarios. In the following example, the scenario is for a method sending `Order` objects to the queue.
    - kind: paragraph
      text: 1. Some convenience methods can be added to sealed types as extension methods.
    - kind: code
      text: |-
        public class OrdersQueue : MessageQueue {
          public OrdersQueue() : base(OrdersQueue.Path){
            this.Formatter = new BinaryMessageFormatter();
          }

          public void SendOrder(Order order){
            Send(order,order.Id);
          }
        }
    - kind: annotation
      text: |-
        Because test-driven development has caught fire in the .NET developer community, many developers want to inherit from unsealed classes (often dynamically using a mock framework) in order to substitute a test double in the place of the real implementation.

        At the very least, if you’ve gone to the trouble of making your class unsealed, consider making key members virtual, perhaps via the Template Method Pattern, to provide more control.
      author: Phil Haack
    - kind: paragraph
      text: Classes are unsealed by default in most programming languages, and this is also the recommended default for most classes in frameworks. The extensibility afforded by unsealed types is much appreciated by framework users and quite inexpensive to provide because of the relatively low test costs associated with unsealed types.
    - kind: annotation
      text: The key word in this advice is “CONSIDER.” Keep in mind that you always have the option of unsealing a class in the future (it is not a breaking change); however, once unsealed, a class must remain unsealed. Also, unsealing does inhibit some optimizations [e.g., converting virtual calls to more efficient nonvirtual calls (and then inlining)]. Finally, unsealing helps your users only if they control the creation of the class (sometimes true, sometimes not). In short, designs are only rarely usefully extensible “by accident.” Being unsealed is part of the contract of a class and its users, and like everything about the contract, it deserves to be a conscious, deliberate choice on the part of the designer.
      author: Vance Morrison
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: the extensibility is for users of the framework who inherit from the class. Not an analyzer candidate: a design option, which the Morrison annotation calls a deliberate choice of the designer; FDG6020 is the rule against sealing without a reason.'
