- id: FDG6013
  strength: DO
  text: prefer protected accessibility over public accessibility for virtual members. Public members should provide extensibility (if required) by calling into a protected virtual member.
  context: null
  section: 6.1.4 Virtual Members
  anchor: sec6_1_4
  body:
    - kind: paragraph
      text: The public members of a class should provide the right set of functionality for direct consumers of that class. Virtual members are designed to be overridden in subclasses, and protected accessibility is a great way to scope all virtual extensibility points to where they can be used.
    - kind: code
      text: |-
        public Control{
          public void SetBounds(...){
            ...
            SetBoundsCore (...);
          }

          protected virtual void SetBoundsCore(...){
            // Do the real work here.
          }
        }
    - kind: paragraph
      text: Section 9.9 provides more insight into this subject.
    - kind: annotation
      text: It is common for a type to define multiple overloaded methods for caller convenience. These methods typically allow the caller to pass fewer arguments to the method and then, internally, the method calls a more complex method, passing additional arguments with good default values. If your type offers convenience methods, these methods should not be virtual, but internally they should call the one virtual method that contains the actual implementation of the method (which can be overridden).
      author: Jeffrey Richter
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG6013
    coverage: full
  autofix: breaking
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Make the virtual member '{0}' protected and call it from a nonvirtual public member
    category: Extensibility
  notes: "Library only: the body separates the public members, for direct consumers of the class, from the protected virtual members, for subclasses outside the library. FDG6013 reports a virtual or abstract method, property, indexer or event declared public in an externally visible class; abstract members count because they are virtual, and the Template Method of section 9.9 has a public member call a protected abstract one as well. Overrides are not reported, since their accessibility comes from the overridden member, nor members that the compiler declares, nor a record's Equals(T), which C# requires to be public and virtual in an unsealed record. Whether a public member calls a protected virtual one is not checked. A virtual shorter overload is reported by FDG5004 too (the Richter annotation). CA1070 (virtual field-like events) is not mapped: its reason is how the compiler implements such events, not accessibility. Making a public member protected or nonvirtual changes the public API, so the fix is breaking; there is no code fix."
