- id: FDGA004
  strength: AVOID
  text: omitting braces, even if the language allows it.
  context: null
  section: A.1.1 Brace Usage
  anchor: secA_1_1
  body:
    - kind: paragraph
      text: Braces should not be considered optional. Even for single-statement blocks, you should use braces. This increases code readability and maintainability.
    - kind: code
      text: |-
        for (int i = 0; i < 100; i++)
        {
            DoSomething(i);
        }
    - kind: paragraph
      text: One exception to the rule is braces in `case` statements. These braces can be omitted, because the `case` and `break` statements indicate the beginning and the end of the block.
    - kind: code
      text: |-
        case 0:
           DoSomething();
           break;
  status: draft
  style: true
  check:
    kind: sdk
    diagnostics:
      - IDE0011
    coverage: partial
  autofix: yes
  severity:
    library: warning
    application: warning
    test: warning
  config:
    - csharp_prefer_braces = true
  minLanguage: null
  alternative: null
  analyzer: null
  notes: IDE0011 does not know the argument validation preamble exception (FDGA005).
- id: FDGA005
  strength: CONSIDER
  text: omitting braces in an argument validation preamble.
  context: null
  section: A.1.1 Brace Usage
  anchor: secA_1_1
  body:
    - kind: paragraph
      text: For all parts of the method preamble that are of the form `if (single-LineExpression) { throw … }`, the braces and vertical whitespace can be eliminated. Once you add a blank line, or have code other than `if`…`throw`, you’ve left the preamble and braces become required again. Multi-line conditions should ideally be factored out into methods to maintain the visual flow of the preamble.
    - kind: code
      text: |-
        public void DoSomething(SomeCollection coll, int start, int count)
        {
            if (coll is null)
                throw new ArgumentNullException(nameof(coll));
            if ((uint)start < (uint)coll.Count)
                throw new ArgumentOutOfRangeException(nameof(start));
            if (coll.Count – count > start)
                throw new ArgumentOutOfRangeException(nameof(count));

            if (count == 0)
            {
                 return;
            }

            ...
        }
  status: draft
  style: true
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: suggestion
    test: suggestion
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: FDGA004 (IDE0011) adds braces to the preamble too; omitting them is optional.
- id: FDGA006
  strength: DO NOT
  text: use the braceless variant of the `using` (dispose) statement.
  context: null
  section: A.1.1 Brace Usage
  anchor: secA_1_1
  body:
    - kind: paragraph
      text: The braced `using` statement provides a strong visual indicator of when the value is being released. Just as with locking, a disposable value should be disposed as soon as it is practical to do so. The braceless variant makes it too easy to add code that unnecessarily extends the scope of the disposable value, and changing the braceless version to the braced version adds unnecessary noise to a `diff` representation of a change.
    - kind: code
      text: |-
        Right:
        using (Element element = GetElement())
        {
            ...
        }

        Wrong:
        using Element element = GetElement();
        ...
  status: draft
  style: true
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: warning
  config:
    - csharp_prefer_simple_using_statement = false
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'planned-analyzer: braceless using declarations. The option stops IDE0063 from suggesting them.'
- id: FDGA007
  strength: AVOID
  text: using the braceless variant of the `await using` statement, except to simulate stacked `await using` statements with `ConfigureAwait`.
  context: null
  section: A.1.1 Brace Usage
  anchor: secA_1_1
  body:
    - kind: paragraph
      text: Until an addition to the C# language allows for simple stacked `await using` statements while also appropriately using `ConfigureAwait` (discussed in Chapter 9, sections 9.2.6.2 and 9.4.4.1), the braceless `await using` can be used to achieve the same level of conciseness, provided it is used only in a series of variable declarations and `await using` statements in a fresh scope.
    - kind: paragraph
      text: The braceless await using statement, as of C# 8.0, requires a variable declaration, but since the result of `ConfigureAwait`—a `Configured-AsyncDisposable` value—is never going to be directly used in your method, you can use “var ignored” as an exception to the normal restrictions on the use of the `var` keyword.
    - kind: code
      text: |-
        Acceptable:
        {
            Element element1 = GetElement(1);
            await using var ignored1 = element1.ConfigureAwait(false);
            Element element2 = GetElement(2);
            await using var ignored 2 = element2.ConfigureAwait(false);

            ...
        }

        Wrong:
        await using Element element1 = GetElement(1);
        await using Element element2 = GetElement(2);
        ...
  status: draft
  style: true
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: warning
  config: []
  minLanguage: "8.0"
  alternative: Before C# 8.0 there is no 'await using'; dispose in a finally block with 'await resource.DisposeAsync().ConfigureAwait(false)'.
  analyzer: null
  notes: "planned-analyzer: braceless 'await using' outside a ConfigureAwait declaration series."
