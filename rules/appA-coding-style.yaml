- id: FDGA042
  strength: DO NOT
  text: use the `var` keyword except to save the result of a `new`, `as`-cast or “hard” cast.
  context: null
  section: A.1.6 Other
  anchor: secA_1_6
  body:
    - kind: paragraph
      text: In the core .NET libraries, we only use `var` when the type name is already specified. We don’t use it when calling factory methods, calling methods for which “everyone knows” the return type (e.g., `String.IndexOf`), or receiving the result of a `TryParse` method. We also do not compel the use of `var` when using a `new`, `as`-cast, or “hard” cast; instead, we leave it as a judgment call on the part of the code author.
    - kind: code
      text: |-
        Acceptable (no var):
            StringBuilder builder = new StringBuilder();
            List<int> list = collection as List<int>;
            string built = ProcessList(list, builder);
            SomeType fromCache = cache.Get<SomeType>();

            if (int.TryParse(input, out int parsedValue)
            {
                ...
            }

        Acceptable (maximal use of var):
            var builder = new StringBuilder();
            var list = collection as List<int>;
            string built = ProcessList(list, builder);
            SomeType fromCache = cache.Get<SomeType>();

            if (int.TryParse(input, out int parsedValue)
            {
                ...
            }

        Wrong (uses var in places that are not permitted):
            var builder = new StringBuilder();
            var list = collection as List<int>;
            var built = ProcessList(list, builder);
            var fromCache = cache.Get<SomeType>();

            if (int.TryParse(input, out var parsedValue)
            {
                ...
            }
  status: draft
  style: true
  check:
    kind: sdk
    diagnostics:
      - IDE0008
    coverage: partial
  autofix: yes
  severity:
    library: warning
    application: warning
    test: warning
  config:
    - csharp_style_var_for_built_in_types = false
    - csharp_style_var_when_type_is_apparent = true
    - csharp_style_var_elsewhere = false
  minLanguage: null
  alternative: null
  analyzer: null
  notes: IDE0008 also accepts 'var' for some factory methods whose type it considers apparent.
- id: FDGA043
  strength: DO
  text: use object initializers where possible.
  context: null
  section: A.1.6 Other
  anchor: secA_1_6
  body:
    - kind: paragraph
      text: This rule can be ignored when working with a type that has a required order of property assignment. As with most exceptions to a rule, however, a comment should explain why the code should not be changed to use object initializers. The object initializer does respect the order the properties are assigned, but it doesn’t “feel” as ordered as multiple assignment statements.
    - kind: code
      text: |-
        Right:
            SomeType someType = new SomeType
            {
                PropA = ...,
                PropB = ...,
                PropC = ...,
            }

        Acceptable:
            // PropB has to be set first
            SomeType someType = new SomeType
            {
                PropB = ...,
            };
            someType.PropA = ...;
            someType.PropC = ...;

        Not preferred:
            SomeType someType = new SomeType();
            someType.PropB = ...;
            someType.PropA = ...;
            someType.PropC = ...;
  status: draft
  style: true
