- id: FDGA055
  strength: DO
  text: use a prefix “_” (underscore) for private and internal instance fields, “s_” for private and internal static fields, and “t_” for private and internal thread-static fields.
  context: null
  section: A.2 Naming Conventions
  anchor: secA_2
  body:
    - kind: paragraph
      text: These prefixes are very valuable to a code reviewer. Reading from, or writing to, a field indicates why a method isn’t declared as `static`. Writes to a field indicate a persisted state. Reading from, or writing to, a static field indicates a shared persisted state and a potential thread-safety problem. Thread-static fields require even more attention, because they may lose their value after an `await`—or have never been initialized on this thread.
    - kind: code
      text: |-
        internal partial class SomeClass
        {
            [ThreadStatic]
            private static byte[] t_buffer;

            private static int s_instanceCount;

            private int _instanceId;
        }
  status: draft
  style: true
  check:
    kind: sdk
    diagnostics:
      - IDE1006
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: suggestion
  config:
    - dotnet_naming_rule.fdga055_private_fields.symbols = fdg_private_fields
    - dotnet_naming_rule.fdga055_private_fields.style = fdg_underscore_camel_case
    - dotnet_naming_symbols.fdg_private_fields.applicable_kinds = field
    - dotnet_naming_symbols.fdg_private_fields.applicable_accessibilities = private, internal
    - dotnet_naming_style.fdg_underscore_camel_case.required_prefix = _
    - dotnet_naming_style.fdg_underscore_camel_case.capitalization = camel_case
    - dotnet_naming_rule.fdga055_private_static_fields.symbols = fdg_private_static_fields
    - dotnet_naming_rule.fdga055_private_static_fields.style = fdg_s_camel_case
    - dotnet_naming_symbols.fdg_private_static_fields.applicable_kinds = field
    - dotnet_naming_symbols.fdg_private_static_fields.applicable_accessibilities = private, internal
    - dotnet_naming_symbols.fdg_private_static_fields.required_modifiers = static
    - dotnet_naming_style.fdg_s_camel_case.required_prefix = s_
    - dotnet_naming_style.fdg_s_camel_case.capitalization = camel_case
  minLanguage: null
  alternative: null
