- id: FDG3024
  strength: DO
  text: use the “64” suffix when introducing versions of APIs that operate on a 64-bit integer (a long integer) instead of a 32-bit integer. You only need to take this approach when the existing 32-bit API exists; don’t do it for brand-new APIs with only a 64-bit version.
  context: null
  section: 3.2.4 Naming New Versions of Existing APIs
  anchor: sec3_2_4
  body:
    - kind: paragraph
      text: For example, various APIs on `System.Diagnostics.Process` return `Int32` values representing memory sizes, such as `PagedMemorySize` or `PeakWorkingSet`. To appropriately support these APIs on 64-bit systems, APIs have been added that have the same name but a “64” suffix.
    - kind: code
      text: |-
        public class Process {
           // old APIs
           public int PeakWorkingSet { get; }
           public int PagedMemorySize { get; }
           // ...
           // new APIs
           public long PeakWorkingSet64 { get; }
           public long PagedMemorySize64 { get; }
        }
    - kind: annotation
      text: Note that this guideline applies only to retrofitting APIs that have already shipped. When designing a brand-new API, use the most appropriate type and name for the API that will work on all platforms, and avoid using both “32” and “64” suffixes. Consider using overloading.
      author: KIT GEORGE
