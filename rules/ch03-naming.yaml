- id: FDG3005
  strength: DO NOT
  text: capitalize any of the characters of any acronyms, whatever their length, at the beginning of a camel-cased identifier.
  context: null
  section: 3.1.2 Capitalizing Acronyms
  anchor: sec3_1_2
  body:
    - kind: annotation
      text: In my time working on the .NET Framework, I have heard every possible excuse for violating these naming guidelines. Many teams feel that they have some special reason to use case differently in their identifiers than in the rest of the Framework. These excuses include consistency with other platforms (MFC, HTML, etc.), avoiding geopolitical issues (casing of some country names), honoring the dead (abbreviation names that came up with some crypto algorithm), and the list goes on and on. For the most part, our customers have seen the places in which we have diverged from these guidelines (for even the best excuse) as warts in the Framework. The only time I think it really makes sense to violate these guidelines is when using a trademark as an identifier. However, I suggest not using trademarks, because they tend to change faster than APIs do.
      author: Brad Abrams
    - kind: annotation
      text: |-
        There’s a mild misconception that because the types `RSA`, `DSA`, `DES`, and `HMAC` are all caps, there’s some sort of exception to the rule when it comes to cryptographic (or other) algorithm names. There isn’t; those names were just mistakes. Newer types are named correctly: Advanced Encryption Standard (AES) is `Aes`, Elliptic Curve Digital Signature Algorithm (ECDSA) is `ECDsa` (two-letter acronym followed by a three-letter acronym), and Elliptic Curve Diffie-Hellman (ECDH) is `ECDiffieHellman` (avoiding the four concurrent capital letters required by a two-letter acronym following a two-letter acronym).

        For the record, the following types are named incorrectly and should not serve as examples to follow: `RSA`, `DSA`, `HMAC`, `HMACMD5`, `HMACSHA1`, `HMACSHA256`, `HMACSHA384`, `HMACSHA512`, `SHA1`, `SHA256`, `SHA384`, `SHA512`, `RIPEMD160`, `DES`, `TripleDES`, `MACTripleDES`. (There may be others, and there are certainly many parameter names in .NET Cryptography that violate different rules.)

        For these specific, existing names, their casing is kept for consistency with types that interact with them, such as `RSASignaturePadding` and `HashAlgorithmNames.SHA256`.
      author: Jeremy Barton
    - kind: annotation
      text: |-
        Here is an example of putting these naming guidelines to the test. We have the class shown here in the Framework today. It successfully follows the guidelines for casing and uses `Argb` rather than `ARGB`. But we have actually gotten bug reports along the lines of “How do you convert a color from an ARGB value—all I see are methods to convert ‘from argument b’?”

        ```
        public struct Color {
        ...
           public static Color FromArgb(int alpha, Color baseColor);
           public static Color FromArgb(int alpha, int red, int green,
        int blue);
           public static Color FromArgb(int argb);
           public static Color FromArgb(int red, int green, int blue);
        ...
        }
        ```

        In retrospect, should this have been a place where we violated the guidelines and used `FromARGB`? I do not think so. It turns out that this is a case of over-abbreviation. RGB is a well-recognized acronym for red– green–blue values. An ARGB value is a relatively uncommon abbreviation that includes the alpha channel. It would have been clearer to name these `AlphaRgb` and would have been more consistent in naming with the rest of the Framework.

        ```
        public struct Color {
        ...
           public static Color FromAlphaRgb(int alpha, Color baseColor);
           public static Color FromAlphaRgb(int alpha, int red, int green,
        int blue);
           public static Color FromAlphaRgb(int argb);
           public static Color FromAlphaRgb(int red, int green, int blue);
        ...
        }
        ```
      author: Brad Abrams
    - kind: annotation
      text: No matter how hard we try to follow all of these guidelines, sometimes we make mistakes. For example, `System.Text.UTF8Encoding` should really have been `System.Text.Utf8Encoding`. Now when we introduce new UTF8-related functionality, what do we do? Do we continue to use “UTF8” for consistency, or do we use “Utf8” for adherence to the guidelines? In general, we choose to not repeat the mistakes of the past, and newer types have used “Utf8”—for example, `System.Buffers.Text.Utf8Formatter`.
      author: Stephen Toub
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - IDE1006
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: IDE1006 reports camel-cased names that start with an uppercase acronym, such as 'IOStream', through the naming rules configured by FDGA055 (private and internal fields), FDGA056 (locals) and FDGA057 (parameters). FDG3003 and FDG3004 check acronyms after the first word.
  naming:
    symbols:
      - parameter
      - local
      - privateField
    failures:
      - casing
- id: FDG3006
  strength: DO NOT
  text: capitalize each word in so-called closed-form compound words.
  context: null
  section: 3.1.3 Capitalizing Compound Words and Common Terms
  anchor: sec3_1_3
  body:
    - kind: paragraph
      text: These are compound words written as a single word, such as endpoint. For the purpose of casing guidelines, treat a closed-form compound word as a single word. Use a current dictionary to determine if a compound word is written in closed form.
    - kind: paragraph
      text: Table 3-2 shows capitalization for some of the most commonly used compound words and common terms.
    - kind: table
      text: |-
        **Table 3-2: Capitalization and Spelling for Common Compound Words and Common Terms**

        | Pascal | Camel | Not |
        | --- | --- | --- |
        | `BitFlag` | `bitFlag` | `Bitflag` |
        | `Callback` | `callback` | `CallBack` |
        | `Canceled` | `canceled` | `Cancelled` |
        | `DoNot` | `doNot` | `Don't` |
        | `Email` | `email` | `EMail` |
        | `Endpoint` | `endpoint` | `EndPoint` |
        | `Filename` | `filename` | `FileName` |
        | `Gridline` | `gridline` | `GridLine` |
        | `Hashtable` | `hashtable` | `HashTable` |
        | `Id` | `id` | `ID` |
        | `Indexes` | `indexes` | `Indices` |
        | `Logoff`<sup>1</sup> | `logoff` | `LogOut` |
        | `Logon`<sup>1</sup> | `logon` | `LogIn`<sup>2</sup> |
        | `Metadata` | `metadata` | `MetaData, metaData` |
        | `Multipanel` | `multipanel` | `MultiPanel` |
        | `Multiview` | `multiview` | `MultiView` |
        | `Namespace` | `namespace` | `NameSpace` |
        | `Ok` | `ok` | `OK` |
        | `Pi` | `pi` | `PI` |
        | `Placeholder` | `placeholder` | `PlaceHolder` |
        | `SignIn` | `signIn` | `SignOn` |
        | `SignOut` | `signOut` | `SignOff` |
        | `Timestamp` | `timestamp` | `TimeStamp` |
        | `Username` | `username` | `UserName` |
        | `WhiteSpace` | `whiteSpace` | `Whitespace` |
        | `Writable` | `writable` | `Writeable` |
    - kind: paragraph
      text: 1. When used as a noun (properties, fields, parameters, types). As a verb (methods) it should be considered two words—for example, `LogOff`.
    - kind: paragraph
      text: 2. “Login” is now regarded as a closed-form noun, so a type with members named “Login” and “Password” would be OK, except in .NET we prefer “Logon” to “Login.” As a compound verb, “Log In” should be “Log On,” so “LogIn” is never used, and “LogOn” does not appear in this table.
    - kind: paragraph
      text: Two other terms that are in common usage are in a category by themselves, because they are common slang abbreviations. The two words *Ok* and *Id* (cased as shown here) are exceptions to the guideline that no abbreviations should be used in names.
    - kind: paragraph
      text: Table 3-2 and the rule about closed-form nouns are secondary to the general guideline of maintaining consistency. As of September 2019, “white space” is the dictionary entry, with some dictionaries having a note that computer science often uses it as a single word. If and when “whitespace” becomes an accepted closed-form noun, you should continue to use “WhiteSpace” in type hierarchies built with the older form of the word.
    - kind: annotation
      text: Table 3-2 presents specific examples found in the development of the .NET Framework. You might find it useful to create your own appendix to this table for compound words and other terms commonly used in your domain.
      author: Brad Abrams
    - kind: annotation
      text: One abbreviation commonly used in COM interface names was Ex (for interfaces that were extended versions of previously existing interfaces). This abbreviation should be avoided in reusable libraries. Use instead a meaningful name that describes the new functionality. For example, rather than `IDispatchEx`, consider `IDynamicDispatch`.
      author: Brad Abrams
    - kind: annotation
      text: |-
        Several changes were made to Table 3-2 for the third edition of this book. The *Oxford English Dictionary*, as well as others, now considers “filename,” “logoff,” “logout,” “login,” “logon,” and “username” as closed-form *nouns*, enabling identifiers like `LogoffTime`. In the sense of an action, the OED still considers “log in,” “log on,” “log off,” or “log out” to be the only acceptable forms.

        That doesn’t mean you should immediately change all of your existing names. However, in types that don’t interact with the older forms, you are free (and encouraged) to accept the evolving nature of language when it comes to these terms.
      author: Jeremy Barton
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG3006
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Use '{2}' instead of '{1}' in the name '{0}'
    category: Naming
  notes: FDG3006 reports, in the names that externally visible declarations choose (see FDG3003 for which names), a run of whole words that spells a form of the Not column of Table 3-2, such as FileName, CallBack or ID, and gives the Pascal form. The case of each word must match the table, except the first letter of a camel-cased name, so fileName is reported and Filename or filename is not. LogOut and LogIn are reported in every name; in a method name, where footnote 1 makes the verb two words, the message gives LogOff and LogOn instead of Logoff and Logon. The last word of a form may carry a plural s, which the message keeps (FileNames gives Filenames, UserIDs gives UserIds), and an acronym plural such as IDEs or PIDs is one word, except before the words As, Is and Us, so UserIDIsValid is reported. A form never spans a digit or underscore of the name, so File2Name is not reported and MAX_ID is. A form that starts with two capitals (EMail, ID, OK, PI) right after an interface's I prefix, as in IEMailService, is not reported. Closed-form compound words outside the table are not checked, because the book gives no longer list. Renaming a public name changes the public API, so the fix is breaking; FDG3006 has no code fix.
