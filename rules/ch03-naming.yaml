- id: FDG3022
  strength: DO
  text: use a numeric suffix to indicate a new version of an existing API, particularly if the existing name of the API is the only name that makes sense (e.g., if it is an industry standard) and if adding any meaningful suffix (or changing the name) is not an appropriate option.
  context: null
  section: 3.2.4 Naming New Versions of Existing APIs
  anchor: sec3_2_4
  body:
    - kind: code
      text: |-
        // old API
        [Obsolete("This type is obsolete. Please use the new version of the same
        class, X509Certificate2.")]
        public class X509Certificate { ... }
        // new API
        public class X509Certificate2 { ... }
    - kind: annotation
      text: |-
        I would use numeric suffixes as the very last resort. A much better approach is to use a new name or a meaningful suffix.

        The BCL team shipped a new type named `TimeZone2` in one of the early prereleases of .NET Framework 3.5. The name immediately became the center of a controversy in the blogging community. After a set of lengthy discussions, the team decided to rename the type to `TimeZoneInfo`, which is not a great name but is much better than `TimeZone2`.

        It’s interesting to note that nobody dislikes `X509Certificate2`. My interpretation of this fact is that programmers are more willing to accept the ugly numeric suffix on rarely used library types somewhere in the corner of the framework than on a core type in the `System` namespace.
      author: Krzysztof Cwalina
    - kind: annotation
      text: I think that `X509Certificate2` is successful as the type name of the more usable of the two X.509 certificate classes in part because it is so much more powerful than `X509Certificate` that there’s really no reason to use the former class. Compounded with there being very few APIs that provide or accept `X509Certificate`, it’s simply that `X509Certificate2` is the name of the certificate type in .NET. (That said, I’ll stand contrary to Krzysztof’s claim and say that I wish that the functionality had been added to `X509Certificate` without a new type being introduced.)
      author: Jeremy Barton
  status: verified
