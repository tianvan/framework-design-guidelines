- id: FDG3027
  strength: DO
  text: prefix namespace names with a company name to prevent namespaces from different companies from having the same name.
  context: null
  section: 3.4 Names of Namespaces
  anchor: sec3_4
  body:
    - kind: paragraph
      text: For example, the Microsoft Office automation APIs provided by Microsoft should be in the namespace `Microsoft.Office`.
    - kind: annotation
      text: It is important to use the official name of your company or organization when choosing the first part of your namespace name to avoid possible conflicts. For example, if Microsoft had chosen to use MS as its root namespace, it might have been confusing to developers at other companies that use MS as an abbreviation.
      author: Brad Abrams
    - kind: annotation
      text: This means staying away from the latest cool and catchy name that the marketing folks have come up with. It is fine to tweak the branding of a product from release to release, but the namespace name will be burned into your client’s code forever. Therefore, choose something that is technically sound and not subject to the marketing whims of the day.
      author: Brad Abrams
  status: verified
