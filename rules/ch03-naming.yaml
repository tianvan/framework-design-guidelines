- id: FDG3074
  strength: DO
  text: name event handlers (delegates used as types of events) with the “EventHandler” suffix, such as `ClickedEventHandler`.
  context: null
  section: 3.6.3 Names of Events
  anchor: sec3_6_3
  body:
    - kind: code
      text: |-
        public delegate void ClickedEventHandler(object sender,
          ClickedEventArgs e);
    - kind: paragraph
      text: Note that you should create custom event handlers very rarely. Instead, most APIs should simply use `EventHandler<T>`. Section 5.4.1 talks about event design in more detail.
    - kind: annotation
      text: Today, you would rarely need to define your own “EventHandler” delegate. Instead, you should use the `EventHandler<TEventArgs>` delegate type, where `TEventArgs` is either `EventArgs` or your own `EventArgs` derived class. This reduces type definitions in the system and ensures that your event follows the pattern described in the preceding bullet.
      author: Jason Clark
  status: verified
