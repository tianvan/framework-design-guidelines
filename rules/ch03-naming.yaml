- id: FDG3069
  strength: DO
  text: name Boolean properties with an affirmative phrase (`CanSeek` instead of `CantSeek`). Optionally, you can also prefix Boolean properties with “Is,” “Can,” or “Has,” but only where it adds value.
  context: null
  section: 3.6.2 Names of Properties
  anchor: sec3_6_2
  body:
    - kind: paragraph
      text: For example, `CanRead` is more understandable than `Readable`. However, `Created` is actually more readable than `IsCreated`. Having the prefix is often too verbose and unnecessary, particularly in the face of IntelliSense in the code editors. It is just as clear to type `MyObject.Enabled =` and have IntelliSense give you the choice of true or false as it is to have `MyObject.IsEnabled =`, and the second approach is more verbose.
    - kind: annotation
      text: |-
        In selecting names for Boolean properties and functions, consider testing out the common uses of the API in an if-statement. Such a usage test will highlight whether the word choices and grammar of the API name (e.g., active versus passive voice, singular versus plural) make sense as English phrases. For example, both of the following

        ```
        if(collection.Contains(item))
        if(regularExpression.Matches(text))
        ```

        read more naturally than

        ```
        if(collection.IsContained(item))
        if(regularExpression.Match(text))
        ```

        Also, all else being equal, you should prefer the active voice to the passive voice:

        ```
        if(stream.CanSeek) // better than ..
        if(stream.IsSeekable
        ```
      author: Krzysztof Cwalina
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Analyzer candidate rejected (gate 1): the rule text gives one negative example (CantSeek) and no word list. Telling a negative phrase from an affirmative one (Disabled, Hidden, NoWrap) would need a word list the book does not give, so a check would have to guess intent.'
