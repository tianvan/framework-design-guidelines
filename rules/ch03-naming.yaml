- id: FDG3001
  strength: DO
  text: use PascalCasing for the names of namespaces, types, members, and generic type parameters.
  context: null
  section: 3.1.1 Capitalization Rules for Identifiers
  anchor: sec3_1_1
  body:
    - kind: paragraph
      text: For example, use `TextColor` rather than `Textcolor` or `Text_color`. Single words, such as `Button`, simply have initial capitals. Compound words that are always written as a single word, like endpoint, are treated as single words and have initial capitals only. More information on compound words is given in section 3.1.3.
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - IDE1006
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: IDE1006 checks the first letter through the naming rules configured by FDGA052; it cannot see word boundaries inside an identifier.
  naming:
    symbols:
      - namespace
      - type
      - typeParameter
      - method
      - property
      - event
      - visibleField
    failures:
      - casing
- id: FDG3002
  strength: DO
  text: use camelCasing for parameter names.
  context: null
  section: 3.1.1 Capitalization Rules for Identifiers
  anchor: sec3_1_1
  body:
    - kind: paragraph
      text: Table 3-1 describes the capitalization rules for different types of identifiers.
    - kind: table
      text: |-
        **Table 3-1: Capitalization Rules for Different Types of Identifiers**

        | Identifier | Casing | Example |
        | --- | --- | --- |
        | Namespace | Pascal | namespace System.Security { ... } |
        | Type | Pascal | public class StreamReader { ... } |
        | Interface | Pascal | public interface IEnumerable { ... } |
        | Method | Pascal | public class Object {<br>public virtual string ToString();<br>} |
        | Property | Pascal | public class String {<br>public int Length { get; }<br>} |
        | Event | Pascal | public class Process {<br>public event EventHandler Exited;<br>} |
        | Field | Pascal | public class MessageQueue {<br>public static readonly TimeSpan<br>InfiniteTimeout;<br>}<br>public struct UInt32 {<br>public const MinValue = 0;<br>} |
        | Enum value | Pascal | public enum FileMode {<br>Append,<br>...<br>} |
        | Type parameter, generic method | Pascal | public partial class Enum {<br>public static TEnum Parse<TEnum>(<br>string value) { ... }<br>} |
        | Type parameter, generic type | Pascal | public class Task<TResult> {<br>...<br>} |
        | Tuple element | Pascal | public partial class Range {<br>public<br>(int Offset, int Length)<br>GetOffsetAndLength(<br>int length) { ... }<br>} |
        | Parameter | Camel | public class Convert {<br>public static int ToInt32(string value);<br>} |
    - kind: annotation
      text: An early version of this table included a convention for instance field names. We later adopted the guideline that you should almost never use publicly exposed instance fields and should use properties instead. Thus, the guideline for publicly exposed instance fields was no longer needed. For the record, the convention was camelCasing.
      author: Brad Abrams
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - IDE1006
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: IDE1006 checks the first letter through the naming rule configured by FDGA057.
  naming:
    symbols:
      - parameter
    failures:
      - casing
