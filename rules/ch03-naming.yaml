- id: FDG3017
  strength: DO
  text: use a generic CLR type name, rather than a language-specific name, in the rare cases when an identifier has no semantic meaning beyond its type.
  context: null
  section: 3.2.3 Avoiding Language-Specific Names
  anchor: sec3_2_3
  body:
    - kind: paragraph
      text: For example, a method converting to `System.Int64` should be named `ToInt64`, not `ToLong` (because `System.Int64` is a CLR name for the C#-specific alias `long`). Table 3-4 presents several base data types using the CLR type names (as well as the corresponding type names for C#, Visual Basic, and C++).
    - kind: table
      text: |-
        **Table 3-4: CLR Type Names for Language-Specific Type Names**

        | C# | Visual Basic | C++ | CLR |
        | --- | --- | --- | --- |
        | `Sbyte` | `SByte` | `char` | `SByte` |
        | `Byte` | `Byte` | `unsigned char` | `Byte` |
        | `short` | `Short` | `short` | `Int16` |
        | `ushort` | `UInt16` | `unsigned short` | `UInt16` |
        | `int` | `Integer` | `int` | `Int32` |
        | `uint` | `UInt32` | `unsigned int` | `UInt32` |
        | `long` | `Long` | `__int64` | `Int64` |
        | `ulong` | `UInt64` | `unsigned __int64` | `UInt64` |
        | `float` | `Single` | `float` | `Single` |
        | `double` | `Double` | `double` | `Double` |
        | `bool` | `Boolean` | `bool` | `Boolean` |
        | `char` | `Char` | `wchar_t` | `Char` |
        | `string` | `String` | `String` | `String` |
        | `object` | `Object` | `Object` | `Object` |
  status: verified
