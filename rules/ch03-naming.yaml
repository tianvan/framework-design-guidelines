    - kind: paragraph
      text: For example, do not use “g_” or “s_” to indicate static fields. Publicly accessible fields (the subject of this section) are very similar to properties from the API design point of view; therefore, they should follow the same naming conventions as properties.
    - kind: annotation
      text: As with just about all the guidelines in this book, this guideline is meant to apply only to publicly exposed fields. In this case, it’s important that the names be clean and simple so the masses of consumers can easily understand them. As many have noted, there are very good reasons to use some sort of convention for private fields and local variables.
