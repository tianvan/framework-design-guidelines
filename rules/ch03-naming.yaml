- id: FDG3011
  strength: DO NOT
  text: use Hungarian notation.
  context: null
  section: 3.2.1 Word Choice
  anchor: sec3_2_1
  body:
    - kind: annotation
      text: |-
        It might be useful here to define what Hungarian notation is. It is the convention of prefixing a variable name with some lowercase encoding of its data type. For example, the variable `uiCount` would be an unsigned integer. Another common convention also adds a prefix indicating the scope of the variable in addition to or in place of the type (see Jeffrey’s later example of static and member variable-scope prefixes).

        One downside of Hungarian notation is that developers frequently change the type of variables during early coding, which requires the name of the variable to also change. Additionally, while commonly used fundamental data types (integers, characters, etc.) had well-recognized and standard prefixes, developers frequently fail to use a meaningful and consistent prefix for their custom data types.
      author: Brent Rector
    - kind: annotation
      text: There have always been both positive and negative effects of using the Hungarian naming convention, and they still exist today. Positives include better readability (if used correctly). Negatives include cost of maintenance, confusion if maintenance was not done properly, and finally, Hungarian makes the API more cryptic (less approachable) to some developers. In the world of procedural languages (e.g., C) and the separation of the System APIs for advanced developers from framework libraries for a much wider developer group, the positives seemed to be greater than the negatives. Today, with System APIs designed to be approachable to more developers, and with object-oriented (OO) languages, the trade-off seems to be pulling in the other direction. OO encapsulation brings variable declaration and usage points closer together, OO style favors short, well-factored methods, and abstractions often make the exact type less important or even meaningless.
      author: Krzysztof Cwalina
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: null
- id: FDG3012
  strength: AVOID
  text: using identifiers that conflict with keywords of widely used programming languages.
  context: null
  section: 3.2.1 Word Choice
  anchor: sec3_2_1
  body:
    - kind: paragraph
      text: According to Rule 4 of the Common Language Specification (CLS), all compliant languages must provide a mechanism that allows access to named items that use a keyword of that language as an identifier. C#, for example, uses the @ sign as an escape mechanism in this case. However, it is still a good idea to avoid common keywords because it is much more difficult to use a method with the escape sequence than one without it.
    - kind: annotation
      text: When I was porting my *Applied Microsoft .NET Framework Programming* book from C# to Visual Basic, I ran into this situation a lot. For example, the class library has `Delegate`, `Module`, and `Assembly` classes, and Visual Basic uses these same terms for keywords. This problem is exacerbated by the fact that VB is a case-insensitive language. Visual Basic, like C#, has a way to escape the keywords to disambiguate the situation to the compiler (using square brackets), but I was surprised that the VB team selected keywords that conflict with so many class library names.
      author: Jeffrey Richter
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1716
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA1716 checks namespaces, types, virtual or interface members and the parameters of virtual or interface members against C#, Visual Basic, and C++/CLI keywords; non-virtual members are not checked (probe with SDK 10.0.402). Renaming a public namespace, type, member or parameter changes the public API, so the fix is breaking; CA1716 has no code fix.
- id: FDG3013
  strength: DO
  text: use only ASCII characters in identifier names.
  context: null
  section: 3.2.1 Word Choice
  anchor: sec3_2_1
  body:
    - kind: paragraph
      text: All of the identifiers in .NET use ASCII characters, so anyone working with .NET is capable of typing those characters and working with files or tools that understand those characters. But the developers who want to use your library may not have easy capability to type non-ASCII characters, or may use text editors (or other tools) that do not reliably preserve non-ASCII data.
    - kind: paragraph
      text: When basing an identifier on a word that properly requires diacritical marks, either use (or invent) the diacritical-free approximation or choose a different identifier.
    - kind: paragraph
      text: Table 3-3 describes some suggested replacement spellings to avoid diacritical marks. It is provided for clarity, but is neither authoritative nor exhaustive.
    - kind: table
      text: |-
        **Table 3-3: Alternative Spellings to Avoid Diacritical Marks**

        | Spelling with Diacritics | Spelling for an Identifier |
        | --- | --- |
        | `Edelweiß` | `Edelweiss` |
        | `Mêlée` | `Melee` |
        | `Naïve` | `Naive` |
        | `Résumé` | `Resume` |
        | `Röntgen` | `Roentgen` |
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG3013
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Use only ASCII characters in the name '{0}'
    category: Naming
  notes: FDG3013 reports a non-ASCII character in a name that an externally visible declaration chooses (see FDG3003 for which names). Locals and non-public members are not checked, as chapter 3 governs public names. Renaming a public name changes the public API, so the fix is breaking; FDG3013 has no code fix.
