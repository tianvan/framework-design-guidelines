- id: FDG3040
  strength: DO NOT
  text: give class names a prefix (e.g., “C”).
  context: null
  section: 3.5 Names of Classes, Structs, and Interfaces
  anchor: sec3_5
  body:
    - kind: annotation
      text: One of the few prefixes used is “I” for interfaces (as in `ICollection`), but that is for historical reasons. In retrospect, I think it would have been better to use regular type names. In a majority of the cases, developers don’t care that something is an interface and not an abstract class, for example.
      author: Krzysztof Cwalina
    - kind: annotation
      text: The “I” prefix for interfaces is a clear recognition of the influence of COM (and Java) on the .NET Framework. COM popularized—even institutionalized—the notation that interfaces begin with “I.” Although we discussed diverging from this historical pattern, we decided to carry forward the pattern because so many of our users were already familiar with COM.
      author: Brad Abrams
    - kind: annotation
      text: Personally, I like the “I” prefix, and I wish we had more stuff like this. Little one-character prefixes go a long way toward keeping code terse and yet descriptive. As I said earlier, I use prefixes for my private type fields because I find this very useful.
      author: Jeffrey Richter
    - kind: annotation
      text: 'Note: This is really another application of Hungarian notation (though one without the disadvantages of the notation’s use in variable names).'
      author: Brent Rector
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: null
- id: FDG3041
  strength: CONSIDER
  text: ending the name of derived classes with the name of the base class.
  context: null
  section: 3.5 Names of Classes, Structs, and Interfaces
  anchor: sec3_5
  body:
    - kind: paragraph
      text: 'This is very readable and explains the relationship clearly. Two examples of this in code are `ArgumentOutOfRangeException`, which is a kind of `Exception`, and `SerializableAttribute`, which is a kind of `Attribute`. However, it is important to use reasonable judgment in applying this guideline; for example, the `Button` class is a kind of `Control`, although `Control` doesn’t appear in its name. The following are examples of correctly named classes:'
    - kind: code
      text: |-
        public class FileStream : Stream {...}
        public class Button : Control {...}
  status: verified
