- id: FDG3020
  strength: DO
  text: prefer adding a suffix rather than a prefix to indicate a new version of an existing API.
  context: null
  section: 3.2.4 Naming New Versions of Existing APIs
  anchor: sec3_2_4
  body:
    - kind: annotation
      text: |-
        We did exactly this when we added a faster (but not completely backward-compatible) version of `ReaderWriterLock`. We called it `ReaderWriterLockSlim`. There was debate whether we should call it `SlimReaderWriterLock` (following the guideline that you write it like you say it in English), but decided the discoverability (and the fact that lexical sorting would put them close to each other) was more important.

        This naming practice will assist discovery when browsing documentation or using IntelliSense. The old version of the API will be organized close to the new APIs, because most browsers and IntelliSense show identifiers in alphabetical order.
      author: Vance Morrison
