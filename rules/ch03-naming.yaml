      text: For acronym capitalization rules, see section 3.1.2.
    - kind: annotation
      text: We continually debate about whether a given acronym is well known or not. A good divining rod is what I call the grep test. Simply use some search engine to grep the Web for the acronym. If the first few results returned are indeed the meaning you intend, it is likely that your acronym qualifies as well known; if you don’t get those search results, think harder about the name. If you fail the test, don’t just spell out the acronym but consider how you can be descriptive in the name.
