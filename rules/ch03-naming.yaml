- id: FDG3048
  strength: DO
  text: follow the guidelines described in Table 3-5 when naming types derived from or implementing certain .NET types.
  context: null
  section: 3.5.2 Names of Common Types
  anchor: sec3_5_2
  body:
    - kind: paragraph
      text: These suffixing guidelines apply to the whole hierarchy of the specified base type. For example, it is not just types derived directly from `System.Exception` that need the suffixes, but also those derived from `Exception` subclasses.
    - kind: paragraph
      text: 'These suffixes should be reserved for the named types. Types derived from or implementing other types should not use these suffixes. For example, the following represent incorrect naming:'
    - kind: code
      text: |-
        public class ElementStream : Object { ... }
        public class WindowsAttribute : Control { ... }
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1710
      - CA1711
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: By default (dotnet_code_quality.CA1710.exclude_indirect_base_types = true) CA1710 checks only the direct base type, so a type derived from a subclass, such as an exception derived from ArgumentException or a class derived from Dictionary<TKey, TValue>, is not reported (probe with SDK 10.0.402). Renaming a public type changes the public API, so the fix is breaking; CA1710 and CA1711 have no code fix.
