  notes: Renaming a public type changes the public API, so the fix is breaking; CA1710 has no code fix.
- id: FDG3075
  strength: DO
  text: use two parameters named *sender* and *e* in event handlers.
  context: null
  section: 3.6.3 Names of Events
  anchor: sec3_6_3
  body:
    - kind: paragraph
      text: The sender parameter represents the object that raised the event. The sender parameter is typically of type `object`, even if it is possible to employ a more specific type. The pattern is used consistently across .NET and is described in more detail in section 5.4.
    - kind: annotation
      text: The `object sender` parameter may be my least favorite guideline in .NET. But, for consistency, I have followed it in every event I’ve ever declared.
      author: Jeremy Barton
    - kind: code
