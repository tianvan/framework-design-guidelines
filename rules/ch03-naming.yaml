- id: FDG3028
  strength: DO
  text: use a stable, version-independent product name at the second level of a namespace name.
  context: null
  section: 3.4 Names of Namespaces
  anchor: sec3_4
  body:
    - kind: annotation
      text: We added a set of controls to ASP.NET late in the ship cycle for V1.0 of the .NET Framework that rendered for mobile devices. Because these controls came from a team in a different division, our immediate reaction was to put them in a different namespace (`System.Web.MobileControls`). Then, after a couple of reorganizations and .NET Framework versions, we realized a better engineering trade-off was to fold that functionality into the existing controls in `System.Web.Controls`. In retrospect, we let internal organizational differences affect the public exposure of the APIs, and we came to regret that later. Avoid this type of mistake in your designs.
      author: Brad Abrams
