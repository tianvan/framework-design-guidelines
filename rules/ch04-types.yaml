- id: FDG4066
  strength: CONSIDER
  text: exposing the underlying string value from a strongly typed string in a get-only property.
  context: null
  section: 4.11 Strongly Typed Strings
  anchor: sec4_11
  body:
    - kind: paragraph
      text: '`ToString()` should be overridden because the underlying string value provides an obvious “interesting human-readable string” to return, per the guidelines on overriding `ToString()`.'
    - kind: paragraph
      text: Since `ToString()` is used for debugging and display purposes, rather than runtime decisions, exposing the underlying string value from the property presents a better general pattern to callers when the value is required—such as interoperating with libraries that use the same string values without using the wrapping type.
    - kind: paragraph
      text: If callers will only rarely, or never, need the underlying string value, then not having the property allows the type to look more like an enum to IntelliSense.
    - kind: paragraph
      text: There is not a prescriptive guideline for the name of the property. If no obvious name presents itself, remember that “Value” is preferred to “String” (section 3.2.3).
    - kind: paragraph
      text: For more information on overloading `ToString()`, see section 8.9.3.
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: Whether callers need the underlying value is a design judgment; not machine-checkable.
- id: FDG4067
  strength: DO
  text: override equality operators for strongly typed string types.
  context: null
  section: 4.11 Strongly Typed Strings
  anchor: sec4_11
  body:
    - kind: paragraph
      text: Overriding the equality operators allows for a strongly typed string type to syntactically look like either a string or an enum in common code patterns.
    - kind: paragraph
      text: Strongly typed strings should use ordinal string equality by default. However, when a specific domain represents case-insensitive content, the `IEquatable<T>` behavior can be based on other string comparisons.
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
