- id: FDG4022
  strength: AVOID
  text: using marker interfaces (interfaces with no members).
  context: null
  section: 4.6 Interface Design
  anchor: sec4_6
  body:
    - kind: paragraph
      text: If you need to mark a class as having a specific characteristic (marker), in general, use a custom attribute rather than an interface.
    - kind: code
      text: |-
        // Avoid
        public interface IImmutable {} // empty interface
        public class Key: IImmutable {
           ...
        }
        // Consider
        [Immutable]
        public class Key {
           ...
        }
    - kind: paragraph
      text: 'Methods can be implemented to reject parameters that are not marked with a specific attribute, as follows:'
    - kind: code
      text: |-
        public void Add(Key key, object value){
          if(!key.GetType().IsDefined(typeof(ImmutableAttribute), false)){
             throw new ArgumentException("The argument must be declared
        [Immutable]","key");
          }
          ...
        }
    - kind: annotation
      text: Of course, any kind of marking like this has a cost. Attribute testing is a lot more costly than type checking. You might find that it’s necessary to use the marker interface approach for performance reasons—measure and see. My own experience is that true markers (with no members) don’t come up very often. Most of the time, you need a no-kidding-around interface with actual functionality to do the job, in which case there is no choice to make.
      author: Rico Mariani
    - kind: paragraph
      text: 'The problem with this approach is that the check for the custom attribute can occur only at runtime. Sometimes it is very important that the check for the marker be done at compile-time. For example, a method that can serialize objects of any type might be more concerned with verifying the presence of the marker than with type verification at compile-time. Using marker interfaces might be acceptable in such situations. The following example illustrates this design approach:'
    - kind: code
      text: |-
        public interface ITextSerializable {} // empty interface
        public void Serialize(ITextSerializable item){
          // use reflection to serialize all public properties
           ...
        }
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1040
    coverage: partial
  autofix: no
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: "CA1040 reports externally visible interfaces with no members that do not extend another interface. The body allows a marker interface when the marker must be checked at compile time (the ITextSerializable example); such reports are not violations. CA1040 has no code fix. Noise: lowered to suggestion. On the noise samples the one CA1040 report was an empty interface used as the type of a property and a variable, which the body's compile-time marker exception allows (1 false positive of 1)."
