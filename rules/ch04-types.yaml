- id: FDG4043
  strength: DO NOT
  text: extend `System.Enum` directly.
  context: null
  section: 4.8 Enum Design
  anchor: sec4_8
  body:
    - kind: paragraph
      text: '`System.Enum` is a special type used by the CLR to create user-defined enumerations. Most programming languages provide a programming element that gives you access to this functionality. For example, in C# the `enum` keyword is used to define an enumeration.'
    - kind: paragraph
      text: Simple enums works well for a closed set of alternatives. When multiple values need to be expressed concurrently, consider a flag enum (section 4.8.1). When the set of alternatives should be open to allow for derived types to add new capabilities, consider the strongly typed string approach discussed in section 4.11.
