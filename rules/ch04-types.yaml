- id: FDG4047
  strength: AVOID
  text: creating flag enums where certain combinations of values are invalid.
  context: null
  section: 4.8.1 Designing Flag Enums
  anchor: sec4_8_1
  body:
    - kind: paragraph
      text: The `System.Reflection.BindingFlags` enum is an example of an incorrect design of this kind. The enum tries to represent many different concepts, such as visibility, staticness, member kind, and so on.
    - kind: code
      text: |-
        [Flags]
        public enum BindingFlags {
           Default = 0,

           Instance = 0x4,
           Static = 0x8,

           Public = 0x10,
           NonPublic = 0x20,

           CreateInstance = 0x200,
           GetField = 0x400,
           SetField = 0x800,
           GetProperty = 0x1000,
           SetProperty = 0x2000,
           InvokeMethod = 0x100,
           ...
        }
    - kind: paragraph
      text: Certain combinations of the values are not valid. For example, the `Type.GetMembers` method accepts this enum as a parameter, but the documentation for the method warns users, “You must specify either `BindingFlags.Instance` or `BindingFlags.Static` in order to get a return.” Similar warnings apply to several other values of the enum.
    - kind: paragraph
      text: 'If you have an enum with this problem, you should separate the values of the enum into two or more enums or other types. For example, the Reflection APIs could have been designed as follows:'
    - kind: code
      text: |-
        [Flags]
        public enum Visibilities {
           None = 0,
           Public = 0x10,
           NonPublic = 0x20,
        }

        [Flags]
        public enum MemberScopes {
           None = 0,
           Instance = 0x4,
           Static = 0x8,
        }

        [Flags]
        public enum MemberKinds {
           None = 0,
           Constructor = 1 << 0,
           Field = 1 << 1,
           PropertyGetter = 1 << 2,
           PropertySetter = 1 << 3,
           Method = 1 << 4,
        }

        public class Type {
           public MemberInfo[] GetMembers(MemberKinds members,
                                          Visibilities visibility,
                                          MemberScopes scope);
        }
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: Which combinations are invalid depends on the meaning of the values; not machine-checkable.
- id: FDG4048
  strength: AVOID
  text: using flag enum values of zero unless the value represents “all flags are cleared” and is named appropriately, as prescribed by the next guideline.
  context: null
  section: 4.8.1 Designing Flag Enums
  anchor: sec4_8_1
  body:
    - kind: paragraph
      text: The following example shows a common implementation of a check that programmers use to determine if a flag is set (see the if-statement in the example). The check works as expected for all flag enum values except the value of zero, where the Boolean expression always evaluates to true.
    - kind: code
      text: |-
        [Flags]
        public enum SomeFlag {
          ValueA = 0,  // this might be confusing to users
          ValueB = 1,
          ValueC = 2,
          ValueBAndC = ValueB | ValueC,
        }

        SomeFlag flags = GetValue();
        if ((flags & SomeFlag.ValueA) == SomeFlag.ValueA) {
            ...
        }
    - kind: annotation
      text: |-
        Note that in C# the literal constant 0 implicitly converts to any enum type, so you could just write:

        ```
        if (Foo.SomeFlag == 0)...
        ```

        We support this special conversion in order to provide programmers with a consistent way of writing the default value of an enum type, which by CLR decree is “all bits zero” for any value type.
      author: Anders Hejlsberg
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1008
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA1008 reports an externally visible flag enum whose zero value is not named None. Whether the value means all flags are cleared is not checked. The fix renames the value, which changes the public API, so it is breaking.
- id: FDG4049
  strength: DO
  text: name the zero value of flag enums `None`. For a flag enum, the value must always mean “all flags are cleared.”
  context: null
  section: 4.8.1 Designing Flag Enums
  anchor: sec4_8_1
  body:
    - kind: code
      text: |-
        [Flags]
        public enum BorderStyle {
          Fixed3D   = 0x1,
          FixedSingle  = 0x2,
          None  = 0x0
        }
        if (foo.BorderStyle == BorderStyle.None)....
    - kind: annotation
      text: |-
        Note that the zero value is special in that it is the default value that will be assigned if no other assignment is made. Thus, it has the potential to be the most common value. Your design should accommodate this situation. In particular, the zero value should be either of the following:

        - A very good default value (when there is such a default)
        - An error value that is checked by your APIs (when there is no good default value and you want to ensure that users set something)
      author: Vance Morrison
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1008
