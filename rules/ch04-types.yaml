- id: FDG4037
  strength: DO NOT
  text: provide reserved enum values that are intended for future use.
  context: null
  section: 4.8 Enum Design
  anchor: sec4_8
  body:
    - kind: paragraph
      text: You can always simply add values to the existing enum at a later stage. Section 4.8.2 provides more details on adding values to enums. Reserved values just pollute the set of real values and tend to lead to user errors.
    - kind: code
      text: |-
        public enum DeskType {
          Circular,
          Oblong,
          Rectangular,

          // the following two values should not be here
          ReservedForFutureUse1,
          ReservedForFutureUse2,
        }
  status: draft
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1700
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA1700 reports enum values whose names contain 'Reserved'. Reserved values with other names are not detected. Removing or renaming a public enum value changes the public API, so the fix is breaking; CA1700 has no code fix.
- id: FDG4038
  strength: AVOID
  text: publicly exposing enums with only one value.
  context: null
  section: 4.8 Enum Design
  anchor: sec4_8
  body:
    - kind: paragraph
      text: A common practice for ensuring future extensibility of C APIs is to add reserved parameters to method signatures. Such reserved parameters can be expressed as enums with a single default value. This practice should not be followed in managed APIs. Method overloading allows adding parameters in future releases.
    - kind: code
      text: |-
        // bad design
        public enum SomeOption {
           DefaultOption
           // we will add more options in the future
        }

        ...

        // The option parameter is not needed.
        // It can always be added in the future
        // to an overload of SomeMethod().
        public void SomeMethod(SomeOption option) {
          ...
        }
    - kind: annotation
      text: While I agree that this example is not a good practice, I think it is OK to define enums with no values (or just one “sentinel” value). The key question is whether the type safety (not being allowed to “accidentally” use an int) is valuable. If you pass out int values as “handles” to your structure, passing them out as an enum rather than an int is a REALLY good thing because it prevents mistakes and makes the intent of the API clear (What can I do with this “handle” you returned to me?). When you do this, you may be defining enums with no values or maybe just one (a “null” value).
      author: Vance Morrison
    - kind: annotation
      text: I agree with Vance that using a strong type instead of `int` or `string` provides value for the case “I gave this to you, and need you to give this back to me,” but I would advise using a custom struct rather than an enum. A custom struct can evolve better (such as gaining extra fields, or being `IDisposable`).
      author: Jeremy Barton
    - kind: annotation
      text: Although having enums with one value is a bad idea, enums with just two values are far more common. If you have a Boolean parameter and suspect that the choice may have a third possible value sometime in the future, it’s usually a good idea to proactively add the parameter to a two-valued enum. This can help to avoid versioning problems down the road.
      author: Joe Duffy
    - kind: annotation
      text: |-
        Like Joe, I believe an enum with just two values is a fine and common practice. I much prefer this to a Boolean argument. The main reason is for code readability. For example, consider:

        ```
        FileStream f = File.Open ("foo.txt", true, false);
        ```

        This call gives you no context whatsoever for understanding the meaning behind true and false. Now consider if the call were:

        ```
        FileStream f = File.Open ("foo.txt", CasingOptions.CaseSensitive,
                                  FileMode.Open)
        ```
      author: Brad Abrams
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG4038
    coverage: full
  autofix: no
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: The enum '{0}' has only one value
    category: Types
  notes: 'Library only: the text is about publicly exposed enums. FDG4038 reports an externally visible enum with exactly one member. The Morrison and Barton annotations prefer a type-safe handle in some cases (Barton as a custom struct); the text states no exception. Removing the enum changes the public API, so there is no code fix.'
- id: FDG4039
  strength: DO NOT
  text: include sentinel values in enums.
  context: null
  section: 4.8 Enum Design
  anchor: sec4_8
  body:
    - kind: paragraph
      text: Although they are sometimes helpful to framework developers, sentinel values are confusing to users of the framework. They are used to track the state of the enum rather than being one of the values from the set represented by the enum. The following example shows an enum with an additional sentinel value used to identify the last value of the enum, which is intended for use in range checks. This is bad practice in framework design.
    - kind: code
      text: |-
        public enum DeskType {
           Circular    = 1,
           Oblong      = 2,
           Rectangular = 3,

           LastValue   = 3 // this sentinel value should not be here
        }

        public void OrderDesk(DeskType desk){
          if((desk > DeskType.LastValue){
            throw new ArgumentOutOfRangeException(...);
          }
           ...
        }
    - kind: paragraph
      text: Rather than relying on sentinel values, framework developers should perform the check using one of the real enum values.
    - kind: code
      text: |-
        public void OrderDesk(DeskType desk){
          if(desk > DeskType.Rectangular || desk < DeskType.Circular){
            throw new ArgumentOutOfRangeException(...);
          }
          ...
        }
    - kind: annotation
      text: 'You can get yourself into a lot of trouble by trying to be too clever with enums. Sentinel values are a great example of this: People write code like the example shown, but they use the sentinel value `LastValue` instead of `Rectangular`, as recommended. When a new value comes along and `LastValue` is updated, their program “automatically” does the right thing and accepts the new input value without giving an `ArgumentOutOfRangeException`. That sounds grand except for all that we didn’t show—the part that’s doing the actual work and that might not yet expect or even handle the new value. By avoiding sentinel values you will be forced to revisit all the right places to ensure that the new value really is going to work. The few minutes you spend visiting those call sites will be more than repaid in time you save avoiding bugs.'
      author: Rico Mariani
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1069
    coverage: partial
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA1069 reports an enum member whose literal value duplicates another member's, which catches a sentinel that repeats the last real value (LastValue = 3 in the book's example). Sentinels with their own value are not detected. CA1069 has no code fix.
- id: FDG4040
  strength: DO
  text: provide a value of zero on simple enums.
  context: null
  section: 4.8 Enum Design
  anchor: sec4_8
  body:
    - kind: paragraph
      text: Consider calling the value something like “None.” If such a value is not appropriate for this particular enum, the most common default value for the enum should be assigned the underlying value of zero.
    - kind: code
      text: |-
        public enum Compression {
          None = 0,
          GZip,
          Deflate,
        }
        public enum EventType {
          Error = 0,
          Warning,
          Information,
          ...
        }
    - kind: annotation
      text: Remember that class and struct fields are initialized to their zero-value by default. When it would be hard to describe a “default” state, or when it’s important that the caller express an intentional value, consider naming the zero value “Undefined” and treating it as an invalid value.
      author: Jeremy Barton
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1008
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA1008 reports an externally visible simple enum with no zero value; any name is accepted for the zero value, matching the body (and the Barton annotation's Undefined). Its fix adds None = 0, where the body may instead want the most common value at zero, which renumbers the enum; CA1008's fix also renames flag enum values (FDG4049), so the fix is treated as breaking.
- id: FDG4041
  strength: CONSIDER
  text: 'using `Int32` (the default in most programming languages) as the underlying type of an enum unless any of the following is true:'
  context: null
  section: 4.8 Enum Design
  anchor: sec4_8
  body:
    - kind: list
      text: |-
        - The enum is a flags enum and you have more than 32 flags, or expect to have more in the future.
        - The underlying type needs to be different than `Int32` for easier interoperability with unmanaged code expecting different-size enums.
          > **Rico Mariani**
          >
          > Did you know that the CLR supports enums with an underlying type of `float` or `double` even though most languages don’t choose to expose it? This is very handy for strongly typed constants that happen to be floating point (e.g., a set of canonical conversion factors for different measuring systems). It’s in the ECMA standard.
        - A smaller underlying type would result in substantial savings in space. If you expect the enum to be used mainly as an argument for flow of control, the size makes little difference. The size savings might be significant if:
          - You expect the enum to be used as a field in a very frequently instantiated structure or class.
          - You expect users to create large arrays or collections of the enum instances.
          - You expect a large number of instances of the enum to be serialized.
    - kind: paragraph
      text: For in-memory usage, be aware that managed objects are always DWORD-aligned. So, you effectively need multiple enums or other small structures in an instance to pack a smaller enum with in order to make a difference, because the total instance size will always be rounded up to a DWORD.
    - kind: annotation
      text: Keep in mind that it is a binary breaking change to change the size of the enum type once you have shipped, so choose wisely— with an eye toward the future. Our experience has been that `Int32` is usually the right choice; thus we made it the default.
      author: Brad Abrams
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1028
    coverage: partial
  autofix: breaking
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA1028 reports an externally visible enum whose underlying type is not Int32; Int64 flag enums are not reported. The interop and space-saving exceptions (the second and third items of the list) cannot be detected; such reports are not violations. Changing the underlying type is a binary breaking change (the Abrams annotation), so the fix is breaking.
