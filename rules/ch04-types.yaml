- id: FDG4053
  strength: AVOID
  text: publicly exposed nested types. The only exception to this guideline is if variables of the nested type need to be declared only in rare scenarios such as subclassing or other advanced customization scenarios.
  context: null
  section: 4.9 Nested Types
  anchor: sec4_9
  body:
    - kind: annotation
      text: The main motivation for this guideline is that many beginner developers don’t understand why some type names have dots in them and some don’t. As long as they don’t have to type in the type name, they don’t care. But the moment you ask them to declare a variable of a nested type, they get lost. Therefore, in general, we avoid nested types and use them only in places where developers almost never have to declare variables of that type (e.g., collection enumerators).
      author: Krzysztof Cwalina
    - kind: annotation
      text: The main scenario where we expose nested types in the Base Class Libraries is for struct-based enumerators (which also violate the guideline of not making mutable structs). We feel that these are generally OK because (a) they help with performance by avoiding heap-based allocation and interface dispatch and (b) they’re almost always used in a foreach statement and most callers aren’t aware that a struct enumerator was involved.
      author: Jeremy Barton
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1034
    coverage: partial
  autofix: no
  severity:
    library: warning
    application: none
