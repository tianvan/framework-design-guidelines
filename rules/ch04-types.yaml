- id: FDG4026
  strength: DO NOT
  text: provide a default constructor for a struct.
  context: null
  section: 4.7 Struct Design
  anchor: sec4_7
  body:
    - kind: paragraph
      text: Many CLR languages do not allow developers to define default constructors on value types. Users of these languages are often surprised to learn that `default(SomeStruct)` and `new SomeStruct()` don’t necessarily produce the same value. Even if your language does allow defining a default constructor on a value type, it probably isn’t worth the confusion it would cause if you did it.
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG4026
    coverage: full
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Remove the parameterless constructor of the struct '{0}'
    category: Types
  notes: FDG4026 reports an explicit parameterless instance constructor declared on a struct or record struct (allowed from C# 10, including a parameterless primary constructor). Removing it changes what new S() returns, so there is no code fix.
- id: FDG4027
  strength: DO NOT
  text: define mutable value types.
  context: null
  section: 4.7 Struct Design
  anchor: sec4_7
  body:
    - kind: paragraph
      text: Mutable value types have several problems. For example, when a property getter returns a value type, the caller receives a copy. Because the copy is created implicitly, developers might not be aware that they are mutating the copy, not the original value. Also, some languages (dynamic languages, in particular) have problems using mutable value types because even local variables, when dereferenced, cause a copy to be made.
    - kind: code
      text: |-
        // bad design
        public struct ZipCode {
           public int FiveDigitCode { get; set; } // get/set properties
           public int PlusFourExtension { get; set; }
        }

        // good design
        public struct ZipCode {
           public ZipCode(int fiveDigitCode, int plusFourExtension){...}
           public ZipCode(int fiveDigitCode):this(fiveDigitCode,0){}

           public int FiveDigitCode { get; } // get-only properties
           public int PlusFourExtension { get; }
        }
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG4027
    coverage: partial
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: The value type '{0}' can be changed through '{1}'
    category: Types
  notes: FDG4027 reports, on an externally visible struct that is not readonly, each externally visible instance field that is not readonly and each externally visible instance property or indexer with a set accessor (init accessors are allowed); the book's bad design uses get/set properties. Public methods that change the instance are not detected, and ref structs are left to FDG4031. Removing a setter changes the public API, so there is no code fix.
- id: FDG4028
  strength: DO
  text: declare immutable value types with the `readonly` modifier.
  context: null
  section: 4.7 Struct Design
  anchor: sec4_7
  body:
    - kind: paragraph
      text: Newer compiler understand the `readonly` modifier on a value type and avoid making extra value copies on operations such as invoking a method on a field declared with the `readonly` modifier.
    - kind: code
      text: |-
        public readonly struct ZipCode {
           public ZipCode(int fiveDigitCode, int plusFourExtension){...}
           public ZipCode(int fiveDigitCode):this(fiveDigitCode,0){}

           public int FiveDigitCode { get; } // get-only properties
           public int PlusFourExtension { get; }

           public override string ToString() {
              ...
           }
        }

        public partial class Other {
           private readonly ZipCode _zipCode;

           ...
           private void Work() {
              // Because ZipCode is declared as "readonly struct" the
              // ToString() method call does not involve a defensive copy
              string zip = _zipCode.ToString();
              ...
           }
        }
    - kind: annotation
      text: Be careful when marking an existing struct as `readonly`. Existing structs that appear to be immutable may be mutable in very subtle ways. We learned this lesson hard way when `Nullable<T>` was marked as `readonly` in .NET Core. We quickly found that it broke existing code that depended on the `GetHashCode` and `Equals` methods mutating the `T` for caching, and the change was rolled back.
      author: Jan Kotas
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - IDE0250
    coverage: partial
  autofix: yes
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: "7.2"
  alternative: Before C# 7.2 there is no readonly struct; declare every instance field readonly.
  analyzer: null
  notes: IDE0250 reports a struct whose instance fields are all readonly but which is not declared readonly. Adding the modifier does not change the public API, so the fix is safe.
- id: FDG4029
  strength: DO
  text: declare nonmutating methods on mutable value types with the `readonly` modifier.
  context: null
  section: 4.7 Struct Design
  anchor: sec4_7
  body:
    - kind: paragraph
      text: For better or worse, there are public mutable value types in .NET. As mentioned in the guidance against having mutable value types, when a mutable value type is stored in a field declared with the `readonly` modifier, any method or property invocation is performed on a copy of the value. Like the `readonly` modifier at the type level, the `readonly` modifier on a method allows the compiler to skip copying the value before invoking the method.
    - kind: paragraph
      text: When the type is declared with the `readonly` modifier, there is no additional benefit from specifying the modifier on each method.
    - kind: paragraph
      text: The C# compiler automatically applies the `readonly` modifier to the `get` method of a property declared using the auto-implemented property syntax.
    - kind: code
      text: |-
        // Using the "bad design" mutable version of ZipCode
        public struct ZipCode {
           private int _plusFour;

           // This get method is implicitly readonly
           public int FiveDigitCode { get; set; }

           // This one needs it explicitly
           public int PlusFourExtension {
              readonly get => _plusFour;

              set {
                 if (value > 9999) {
                    value = -1;
                 }
                 _plusFour = value;
              }
           }

           // Any methods also need the readonly modifier
           // (if they don't mutate)
           public override readonly string ToString() { ... }
        }
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - IDE0251
    coverage: full
  autofix: yes
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: "8.0"
  alternative: Before C# 8.0 there are no readonly members; make the type immutable instead (FDG4027).
  analyzer: null
  notes: IDE0251 reports a member of a struct that does not mutate the instance and is not readonly. Members of a readonly struct are not reported, matching the body. Adding the modifier does not change the public API.
- id: FDG4030
  strength: DO
  text: ensure that a state where all instance data is set to zero, false, or null (as appropriate) is valid.
  context: null
  section: 4.7 Struct Design
  anchor: sec4_7
  body:
    - kind: paragraph
      text: This prevents accidental creation of invalid instances when an array of the structs is created. For example, the following struct is incorrectly designed. The parameterized constructor is meant to ensure a valid state, but the constructor is not executed when an array of the struct is created. Thus, the instance field value gets initialized to 0, which is not a valid value for this type.
    - kind: code
      text: |-
        // bad design
        public struct PositiveInteger {
          private int value;

          public PositiveInteger(int value) {
            if (value <= 0) throw new ArgumentException(...);
            _value = value;
          }

          public override string ToString() {
            return _value.ToString();
          }
        }
    - kind: paragraph
      text: The problem can be fixed by ensuring that the default state (in this case, the value field equal to 0) is a valid logical state for the type.
    - kind: code
      text: |-
        // good design
        public struct PositiveInteger {
          private int _value; // the logical value is value+1

          public PositiveInteger(int value) {
            if (value <= 0) throw new ArgumentException(...);
            _value = value-1;
          }

          public override string ToString() {
            return (_value+1).ToString();
          }
        }
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: Whether the all-zero state is valid depends on the type's meaning; not machine-checkable.
- id: FDG4031
  strength: DO NOT
  text: define ref-like value types (`ref struct` types), other than for specialized low-level purposes where performance is critical.
  context: null
  section: 4.7 Struct Design
  anchor: sec4_7
  body:
    - kind: paragraph
      text: A `ref struct` type is an advanced concept that comes with several restrictions. Values from a `ref struct` type are allowed to exist only on the stack, and can never be boxed into the heap. Consequently, a `ref struct` type cannot be used as the type for a field in another type, except for other `ref struct` types, and cannot be used in asynchronous methods generated with the `async` keyword.
    - kind: paragraph
      text: These usability limitations are a source of confusion and frustration for less advanced developers, and should generally be avoided.
    - kind: annotation
      text: |-
        I’ve found myself saying, “Yeah, but `ref struct`s break all the rules,” when discussing certain inconsistencies in the guidelines in this book compared to some features from .NET Core 2.0 (when `ref struct`s were first introduced) and beyond. This doesn’t mean that the ref-like value types have a free license to ignore the guidance, but that the restrictions placed on them can sometimes force a compromise between strict compliance and the target scenario.

        The usability concerns and occasional inconsistency with the rest of the platform are why `ref structs` have a “DO NOT” guidance, and almost every one of them involves long discussion in API review.
      author: Jeremy Barton
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: the exception (specialized low-level purposes where performance is critical) is a matter of intent that symbols do not show.'
- id: FDG4032
  strength: DO
  text: implement `IEquatable<T>` on value types.
  context: null
  section: 4.7 Struct Design
  anchor: sec4_7
  body:
    - kind: paragraph
      text: The `Object.Equals` method on value types causes boxing, and its default implementation is not very efficient, because it uses reflection. `IEquatable<T>.Equals` can have much better performance and can be implemented so that it will not cause boxing. See section 8.6 for guidelines on implementing `IEquatable<T>`.
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG4032
    coverage: partial
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Implement IEquatable<{0}> on the value type '{0}'
    category: Types
  notes: "FDG4032 reports an externally visible struct, other than a ref struct, that does not implement IEquatable<T> of itself; record structs implement it already. Structs that are not externally visible are not checked. CA1815 is not mapped: it also asks for the equality operators, which this rule does not (section 8.6 covers equality). There is no code fix: Equals and GetHashCode need the type's own notion of equality."
