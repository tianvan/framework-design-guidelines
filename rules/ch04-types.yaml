  context: null
  section: 4.10 Types and Assembly Metadata
  anchor: sec4_10
  body:
    - kind: code
      text: '[assembly:CLSCompliant(true)]'
    - kind: paragraph
      text: The attribute is a declaration that the types contained in the assembly are CLS<sup>3</sup> compliant and so can be used by all .NET languages.<sup>4</sup> Some languages, such as C#, verify compliance<sup>5</sup> with the standard if the attribute is applied.
    - kind: paragraph
      text: 3. The CLS standard is an interoperability agreement between framework developers and language developers as to what subset of the CLR type system can be used in framework APIs so that these APIs can be used by all CLS-compliant languages.
    - kind: paragraph
      text: 4. All that support the CLS standard—and almost all of the CLR languages do.
    - kind: paragraph
      text: 5. C# verifies compliance with most of the CLS rules. Some rules are not automatically verifiable. For example, the standard does not say that an assembly cannot have non-compliant APIs. Instead, it says only that noncompliant APIs must be marked with `CLSCompliant(false)` and that a compliant alternative must exist. But, of course, the existence of an alternative to a noncompliant API cannot be verified automatically.
    - kind: paragraph
      text: For example, unsigned integers are not in the CLS subset. Therefore, if you add an API that uses `UInt32` (for example), C# will generate a compilation warning. To comply with the CLS standard, the assembly must provide a compliant alternative and explicitly declare the noncompliant API as `CLSCompliant(false)`.
    - kind: code
      text: |-
        public static class Console {

          [CLSCompliant(false)]
          public void Write(uint value); // not CLS compliant

          public void Write(long value); // CLS-compliant alternative
        }
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1014
    coverage: partial
  autofix: no
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: the text scopes it to assemblies with public types, for use by all .NET languages. CA1014 reports an assembly with externally visible types and no CLSCompliantAttribute, without a source location. CA1014 has no code fix. CLSCompliant(false) on the assembly also satisfies CA1014, though the rule asks for true.'
