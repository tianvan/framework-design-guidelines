- id: FDG4008
  strength: AVOID
  text: 'defining a struct unless the type has all of the following characteristics:'
  context: null
  section: 4.2 Choosing Between Class and Struct
  anchor: sec4_2
  body:
    - kind: list
      text: |-
        - It logically represents a single value, similar to primitive types (`int`, `double`, etc.).
        - It has an instance size less than 24 bytes.
        - It is immutable.
        - It will not have to be boxed frequently.
    - kind: paragraph
      text: In all other cases, you should define your types as classes.
    - kind: annotation
      text: In my opinion, a value type should be defined for types with a size of approximately 16 bytes or less. Value types can be more than 16 bytes if you don’t intend to pass them to other methods or copy them to and from a collection class (like an array). I would also define a value type if you expect instances of the type to be used for short periods of time (usually they are created in a method and no longer needed after a method returns). I used to discourage defining value types if you thought that instances of them would be placed in a collection due to all the boxing that would have to be done. But, fortunately, newer versions of the CLR, C#, and other languages support generics so that boxing is no longer necessary when putting value type instances in a collection.
      author: Jeffrey Richter
    - kind: annotation
      text: I frequently struggle with the reference versus value type decision. Although these rules are very black-and-white, there is a fairly large cliff you jump off when you decide to implement a reference type. This decision means you will pay the cost of heap allocation for each instance—which can impact scalability on multiprocessor machines due to the shared heap and cost of collections—in addition to at least a pointer of overhead (due to the object header) and a level of indirection to each access (due to the need to go through an object reference). That said, my experience has shown that whenever I attempt to be clever and break any of these rules, it usually comes back to bite me.
      author: Joe Duffy
    - kind: annotation
      text: |-
        Whether a struct or a class is better for performance depends on usage characteristics, which themselves depend on the split between your library code and the calling code from your user. When a struct is passed into a method by value, the details of memory layout and expense differ by runtime OS and CPU architecture—so a struct with three `Int64` fields isn’t always the same as a struct with six `Int32` fields. Since the usage characteristics cannot be readily known, the size guideline is a general approximation.

        Private types have the flexibility of using performance analysis data to change from a struct to a class, or vice versa, from build to build. But for public types, you have to make a decision and stick with it.
      author: Jeremy Barton
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: whether a type logically represents a single value, and how often it is boxed, cannot be read from symbols. Immutability is checked by FDG4027 and the readonly modifier by FDG4028.'
- id: FDG4009
  strength: DO
  text: favor defining classes over interfaces.
  context: null
  section: 4.3 Choosing Between Class and Interface
  anchor: sec4_3
  body:
    - kind: paragraph
      text: Class-based APIs can be evolved with much greater ease than interface-based APIs because it is possible to add members to a class without breaking existing code.
    - kind: annotation
      text: I have talked about this guideline with quite a few developers on our team. Many of them, including those who initially disagreed with the guideline, have said that they regret having shipped some API as an interface. I have not heard of even one case in which somebody regretted that they shipped a class.
      author: Krzysztof Cwalina
    - kind: annotation
      text: I agree with Krzysztof in general. However, you do need to think about some other things. There are some special base classes, such as `MarshalByRefObject`. If your library type provides an abstract base class that isn’t itself derived from `MarshalByRefObject`, then types that derive from your abstract base class cannot live in a different `AppDomain`.
      author: Jeffrey Richter
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: A design choice between abstractions; not machine-checkable.
- id: FDG4010
  strength: DO
  text: use abstract classes instead of interfaces to decouple the contract from implementations.
  context: null
  section: 4.3 Choosing Between Class and Interface
  anchor: sec4_3
  body:
    - kind: paragraph
      text: Abstract classes, if designed correctly, allow for the same degree of decoupling between contract and implementation.
    - kind: annotation
      text: Here is one instance in which the design guideline, if followed too strictly, can paint you into a corner. Abstract types do version much better, and allow for future extensibility, but they also burn your one and only one base type. Interfaces are appropriate when you are really defining a contract between two objects that is invariant over time. Abstract base types are better for defining a common base for a family of types. When we did .NET, there was somewhat of a backlash against the complexity and strictness of COM—interfaces, GUIDs, variants, and IDL were all seen as bad things. I believe today that we have a more balanced view of this. All of these COM-isms have their place, and in fact you can see interfaces coming back as a core concept in WCF.
      author: Chris Anderson
    - kind: annotation
      text: One thing I’ve started doing is to actually bake as much contract into my abstract class as possible. For example, I might want to have four overloads to a method, where each overload offers an increasingly complex set of parameters. The best way to do this is to provide a nonvirtual implementation of these methods on the abstract class and have the implementations all route to a protected abstract method that provides the actual implementation. By doing this, you can write all the boring argument-checking logic once. Developers who want to implement your class will thank you.
      author: Brian Pepin
    - kind: annotation
      text: What Brian is describing here is the Template Method Pattern, discussed more in section 9.9.
      author: Jeremy Barton
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: A design choice between abstractions; not machine-checkable.
- id: FDG4011
  strength: DO
  text: define an interface if you need to provide a polymorphic hierarchy of value types.
  context: null
  section: 4.3 Choosing Between Class and Interface
  anchor: sec4_3
  body:
    - kind: paragraph
      text: Value types cannot inherit from other types, but they can implement interfaces. For example, `IComparable`, `IFormattable`, and `IConvertible` are all interfaces, so value types such as `Int32`, `Int64`, and other primitives can all be comparable, formattable, and convertible.
    - kind: code
      text: |-
        public struct Int32 : IComparable, IFormattable, IConvertible {
          ...
        }
        public struct Int64 : IComparable, IFormattable, IConvertible {
          ...
        }
    - kind: annotation
      text: Good interface candidates often have this “mix in” feel to them. All sorts of objects can be `IFormattable`—it isn’t restricted to a certain subtype. It’s more like a type attribute. Other times we have interfaces that look more like they should be classes—`IFormatProvider` springs to mind. The fact that the interface’s name ended in “er” speaks volumes.
      author: Rico Mariani
    - kind: annotation
      text: Another sign that you’ve got a well-defined interface is that the interface does exactly one thing. If you have an interface that has a grab bag of functionality, that’s a warning sign. You’ll end up regretting it because in the next version of your product you’ll want to add new functionality to this rich interface, but you can’t.
      author: Brian Pepin
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: Whether a polymorphic hierarchy of value types is needed is a design decision; not machine-checkable.
- id: FDG4012
  strength: CONSIDER
  text: defining interfaces to achieve a similar effect to that of multiple inheritance.
  context: null
  section: 4.3 Choosing Between Class and Interface
  anchor: sec4_3
  body:
    - kind: paragraph
      text: For example, `System.IDisposable` and `System.ICloneable` are both interfaces, so types, like `System.Drawing.Image`, can be both disposable and cloneable yet still inherit from the `System.MarshalByRefObject` class.
    - kind: code
      text: |-
        public class Image : MarshalByRefObject, IDisposable, ICloneable {
           ...
        }
    - kind: annotation
      text: When a class is derived from a base class, I say that the derived class has an “is a” relationship with the base. For example, a `FileStream` “is a” `Stream`. However, when a class implements an interface, I say that the implementing class has a “can-do” relationship with the interface. For example, a `FileStream` “can-do” disposing because it implements the `IDisposable`.
      author: Jeffrey Richter
    - kind: annotation
      text: |-
        One hint that Jeffrey’s “can-do” paradigm is being followed is when the interface ends in the suffix “able.” For example, `IDisposable` can be loosely rewritten “a thing that can do `Dispose`.”

        If we compare this to `ICryptoTransform`, that interface isn’t describing a capability; it’s instead defining a set of related actions. When we added `System.Span<T>` in .NET Core 2.0, we found that we couldn’t add Span support to symmetric cryptography because we used an interface instead of an abstract base class. It may have taken 15 years to realize that it was a mistake to have that type as an interface, but it *was* nonetheless a mistake.
      author: Jeremy Barton
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: A design choice; not machine-checkable.
- id: FDG4013
  strength: DO NOT
  text: define public or protected internal constructors in abstract types.
  context: null
  section: 4.4 Abstract Class Design
  anchor: sec4_4
  body:
    - kind: paragraph
      text: Constructors should be public only if users will need to create instances of the type. Because you cannot create instances of an abstract type, an abstract type with a public constructor is incorrectly designed and misleading to the users.<sup>2</sup>
    - kind: paragraph
      text: 2. This also applies to protected internal constructors.
    - kind: code
      text: |-
        // bad design
        public abstract class Claim {
          public Claim() {
          }
        }
        // good design
        public abstract class Claim {
          protected Claim() {
          }
        }
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG4013
      - CA1012
    coverage: full
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Make the constructor of the abstract class '{0}' protected instead of protected internal
    category: Types
  notes: "CA1012 reports a public constructor on an externally visible abstract type; FDG4013 reports the protected internal constructors that CA1012 does not (footnote 2). Changing a constructor's accessibility changes the public API: FDG4013 has no code fix, and CA1012's fix is breaking. Abstract types that are not externally visible are not checked: their constructors are not visible to users, which is the book's reason."
- id: FDG4014
  strength: DO
  text: define a protected or an internal constructor in abstract classes.
  context: null
  section: 4.4 Abstract Class Design
  anchor: sec4_4
  body:
    - kind: paragraph
      text: A protected constructor is more common and simply allows the base class to do its own initialization when subtypes are created.
    - kind: code
      text: |-
        public abstract class Claim {
          protected Claim() {
            ...
          }
        }
    - kind: paragraph
      text: An internal constructor can be used to limit concrete implementations of the abstract class to the assembly defining the class.
    - kind: code
      text: |-
        public abstract class Claim {
          internal Claim() {
            ...
          }
        }
    - kind: annotation
      text: Many languages (such as C#) will insert a protected constructor if you do not. It is a good practice to define the constructor explicitly in the source so that it can be more easily documented and maintained over time.
      author: Brad Abrams
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1012
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'CA1012 reports a public constructor on an externally visible abstract type. An abstract class with no declared constructor complies: the C# compiler gives it a protected one. Making the constructor protected changes the public API, so the fix is breaking.'
- id: FDG4015
  strength: DO
  text: provide at least one concrete type that inherits from each abstract class that you ship.
  context: null
  section: 4.4 Abstract Class Design
  anchor: sec4_4
  body:
    - kind: paragraph
      text: Doing this helps to validate the design of the abstract class. For example, `System.IO.FileStream` is an implementation of the `System.IO.Stream` abstract class.
    - kind: annotation
      text: I have seen countless examples of a “well-designed” base class or interface where the designers spent hundreds of hours debating and tweaking the design, only to have it be blown out of the water when the first real-world client came to use the design. Far too often these real-world clients come too late in the product cycle to allow time for the correct fix. Forcing yourself to provide at least one concrete implementation reduces the chances of finding a new problem late in the product cycle.
      author: Brad Abrams
    - kind: annotation
      text: My rule of thumb for testing a type or set of types is to have three people write three apps against it based on scenarios you hope to support. If the client code is pretty in all three cases, you’ve done a good job. Otherwise, you should consider refactoring until pretty happens.
      author: Chris Sells
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: the concrete type can ship in another assembly of the framework, which one compilation cannot see.'
