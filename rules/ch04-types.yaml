- id: FDG4063
  strength: CONSIDER
  text: defining a strongly typed string value type when a base class supports a fixed set of inputs but a derived type could support more.
  context: null
  section: 4.11 Strongly Typed Strings
  anchor: sec4_11
  body:
    - kind: paragraph
      text: When a strongly typed string is used only by a sealed type hierarchy, there is little to no value in supporting values other than the predefined ones, and an enum is a more consistent type choice.
    - kind: paragraph
      text: A strongly typed string provides the most benefit when most code treats it as if it were an enum, such as HTTP header names or cryptographic digest algorithms. When the number of possible values is too large, such as all possible filenames, the value in a strongly typed string is reduced to just parameter consistency via type checking.
    - kind: paragraph
      text: A variation of strongly typed strings is used in .NET for the `JsonEncodedText` type, where the type indicates that the value has already been processed by a string escaping/normalization process. This is a valuable approach, but does not represent a strongly typed string.
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: Whether a base class's inputs may be extended by derived types is a design judgment; not machine-checkable.
