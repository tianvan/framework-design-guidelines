  notes: 'Library only: the text is about publicly exposed nested types. CA1034 reports externally visible nested types; nested enums are not reported. The exception (types whose variables are declared only in rare scenarios such as subclassing, and the struct enumerators of the Cwalina and Barton annotations) cannot be detected; such reports are not violations. CA1034 has no code fix.'
