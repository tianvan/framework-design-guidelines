- id: FDG4004
  strength: AVOID
  text: having too many namespaces.
  context: null
  section: 4.1 Types and Namespaces
  anchor: sec4_1
  body:
    - kind: paragraph
      text: Users of a framework should not have to import many namespaces in the most common scenarios. Types that are used together in common scenarios should reside in a single namespace if at all possible. This guideline does not mean “have only one namespace,” but instead urges you to seek balance. The types used by developers and the types used by code generators or IDE designers to help the developers are two different concepts and should be in different, but related, namespaces.
    - kind: annotation
      text: As an example of a problem, the runtime serializer types are defined under the `System.Runtime.Serialization` namespace and its subnamespaces. However, the `Serializable` and `NonSerialized` attributes are incorrectly defined in the `System` namespace. Because these types are not in the same namespace, developers don’t realize that they are closely related. In fact, I have run into many developers who apply the `Serializable` attribute to a class that they are serializing with the `System.Xml. Serialization`’s `XmlSerializer` type. However, the `XmlSerializer` completely ignores the `Serializable` attribute; applying the attribute gives no value and just bloats your assembly’s metadata.
      author: Jeffrey Richter
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: the body asks for balance and names no limit.'
- id: FDG4005
  strength: AVOID
  text: having types designed for advanced scenarios in the same namespace as types intended for common programming tasks.
  context: null
  section: 4.1 Types and Namespaces
  anchor: sec4_1
  body:
    - kind: paragraph
      text: This makes it easier to understand the basics of the framework and to use the framework in the common scenarios.
    - kind: annotation
      text: One of the best features of Visual Studio is Intelli-Sense, which provides a drop-down list for your likely next type or member usage. The benefit of this feature is inversely proportional to the number of options. That is, if there are too many items in the list, it takes longer to find the one you are looking for. Following this guideline to split out advanced functionality into a separate namespace enables developers to see the smallest number of types possible in the common case.
      author: Brad Abrams
    - kind: annotation
      text: One thing we’ve learned is that most programmers live or die by IntelliSense. If something isn’t listed in the drop-down list, most programmers won’t believe it exists. But, as Brad says, too much of a good thing can be bad, and having too much stuff in the drop-down list dilutes its value. If you have functionality that should be in the same namespace but you don’t think it needs to be shown all the time to users, you can use the `EditorBrowsable` attribute.
      author: Brian Pepin
    - kind: annotation
      text: Don’t go crazy adding members for every exotic thing someone might want to do with your type. You’ll make fatter, uglier assemblies that are hard to grasp. Provide good primitives with understandable limitations. A great example of this is the urge people get to duplicate functionality that is already easy to use via Interop to native. Interop is there for a reason—it’s not an unwanted stepchild. When wrapping anything, be sure you are adding plenty of value. Otherwise, the value added by not implementing the type and therefore being smaller would make your assembly more helpful to more people.
      author: Rico Mariani
    - kind: annotation
      text: I agree with this guideline, but I’d like to further add that the more advanced classes should be in a namespace that is under the namespace that contains the simple types. For example, the simple types might be in `System.Mail`, and the more advanced types should be in `System.Mail.Advanced`.
      author: Jeffrey Richter
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: Which types are for advanced scenarios is a design judgment; see FDG2030 to FDG2032 for layering.
- id: FDG4006
  strength: DO NOT
  text: define types without specifying their namespaces.
  context: null
  section: 4.1 Types and Namespaces
  anchor: sec4_1
  body:
    - kind: paragraph
      text: This practice organizes related types in a hierarchy and can help resolve potential type name collisions. Of course, the fact that namespaces can help resolve name collisions does *not* mean that such collisions should be introduced. See section 3.4.1 for details.
    - kind: annotation
      text: |-
        It is important to realize that namespaces cannot actually prevent naming collisions; however, they can significantly reduce them. I could define a class called `MyNamespace.MyType` in an assembly called `MyAssembly` and define a class with precisely the same name in another assembly. I could then build an application that uses both of these assemblies and types. The CLR would not get confused because the type identity in the CLR is based on the strong name (which includes the fully qualified assembly name) rather than just the namespace and type name. This fact can be seen by looking at the C# and ILASM of code creating an instance of `MyType`.

        ```
        C#:
        new MyType();

        IL:
        IL_0000: newobj instance void [MyAssembly]MyNamespace.MyType::.ctor()
        ```

        Notice that the C# compiler adds a reference to the assembly that defines the type, of the form `[MyAssembly]`, so the runtime always has a disambiguated, fully qualified name to work with.
      author: Brad Abrams
    - kind: annotation
      text: Namespaces are a language thing. The CLR doesn’t know anything about them, really. As far as the CLR is concerned, the name of the class really is something like `MyNameSpace.MyOtherNameSpace.MyAmazingType`. The compilers give you syntax (e.g., “using”) so that you don’t have to type those long class names all the time. So the CLR is never confused about class names because everything is always fully qualified.
      author: Rico Mariani
  status: draft
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1050
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA1050 reports externally visible types declared outside any namespace; internal types in the global namespace are not reported. Moving a public type into a namespace changes its full name, which changes the public API, so the fix is breaking; CA1050 has no code fix.
- id: FDG4007
  strength: CONSIDER
