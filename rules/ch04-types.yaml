- id: FDG4035
  strength: DO
  text: favor using an enum instead of static constants.
  context: null
  section: 4.8 Enum Design
  anchor: sec4_8
  body:
    - kind: paragraph
      text: IntelliSense provides support for specifying arguments to members with enum parameters. It does not have similar support for static constants.
    - kind: code
      text: |-
        // Avoid the following
        public static class Color {
           public static int Red    = 0;
           public static int Green  = 1;
           public static int Blue   = 2;
           ...
        }

        // Favor the following
        public enum Color {
           Red,
           Green,
           Blue,
           ...
        }
    - kind: annotation
      text: An enum is a structure with a set of static constants. The reason to follow this guideline is because you will get some additional compiler and reflection support if you define an enum versus manually defining a structure with static constants.
      author: Jeffrey Richter
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
