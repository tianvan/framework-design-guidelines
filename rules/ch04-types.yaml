- id: FDG4001
  strength: DO
  text: ensure that each type is a well-defined set of related members, not just a random collection of unrelated functionality.
  context: null
  section: "4"
  anchor: ch04
  body:
    - kind: paragraph
      text: It is important that a type can be described in one simple sentence. A good definition should also rule out functionality that is only tangentially related.
    - kind: annotation
      text: If you have ever managed a team of people, you know that they don’t do well without a crisp set of responsibilities. Well, types work the same way. I have noticed that types without a firm and focused scope tend to be magnets for more random functionality, which over time makes a small problem a lot worse. It becomes more difficult to justify why the next member with even more random functionality does not belong in the type. As the focus of the members in a type blurs, the developer’s ability to predict where to find a given functionality is impaired, and therefore so is productivity.
      author: Brad Abrams
    - kind: annotation
      text: 'Good types are like good diagrams: What has been omitted is as important to clarity and usability as what has been included. Every additional member you add to a type starts at a net negative value; only by proven usefulness does it go from there to positive. If you add too much in an attempt to make the type more useful to some users, you are just as likely to make the type useless to everyone.'
      author: Rico Mariani
    - kind: annotation
      text: |-
        When I was learning OOP back in the early 1980s, I was taught a mantra that I still honor today: If things get too complicated, make more types. Sometimes I find that I am thinking really hard trying to define a good set of methods for a type. When I start to feel that I’m spending too much time on this or when things just don’t seem to fit together well, I remember my mantra and I define more, smaller types, where each type has well-defined functionality. This has worked extremely well for me over the years.

        On the flip side, sometimes types do end up being dumping grounds for various loosely related functions. .NET offers several types like this, such as `Marshal`, `GC`, `Console`, `Math`, and `Application`. You will note that all members of these types are static, so it is not possible to create any instances of these types. Programmers seem to be OK with this. Fortunately, these types’ methods are separated a bit into separate types. It would be awful if all these methods were defined in just one type!
      author: Jeffrey Richter
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: A type design principle; whether members are related is not machine-checkable. Applies to an application's types too (design §5.1).
- id: FDG4002
  strength: DO
  text: use namespaces to organize types into a hierarchy of related feature areas.
  context: null
  section: 4.1 Types and Namespaces
  anchor: sec4_1
  body:
    - kind: paragraph
      text: The hierarchy should be optimized for developers browsing the framework for desired APIs.
    - kind: annotation
      text: |-
        This is an important guideline. Contrary to popular belief, the main purpose of namespaces is not to help in resolving naming conflicts between types with the same name. As the guideline states, the main purpose of namespaces is to organize types in a hierarchy that is coherent, easy to navigate, and easy to understand.

        I consider type-name conflicts in a single framework to indicate sloppy design. Types with identical names should either be merged to allow for better integration between parts of the library or be renamed to improve code readability and searchability.
      author: Krzysztof Cwalina
  status: verified
  style: false
  check:
