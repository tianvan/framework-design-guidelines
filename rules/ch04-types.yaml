- id: FDG4019
  strength: DO
  text: declare static classes as sealed, abstract, and add a private instance constructor if your programming language does not have built-in support for static classes.
  context: null
  section: 4.5 Static Class Design
  anchor: sec4_5
  body:
    - kind: annotation
      text: |-
        In .NET Framework 1.0, I wrote the code for the `System.Environment` class, which is an excellent example of a static class. I messed up and accidentally added a property to this class that wasn’t static (`HasShutdownStarted`). Because it was an instance method on a class that could never be instantiated, no one could call it. We didn’t discover the problem early enough in the product cycle to fix it before releasing version 1.0.

        If I were inventing a new language, I would explicitly add the concept of a static class into the language to help people avoid falling into this trap. And in fact, C# 2.0 did add support for static classes!
      author: Brian Grunkemeyer
    - kind: annotation
      text: Make sure that you do not attempt to define a static structure, because structures (value types) can always be instantiated, no matter what. Only classes can be static.
      author: Jeffrey Richter
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1052
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: C# has built-in support for static classes (section 4.5), so in C# the guideline means declaring such a class static. CA1052 reports an externally visible class that has only static members and is neither static nor sealed; a sealed class is accepted. Its fix makes the class static, which changes the kind of the type and removes its constructor, so the fix is breaking.
