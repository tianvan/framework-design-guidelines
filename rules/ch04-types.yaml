- id: FDG4045
  strength: DO
  text: use powers of 2 for the flag enum values so they can be freely combined using the bitwise OR operation.
  context: null
  section: 4.8.1 Designing Flag Enums
  anchor: sec4_8_1
  body:
    - kind: code
      text: |-
        [Flags]
        public enum WatcherChangeTypes {
          None = 0,
          Created = 0x0002,
          Deleted = 0x0004,
          Changed = 0x0008,
          Renamed = 0x0010,
        }
    - kind: annotation
      text: |-
        I often find it clearer, when writing, to use the left-shift operator when defining flag enum values to show I’ve set only one bit and I’m going in bit order.

        ```
        [Flags]
        public enum WatcherChangeTypes {
          None = 0,
          // No value is defined for 1 (0x1, 1 << 0)
          Created = 1 << 1,
          Deleted = 1 << 2,
          Changed = 1 << 3,
          Renamed = 1 << 4,
        }
        ```

        Since I find hexadecimal nicer when matching the values against file contents or memory views, I’ll usually have my IDE do a value replacement before committing the code.
      author: Jeremy Barton
  status: verified
  style: false
  check:
    kind: sdk
