- id: FDG4070
  strength: AVOID
  text: creating overloads across `System.String` and a strongly typed string, unless the `System.String` overload was released in a previous version.
  context: null
  section: 4.11 Strongly Typed Strings
  anchor: sec4_11
  body:
    - kind: paragraph
      text: The existence of an overload that accepts a `System.String` instance instead of a strongly typed string can save a few characters at the call site for callers that have only the underlying string value available, but it forces developers new to your API to understand the difference between the two methods.
    - kind: paragraph
      text: If you have recently defined a strongly typed string type to help clarify valid inputs to a method, adding an overload that accepts the strongly typed string provides value. In that case, consider marking the original `System.String`-based overload as `[EditorBrowsable(EditorBrowsableState.Advanced)]`, `[EditorBrowsable(EditorBrowsableState. Never)]`, or `[Obsolete]`.
