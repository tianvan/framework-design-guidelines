- id: FDGD001
  strength: NOT PERMITTED
  text: Changing the Name of an Assembly
  context: runtime, compilation, recompile and reflection breaks
  section: D.1.1 Changing the Name of an Assembly
  anchor: secD_1_1
  body:
    - kind: paragraph
      text: Changing the name of an assembly, while keeping the filename unchanged, will result in type load failures for any process that needs a type from your assembly. This failure can manifest in nonintuitive exceptions at runtime, such as a `FileNotFoundException`. If you change the assembly name and the filename, then you’ve created an entirely new assembly with a duplicate type hierarchy, and the runtime will continue to use the previous assembly unless some mechanism deleted the older file.
    - kind: paragraph
      text: The compile-time behavior for a user of your library after such a change depends on multiple factors, such as whether you maintained the filename, the mechanism by which the caller gets your updates, and the mechanism by which the final application gets your updates. It can range from a failure to compile due to an unresolvable reference, to producing the same nonfunctioning library, to producing a working output.
    - kind: paragraph
      text: Reflection loads of your type will fail if they use the assembly-qualified name. If something has already caused your assembly to be loaded into the process, then other reflection loads might succeed, but would fail to match an `AssemblyQualifiedName` after type resolution.
    - kind: paragraph
      text: The .NET BCL team generally considers changing an assembly name to be an unacceptable breaking change. An assembly rename can be effectively accomplished by producing one final version of the existing assembly that uses `[TypeForwardedTo]` to resolve the runtime and compile-time failures and ambiguities, but you should strongly prefer to maintain the existing name.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: An assembly rename can be done by shipping one final version of the old assembly that uses `[TypeForwardedTo]`, but keeping the existing name is strongly preferred. PublicApiAnalyzers (optional in /fdg-setup) can flag changes to the public API.
- id: FDGD002
  strength: NOT PERMITTED
  text: Adding a Namespace That Conflicts with an Existing Type
  context: compilation break
  section: D.2.1 Adding a Namespace That Conflicts with an Existing Type
  anchor: secD_2_1
  body:
    - kind: paragraph
      text: In the .NET CLR, a namespace name is only used as a prefix to type names; namespaces aren’t runtime concepts. Adding a namespace that conflicts with an existing type (e.g., if a namespace named “System.Math” was created after the type `System.Math`) will result in a compile-time break for any libraries that can see both the type and the namespace, and that have a namespace-qualified reference to the type—with an error like `CS0434` (`The namespace 'NamespaceName1' in 'Assembly1' conflicts with the type 'TypeName1' in 'Assembly2'`).
    - kind: paragraph
      text: The .NET BCL team considers this an unacceptable breaking change. Following Framework Design Guidelines, namespaces should have a structured prefix like “[CompanyName].[ProductName].” Moreover, within a single product, the types and namespaces should be managed to avoid conflicts. Seek out a synonym for the existing type name to use as the new namespace name.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: Callers that use a namespace-qualified reference to the type get `CS0434`. Use a synonym of the existing type name for the new namespace. PublicApiAnalyzers (optional in /fdg-setup) can flag changes to the public API.
- id: FDGD003
  strength: NOT PERMITTED
  text: Changing the Name or Casing of a Namespace
  context: compilation break
  section: D.3.1 Changing the Name or Casing of a Namespace
  anchor: secD_3_1
  body:
    - kind: paragraph
      text: The .NET CLR considers the namespace to be part of the type name, and type names are case-sensitive. Changing the name of a namespace, including the casing of the name, is logically the same as deleting all of the types from that namespace and creating new, unrelated types in the new namespace. See section D.5.1 for the impact of removing a type.
    - kind: paragraph
      text: The .NET BCL team considers this an unacceptable breaking change.
  status: draft
  style: false
  check:
