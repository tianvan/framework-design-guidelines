- id: FDGD061
  strength: CONTEXTUAL
  text: Changing the Type of Values Returned from a Method
  context: runtime break
  section: D.12.3 Changing the Type of Values Returned from a Method
  anchor: secD_12_3
  body:
    - kind: paragraph
      text: Changing the declared return type of a method is discussed in section D.11.6. The present section addresses changing the implementation of the method to return a value of a different type than the method did in a previous version of your library.
    - kind: paragraph
      text: Changing the returned value to be a more derived type than in the previous version of the library is generally a safe change. Callers that interact with the return value only via the type that the method is declared to return would be broken only if the new type implements virtual methods in an incompatible manner. Callers that are “hard-casting” the return value to a more specific type also won’t be broken by your change, since the new return value can be safely cast to the intermediate type. The only sort of caller pattern that is broken is when callers do an equality comparison on `value.GetType()`—which might not be apparent to callers that use the type of the returned value as a key in a dictionary.
    - kind: paragraph
      text: If you were already returning a type derived from the declared return type and you change to returning some other compatible type, then you will break both type-testing callers and “hard-casting” callers. For example, if your method is declared to return `IEnumerable<int>`, but always returns `List<int>`, then callers might have depended on the return type. If so, they will get an `InvalidCastException` if you change the return type to be `HashSet<int>`, or a non-public type that implements `IEnumerable<int>`.
    - kind: paragraph
      text: The .NET BCL team is generally supportive of returning a “more derived” type than in a previous version, unless there’s a strong reason to believe type equality checks will be routinely used for that particular method. Returning a value that would break existing “hard-casting” callers is something the .NET BCL team generally considers an unacceptable breaking change.
  status: draft
  style: false
