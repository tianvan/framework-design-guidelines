- id: FDGD009
  strength: NOT PERMITTED
  text: Changing the Case of a Type Name
  context: runtime, compilation, recompile and reflection breaks
  section: D.6.3 Changing the Case of a Type Name
  anchor: secD_6_3
  body:
    - kind: paragraph
      text: The .NET CLR considers type names to be case-sensitive. Changing the casing of a type is therefore logically the same as removing the existing type and creating a new one with a similar-looking name. For information on the impact of removing a type, see section D.5.1.
    - kind: paragraph
      text: The compile-time behavior of your change depends on the language that the caller uses. Some languages, such as VB.NET, are case-insensitive, so recompiling will succeed and the output assembly will function. Case-sensitive languages, such as C#, will fail to compile.
    - kind: paragraph
      text: Reflection-loading your type will fail using the standard reflection loads, but reflection loads allow for a case-insensitive comparison, which will allow reflection to load your type. The case change you introduced will be reflected in `Type.Name` and other metadata with the type name in it, so reflection code may still react differently after your change.
    - kind: paragraph
      text: The .NET BCL team considers this an unacceptable breaking change.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: The same as removing the type (FDGD006). Callers in case-insensitive languages such as VB.NET still compile; C# callers do not. PublicApiAnalyzers (optional in /fdg-setup) can flag changes to the public API.
- id: FDGD010
  strength: NOT PERMITTED
  text: Changing a Type Name
  context: runtime and compilation breaks
  section: D.6.4 Changing a Type Name
  anchor: secD_6_4
  body:
    - kind: paragraph
      text: The .NET CLR has no mechanism for a type rename, so changing the name is logically the same as creating a new type with similar members as the old type while removing the old type. For information on the impact of removing a type, see section D.5.1.
    - kind: paragraph
      text: The .NET BCL team considers this an unacceptable breaking change.
