  notes: Returning a more derived type is generally permitted, unless callers can be expected to compare `value.GetType()`. Switching from one derived type to another (`List<int>` to `HashSet<int>` behind `IEnumerable<int>`) breaks hard-casting callers and is not permitted. Changing the declared return type is FDGD042. PublicApiAnalyzers (optional in /fdg-setup) can flag changes to the public API.
- id: FDGD062
  strength: NOT PERMITTED
  text: Throwing a New Type of Error Exception
  context: runtime break
  section: D.12.4 Throwing a New Type of Error Exception
  anchor: secD_12_4
  body:
    - kind: paragraph
      text: When you throw a new type of exception from your method, or when you allow a new type of exception to escape your method by changing the implementation, you will likely cause the exception to be thrown past any existing `catch` blocks that your caller has for handling errors in your method.
    - kind: paragraph
      text: 'The .NET BCL team generally considers this an unacceptable breaking change, outside of two specific situations: The exception is a subtype of an exception type that is already thrown by the method (section D.12.5) or using an “uncaught” exception type is necessary for fixing a critical bug.'
  status: draft
  style: false
  check:
    kind: judgment
