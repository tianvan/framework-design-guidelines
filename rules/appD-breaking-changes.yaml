  minLanguage: null
  alternative: null
  analyzer: null
  notes: The same as removing every type in the namespace (FDGD006). PublicApiAnalyzers (optional in /fdg-setup) can flag changes to the public API.
- id: FDGD004
  strength: PERMITTED
  text: Moving a Type via [`TypeForwardedTo`]
  context: reflection break
  section: D.4.1 Moving a Type via [TypeForwardedTo]
  anchor: secD_4_1
  body:
    - kind: paragraph
      text: 'There are two flavors of forwarding a type: into an existing dependency and into a new dependency. Generally speaking, moving a type into an existing dependency does not create any problems, as all applications that use the origin library must already have the destination library.'
    - kind: paragraph
      text: Moving a type into a new library, or into an existing library that was not previously a dependency, can cause missing dependency problems depending on the update mechanisms involved. Package dependencies from systems like NuGet, as well as new versions of published shared runtimes, will usually handle the dependency adequately. Like all new dependencies, this type of change can cause the total copy size of a stand-alone application to increase.
    - kind: paragraph
      text: Reflection-based code can be affected because the assembly-qualified name of the type changes. While lookup methods such as `Type.GetType(...)` will find the `[TypeForwardedTo]`, post-match analysis on values like the `AssemblyQualifiedName` property of the `Type` object will fail.
    - kind: paragraph
      text: The .NET BCL team considers moving a type in this way to be an acceptable breaking change, when there’s a technical reason why it’s required.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: Permitted when there is a technical reason for the move. Forwarding into a library that was not already a dependency can cause missing dependency problems, and `AssemblyQualifiedName` changes for reflection. PublicApiAnalyzers (optional in /fdg-setup) can flag changes to the public API.
- id: FDGD005
  strength: NOT PERMITTED
  text: Moving a Type Without **[`TypeForwardedTo`]**
  context: runtime, compilation and recompile breaks
  section: D.4.2 Moving a Type Without [TypeForwardedTo]
  anchor: secD_4_2
  body:
    - kind: paragraph
      text: Because the assembly name is part of the type identity to the .NET CLR, moving a type without using `[TypeForwardedTo]` is logically the same as deleting the existing type and creating a new type with an identical namespace-qualified name in the new assembly. See section D.5.1 for information on the impact of removing types.
    - kind: paragraph
      text: If your callers have both the existing assembly and the new assembly as references for their library or executable, then no compile-time break will occur and the recompiled output will be restored to a working condition.
    - kind: paragraph
      text: The .NET BCL team considers this an unacceptable breaking change.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: The same as removing the type (FDGD006); callers that reference both the old and the new assembly still compile. Moving with `[TypeForwardedTo]` is FDGD004. PublicApiAnalyzers (optional in /fdg-setup) can flag changes to the public API.
- id: FDGD006
  strength: NOT PERMITTED
  text: Removing Types
  context: runtime and compilation breaks
  section: D.5.1 Removing Types
  anchor: secD_5_1
  body:
    - kind: paragraph
      text: It should come as no surprise that removing a type is a runtime breaking change. The .NET CLR loads types on an as-needed basis, so an application can sometimes run to completion with no errors, depending on the data-driven execution flow. When the executing code gets “close enough” to needing the type you’ve deleted, then the CLR will attempt to resolve the type, fail, and throw a `TypeLoadException`. The exact definition of “close enough” is complex, but it typically means at the beginning of a method that invokes a static member from your type, has a local variable of your type, instantiates your type, or loads another type that has your type as a field, base class, or implemented interface. JIT inlining look-ahead and other preload runtime features can move “close enough” to an earlier point in program execution.
    - kind: paragraph
      text: As your type no longer exists, libraries and executables that reference your assembly will fail to compile if they used your type in any manner.
    - kind: paragraph
      text: The .NET BCL team considers this an unacceptable breaking change.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: The `TypeLoadException` comes only when execution gets close to the type, so it can surface late. PublicApiAnalyzers (optional in /fdg-setup) can flag changes to the public API.
- id: FDGD007
  strength: NOT PERMITTED
  text: Sealing an Unsealed Type
  context: runtime and compilation breaks
  section: D.6.1 Sealing an Unsealed Type
  anchor: secD_6_1
  body:
    - kind: paragraph
      text: "Both the compilation break and the runtime break from sealing an unsealed type are dependent on someone having already inherited from the type you seal. Compilation will fail with error `CS0509` (`'class1' : cannot derive from sealed type 'class2'`), and any use of the type at runtime—including invoking static members—will result in a `System.TypeLoadException` with a message like “Could not load type … because the parent type is sealed.”"
    - kind: paragraph
      text: The .NET BCL team considers this an unacceptable breaking change.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Breaks only code that already derives from the type: `CS0509` at compile time, `TypeLoadException` at run time. PublicApiAnalyzers (optional in /fdg-setup) can flag changes to the public API.'
