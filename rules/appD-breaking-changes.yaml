    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Exceptions: a subtype of an exception type the method already throws (FDGD063), or an uncaught exception type that a critical bug fix needs. PublicApiAnalyzers (optional in /fdg-setup) can flag changes to the public API.'
- id: FDGD063
  strength: PERMITTED
  text: Throwing a New Type of Exception, Derived from an Existing Thrown Type
  context: runtime break
  section: D.12.5 Throwing a New Type of Exception, Derived from an Existing Thrown Type
  anchor: secD_12_5
  body:
    - kind: paragraph
      text: When you throw a new type of exception that derives from an exception type already thrown by your method (e.g., throwing `FileNotFoundException` from a method that already throws `IOException`), you generally won’t bypass existing `catch` blocks, or otherwise change the exception handling from your callers—with a few caveats.
    - kind: paragraph
      text: First, callers that have a `catch` block for the more derived type in addition to the existing type might—depending on nesting and ordering— have a different `catch` block trigger for the same kind of problem. While most callers would consider that a “good” breaking change, it’s something to take into account.
    - kind: paragraph
      text: The second caveat is that callers using type-equality tests in exception filters, or within `catch` blocks, will see a runtime behavioral difference. Type-equality testing in exception handlers is much less common than type hierarchy tests (e.g., the `is` operator), but it’s still something to take into account.
    - kind: paragraph
      text: The .NET BCL team is generally supportive of throwing more specific exceptions.
  status: draft
  style: false
  check:
