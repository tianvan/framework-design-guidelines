- id: FDG9093
  strength: DO
  text: implement `IEnumerable<T>` to enable basic LINQ support.
  context: null
  section: 9.6.3 Supporting LINQ through IEnumerable<T>
  anchor: sec9_6_3
  body:
  - kind: paragraph
    text: 'Such basic support should be sufficient for most in-memory data sets. The basic LINQ support will use the extension methods on `IEnumerable<T>` provided in .NET. For example, simply define the methods as follows:'
  - kind: code
    text: "public class RangeOfInt32s : IEnumerable<int> {\n  public IEnumerator<int> GetEnumerator() {...}\n  IEnumerator IEnumerable.GetEnumerator() {...}\n}"
  - kind: paragraph
    text: 'Doing so allows for the following code, despite the fact that `RangeOfInt32s` did not implement a `Where` method:'
  - kind: code
    text: "   var a = new RangeOfInt32s();\n   var b = a.Where(x => x>10);"
  - kind: annotation
    text: Keep in mind that you’ll get your same enumeration semantics, and putting a LINQ façade on them does not make them execute any faster or use less memory.
    author: Rico Mariani
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
    - CA1010
    coverage: partial
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA1010 reports a type that implements the non-generic IEnumerable, ICollection or IList without the generic counterpart; it honors api_surface, so the library profile checks externally visible types and the application profile all types (probe with SDK 10.0.402). Which other types are data sets that need LINQ support is a judgment, so coverage is partial. Adding the generic interface adds to the public API without changing a signature; CA1010 has no code fix. CA1010 is shared with FDG8034.
- id: FDG9094
  strength: CONSIDER
  text: implementing `ICollection<T>` to improve the performance of query operators.
  context: null
  section: 9.6.3 Supporting LINQ through IEnumerable<T>
  anchor: sec9_6_3
