- id: FDG9117
  strength: DO NOT
  text: declare a generic type parameter covariant on an interface that returns an array based on the type parameter.
  context: null
  section: 9.8.2 Covariance
  anchor: sec9_8_2
  body:
  - kind: paragraph
    text: The C# variance rules permit an interface to be covariant when returning generic arrays, but writing to an array produced by covariance can result in an `ArrayTypeMismatchException` at runtime from safe-looking code. Change the return value to be a covariant collection interface, remove the array-returning member altogether, or declare the generic type parameter as invariant on the interface.
  - kind: code
    text: "public interface IArrayProducer<out T> {\n  T[] ProduceArray(int length);\n}\npublic class ArrayProducer<T> : IArrayProducer<T> {\n  public T[] ProduceArray(int length) {\n    return new T[length];\n  }\n}\n...\nIArrayProducer<object> producer = new ArrayProducer<string>();\nobject[] array = producer.ProduceArray(1);\n// The array is actually a string[], so this write fails.\narray[0] = 3;"
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9117
    coverage: partial
