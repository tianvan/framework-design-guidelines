- id: FDG9152
  strength: CONSIDER
  text: providing an array-returning alternative to buffer-writing methods.
  context: null
  section: 9.12 Operating on Buffers
  anchor: sec9_12
  body:
  - kind: paragraph
    text: Novice developers, short-lived applications, one-time operations, and prototyping all benefit from having an array-returning alternative to buffer-writing methods by getting the data they want without the developer overhead of managing buffers.
  - kind: paragraph
    text: For methods that write to `Span<char>`, `Memory<char>`, or `char[]`, the “array-returning” method might be better designed as returning a `System.String`. For example, a `ToBase64` operation might have a `String`-returning form and a `Span<char>`-writing form.
  - kind: code
    text: "public static string ToBase64(byte[] source) { ... }\n\npublic static int ToBase64(\n ReadOnlySpan<byte> source, Span<char> destination);"
  - kind: paragraph
    text: If you’re designing a low-level component that is only intended to be used by other buffer-writing operations, then it’s OK to not provide the array or string alternative methods.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: suggestion
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: the reason given is callers who would rather not manage buffers (novice developers, short-lived applications, one-time operations, prototypes). Not an analyzer candidate: the body allows leaving it out for a low-level component used only by other buffer-writing operations, which is intent.'
- id: FDG9153
  strength: DO
  text: perform normal parameter validation in array or string alternatives to Span or Memory methods.
  context: null
  section: 9.12 Operating on Buffers
  anchor: sec9_12
  body:
  - kind: paragraph
    text: The Span types and Memory types are all value types, where the default value represents an empty buffer. Arrays—and strings—are reference types, where the default value (null) represents a lack of a buffer.
  - kind: paragraph
    text: Consider your array, or string, alternative method on its own when deciding whether you want to treat a null input and an empty input as the same thing. If you decide that null values are not appropriate, throw the normal `ArgumentNullException`.
  - kind: paragraph
    text: If your array, or string, alternative member accepts offset and count parameters, you should validate them manually so that the `ArgumentException` uses the parameter name that matches your method.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether null and empty mean the same for an alternative is the designer''s choice, which the body leaves open. CA1062 (FDG5108) is not mapped: in a probe with SDK 10.0.402 it did not report array alternatives that forward without a null check through values.AsSpan() or new ReadOnlySpan<int>(values, 1, 2), and it does not check offsets and counts. CA2265 (comparing a Span to null or default) is about Span values, not about the array or string alternative.'
- id: FDG9154
  strength: DO
  text: prefer the name “source” for the input buffer parameter of methods that accept an output buffer and a single input buffer.
  context: null
  section: 9.12 Operating on Buffers
  anchor: sec9_12
  body: []
  status: draft
