    text: The `ConfigureAwait` extension method for `IAsyncEnumerable<T>` produces a value that effectively proxies the `ConfigureAwait` to each call to `MoveNextAsync()`. You should use it the same way, and in the same situations, as the `ConfigureAwait` modifier for Tasks (see section 9.2.5.2).
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
    - CA2007
    coverage: partial
  autofix: 'no'
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: as for FDG9039, the text excepts application models that depend on the synchronization context. CA2007 reports an await foreach without ConfigureAwait, and not one with ConfigureAwait(true) (probe with SDK 10.0.402); an await foreach over WithCancellation(...) without ConfigureAwait is not reported either, so coverage is partial; FDG9039 shares CA2007 and its notes give the details.'
- id: FDG9051
  strength: DO
  text: provide properties as dependency properties if you need the properties to support WPF features such as styling, triggers, data binding, animations, dynamic resources, and inheritance.
  context: null
  section: 9.3 Dependency Properties
  anchor: sec9_3
  body:
  - kind: paragraph
    text: In the following example, the `TextButton.Text` property is a dependency property supporting WPF style triggers.
  - kind: code
    text: "<Style TargetType=\"TextButton\">\n  <Setter Property=\"Text\" Value=\"Move here and click\" />\n  <Style.Triggers>\n    <Trigger Property=\"IsMouseOver\" Value=\"True\">\n      <Setter Property=\"Text\" Value=\"Now click\" />\n    </Trigger>\n  </Style.Triggers>\n</Style>"
  - kind: paragraph
    text: 'Here’s an example using the property with data binding:'
  - kind: code
    text: <TextButton Text="{Binding FirstName}" />
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether a property needs styling, triggers, data binding, animations, dynamic resources or inheritance depends on how it is used in XAML.'
- id: FDG9052
  strength: DO
  text: inherit from `DependencyObject`, or one of its subtypes, when implementing dependency properties. The type provides a very efficient implementation of a property store and automatically supports WPF data binding.
  context: null
  section: 9.3.1 Dependency Property Design
  anchor: sec9_3_1
  body: []
  status: verified
