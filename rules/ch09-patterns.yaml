- id: FDG9087
  strength: CONSIDER
  text: using a factory if having a named method is the only way to make the operation self-explanatory.
  context: null
  section: 9.5 Factories
  anchor: sec9_5
  body:
  - kind: paragraph
    text: 'Constructors cannot have names, and sometimes using a constructor lacks sufficient context to inform a developer of an operation’s semantics. For example, consider this statement:'
