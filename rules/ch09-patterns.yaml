  minLanguage: null
  alternative: null
  analyzer:
    message: Do not return the array type '{0}' from '{1}'; the type parameter of '{2}' is covariant
    category: Patterns
  notes: 'FDG9117 reports a method, or a property with a getter, declared in an interface of any accessibility, whose return type is, or contains in an output position, an array whose element type uses a covariant (out) type parameter of the interface, such as T[] ProduceArray(int length). Arrays reached through a base interface (IFoo<out T> : IEnumerable<T[]>) and static members are not checked, so coverage is partial. The fixes the text gives (a covariant collection interface as the return type, removing the member, or an invariant type parameter) all change the public signature, so the fix is breaking; there is no code fix.'
