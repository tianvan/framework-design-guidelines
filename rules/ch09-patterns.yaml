- id: FDG9049
  strength: DO
  text: use the `WithCancellation` modifier when using `await foreach` on an `IAsyncEnumerable<T>` parameter for the purpose of using your `CancellationToken` with the enumerator.
  context: null
  section: 9.2.6.5 Usage Guidelines for await foreach
  anchor: sec9_2_6_5
  body:
  - kind: paragraph
    text: The `IAsyncEnumerable<T>` interface accepts a `CancellationToken` in the call to `GetAsyncEnumerator`, but the `async foreach` statement doesn’t have anywhere to directly accept a `CancellationToken` value to pass on your behalf. The `WithCancellation` extension method produces a value that wraps the `IAsyncEnumerable<T>` value and passes on the appropriate `CancellationToken` value.
  - kind: paragraph
    text: In the first example that follows, the `MaxAsync` method correctly accepts a `CancellationToken` value, but it does not use the `CancellationToken` during the `async foreach`. The second example corrects this error.
  - kind: code
    text: "// incorrect\npublic Task<int> MaxAsync(\n  IAsyncEnumerable<int> source,\n  CancellationToken cancellationToken = default) {\n\n  int max = int.MinValue;\n  bool hasValue = false;\n\n  // cancellationToken isn't used\n  async foreach (int value in source.ConfigureAwait(false)) {\n    hasValue = true;\n    if (value > max) {\n      max = value;\n    }\n  }\n\n  return hasValue ? max : throw new InvalidOperationException();\n}\n\n// correct\npublic Task<int> MaxAsync(\n  IAsyncEnumerable<int> source,\n  CancellationToken cancellationToken = default) {\n\n  int max = int.MinValue;\n  bool hasValue = false;\n\n  // cancellationToken is passed into the enumerator\n  async foreach (int value in source.WithCancellation(cancellationToken).ConfigureAwait(false)) {\n    hasValue = true;\n\n    if (value > max) {\n      max = value;\n    }\n  }\n\n  return hasValue ? max : throw new InvalidOperationException();\n}"
  - kind: paragraph
    text: When using `await foreach` directly on the result of a method that accepted a `CancellationToken`, there is no need, nor any value, in also calling `WithCancellation`. But there’s also no significant penalty, other than line length.
  - kind: code
    text: "// WithCancellation(cancellationToken) is not needed,\n// because it was passed into ValueGenerator already.\nasync foreach (int value in\n  ValueGenerator(10, 5, cancellationToken).ConfigureAwait(false)) {\n  ...\n}"
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9049
    coverage: partial
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Pass the CancellationToken to the enumeration of '{0}' with WithCancellation
    category: Patterns
  notes: FDG9049 reports an await foreach over a parameter of type IAsyncEnumerable<T>, directly or through ConfigureAwait, when the method, local function or lambda that declares the parameter also has a CancellationToken parameter and the enumeration does not go through WithCancellation. Enumerations of other values, such as the result of a method that took the token (which the body says needs no WithCancellation), and tokens from elsewhere are not seen, so coverage is partial. CA2016 (forward the token to called methods) does not report a missing WithCancellation (probe with SDK 10.0.402), and it is not mapped. There is no code fix.
- id: FDG9050
  strength: DO
  text: use the `ConfigureAwait` modifier when using `await foreach` in the same way that you would with `await`.
  context: null
  section: 9.2.6.5 Usage Guidelines for await foreach
