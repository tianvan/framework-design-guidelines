- id: FDG9088
  strength: DO
  text: use a factory for conversion-style operations, such as `Parse` or `Decode`.
  context: null
  section: 9.5 Factories
  anchor: sec9_5
  body:
  - kind: paragraph
    text: For example, consider the standard `Parse` method available on the primitive value types.
  - kind: code
    text: 'int i = int.Parse("35");

      DateTime d = DateTime.Parse("10/10/1999");'
  - kind: paragraph
    text: 'The semantics of the `Parse` operation is such that information is converted from one representation of the value into another. In fact, it doesn’t feel like we are constructing a new instance at all, but rather rehydrating one from an existing state (the string). The `System.Convert` class exposes many such static factory methods that take a value type in one representation and convert it to an instance of a different value type, retaining the same logical state in the process. Constructors have a very rigid contract with callers: A unique instance of a specific type will be created, initialized, and returned.'
  status: verified
