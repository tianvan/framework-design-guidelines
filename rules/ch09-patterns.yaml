    message: Give '{0}', which takes '{1}', a different name from its overload that takes '{2}'
    category: Patterns
  notes: 'FDG9148 reports an externally visible method that has an externally visible overload in the same type with the same number of parameters, the same ref kinds and the same parameter types, except that at one or more positions it takes Memory<T> where the overload takes Span<T>, or ReadOnlyMemory<T> where the overload takes ReadOnlySpan<T>, with the same T (type parameters of generic methods are compared by position). The report is on the Memory method, the one that can store a reference to the buffer. The exception of the body is not reported: each method returns the type of its own differing parameter, as TrimEnd does when it returns a slice of its input. Overloads inherited from a base type, constructors, overrides, interface implementations and overloads that also differ in other parameters are not compared, so coverage is partial. Span<T> and Memory<T> types need .NET Core 2.1 or later, or the System.Memory package on .NET Framework and .NET Standard 2.0 (see FDG9137). Renaming changes the public API, so the fix is breaking; there is no code fix.'
- id: FDG9149
  strength: CONSIDER
  text: adding Span- or Memory-based alternatives to methods that accept arrays or strings.
  context: null
  section: 9.12 Operating on Buffers
  anchor: sec9_12
  body:
  - kind: paragraph
    text: The Span and Memory types support arrays, but also support additional kinds of buffers—such as `ReadOnlyMemory<char>` and `ReadOnlySpan<char>`, which can represent a portion of a `System.String` value. Providing Span- or Memory-based alternatives allows for a greater number of callers to the functionality you’re offering.
  - kind: paragraph
    text: Generally, your users will expect you to provide the alternatives as method overloads on the same type as the array- or string-accepting method.
  - kind: code
    text: "// Previously:\npublic void AppendData(byte[] data, int offset, int count) {\n  if (data == null)\n    throw new ArgumentNullException(nameof(data));\n  // bounds argument validation here\n\n  // implementation\n}\n\n// With a ReadOnlySpan<byte> overload:\npublic void AppendData(byte[] data, int offset, int count) {\n  if (data == null)\n    throw new ArgumentNullException(nameof(data));\n  // bounds argument validation here so parameter names are correct\n\n  AppendData(data.AsSpan(offset, count));\n}\n\npublic void AppendData(ReadOnlySpan<byte> data) {\n  // implementation, from previous version\n}"
  - kind: paragraph
    text: For static methods, it can make sense to have the array- or string-accepting methods on a high-level type, and to create a new low-level type for working with Span or Memory (section 2.2.4).
  status: draft
  style: false
  check:
    kind: sdk
    diagnostics:
    - CA1844
    coverage: partial
  autofix: 'no'
  severity:
    library: suggestion
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: the reason given is a greater number of callers, and an application changes its own callers (as for FDG9021). CA1844 reports a class derived from Stream that overrides the array-based ReadAsync or WriteAsync without overriding the Memory-based one (probe with SDK 10.0.402: reported when targeting net10.0, not net472, whose Stream has no Memory-based overloads; a Stream that overrides only Read and Write is not reported). That is one case of a missing Memory-based alternative; other methods that accept arrays or strings are not seen, and whether a string or array parameter is a buffer is what it means, so coverage is partial. CA1844 has no code fix; adding an override or an overload changes no existing signature. Span<T> and Memory<T> types need .NET Core 2.1 or later, or the System.Memory package on .NET Framework and .NET Standard 2.0 (see FDG9137).'
