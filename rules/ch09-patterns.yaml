- id: FDG9062
  strength: DO
  text: implement the Basic Dispose Pattern on types containing instances of disposable types. See section 9.4.1 for details on the basic pattern.
  context: null
  section: 9.4 Dispose Pattern
  anchor: sec9_4
  body:
  - kind: paragraph
    text: If a type is responsible for the lifetime of other disposable objects, developers need a way to dispose of them, too. Using the container’s `Dispose` method is a convenient way to make this possible.
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
    - CA1001
    - CA1063
    - CA2213
    coverage: partial
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA1001 reports a type of any accessibility that owns a disposable field (one it assigns a newly created object) and does not implement IDisposable; a field assigned from a constructor parameter was not reported, since the type does not own it (probe with SDK 10.0.402). CA1063 reports an implementation of IDisposable that departs from the Basic Dispose Pattern of section 9.4.1 (no overridable Dispose(bool) on an unsealed type, a virtual or explicit Dispose(), a Dispose() that does more than call Dispose(true) and then GC.SuppressFinalize(this), a finalizer that does not call Dispose(false)); it honors api_surface, so the library profile checks externally visible types and the application profile all types (probe). CA2213 reports a disposable field that Dispose never disposes, in a type of any accessibility (probe). Disposable objects held other than in fields, such as in a collection, are not seen, so coverage is partial. The CA1001 code fix adds a Dispose method that throws NotImplementedException (probe), so autofix is no; implementing IDisposable adds to the public API without changing a signature. The CA1063 reports on the signatures of Dispose methods belong to FDG9064 and FDG9066, whose fixes are breaking. CA1063 also reports the explicit IDisposable.Dispose that FDG9072 recommends together with Close (probe); such a report is not a violation. CA1063 is shared with FDG9064, FDG9065, FDG9066 and FDG9074.
- id: FDG9063
  strength: CONSIDER
  text: implementing the Basic Dispose Pattern on classes that themselves don’t hold unmanaged resources or disposable objects, but are likely to have subtypes that do.
  context: null
  section: 9.4 Dispose Pattern
  anchor: sec9_4
  body:
  - kind: paragraph
    text: A great example of this is the `System.IO.Stream` class. Although it is an abstract base class that doesn’t hold any resources, most of its subclasses do—and because of this, it implements this pattern.
  status: verified
  style: false
  check:
    kind: judgment
