  context: null
  section: 9.7 Optional Feature Pattern
  anchor: sec9_7
  body:
  - kind: paragraph
    text: The pattern minimizes the complexity of the framework and improves usability by making dynamic casts unnecessary.
  - kind: annotation
    text: If your expectation is that only a very small percentage of classes deriving from the base class or interface would actually implement the optional feature or behavior, then using interface-based design might be better. There is no real need to add additional members to all derived classes when only one of them provides the feature or behavior. Also, factored design is preferred in cases when the number of combinations of the optional features is small and the compile-time safety afforded by factorization is important.
