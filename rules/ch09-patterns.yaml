    text: Changing a generic type parameter from contravariant to invariant would be a breaking change for any callers that exercised the variance. Given that adding new members to an interface is a breaking change, the most likely situation in which you might want to remove the contravariant indicator is when rewriting your library from a language that can express variance (such as C#) to one that cannot (such as F#, as of language version 4.7).
