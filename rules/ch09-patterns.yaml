- id: FDG9151
  strength: CONSIDER
  text: providing `System.String`-accepting alternatives for methods that accept `ReadOnlySpan<char>` or `ReadOnlyMemory<char>`.
  context: null
  section: 9.12 Operating on Buffers
  anchor: sec9_12
  body:
  - kind: paragraph
    text: Not all CLR languages can use Spans as easily as C# does, and not all C# users are familiar with Spans. If you have an array- (or string-) based approach, you make it easier for these callers to call your method.
  - kind: paragraph
    text: If you’re designing a low-level component that is only intended to be used by other Span- or Memory-based operations, then it’s OK to not provide the array or string alternative methods.
  status: draft
