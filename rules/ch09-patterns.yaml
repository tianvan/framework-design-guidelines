    text: 'Users expect that a call to `Dispose` will not raise an exception. For example, consider the manual try-finally statement in this snippet:'
  - kind: code
    text: "TextReader tr = new StreamReader(File.OpenRead(\"foo.txt\"));\ntry {\n  // do some stuff\n}\nfinally {\n  tr.Dispose();\n  // more stuff\n}"
  - kind: paragraph
    text: 'If `Dispose` throws an exception, further finally-block cleanup logic will not execute. To work around this, the user would need to wrap every call to `Dispose` (within the finally block!) in another try block, which leads to very complex cleanup handlers. If executing a `Dispose(bool disposing)` method, never throw an exception if `disposing` is false: Doing so will terminate the process if executing inside a finalizer context!'
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
    - CA1065
    coverage: partial
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA1065 reports an exception created directly in Dispose(), the IDisposable.Dispose implementation, of an externally visible type, an ObjectDisposedException included (probe with SDK 10.0.402); the body's reason, that users expect a call to Dispose not to raise an exception, covers Dispose(). In the probe it did not report a throw in Dispose(bool), the method the text names, nor in DisposeAsync, nor in Dispose() of an internal type with api_surface all, and exceptions from called methods are not seen, so coverage is partial. The critical situations the text excepts are a judgment; the IndentationScope example of FDG9078 throws InvalidOperationException from Dispose(bool) when the indentation is inconsistent. Finalizers are FDG9076. CA1065 is shared with FDG5031, FDG5054, FDG5092, FDG8066, FDG8075, FDG8083, FDG8101 and FDG9076. Not throwing changes no signature; CA1065 has no code fix.
- id: FDG9070
  strength: DO
  text: throw an `ObjectDisposedException` from any member that cannot be used after the object has been disposed of.
  context: null
  section: 9.4.1 Basic Dispose Pattern
  anchor: sec9_4_1
  body:
  - kind: code
    text: "public class DisposableResourceHolder : IDisposable {\n  bool _disposed = false;\n  SafeHandle _resource; // handle to a resource\n\n  public void DoSomething() {\n    if (_disposed) {\n      throw new ObjectDisposedException(...);\n    }\n    // now call some native methods using the resource\n    ...\n  }\n\n  protected virtual void Dispose(bool disposing) {\n    if (_disposed) {\n      return;\n    }\n    // cleanup\n    ...\n    disposed = true;\n  }\n}"
  status: verified
