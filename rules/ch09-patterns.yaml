  notes: 'Not an analyzer candidate: Begin and End methods (Classic Async Pattern) and Async methods with Completed events (Event-Based Async Pattern) are visible, but whether an API is new or an existing one kept for compatibility (FDG9019, sections 9.2.7 and 9.2.8) needs the shipped API.'
- id: FDG9019
  strength: CONSIDER
  text: upgrading a Classic Async Pattern or Event-Based Async Pattern API to the Task-Based Async Pattern.
  context: null
  section: 9.2.1 Choosing Between the Async Patterns
  anchor: sec9_2_1
  body:
  - kind: paragraph
    text: The `TaskFactory` and `TaskFactory<TResult>` types can be used to provide Task-Based Async Pattern methods by wrapping existing Classic Async Pattern and Event-Based Async Pattern APIs. However, the prevalence of Task-Based Async Pattern APIs in .NET generally makes it easier to write the new Task-Based Async Pattern methods directly and continue to support existing async methods from the older patterns in terms of the new methods.
  - kind: code
    text: "// Synchronous method\npublic ParsedData Parse(string filename) { ... }\n\n// Classic Async Pattern\npublic IAsyncResult BeginParse(\n  string filename,\n  AsyncCallback callback,\n  object state) { ... }\n\npublic ParsedData EndParse(IAsyncResult asyncResult) { ... }\n\n// Task-Based Async Pattern\n//\n// Written to wrap an existing Classic Async Pattern method,\n// which does not support cancellation.\npublic Task<ParsedData> ParseAsync(string filename) {\n if (filename == null)\n   throw new ArgumentNullException(nameof(filename));\n\n return TaskFactory<ParsedData>.FromAsync(\n   BeginParse, EndParse, filename, null);\n}\n\n// Event-Based Async Pattern\npublic event EventHandler<ParseEventArgs> ParseCompleted;\n\n// Written to call the new Task-Based Async Pattern method instead\npublic void ParseAsync(string filename, object userState) {\n  ParseAsync(filename).\n   ContinueWith(\n     FireEapEvent,\n     AsyncOperationManager.CreateOperation(userState));\n}\n\nprivate void FireEapEvent(Task<ParsedData> task, object userState){\n  EventHandler<ParseEventArgs> completed = ParseCompleted;\n\n  if (completed != null) {\n    AsyncOperation op = (AsyncOperation)userState;\n    ParseEventArgs args;\n\n  if (task.IsFaulted) {\n    args = ParseEventArgs.FromException(\n      task.Exception.InnerException, op.UserSuppliedState);\n  } else {\n    args = ParseEventArgs.FromResult(\n      task.Result, op.UserSuppliedState);\n }\n\n op.PostOperationCompleted(\n   a => completed(this, (ParseEventArgs)a), args);\n }\n}"
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: a design decision about existing APIs.'
- id: FDG9020
  strength: DO
  text: use the suffix “Async” when naming an asynchronous method.
  context: null
  section: 9.2.2 Task-Based Async Pattern
  anchor: sec9_2_2
  body:
  - kind: paragraph
    text: The “Async” suffix provides a clear indicator to both callers and code reviewers that the method is asynchronous, and thus requires special handling. The suffix also disambiguates synchronous and asynchronous variants of the same functionality when both methods have the same parameter list (e.g., in cases where the synchronous method accepts a `CancellationToken`).
  - kind: paragraph
    text: The “Async” suffix should not be used when naming types, because even a type that is primarily designed for asynchronous operations may have synchronous methods for configuring the instance.
  - kind: annotation
    text: One reason that I’ve heard for why the “Async” suffix isn’t needed is that it’s obvious from usage, and that you’ll fail to compile if you forget to `await` the result. But reading a property named `IsCompleted` or `Exception`, or calling a method named `Dispose` or `Wait`, is easy to mistakenly do on the returned Task-like value instead of the value that should have been produced from `await`.
    author: Jeremy Barton
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9020
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Add the suffix 'Async' to the name of the asynchronous method '{0}'
    category: Patterns
  notes: 'FDG9020 reports an externally visible method whose return type is Task, Task<TResult>, ValueTask, ValueTask<TResult> or another task-like type (a type marked with AsyncMethodBuilderAttribute) and whose name does not end with "Async" or "AsyncCore", the combined suffix that section 9.2.10 names for the Template Method Pattern. Overrides and interface implementations take their name from another member and are not reported, and neither is a static method named Main, the entry point of a program. The Correct example of FDG9022 is spelled WriteAync in the book; it is reported. Private and internal methods are not checked, since the Task-Based Async Pattern is a convention for providing APIs (section 9.2.2), so coverage is partial. A static method without the async keyword whose every return value, outside lambdas and local functions, is a completed task (FromResult, FromException, FromCanceled or CompletedTask of Task or ValueTask, or a ValueTask that is default or holds a result) is not reported: section 9.2.2 describes the "-Async" method as the one "which initiates an asynchronous operation", and such a method starts none, as Task.FromResult, which has no suffix, does not. Other methods that return a task without being asynchronous are reported; FDG9026 asks to change their return type. The advice not to use the suffix in type names is not checked. Renaming a public method breaks its callers, so the fix is breaking; there is no code fix.'
- id: FDG9021
  strength: CONSIDER
  text: adding synchronous variants of Async methods.
  context: null
  section: 9.2.2 Task-Based Async Pattern
  anchor: sec9_2_2
  body:
  - kind: code
    text: "// asynchronous method\npublic Task<ParsedData> ParseAsync(\n  string filename,\n  CancellationToken cancellationToken = default) { ... }\n// synchronous variant\npublic ParsedData Parse(string filename) { ... }"
  - kind: paragraph
    text: Existing codebases may already have a large number of synchronous methods, and converting them to support asynchronous calls may not be a high priority for those developers compared to the functional value that your component offers. If you only provide asynchronous operations, then a synchronous caller is forced to call the blocking `GetResult()` method, creating a condition called “sync-over-async.” See section 9.2.5.3 for more information.
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: suggestion
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: the reason given is synchronous callers in existing codebases that use the component, and an application changes its own callers. Not machine-checkable: whether callers need a synchronous variant is a design judgment.'
- id: FDG9022
  strength: DO
  text: accept a `CancellationToken` parameter, named “cancellation-Token,” in asynchronous methods.
  context: null
  section: 9.2.2 Task-Based Async Pattern
  anchor: sec9_2_2
  body:
  - kind: paragraph
    text: Long-running operations generally warrant an “abort” option, and asynchronous operations tend to be long-running. The Task-Based Async Pattern uses the `System.Threading.CancellationToken` type to control cancelations.
  - kind: code
    text: "// Incorrect: The caller has no way of cancelling this operation\npublic Task WriteAsync(string text) { ... }\n\n// Correct: Cancellation is supported, as an optional parameter\npublic Task WriteAync(\n  string text,\n  CancellationToken cancellationToken = default) { ... }"
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9022
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Accept a CancellationToken parameter named 'cancellationToken' in the asynchronous method '{0}'
    category: Patterns
  notes: FDG9022 reports an externally visible method that returns a task-like type (as for FDG9020) and has no CancellationToken parameter, or none named "cancellationToken" (the text breaks the name with a hyphen at a line end; every example writes cancellationToken). A missing parameter is not reported when another overload with the same name in the type accepts a CancellationToken, as Stream.ReadAsync does in the FDG9032 body, or on DisposeAsyncCore, which the Dispose Pattern declares without one (FDG9082), or on a static method that only returns completed tasks, which FDG9020 leaves out for the same reason (it starts no operation to cancel). Overrides and interface implementations are not reported, and private and internal methods are not checked, so coverage is partial. Several examples in the chapter leave the parameter out to show other rules (FDG9019, FDG9029, FDG9043, FDG9044); they are reported. Adding or renaming a parameter changes the public signature, so the fix is breaking; there is no code fix.
- id: FDG9023
  strength: DO
  text: provide a default value to the `CancellationToken` value.
  context: null
  section: 9.2.2 Task-Based Async Pattern
  anchor: sec9_2_2
  body: []
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9023
    coverage: partial
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Give the CancellationToken parameter '{0}' of the asynchronous method '{1}' a default value
    category: Patterns
  notes: FDG9023 reports a CancellationToken parameter without a default value of an externally visible method that returns a task-like type (as for FDG9020). It is not reported when the method has another overload with the same name in its type, since the FDG9024 body allows overloads involving a CancellationToken to leave out the default by a conscious decision, and Stream.ReadAsync (FDG9032 body) pairs an overload without the token with one that requires it; when a required parameter follows the token, which C# does not allow after an optional one (that order is CA1068, FDG9024); or on a protected method whose name ends with "Core", the virtual implementation method of the Template Method Pattern, which the FDG5011 body declares without default parameters. Overrides and interface implementations take their defaults from another member and are not reported. Adding "= default" makes the parameter optional without changing its type or name, and no caller breaks, so the fix is not breaking; there is no code fix.
- id: FDG9024
  strength: CONSIDER
  text: keeping the `CancellationToken` as the last parameter, for better alignment with a synchronous version of the method.
  context: null
  section: 9.2.2 Task-Based Async Pattern
  anchor: sec9_2_2
  body:
  - kind: paragraph
    text: The last parameter rule is an exception to the normal rule of method overloads, which states that the additional parameters of the overloads go last. The C# language requires that all optional parameters (any parameter with a default value) come after all required parameters, and the combination of the `CancellationToken` rules plays well with that requirement.
  - kind: paragraph
    text: 'For example, the following example is incorrect for overloads involving `CancellationToken`—even if you make a conscious decision to not provide a default value:'
  - kind: code
    text: "public Task WriteAsync(\n  string text,\n  CancellationToken cancellationToken) { ... }\n\npublic Task WriteAsync(\n  string text,\n  CancellationToken cancellationToken,\n  Encoding encoding) { ... }"
  - kind: paragraph
    text: These overloads should instead have been
  - kind: code
    text: "public Task WriteAsync(\n  string text,\n  CancellationToken cancellationToken) { ... }\n\npublic Task WriteAsync(\n  string text,\n  Encoding encoding,\n  CancellationToken cancellationToken) { ... }"
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
    - CA1068
    coverage: partial
  autofix: breaking
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'CA1068 reports a method whose CancellationToken parameter is followed by a parameter that is not optional, params or out (probe with SDK 10.0.402: private and virtual methods are reported, overrides are not). A token followed by optional parameters is not reported, so coverage is partial. CA1068 also reports synchronous methods, for which FDG9026 says the last-parameter guidance does not apply; see docs/noise-samples.md. Moving the parameter changes the public signature, so the fix is breaking; CA1068 has no code fix.'
- id: FDG9025
  strength: CONSIDER
  text: accepting a `CancellationToken` in long-running or blocking synchronous methods.
  context: null
  section: 9.2.2 Task-Based Async Pattern
  anchor: sec9_2_2
  body:
  - kind: paragraph
    text: The `CancellationToken` type isn’t tied to asynchronous execution or Tasks, so it is equally suited to synchronous operations that would benefit from timeout-based or user-initiated abort signals. Synchronous methods that pause until some other action is completed—known as blocking methods—are often good candidates for a `CancellationToken`. The two most common blocking operations are waiting on thread synchronization and an I/O operation such as a file download.
  - kind: paragraph
    text: 'As an example, the `BlockingCollection<T>` class supports a cancelable version of `Add`:'
  - kind: code
    text: "public partial class BlockingCollection<T> {\n  public void Add(T item) {}\n  public void Add(T item, CancellationToken cancellationToken) {}\n}"
  - kind: paragraph
    text: 'The cancelable `Add` overload is not an asynchronous operation: It uses a synchronous `Wait()` instead of an asynchronous yield to pause until there’s space in the collection. This same type of cancelation support would apply to a long-running, nonblocking operation such as prime factorization.'
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether a synchronous method is long-running or blocking needs its behavior.'
- id: FDG9026
  strength: DO NOT
  text: return Tasks for long-running synchronous methods.
  context: null
  section: 9.2.2 Task-Based Async Pattern
  anchor: sec9_2_2
  body:
  - kind: paragraph
    text: If a method is not using asynchronous yield (either it’s a long-running computation or it’s using a synchronous block), it should not return Tasks or use the “Async” suffix. Since synchronous methods are not part of the Task-Based Async Pattern, neither the guidance to keep the `CancellationToken` parameter as the final parameter nor the guidance to provide a default value for the parameter applies.
  - kind: annotation
    text: Related to this, you are strongly discouraged from exposing a Task-returning method that simply wraps a synchronous method by queueing the call to the synchronous method—doing so makes it harder for a consumer of your API to choose the best method for their needs. The main exception to this guidance is when you are exposing the async version as virtual and expect derived overrides to be able to provide truly asynchronous implementations.
    author: Stephen Toub
  - kind: paragraph
    text: Because the previous example of `BlockingCollection<T>.Add` uses synchronous `Wait()`, it is correct that it doesn’t follow the Task-Based Asynchronous Pattern.
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: whether a task-returning method yields asynchronously, or computes or blocks synchronously, cannot be told from its signature, and the Toub annotation allows a task-returning wrapper of a synchronous method when it is virtual and overrides can be truly asynchronous.'
- id: FDG9027
  strength: DO NOT
  text: use `ref` or `out` parameter modifiers in an Async method.
  context: null
  section: 9.2.2 Task-Based Async Pattern
  anchor: sec9_2_2
  body:
  - kind: paragraph
    text: The .NET runtime only permits value references on the stack (method parameters or locals), which cannot be maintained if an asynchronous method needs to yield execution. The C# compiler understands this limitation, so declaring a `ref` or `out` parameter on a method that uses the `async` keyword is a compile error, but it will not issue an error on arbitrary methods that return Tasks.
  - kind: code
    text: "public Task<bool> TryParseAsync(\n  TextReader reader,\n  out ParsedData value) {\n\n  Task<ParsedData> parseTask = ParseAsync(reader);\n\n  // This method isn't actually asynchronous;\n  // it does a synchronous wait!\n  parseTask.Wait();\n\n  if (parseTask.IsFaulted) {\n    value = default;\n    return Task.FromResult(false);\n }\n\n value = parseTask.Result;\n return Task.FromResult(true);\n}"
  - kind: paragraph
    text: To maintain the ability to write to the `out` parameter, the `TryParseAsync` method instead became a blocking synchronous method masquerading as an asynchronous method. This is not only misleading to the callers of this method, but also can cause deadlock due to the use of `Task.Wait()` (see section 9.2.5.3 for more information).
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9027
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Remove the {1} modifier from the parameter '{0}' of the asynchronous method '{2}'
    category: Patterns
  notes: FDG9027 reports a ref or out parameter of an externally visible method that returns a task-like type (as for FDG9020) or IAsyncEnumerable<T>; the compiler already rejects them on async methods (CS1988). Overrides and interface implementations take their signature from another member and are not reported, and private and internal methods are not checked, so coverage is partial. Removing the modifier changes the public signature, so the fix is breaking (FDG9034 describes the conversions); there is no code fix.
- id: FDG9028
  strength: DO NOT
  text: use the `in` (ref readonly) parameter modifier in a virtual or abstract Async method.
  context: null
  section: 9.2.2 Task-Based Async Pattern
  anchor: sec9_2_2
  body: []
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9028
    coverage: full
  autofix: breaking
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Remove the in modifier from the parameter '{0}' of the virtual asynchronous method '{1}'
    category: Patterns
  notes: 'Library only: the reason given is the developers who extend the type, who cannot use the async keyword in an override. FDG9028 reports an in or ref readonly parameter of an externally visible method that returns a task-like type (as for FDG9020) or IAsyncEnumerable<T> and is virtual or abstract, or of an interface method. Overrides and interface implementations take their signature from another member and are not reported. Changing the modifier changes the public signature, so the fix is breaking; there is no code fix.'
- id: FDG9029
  strength: AVOID
  text: the `in` (ref readonly) parameter modifier in nonvirtual Async methods.
  context: null
  section: 9.2.2 Task-Based Async Pattern
  anchor: sec9_2_2
  body:
  - kind: paragraph
    text: The C# compiler will issue an error if the `in` parameter modifier is used in a signature of a method with the `async` keyword, which will prevent the developers extending the type from using the language support for implementing an override for the asynchronous method.
  - kind: paragraph
    text: When implementing a virtual asynchronous method with the Template Method Pattern (section 9.9), it is not a compile-time error to have a parameter with the `in` modifier. Be aware that if the parameter type is not a `readonly struct`, a caller might expect that the asynchronous method can react to the caller modifying the value; however, since a value copy is made between the public method and the protected method, the asynchronous operation will not see mutations done by the caller. Since a `readonly struct` cannot be modified, there is no possibility of confusion, so the `in` modifier can be used if appropriate.
  - kind: paragraph
    text: For more information on when it is appropriate to use the `in` modifier, see section 5.8.3.
  - kind: code
    text: "public Task WriteParametersAsync(\n  string filename,\n  in RSAParameters rsaParameters) {\n\n  if (rsaParameters.Modulus == null) {\n    throw new ArgumentException(\n      \"Modulus is required.\",\n      nameof(rsaParameters));\n  }\n\n  // A value copy of rsaParameters is made here.\n  return WriteParametersAsyncCore(filename, rsaParameters);\n}\n\nprotected abstract Task WriteParametersAsyncCore(\n  string filename,\n  RSAParameters rsaParameters);\n\n...\n\nRSAParameters rsaParameters = GetRSAParameters();\n// The optional 'in' keyword is shown here for clarity.\nTask saveToFile = WriteParametersAsync(filename, in rsaParameters);\n\n// Because the struct was passed as 'in' the code behind the Task\n// will see this change, right? (Wrong.)\nrsaParameters.Exponent = s_someOtherExponent;\nawait saveToFile;"
  - kind: annotation
    text: While the example here just has a linear flow, things get trickier if the mutable `struct` is a field and the application is multithreaded. A concurrent write could happen between the argument validation phase and the value copy to the Core method, violating the contract that the base class was trying to uphold. Since this awkwardness only comes up when ignoring the guideline against public mutable value types (section 4.7) *and* the guidelines against using `in` (`ref readonly`) parameters in public APIs (section 5.8.3), hopefully no one will run into it when using your library.
    author: Jeremy Barton
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9029
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Avoid the in modifier on the parameter '{0}' of the asynchronous method '{1}'
    category: Patterns
  notes: 'FDG9029 reports an in or ref readonly parameter of an externally visible method that returns a task-like type (as for FDG9020) or IAsyncEnumerable<T> and is neither virtual nor abstract, unless the parameter type is a readonly struct, which the body allows. Whether a type is a readonly struct comes from its declaration: primitive types are readonly structs in .NET Core and .NET 5 and later, but not in the .NET Framework reference assemblies. Overrides and interface implementations are not reported, and private and internal methods are not checked, so coverage is partial. FDG5115 (library only) reports in parameters of value types in general. Changing the modifier changes the public signature, so the fix is breaking; there is no code fix.'
- id: FDG9030
  strength: DO
  text: use (non-generic) `Task` as the preferred return type for an asynchronous method that does not produce a value.
  context: null
  section: 9.2.3 Async Method Return Types
  anchor: sec9_2_3
  body:
  - kind: paragraph
    text: The `Task` class has better usability than the `ValueTask` struct, and both types have similar performance characteristics for methods generated with the `async` keyword.
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: Task is the preferred type, not the only one. The Toub annotation of FDG9032 names critical-path methods that reuse objects as the place for the non-generic ValueTask, and the Dispose Pattern returns ValueTask from DisposeAsyncCore (FDG9082); which case a method is needs its implementation.'
- id: FDG9031
  strength: DO
  text: use `Task<TResult>` as the preferred return type for an asynchronous method that produces a value.
  context: null
  section: 9.2.3 Async Method Return Types
  anchor: sec9_2_3
  body:
  - kind: paragraph
    text: Since the `Task<TResult>` class is a reference type, and the value it carries can be different every time an asynchronous method is called, it comes at a slight memory allocation cost compared to `ValueTask<TResult>`. Often, the extra memory allocation doesn’t matter, so the better usability of the `Task<TResult>` class makes it a better default.
  - kind: annotation
    text: 'There is a limited amount of synchronous-success caching for `Task<TResult>` for methods built with the `async` keyword. For .NET Core 3.1, this is the Boolean values `true` and `false`, the Int32 values `-1` through `9`, and the 0 value for `Byte`, `SByte`, `Int16`, `UInt16`, `UInt32`, `Int64`, `UInt64`, `IntPtr`, `UIntPtr`, and `Char`.


      Some asynchronous methods that are built manually also cache their own common return values to provide both good critical-path performance and better usability of `Task<TResult>`.'
    author: Jeremy Barton
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: Task<TResult> is preferred unless the method commonly completes synchronously (FDG9032), which needs the method''s behavior.'
- id: FDG9032
  strength: CONSIDER
  text: returning `ValueTask<TResult>` from an asynchronous method when the method commonly completes synchronously.
  context: null
  section: 9.2.3 Async Method Return Types
  anchor: sec9_2_3
  body:
  - kind: paragraph
    text: Analysis of the behavior of `System.IO.Stream` shows that in many cases there is already data available when the `ReadAsync` method is called, due to buffering; thus, the method often returns synchronously. Since the synchronous `Read` method returns an `Int32`, it can usually avoid having any memory impact when data is already available, but the `ReadAsync` method needs to produce a `Task<int>` to report the number of bytes read. The resulting small memory impact can become noticeable when done in a loop.
  - kind: paragraph
    text: The newer `ReadAsync` overload on `Stream` that writes to `System.Memory<byte>` returns a `ValueTask<int>` so that the asynchronous method can similarly have no memory impact when data is already available.
  - kind: code
    text: "public partial class Stream {\n  // The older, .NET Standard 1.0 versions\n  public virtual Task<int> ReadAsync(\n    byte[] buffer, int offset, int count) { ... }\n\n  public virtual Task<int> ReadAsync(\n    byte[] buffer, int offset, int count,\n    CancellationToken cancellationToken) { ... }\n\n  // The newer, .NET Standard 2.1 version\n  public virtual ValueTask<int> ReadAsync(\n    Memory<byte> buffer,\n    CancellationToken cancellationToken = default);\n}"
  - kind: paragraph
    text: '`ValueTask<TResult>` doesn’t always provide better performance than `Task<TResult>`. When a `ValueTask<TResult>` is returned by a method that is built with the `async` keyword, and the method did not complete synchronously, a new `Task<TResult>` instance is created to track the remainder of the operation. For operations that regularly complete asynchronously, returning a `ValueTask<TResult>` leads to a usability loss and a minor performance *penalty* for the caller, with no significant gain. Therefore the recommendation for methods that don’t have an expectation of synchronous completion is to return the reference type, `Task<TResult>`.'
  - kind: annotation
    text: This guidance may make you question why the non-generic `ValueTask` exists at all. It exists as a performance optimization for critical-path methods that frequently complete asynchronously and where the implementation is able to employ some kind of object reuse to avoid allocation. Many more details are available in [https://devblogs.microsoft.com/dotnet/understanding-the-whys-whats-and-whens-of-valuetask/](https://devblogs.microsoft.com/dotnet/understanding-the-whys-whats-and-whens-of-valuetask/).
    author: Stephen Toub
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether a method commonly completes synchronously needs its behavior (the Stream.ReadAsync example).'
- id: FDG9033
  strength: DO
  text: keep parameters in the same order in the synchronous and asynchronous variants of a method, when possible.
  context: null
  section: 9.2.4 Making an Async Variant of an Existing Synchronous Method
  anchor: sec9_2_4
  body:
  - kind: paragraph
    text: 'When the synchronous method has no parameters passed as `out` or `ref`, and neither the return value or any of the parameters are ref-like value types (`ref struct` types), then you can declare the asynchronous variant by just adding the “Async” suffix, changing the return type to the appropriate Task-like type (section 9.2.3), and accepting a `CancellationToken`. For example:'
  - kind: code
    text: "public partial class XDocument {\n  public static XDocument Load(\n    TextReader textReader, LoadOptions options) { ... }\n\n  // The real XDocument.LoadAsync does not have a default value for\n  // cancellationToken; this version is better aligned with the\n  // guidance in this section.\n  public static Task<XDocument> LoadAsync(\n    TextReader textReader, LoadOptions options,\n    CancellationToken cancellationToken = default) { ... }\n}"
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9033
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Keep the parameters of '{0}' in the same order as in the synchronous method '{1}'
    category: Patterns
  notes: FDG9033 reports an externally visible method whose name ends with "Async" and which returns a task-like type (as for FDG9020) when the methods of the same type named without the suffix, its synchronous variants, static or not as it is and not returning a task-like type, that share at least two parameter names with it all have those names in a different relative order. There is no report when one such variant has the same order, since the asynchronous method then aligns with it, and a variant that shares fewer than two names is not compared. CancellationToken parameters are left out, since the asynchronous variant adds its token last (FDG9024), and parameters that only one of the two has are ignored, as the conversions of ref and out parameters (FDG9034) need. Overrides and interface implementations are not reported, and variants in other types or with other names are not seen, so coverage is partial. FDG5003 compares the order across overloads. Reordering changes the public signature, so the fix is breaking; there is no code fix.
- id: FDG9034
  strength: DO
  text: convert the signature as needed to remove any `ref` or `out` parameters from an asynchronous method.
  context: null
  section: 9.2.4 Making an Async Variant of an Existing Synchronous Method
  anchor: sec9_2_4
  body:
  - kind: paragraph
    text: If the method had a single `out` parameter and was `void`-returning, then you can define the Async variant to simply return the value via a Task-like type.
  - kind: code
    text: "public void CalculateValue(int input, out int result) { ... }\npublic Task<int> CalculateValueAsync(\n  int input,\n  CancellationToken cancellationToken = default) { ... }"
  - kind: paragraph
    text: If there is a preexisting return value or more than one `out` parameter, then you can create a new type to describe the more complex return value.
  - kind: code
    text: "public partial class SomeClass {\n  public int Divide(int divisor, int dividend, out int remainder);\n\n  public Task<DivisionResult> DivideAsync(\n    int divisor, int dividend,\n    CancellationToken cancellationToken = default);\n}\npublic readonly struct DivisionResult {\n  public int Quotient { get; }\n  public int Remainder { get; }\n\n  public DivisionResult(int quotient, int remainder) { ... }\n}"
  - kind: annotation
    text: This replacement strategy for `out` does not work if the method is designed to both write to the `out` and throw an exception. While that’s generally considered bad design, it can be handled by the reference wrapper for `ref` replacement.
    author: Jeremy Barton
  - kind: paragraph
    text: A `ref` parameter is more difficult to replace, since it describes zero or more value reads and zero or more value writes. If the intention of the method is single-read single-write, then one possibility is to logically separate the parameter into two parameters—a simple input parameter and an `out`—and then apply the suggested `out` replacement strategy.
  - kind: code
    text: "   public partial class SomeClass {\n     public int SomeMethod(ref string value) { ... }\n\n     // Logical intermediate replacement; this method does not\n     // need to ever actually be defined\n     // public int SomeMethod(string value, out string updatedValue);\n\n     // Async variant based on the parameter separation\n     public Task<SomeResult> SomeMethodAsync(\n       string value,\n       CancellationToken cancellationToken = default);\n   }\n   public readonly struct SomeResult {\n     public int CalculatedResult { get; }\n     public string UpdatedValue { get; }\n\n     public DivisionResult(int result, string updatedValue) { ... }\n   }"
  - kind: paragraph
    text: If the method expects to have `ref` reads and writes interact with another thread, have intermediate writes be visible to other threads, or just wants to avoid creating a new return type, you can wrap the value in a reference type.
  - kind: code
    text: "   public bool ContrivedMethod(\n     byte[] data, ref string value, out int valueUtf8Length) { ... }\n\n   public Task<bool> ContrivedMethodAsync(\n     byte[] data, RefWrapper<string> value,\n     RefWrapper<int> valueUtf8Length,\n     CancellationToken cancellationToken = default) { ... }\n\n   public class RefWrapper<T> {\n      public T Value { get; set; }\n      ...\n   }"
  - kind: paragraph
    text: It may be difficult to assess which read and write models the implementations and callers are expecting for virtual methods.
  - kind: paragraph
    text: The final replacement strategy is to not convert a particularly troublesome method to Async. Consider that parameter guidance in section 5.8.3 recommends avoiding `ref` and `out`, design a new synchronous method avoiding those parameter passing conventions, and make an asynchronous version of that method instead.
  - kind: annotation
    text: 'All of the examples in this section are contrived. I looked at all of the types and members in .NET Standard 2.1 and couldn’t find any representative examples. The best example that I can provide is that during the transformation from the Classic Async Pattern to the Task-Based Async Pattern, `System.Net.Socket` simplified the async completion value from a return value and two `out` parameters to just the one return value.


      That, combined with the fact that there is no public `RefWrapper<T>` type in .NET, should suggest that the answer most commonly chosen by the BCL team is to just redesign the method.'
    author: Jeremy Barton
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate of its own: FDG9027 reports ref and out parameters of Async methods, which is what this rule removes, and the validator does not let a rule list another rule''s analyzer diagnostic. Which conversion fits (a task-like result, a result type, a reference wrapper, or a redesign) is judgment.'
- id: FDG9035
  strength: CONSIDER
  text: replacing synchronous callbacks with asynchronous callbacks in the Async method, or accepting both via overloading.
  context: null
  section: 9.2.4 Making an Async Variant of an Existing Synchronous Method
  anchor: sec9_2_4
  body:
  - kind: paragraph
    text: Given a method that accepts a synchronous callback, such as `public void DoWork(Action<State> callback)`, you need to understand if the caller is expected to do synchronous or asynchronous work in the callback. If the callback is intended to save data, and the `DoWorkAsync` will call the callback asynchronously, then `DoWorkAsync` probably only needs an asynchronous callback. Conversely, a progress notification callback from an asynchronous version of loading saved state might only warrant a synchronous callback. If it’s unclear, consider offering both.
  - kind: code
    text: "   // The original synchronous method\n   public void DoWork(Action<State> callback) { ... }\n\n   // An asynchronous variant with a synchronous callback\n   public void DoWorkAsync(\n     Action<State> callback,\n     CancellationToken cancellationToken = default) { ... }\n\n   // An asynchronous variant with an asynchronous callback\n   public void DoWorkAsync(\n     Func<State, CancellationToken, Task> asyncCallback,\n     CancellationToken cancellationToken = default) { ... }"
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether a callback should be synchronous or asynchronous depends on what callers do in it.'
- id: FDG9036
  strength: DO NOT
  text: return a null `Task` or `Task<TResult>`.
  context: null
  section: 9.2.5 Implementation Guidelines for Async Pattern Consistency
  anchor: sec9_2_5
  body:
  - kind: paragraph
    text: Very few callers would ever check an Async method for a null `Task` being returned. Instead of returning null, consider what this value means and then choose a better alternative. For example, if an Async method cannot be started, it should throw an exception (see section 9.2.6.5). Alternatively, if the work is already done, return `Task.CompletedTask` or `Task.FromResult(result)`.
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9036
    coverage: partial
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Do not return a null task from '{0}'
    category: Patterns
  notes: FDG9036 reports a null or default literal, or a conditional access (x?.M()), returned as Task or Task<TResult> from a method, local function or property getter that is not async; in an async method such a value is the result, not the task. A null is seen directly, through a conversion, or in a branch of a conditional expression. Variables and fields that hold null, and lambdas, are not seen, so coverage is partial. ValueTask is a struct whose default value is a completed operation, so it is not checked. The body asks what the value means (an exception, or Task.CompletedTask or Task.FromResult), so there is no code fix; the fix changes no signature.
- id: FDG9037
  strength: DO NOT
  text: return tasks in the `Created` state.
  context: null
  section: 9.2.5.1 Task.Status Consistency
  anchor: sec9_2_5_1
  body:
  - kind: paragraph
    text: '`Task` values created directly with a `Task` constructor are in the `Created` state, which allows customization before the `Task` begins work. If a `Task` is returned in the `Created` state (and the object isn’t later started by another thread), then any caller that awaits the `Task` will wait indefinitely.'
  - kind: paragraph
    text: Tasks created by the compiler via the `async` keyword are always started before they are returned, as are Tasks from `Task.Run(...)` and `Task.Factory.StartNew(...)`.
  - kind: annotation
    text: This `Created` state is a good example of a public API that probably shouldn’t have ever existed. The ability to create a Task separately from `Start`ing it helps as an implementation detail in a very, very small number of cases. In catering to that need by exposing the `Created` state, the relevant constructors, and the `Start` method, we ended up creating a pit of failure that developers can easily fall into, while also making it a lot more difficult for us to optimize certain common use cases. This is an example where actually cutting back on the functionality exposed would have led to a greater good.
    author: Stephen Toub
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9037
    coverage: partial
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Do not return a task in the Created state from '{0}'
    category: Patterns
  notes: 'The book shows the check icon here; the strength word is used. FDG9037 reports a Task or Task<TResult> created with a constructor and returned directly from a method, local function or property getter that is not async. A constructor call that passes a CancellationToken is not reported: when the token is already canceled, the task starts in the Canceled state, not Created, which is how code without Task.FromCanceled makes a canceled task. A token that is not canceled leaves such a task in the Created state, and it is not reported either. A task created into a variable and returned without Start is not seen, so coverage is partial. Starting the task, or creating it with Task.Run, changes no signature; there is no code fix.'
- id: FDG9038
  strength: DO
  text: throw an `OperationCanceledException` when aborting work due to a `CancellationToken`.
  context: null
  section: 9.2.5.1 Task.Status Consistency
  anchor: sec9_2_5_1
  body:
  - kind: paragraph
    text: The Task execution engine handles `OperationCanceledException` and updates the Task to be in the `Canceled` state. Awaiting a Task in the `Canceled` state results in another `OperationCanceledException` being thrown, which normally results in a cascade that ends with program termination or a caller explicitly handling the `Canceled` state.
  - kind: paragraph
    text: If you use the `CancellationToken.IsCancellationRequested` value to do an early return from a method created with the `async` keyword, then the Task for your method moves to the `RanToCompletion` state— not the `Canceled` state—and any caller awaiting the Task continues as if the method had completed successfully. This behavior is often a source of bugs.
  - kind: paragraph
    text: The easiest way to ensure that the correct behaviors happen is to invoke the `ThrowIfCancellationRequested()` method on the `CancellationToken`, but manually throwing an instance of `OperationCanceledException` works as well.
  - kind: code
    text: "try {\n  await SaveData(data, cancellationToken);\n  QueueNotification(\"Data saved successfully!\");\n} catch (OperationCanceledException) {\n  QueueNotification(\"Save was canceled.\");\n}\n...\n\nprivate async Task SaveData(\n  byte[] data, CancellationToken cancellationToken) {\n\n  // Bad: this causes the success message\n  if (cancellationToken.IsCancellationRequested) {\n    return;\n  }\n\n  // Good: this causes the canceled message for our caller\n  if (cancellationToken.IsCancellationRequested) {\n    throw new OperationCanceledException(cancellationToken);\n  }\n\n  // Good: this causes the canceled message for our caller\n  cancellationToken.ThrowIfCancellationRequested();\n\n  ...\n }"
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9038
    coverage: partial
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Throw an OperationCanceledException instead of returning when cancellation is requested in '{0}'
    category: Patterns
  notes: 'FDG9038 reports a return statement that is the whole branch of an if statement whose condition is the IsCancellationRequested property of a CancellationToken, in an async method, local function or lambda that returns a task-like type, as in the Bad example of the body. Loops that end when cancellation is requested, and other early exits, are not seen, so coverage is partial. CA2250 (use ThrowIfCancellationRequested) is not mapped: it reports the second Good example of the body, an explicit throw of OperationCanceledException, which the text allows (probe with SDK 10.0.402). There is no code fix.'
- id: FDG9039
  strength: DO
  text: use `await task.ConfigureAwait(false)` when awaiting an Async operation, except in application models that depend on the synchronization context.
  context: null
  section: 9.2.5.2 Awaiting on the Correct Context
  anchor: sec9_2_5_2
  body:
  - kind: paragraph
    text: By default, .NET uses `SynchronizationContext.Current` to determine how to continue processing the Task. In a console application, the default `SynchronizationContext` sends Tasks to be executed on background threads with no special handling.
  - kind: paragraph
    text: In graphical user interface (GUI) application models—such as Win-Forms or WPF—the default `SynchronizationContext` dispatches all Task completion callbacks to the UI thread to make it easier to interact with UI elements. Since the `SynchronizationContext` in a GUI application is using a single thread for execution, this behavior can lead to a reduction in throughput, and makes deadlock situations possible. Unless your method is interacting with a UI element, or another component that you know needs the synchronization context, then you should use `await task.ConfigureAwait(false)` to avoid unnecessarily tying up the UI thread.
  - kind: annotation
    text: There are many intricacies related to `ConfigureAwait` not captured in this short summary. For more details, [https://devblogs.microsoft.com/dotnet/configureawait-faq/](https://devblogs.microsoft.com/dotnet/configureawait-faq/) is a good source of information.
    author: Stephen Toub
  - kind: annotation
    text: 'Be aware that `ConfigureAwait` returns a wrapper around the Task—it doesn’t modify the Task. Unless you `await` that expression, or save it to a local to `await` later, it has no effect.


      ```

      Task t = SomeAsync(cancellationToken);

      // This has no effect, the result was not awaited.

      t.ConfigureAwait(false);

      // This still comes back on the captured context.

      await t;

      ```'
    author: Jeremy Barton
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
    - CA2007
    coverage: partial
  autofix: 'no'
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: the text excepts application models that depend on the synchronization context (WinForms and WPF in the body), and whether an application''s code runs under one is the application''s choice, which CA2007 cannot see. CA2007 reports an await of a task without ConfigureAwait, and await foreach and await using declarations too, but not an await foreach over WithCancellation(...) or an await using of an existing variable that lack ConfigureAwait; it does not report ConfigureAwait(true) (probe with SDK 10.0.402), which marks code that needs the context, so an unneeded ConfigureAwait(true) is not seen and coverage is partial. Library code that needs the context, such as a WPF control library, falls under the exception and uses ConfigureAwait(true) or suppresses CA2007. CA2007 has a code fix that adds ConfigureAwait(false), but whether the code after the await needs the context is judgment, so autofix is no. FDG9050 shares CA2007.'
- id: FDG9040
  strength: DO NOT
  text: invoke `Task.Wait()` or read the `Task.Result` property in an Async method; instead, use `await`.
  context: null
  section: 9.2.5.3 Avoiding Deadlock
  anchor: sec9_2_5_3
  body:
  - kind: paragraph
    text: The `await` keyword causes the Task to yield, which allows other Tasks to continue. The `Task.Wait()` method—and the `Task.Result` property—instead do a blocking synchronous wait, which is inefficient and can lead to deadlock in some situations.
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
    - CA1849
    coverage: partial
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA1849 reports Task.Wait() and the Result property of Task<TResult>, and other blocking calls that have an asynchronous variant, in methods that are async or return a task (probe with SDK 10.0.402). task.GetAwaiter().GetResult() is not reported, so coverage is partial. Replacing the call with await may make the method async; CA1849 has no code fix. FDG9041 shares CA1849.
- id: FDG9041
  strength: DO
  text: call asynchronous method variants, instead of synchronous method variants, in the implementation of Async methods.
  context: null
  section: 9.2.5.3 Avoiding Deadlock
  anchor: sec9_2_5_3
  body:
  - kind: paragraph
    text: In general, if there are both a synchronous variant and an asynchronous variant for a method, the synchronous method will potentially block and the asynchronous method will potentially yield. Calling a blocking method from an asynchronous method is inefficient, and can lead to resource starvation and deadlock.
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
    - CA1849
    coverage: partial
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'CA1849 reports a call to a synchronous method that has an asynchronous variant (Stream.Read and ReadAsync, Stream.Flush and FlushAsync, Thread.Sleep and Task.Delay in the probe with SDK 10.0.402) in methods that are async or return a task. Variants that CA1849 does not find are not reported, so coverage is partial. CA2024 (StreamReader.EndOfStream in an async method) is not mapped: EndOfStream has no asynchronous variant, which the text is about. CA1849 has no code fix. FDG9040 shares CA1849.'
- id: FDG9042
  strength: DO NOT
  text: operate on an instance of `ValueTask` or `ValueTask<TResult>` more than once or save it; only ever `await` or `return` it.
  context: null
  section: 9.2.5.4 Properly Handling ValueTask and ValueTask<TResult>
  anchor: sec9_2_5_4
  body:
  - kind: paragraph
    text: As mentioned in section 9.2.3, `ValueTask` and `ValueTask<TResult>` have the potential to provide a performance benefit in some cases, but at the cost of some robustness and usability.
  - kind: paragraph
    text: Unlike with `Task` and `Task<TResult>`, awaiting the same `ValueTask` or `ValueTask<TResult>` twice is not safe, and has undefined behavior. The “undefined behavior” extends to anything that can observe the result of a `ValueTask<TResult>`, such as reading the `Result` property or calling `ToString()`. If you need to do anything more complicated than a simple `await` or `return`, get a `Task` (or `Task<TResult>`) from the `AsTask()` method and ignore the `ValueTask`.
  - kind: annotation
    text: 'An easy oversimplification is “never have a `ValueTask` or `ValueTask<T>` local variable.” Once you need to talk about the value, write something like


      ```

      Task<int> task = SomeMethodAsync(...).AsTask();

      // complicated stuff goes here

      ```'
    author: Jeremy Barton
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
    - CA2012
    coverage: partial
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA2012 reports a ValueTask or ValueTask<TResult> that is consumed twice, whose Result is read directly, or that is discarded (probe with SDK 10.0.402, net10.0). A ValueTask saved in a local and awaited once is not reported, though the text asks not to save it, so coverage is partial. There is no code fix.
- id: FDG9043
  strength: DO
  text: throw usage error exceptions directly from the Async method, to aid in debuggability.
  context: null
  section: 9.2.5.5 Exceptions from Async Methods
  anchor: sec9_2_5_5
  body:
  - kind: paragraph
    text: 'Usage error exceptions (see section 7.2) are indicative of an error in the calling code. If you throw a usage error exception directly from the called method that conveys a few benefits over the exception being wrapped inside Tasks:'
  - kind: list
    text: '1. The callstack very clearly indicates where the usage violation came from, making it easier to for the caller to diagnose and fix.

      2. There’s no chance that the exception will be ignored when the Task is never awaited.

      3. The invalid inputs don’t end up spinning up the Task machinery, only to cause it to spin down again.'
  - kind: paragraph
    text: One effect of this guidance is that usage error exceptions should not be thrown from `public async` or `protected async` methods. Instead, the public (or protected) method should do usage validation and then defer to a non-public async method (or an async local function, or another means of separating “inside” and “outside” the Task).
  - kind: code
    text: "// Wrong: The exception is thrown inside the Task;\n// the call stack will be less clear\npublic async Task SaveAsync(string filename) {\n  if (filename == null)\n    throw new ArgumentNullException(nameof(filename));\n\n  ...\n}\n\n// Right: The exception is thrown instead of a Task being returned.\npublic Task SaveAsync(string filename) {\n  if (filename == null)\n    throw new ArgumentNullException(nameof(filename));\n\n  return SaveAsyncCore(uri);\n}\n\nprivate async Task SaveAsyncCore(string filename){ ... }"
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9043
    coverage: partial
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: 'Throw ''{0}'' before the task of ''{1}'' starts: move the check out of the async method'
    category: Patterns
  notes: 'FDG9043 reports, in an externally visible async method (public or protected, as the body says), a throw of ArgumentException or an exception derived from it, or a call to one of their static ThrowIf methods (such as ArgumentNullException.ThrowIfNull), in the method''s own body rather than in a lambda or local function. Async iterators and overrides are reported too: their body is their own. A throw that comes after an await or an await foreach in the text of the body, which can depend on the result of an asynchronous operation (FDG9044), is not reported; an await using awaits only at disposal, so it counts only after its statement ends, and an await using declaration does not count. The order is the order in the text, not control flow: a throw in the else branch of an if whose other branch awaits is not reported, and neither is a throw inside the operand of an await (await F(x ?? throw ...)). Other usage errors, such as InvalidOperationException for a wrong state, are not seen, since the same types also report execution errors, so coverage is partial. The fix moves the checks into a method without the async keyword that returns the task of an async implementation, as the body shows, without changing the signature; there is no code fix.'
- id: FDG9044
  strength: DO
  text: throw execution error exceptions via the Task-like value returned from an Async method.
  context: null
  section: 9.2.5.5 Exceptions from Async Methods
  anchor: sec9_2_5_5
  body:
  - kind: paragraph
    text: Execution error exceptions can be the result of invalid data, which might only be available after a nested Async operation has finished. Since these “late” execution error exceptions would be captured within the Task, the most consistent model is to ensure that all execution error exceptions are held in the Task.
  - kind: paragraph
    text: 'This example can incorrectly throw a `FileNotFoundException`, an execution error exception, in such a way that it is not captured within the `Task<byte[]>`:'
  - kind: code
    text: "public static Task<byte[]> ReadAllBytesAsync(string path) {\n  // Maybe we can just let OpenRead throw the\n  // ArgumentNullException for us?\n  Stream stream = File.OpenRead(path);\n  // Unfortunately, it also could have thrown\n  // AccessDeniedException, FileNotFoundException,\n  // and a number of other execution error-based exceptions.\n  return ReadAllBytesAsyncCore(stream);\n}"
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: which calls throw execution errors (the File.OpenRead example) depends on what they do, and a method without the async keyword may throw usage errors directly (FDG9043), so a check cannot tell which exceptions should go through the task.'
- id: FDG9045
  strength: DO
  text: use the suffix “Async” for methods returning `IAsyncEnumerable<T>`.
  context: null
  section: 9.2.10 IAsyncEnumerable<T>
  anchor: sec9_2_10
  body:
  - kind: paragraph
    text: Methods that return `IAsyncEnumerable<T>` follow the same naming conventions as methods returning Tasks with the Task-Based Async Pattern, including using the combined suffix “AsyncCore” when making use of the Template Method Pattern (section 9.9).
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9045
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Add the suffix 'Async' to the name of '{0}', which returns IAsyncEnumerable<T>
    category: Patterns
  notes: FDG9045 reports an externally visible method that returns IAsyncEnumerable<T> and whose name does not end with "Async" or "AsyncCore". It shares its analyzer with FDG9020 and leaves out the same members (overrides, interface implementations, private and internal methods), so coverage is partial. The ValueGenerator examples of FDG9046 lack the suffix; they show the attribute, and they are reported. Renaming a public method breaks its callers, so the fix is breaking; there is no code fix.
- id: FDG9046
  strength: DO
  text: add the `[EnumeratorCancellation]` attribute to the `CancellationToken` parameter of an `IAsyncEnumerable<T>` method using `yield return`.
  context: null
  section: 9.2.10 IAsyncEnumerable<T>
  anchor: sec9_2_10
  body:
  - kind: paragraph
    text: The `[EnumeratorCancellation]` attribute indicates that the compiler should bind the `CancellationToken` value from the call to `GetAsyncEnumerator` to the parameter with the attribute, or combine the `CancellationToken` values from `GetAsyncEnumerator` and the token passed as a parameter to the `IAsyncEnumerable<T>` method. When the attribute is not specified, the `CancellationToken` value from `GetAsyncEnumerator` is ignored for compiler-generated implementations.
  - kind: code
    text: "// incorrect\npublic static async IAsyncEnumerable<int> ValueGenerator(\n  int start,\n  int count,\n  CancellationToken cancellationToken = default) {\n\n  int end = start + count;\n  for (int i = start; i < end; i++) {\n    await Task.Delay(i, cancellationToken).ConfigureAwait(false);\n    yield return i;\n  }\n}\n\n// correct\npublic static async IAsyncEnumerable<int> ValueGenerator(\n  int start,\n  int count,\n  [EnumeratorCancellation]\n  CancellationToken cancellationToken = default) {\n\n  int end = start + count;\n  for (int i = start; i < end; i++) {\n    await Task.Delay(i, cancellationToken).ConfigureAwait(false);\n    yield return i;\n  }\n}"
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not mapped: the compiler reports CS8425 for an async iterator with a CancellationToken parameter that lacks the attribute (probe with SDK 10.0.402), and compiler warnings are not SDK analyzer diagnostics of the catalog (as CS1591 for FDG2020). Not an analyzer candidate: it would repeat CS8425.'
- id: FDG9047
  strength: DO NOT
  text: use `IAsyncEnumerator<T>`, or any other type that implements or extends that interface, except as the return type of a `GetAsyncEnumerator` method.
  context: null
  section: 9.2.10 IAsyncEnumerable<T>
  anchor: sec9_2_10
