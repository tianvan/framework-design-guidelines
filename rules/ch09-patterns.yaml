  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'The text has no body; the body of FDG9155 explains both. Not machine-checkable: the body keeps the existing name of the source parameter of a buffer-writing variant and allows a name that clarifies the role (data and hash in RSA), so which name is best is judgment. FDG9156 checks the position of a parameter named source.'
- id: FDG9155
  strength: DO
  text: prefer the name “destination” for the output buffer parameter of methods that write to a single buffer.
  context: null
  section: 9.12 Operating on Buffers
  anchor: sec9_12
  body:
  - kind: paragraph
    text: A buffer-writing variant for an existing array-returning method should maintain the existing name for the source parameter. As with all other naming suggestions, if the suggested names are confusing in context, or if a different name would clarify the parameter’s role, use your judgment to pick the best name.
  - kind: paragraph
    text: In the `RSA` class, the name of the input buffer to the `SignData` method is “data,” and the name of the input buffer to `SignHash` is “hash,” to reinforce the different treatment that the buffers get between those two methods. The `TrySignData` and `TrySignHash` methods continue to use the names “data” and “hash” instead of “source” to be consistent with the data-returning method variants, but both still use “destination” as the name for the output buffer because no domain-specific clarity is required.
  - kind: code
    text: "public partial class RSA {\n  public virtual byte[] SignData(\n    byte[] data,\n    HashAlgorithmName hashAlgorithm,\n    RSASignaturePadding padding) { ... }\n\n  public virtual bool TrySignData(\n    ReadOnlySpan<byte> data,\n    Span<byte> destination,\n    HashAlgorithmName hashAlgorithm,\n    RSASignaturePadding padding,\n    out int bytesWritten) { ... }\n}"
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: the body allows a name that clarifies the role of the parameter when destination would be confusing, which is judgment. FDG9157 checks the position of a parameter named destination.'
- id: FDG9156
  strength: DO
  text: position the input buffer parameter (“source”) as the first method parameter, when there is an explicit input buffer parameter.
  context: null
  section: 9.12.1 Data Transformation Operations
  anchor: sec9_12_1
  body: []
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9156
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Make the input buffer '{0}' the first parameter of '{1}'
    category: Patterns
  notes: The text has no body; the body of FDG9157 explains both. FDG9156 reports a parameter named source of an input buffer type (ReadOnlySpan<T>, ReadOnlyMemory<T>, ReadOnlySequence<T>, an array, ArraySegment<T> or string) of an externally visible method when a parameter before it is an output buffer named destination (an array can be either) or is neither another input buffer of those types nor an int that immediately follows an array (the array's offset), so that several source parameters may come first, as in the Xor example. A string or array named source is checked only when the method also has an output buffer (Span<T>, Memory<T>, an array or ArraySegment<T>), since without one it can be a name, a path or a collection; a ReadOnlySpan<T>, ReadOnlyMemory<T> or ReadOnlySequence<T> source is always checked. The this parameter of an extension method is not counted, as it stands for the instance of an instance method, which the body allows to provide the source. Input buffers with other names (left, nonce, plaintext), overrides and interface implementations are not checked, so coverage is partial. Span<T> and Memory<T> types need .NET Core 2.1 or later, or the System.Memory package on .NET Framework and .NET Standard 2.0 (see FDG9137). Reordering changes the public signature, so the fix is breaking; there is no code fix.
- id: FDG9157
  strength: DO
  text: position the output buffer parameter (“destination”) as the first method parameter after the source parameter(s).
  context: null
  section: 9.12.1 Data Transformation Operations
  anchor: sec9_12_1
  body:
  - kind: paragraph
    text: Some methods—instance methods, in particular—may provide the source from ambient state; therefore, no formal source parameter is required. When a formal source parameter is required, it should be the first parameter, followed by the destination parameter, and then any other parameters.
  - kind: code
    text: "public partial class IncrementalHash {\n  // No source parameter is required,\n  // because the values were built by other instance methods.\n  public bool TryGetHashAndReset(\n    Span<byte> destination,\n    out int bytesWritten) { ... }\n}\n\npublic partial class ByteOperations {\n  // One source, one destination\n  // (destination is read-write in this example).\n  public static int XorInto(\n    ReadOnlySpan<byte> source,\n    Span<byte> destination) { ... }\n\n  // Two source parameters, one destination.\n  // The source parameters come first.\n  public static int Xor(\n    ReadOnlySpan<byte> left,\n    ReadOnlySpan<byte> right,\n    Span<byte> destination) { ... }\n\n  // One source, one destination, one other parameter.\n  public static int CombineInto(\n    ReadOnlySpan<byte> source,\n    Span<byte> destination,\n    BitOperation operation) { ... }\n\n  // Two sources, one destination, one other parameter.\n  public static int Combine(\n    ReadOnlySpan<byte> left,\n    ReadOnlySpan<byte> right,\n    Span<byte> destination,\n    BitOperation operation) { ... }\n}\n\npublic partial class AesGcm {\n  // Two (or three) inputs, two outputs.\n  public void Encrypt(\n    ReadOnlySpan<byte> nonce,\n    ReadOnlySpan<byte> plaintext,\n    Span<byte> ciphertext,\n    Span<byte> tag,\n    ReadOnlySpan<byte> associatedData = default) { ... }\n}"
  - kind: paragraph
    text: When a buffer-writing method accepts an array and an offset, the offset parameter should immediately follow the array it is associated with. This is one of the only reasons for inserting a parameter between the `source` and `destination` parameters.
  - kind: code
    text: "public static int XorInto(\n  ReadOnlySpan<byte> source,\n  Span<byte> destination) { ... }\n\npublic static int XorInto(\n  byte[] source,\n  byte[] destination) { ... }\n\npublic static int XorInto(\n  byte[] source, int sourceIndex,\n  byte[] destination, int destinationIndex) { ... }"
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9157
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Move the output buffer '{0}' of '{1}' after the source parameter '{2}'
    category: Patterns
  notes: 'FDG9157 reports a parameter named destination of an output buffer type (Span<T>, Memory<T>, an array or ArraySegment<T>) of an externally visible method when a parameter named source comes after it. Other parameters before destination are not reported: the source can be an input value of any type (the TryWriteGuid call of the FDG9169 example passes a Guid before the destination), which symbols cannot tell from the other parameters. The body''s request that an offset immediately follow its array is not checked, nor are outputs with other names (ciphertext, tag), overrides and interface implementations, so coverage is partial. Span<T> and Memory<T> types need .NET Core 2.1 or later, or the System.Memory package on .NET Framework and .NET Standard 2.0 (see FDG9137). Reordering changes the public signature, so the fix is breaking; there is no code fix.'
- id: FDG9158
  strength: DO
  text: let the caller know the number of elements written into each destination buffer.
  context: null
  section: 9.12.1 Data Transformation Operations
  anchor: sec9_12_1
  body:
  - kind: paragraph
    text: Whenever you write into a caller-provided buffer, you need to inform the caller how much of the buffer contains the result. For simple transformations, the best way to do that is by returning the number of elements written. If the return value is already needed for something else—like the Boolean return for Try-Write (section 9.12.3) or an `OperationStatus` result (section 9.12.4)—then use an `out` parameter instead.
  - kind: paragraph
    text: When your method is always going to fill the entire buffer, as occurs with `RandomNumberGenerator.Fill`, the caller already knows the number of elements written, so you don’t need to explicitly return it.
  - kind: code
    text: "partial class RandomNumberGenerator {\n  // No return value required; it always writes\n  // destination.Length bytes\n  public static void Fill(Span<byte> destination) { ... }\n}\n\npublic partial class Encoding {\n  // Returns the number of bytes written to destination\n  public virtual int GetBytes(\n    ReadOnlySpan<char> source,\n    Span<byte> destination) { ... }\n}"
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: a buffer-writing method that returns void and has no out parameter can be found, but the body exempts a method that always fills the entire buffer (RandomNumberGenerator.Fill), which the signature does not show. FDG9163 and FDG9173 report Try-Write and OperationStatus methods without the out parameter.'
- id: FDG9159
  strength: CONSIDER
  text: naming an `out` parameter that reports the number of values written by a buffer-writing method “bytesWritten,” “charsWritten,” or “valuesWritten” (as appropriate to the data type).
  context: null
  section: 9.12.1 Data Transformation Operations
  anchor: sec9_12_1
  body:
  - kind: paragraph
    text: 'One simple example of this pattern is the `TryFormat` method on `System.Version`:'
  - kind: code
    text: "public bool TryFormat(\n  Span<char> destination, out int charsWritten) { ... }"
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9159
    coverage: partial
  autofix: breaking
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Name the out parameter '{0}' of '{1}' '{2}'
    category: Patterns
  notes: 'FDG9159 reports the out parameter that reports the number of values written by an externally visible buffer-writing method when its name is not the one for the element type of the destination: bytesWritten for byte and sbyte, charsWritten for char, valuesWritten for any other type. The parameter is found in two shapes: the only out parameter of an integer type of a Try-Write method (named Try followed by an uppercase letter, returning bool, with a parameter named destination of type Span<T>, Memory<T>, an array or ArraySegment<T>), and the written one of exactly two such out parameters of a method that returns OperationStatus and has an output buffer (found as for FDG9173): the second, or the first when it ends with Written and the second with Consumed. The ToBase64 example of FDG9174 (a Span<byte> destination counted by charsWritten) is reported. It is taken as a book error: the book''s other ToBase64 signatures (FDG9152 and the TextTransforms example of section 9.12.2) write to Span<char>, and the text asks for the name of the destination''s data type. Other buffer-writing methods, overrides and interface implementations are not checked, so coverage is partial. Span<T> and Memory<T> types need .NET Core 2.1 or later, or the System.Memory package on .NET Framework and .NET Standard 2.0 (see FDG9137). Renaming a public parameter breaks callers that pass it as a named argument, so the fix is breaking; there is no code fix.'
- id: FDG9160
  strength: DO
  text: provide a simple buffer-writing method for operations that write a small, effectively fixed, number of elements to the destination buffer.
  context: null
  section: 9.12.2 Writing Fixed or Predetermined Sizes to a Buffer
  anchor: sec9_12_2
  body:
  - kind: paragraph
    text: If it’s easy for your callers to ensure their buffer is large enough before using your operation, then you should provide a simple signature so they can avoid all of the ceremony associated with the more complex buffer-writing patterns.
  - kind: paragraph
    text: For example, a CRC-64 operation will always write an 8-byte output (64 bits), so there should be a simple method for computing a CRC-64 value into a buffer.
  - kind: code
    text: "partial class Crc64 {\n  public const int ChecksumSize = 8;\n\n  public static int ComputeChecksum(\n    ReadOnlySpan<byte> source,\n    Span<byte> destination) {\n\n    if (destination.Length < ChecksumSize) {\n      throw new ArgumentException(..., nameof(destination));\n    }\n    ...\n    return ChecksumSize;\n  }\n}"
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether the number of elements an operation writes is small and effectively fixed is what the operation does.'
- id: FDG9161
  strength: DO
  text: use the Try-Write Pattern for buffer-writing methods that write variable amounts of data when the amount of data is small, or the operation cannot meaningfully produce partial results.
  context: null
  section: 9.12.3 Writing Values to Buffers with the Try-Write Pattern
  anchor: sec9_12_3
  body:
  - kind: paragraph
    text: The Try-Write Pattern is better than a simple buffer-writing method when the number of output elements varies greatly for two inputs of the same size. It is partially built on a caller “hoping” that the destination buffer is big enough, and when it isn’t, getting a bigger buffer and trying again.
  - kind: paragraph
    text: However, every time your caller grows the buffer, the caller pays the cost of copying all of the existing contents into the new buffer. The performance penalty is worse if method has to do a nontrivial amount of work before it can determine the destination is too small. If you expect a caller to have to get a bigger buffer several times before it can use your operation successfully, the Try-Write Pattern may be a performance trap. Later guidance in this section addresses avoiding, or reducing, the performance concerns in these situations.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether the amount of data is variable and small, or whether the operation can meaningfully produce partial results, is what the operation does. FDG9162 and FDG9163 check the shape of Try-Write methods.'
- id: FDG9162
  strength: DO
  text: use the prefix “Try” and a Boolean return type for methods implementing the Try-Write Pattern.
  context: null
  section: 9.12.3 Writing Values to Buffers with the Try-Write Pattern
  anchor: sec9_12_3
  body: []
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9162
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Give the Try-Write method '{0}' the prefix Try and a Boolean return type
    category: Patterns
  notes: The text has no body; the body of FDG9165 and the introduction of section 9.12.3 describe the pattern. FDG9162 reports an externally visible method with a parameter named destination of type Span<T>, Memory<T>, an array or ArraySegment<T> and an out parameter of an integer type whose name ends with Written, the shape of the Try-Write Pattern, when it returns bool but its name does not start with Try followed by an uppercase letter, or when its name starts so but it does not return bool. A method that returns OperationStatus has the same parameters in the pattern of section 9.12.4 and is not reported. Try-Write methods with other parameter names, overrides and interface implementations are not seen, so coverage is partial. Span<T> and Memory<T> types need .NET Core 2.1 or later, or the System.Memory package on .NET Framework and .NET Standard 2.0 (see FDG9137). Renaming or changing the return type changes the public API, so the fix is breaking; there is no code fix.
- id: FDG9163
  strength: DO
  text: report the number of values written by a Try-Write method via an `out` parameter.
  context: null
  section: 9.12.3 Writing Values to Buffers with the Try-Write Pattern
  anchor: sec9_12_3
  body: []
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9163
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Report the number of values written by the Try-Write method '{0}' through an out parameter
    category: Patterns
  notes: The text has no body; the introduction of section 9.12.3 describes the pattern. FDG9163 reports an externally visible method named Try followed by an uppercase letter that returns bool and has a parameter named destination of type Span<T>, Memory<T>, an array or ArraySegment<T>, when it has no out parameter of an integer type. That includes Try-Write methods that write a fixed number of values, such as the shape of BinaryPrimitives.TryWriteUInt64LittleEndian, which the example of FDG9169 calls; the text asks every Try-Write method for the out parameter. Methods with another name for the output buffer, overrides and interface implementations are not checked, so coverage is partial. CA1021 (FDG5113) does not report the out parameter of a Try method that returns bool (probe with SDK 10.0.402). Span<T> and Memory<T> types need .NET Core 2.1 or later, or the System.Memory package on .NET Framework and .NET Standard 2.0 (see FDG9137). Adding a parameter changes the public signature, so the fix is breaking; there is no code fix.
- id: FDG9164
  strength: DO
  text: return `false` from a Try-Write method if, and only if, the destination is too small.
  context: null
  section: 9.12.3 Writing Values to Buffers with the Try-Write Pattern
  anchor: sec9_12_3
  body: []
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'The text has no body; the body of FDG9165 explains both. Not machine-checkable: when a method returns false is runtime behavior.'
- id: FDG9165
  strength: DO
  text: throw an exception, instead of returning `false`, for any error other than the destination being too small in a Try-Write method.
  context: null
  section: 9.12.3 Writing Values to Buffers with the Try-Write Pattern
  anchor: sec9_12_3
  body:
  - kind: paragraph
    text: In the Try-Write Pattern, `true` means success and `false` means the destination is not big enough. This consistency allows callers to reliably interpret `false` as “try again with a bigger buffer.” For any other error condition (e.g., invalid inputs, invalid object state), the correct response is to throw an appropriate exception (see section 7.2).
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: a return of false after a check can be found, but whether the condition means that the destination is too small is what it means.'
- id: FDG9166
  strength: DO
  text: provide a way of determining a sufficient output length if your Try-Write method can produce large results.
  context: null
  section: 9.12.3 Writing Values to Buffers with the Try-Write Pattern
  anchor: sec9_12_3
  body:
  - kind: paragraph
    text: If a caller has to call your Try-Write method more than twice with successively larger buffers, the attempts between the first call and the successful call probably involved needlessly copying data into bigger and bigger buffers. If you have a method that predicts the output size of your operation, your caller can use that information to grow the buffer once, and succeed on the second call.
  - kind: code
    text: "public partial struct BigInteger {\n  public int GetByteCount(bool isUnsigned=false) {\n    ...\n  }\n}\n...\nBigInteger value = ...;\nbyte[] buf = ...;\nint offset = ...;\n\nwhile (!value.TryWriteBytes(buf.AsSpan(offset), out bytesWritten)){\n  int growBy = Math.Max(buf.Length, value.GetByteCount());\n  Array.Resize(ref buf, buf.Length + growBy);\n}"
  - kind: paragraph
    text: While `BigInteger.GetByteCount` and `Encoding.GetByteCount` both produce exact answers, you can also—or instead—provide a faster method that returns the maximum possible value for the result size, like `Encoding.GetMaxByteCount`.
  - kind: code
    text: "public partial class Encoding {\n  public abstract int GetMaxByteCount(int charCount);\n  public abstract int GetMaxCharCount(int byteCount);\n\n  public virtual int GetByteCount(ReadOnlySpan<char> chars) {\n    ...\n  }\n\n  public virtual int GetCharCount(ReadOnlySpan<byte> bytes) {\n    ...\n  }\n}\n...\nint longestString = strings.Max(s => s.Length);\nbyte[] buf = new byte[encoding.GetMaxByteCount(longestString)];\nforeach (string s in strings) {\n  int written = encoding.GetBytes(s, buf);\n  SendMessage(buf.Slice(0, written));\n}"
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether a Try-Write method can produce large results, and whether a member predicts its output size (GetByteCount, GetMaxByteCount), is what the members mean.'
- id: FDG9167
  strength: CONSIDER
  text: providing an API to compute a sufficient output buffer size for Try-Write methods, even when the output size is small.
  context: null
  section: 9.12.3 Writing Values to Buffers with the Try-Write Pattern
  anchor: sec9_12_3
  body:
  - kind: paragraph
    text: If you know all of the sizes, or an upper bound for all of the sizes, of the output from a series of transformations, you can pre-allocate a big enough buffer to avoid needing to grow.
  - kind: paragraph
    text: For example, writing a row of Boolean values into a CSV file can preallocate a buffer based on knowing that the longest output from `bool.TryFormat` is from the string `"false"`. Pre-allocating buffers is more difficult for `TryFormat` methods on more complex types, unless those types expose their maximum format length via API.
  - kind: code
    text: "private void WriteRow(ReadOnlySpan<bool> row, ref char[] buf) {\n  int length = (bool.FalseString.Length + 1) * row.Length;\n  Array.Resize(ref buf, Math.Max(length, buf.Length));\n  int offset = 0;\n  foreach (bool b in row) {\n    while (!b.TryFormat(buf.AsSpan(offset), out int written)) {\n      Array.Resize(ref buf, buf.Length * 2);\n    }\n    offset += written;\n    buf[offset] = ',';\n  }\n  WriteLine(buf.AsSpan(0, offset));\n}"
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether a member computes a sufficient output size for a Try-Write method is what it means.'
- id: FDG9168
  strength: CONSIDER
  text: providing an exception-throwing alternative for each member using the Try-Write Pattern.
  context: null
  section: 9.12.3 Writing Values to Buffers with the Try-Write Pattern
  anchor: sec9_12_3
  body:
  - kind: paragraph
    text: Callers that make use of pre-sized or over-sized buffers can benefit from simplifying their code and eliminating the `false` branch altogether, without resorting to getting into the habit of calling a Try-Write method and not checking the return value.
  - kind: paragraph
    text: By having an alternative that returns the count of values written instead of a Boolean value, a caller can write linear code and still be protected from logic errors in the pre-sizing (or a time-of-check to time-of-use disagreement from data mutation).
  - kind: paragraph
    text: 'For example, suppose a type has both a `TryWriteBytes` method and a `WriteBytes` method:'
  - kind: code
    text: "public bool TryWriteBytes(\n  Span<byte> destination, out int bytesWritten) { ... }\npublic int WriteBytes(Span<byte> destination) {\n  if (!TryWriteBytes(destination, out int bytesWritten)) {\n    throw new ArgumentException(SR.TooSmall, nameof(destination));\n  }\n  return bytesWritten;\n}"
  - kind: paragraph
    text: 'A caller can simplify the invocation from an if-statement with a (theoretically) unreachable branch to a simple call:'
  - kind: code
    text: "// If only TryWriteBytes is available\nif (!target.TryWriteBytes(destination, out int bytesWritten)) {\n  Debug.Fail(\"TryWriteBytes failed with a pre-allocated buffer\");\n  throw new InvalidOperationException();\n}\n\n// Using WriteBytes\nint bytesWritten = target.WriteBytes(destination);"
  - kind: paragraph
    text: The exception-throwing buffer-writing method should be written according to the guidance for predetermined-length writes in section 9.12.2.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: suggestion
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: the reason given is simpler code for callers that use pre-sized buffers, and an application changes its own callers (as for FDG9021). Not machine-checkable: whether a method is the exception-throwing alternative of a Try-Write method (WriteBytes for TryWriteBytes) is what it does.'
- id: FDG9169
  strength: CONSIDER
  text: also using the Try-Write Pattern for methods that write fixed or predetermined amounts of data to a buffer.
  context: null
  section: 9.12.3 Writing Values to Buffers with the Try-Write Pattern
  anchor: sec9_12_3
  body:
  - kind: paragraph
    text: The Try-Write Pattern is useful both when the amount of data to be written isn’t known ahead of time and when called by an operation that has a variable amount of buffer remaining after successfully calling other Try-Write methods. Offering a Try-Write alternative for a fixed-write method may be valuable to callers, as it composes more fluidly with other Try-Write methods.
  - kind: code
    text: "public partial class EventInstance {\n  public Guid OperationId { get; private set; }\n  public Guid EventTypeId { get; private set; }\n  public DateTimeOffset Timestamp { get; private set; }\n  public bool TrySerialize(\n    Span<byte> destination,\n    out int bytesWritten) {\n\n    bytesWritten = 0;\n    if (!TryWriteGuid(OperationId, destination, out int written)) {\n      return false;\n    }\n    int totalWritten = written;\n    destination = destination.Slice(written);\n    if (!TryWriteGuid(EventTypeId, destination, out written)) {\n      return false;\n    }\n    totalWritten += written;\n    destination = destination.Slice(written);\n    if (!BinaryPrimitives.TryWriteUInt64LittleEndian(destination,\nTimestamp.ToFileTime())) {\n      return false;\n    }\n    bytesWritten = totalWritten + sizeof(ulong);\n    return true;\n  }\n}"
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: suggestion
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: the reason given is callers that compose Try-Write methods, and an application changes its own callers (as for FDG9021). Not machine-checkable: whether a method writes a fixed or predetermined amount of data is what it does.'
- id: FDG9170
  strength: CONSIDER
  text: using the `OperationStatus` method pattern for buffer- writing methods that can produce partial results.
  context: null
  section: 9.12.4 Partial Writes to Buffers and OperationStatus
  anchor: sec9_12_4
  body:
  - kind: paragraph
    text: Any algorithm where the input to can be broken down into smaller pieces—such as reading from or writing to Base64, or expanding compressed data—is a good candidate for an `OperationStatus` method. Such a method allows the caller to process whatever amount of data fits in the current buffer and continue without needing to first obtain a bigger buffer.
  - kind: code
    text: "private int Expand(ReadOnlySpan<byte> source, Stream destination){\n  OperationStatus status = _expander.Expand(\n    source, _buf,\n    out int bytesConsumed, out int bytesWritten);\n\n  switch (status) {\n    case OperationStatus.Done:\n    case OperationStatus.DestinationTooSmall:\n    case OperationStatus.NeedMoreData:\n      destination.Write(_buf.AsSpan(0, bytesWritten));\n      return bytesConsumed;\n  }\n  throw new InvalidOperationException();\n}"
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether an operation can produce partial results is what it does. FDG9171 to FDG9174 check the shape of OperationStatus methods. System.Buffers.OperationStatus is in .NET Core 2.1 or later and in the System.Memory package (see FDG9137).'
- id: FDG9171
  strength: DO
  text: report the number of input values successfully processed by an `OperationStatus` method via an `out` parameter.
  context: null
  section: 9.12.4 Partial Writes to Buffers and OperationStatus
  anchor: sec9_12_4
  body: []
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9171
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Report the number of input values processed by '{0}' through an out parameter
    category: Patterns
  notes: The text has no body; the body of FDG9173 gives the expected signature. FDG9171 reports an externally visible method that returns System.Buffers.OperationStatus and has an input buffer (a parameter named source, or else the first one of type ReadOnlySpan<T>, ReadOnlyMemory<T>, ReadOnlySequence<T> or string) when it has no out parameter of an integer type, or only one, whose name ends with Written. A single out parameter with another name is taken to report the input and is not reported. Methods whose input is the state of the instance, overrides and interface implementations are not checked, so coverage is partial. CA1021 (FDG5113) reports the out parameters of an OperationStatus method (probe with SDK 10.0.402), a pattern that requires them. Span<T> and Memory<T> types need .NET Core 2.1 or later, or the System.Memory package on .NET Framework and .NET Standard 2.0 (see FDG9137). Adding a parameter changes the public signature, so the fix is breaking; there is no code fix.
- id: FDG9172
  strength: CONSIDER
  text: naming the `out` parameter that reports the number of values successfully processed by an `OperationStatus` method “bytesConsumed,” “charsConsumed,” or “valuesConsumed” (as appropriate to the data type).
  context: null
  section: 9.12.4 Partial Writes to Buffers and OperationStatus
  anchor: sec9_12_4
  body: []
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9172
    coverage: partial
  autofix: breaking
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Name the out parameter '{0}' of '{1}' '{2}'
    category: Patterns
  notes: 'The text has no body; the body of FDG9173 gives the expected signature. FDG9172 reports the out parameter that reports the number of input values processed by an externally visible method that returns OperationStatus when its name is not the one for the element type of the input buffer (found as for FDG9171; a string has char elements): bytesConsumed for byte and sbyte, charsConsumed for char, valuesConsumed for any other type. The parameter is the first of exactly two out parameters of an integer type, or the second when the first ends with Written and the second with Consumed (the order FDG9173 reports). Methods with one or more than two such out parameters, methods without an input buffer, overrides and interface implementations are not checked, so coverage is partial. Span<T> and Memory<T> types need .NET Core 2.1 or later, or the System.Memory package on .NET Framework and .NET Standard 2.0 (see FDG9137). Renaming a public parameter breaks callers that pass it as a named argument, so the fix is breaking; there is no code fix.'
- id: FDG9173
  strength: DO
  text: report the number of output values successfully written by an `OperationStatus` method via an `out` parameter, declared after the out parameter that reports the number of input values that were successfully processed.
  context: null
  section: 9.12.4 Partial Writes to Buffers and OperationStatus
  anchor: sec9_12_4
  body:
  - kind: paragraph
    text: 'Following the earlier guidance that the input buffer and output buffer should be the first and second parameters, respectively, an `OperationStatus` method should generally have a method signature like the following example to read a list of numbers:'
  - kind: code
    text: "public static OperationStatus ReadInt32List(\n  ReadOnlySpan<char> source,\n  Span<int> destination,\n  out int charsConsumed,\n  out int valuesWritten) { ... }"
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9173
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Report the number of values written by '{0}' through an out parameter declared after the one for the input
    category: Patterns
  notes: FDG9173 reports an externally visible method that returns OperationStatus and has an output buffer (a parameter named destination, or else the first one of type Span<T> or Memory<T>) when it has no out parameter of an integer type, when it has an input buffer (found as for FDG9171) and its only such out parameter ends with Consumed, or when an out parameter whose name ends with Written comes before one whose name ends with Consumed. Out parameters with other names cannot be told apart and are not reported, nor are methods that write to the state of the instance, overrides and interface implementations, so coverage is partial. Span<T> and Memory<T> types need .NET Core 2.1 or later, or the System.Memory package on .NET Framework and .NET Standard 2.0 (see FDG9137). Adding or moving a parameter changes the public signature, so the fix is breaking; there is no code fix.
- id: FDG9174
  strength: DO
  text: include a Boolean parameter named “isFinalBlock,” if an `OperationStatus` method needs to treat the last input block in a special way. The parameter should be optional and have a default value of true.
  context: null
  section: 9.12.4 Partial Writes to Buffers and OperationStatus
  anchor: sec9_12_4
  body:
  - kind: paragraph
    text: 'For example, `ToBase64` needs to know whether the source buffer represents the final segment of the data so it can determine if it needs to treat an incomplete segment as `NeedsMoreData` or if it should write the padding characters. This would result in something like the following:'
  - kind: code
    text: "public static OperationStatus ToBase64(\n  ReadOnlySpan<byte> source,\n  Span<byte> destination,\n  out int bytesConsumed,\n  out int charsWritten,\n  bool isFinalBlock = true) {\n  ...\n  if (i < source.Length) {\n    if (j + 4 <= destination.Length) {\n      if (isFinalBlock) {\n        // write the padded final block\n        ...\n        return OperationStatus.Done;\n      }\n      return OperationStatus.NeedsMoreData;\n    }\n    return OperationStatus.DestinationTooSmall;\n  }\n  return OperationStatus.Done;\n}"
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9174
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Name the Boolean parameter '{0}' of '{1}' isFinalBlock, optional with a default value of true
    category: Patterns
  notes: FDG9174 reports a bool parameter of an externally visible method that returns OperationStatus when it is named isFinalBlock but is not optional with the default value true, or when a word of its name is Final or Last (ignoring case) and it is not named isFinalBlock, a parameter that marks the last input block under another name. Whether the method needs to treat the last block in a special way is not checked, so a method that needs the parameter and lacks it, or flags with other names, are not seen; overrides and interface implementations are not checked either, so coverage is partial. Span<T> and Memory<T> types need .NET Core 2.1 or later, or the System.Memory package on .NET Framework and .NET Standard 2.0 (see FDG9137). Renaming a parameter or changing its default value changes the public signature, so the fix is breaking; there is no code fix.
- id: FDG9175
  strength: CONSIDER
  text: providing a Try-Write alternative to an `OperationStatus` method.
  context: null
  section: 9.12.4 Partial Writes to Buffers and OperationStatus
  anchor: sec9_12_4
  body:
  - kind: paragraph
    text: A Try-Write method is easily implemented in terms of an `OperationStatus` method, and has an easier method signature to work with when called from higher level Try-Write methods. Your callers may appreciate the simplified signature when they are in a method that cannot itself obtain a larger destination buffer, and the `InvalidData` state is unexpected or they can’t meaningfully handle it.
  - kind: code
    text: "public bool TryEncode(\n  Span<char> destination, out int charsWritten) {\n\n  if (s_header.TryCopyTo(destination)) {\n    OperationStatus result = WriteNewlineHexadecimal(\n      _data,\n      destination.Slice(s_header.Length),\n      newlineAfter: 32,\n      out _,\n      out int written);\n\n      if (result == OperationStatus.Done) {\n        charsWritten = written + s_header.Length;\n        return true;\n      }\n\n      Debug.Assert(result == OperationStatus.DestinationTooSmall);\n  }\n  charsWritten = 0;\n  return false;\n}"
  - kind: paragraph
    text: 'If `WriteNewlineHexadecimal` had a Try-Write alternative method, the caller code could be simpler:'
  - kind: code
    text: "public bool TryEncode(\n  Span<char> destination, out int charsWritten) {\n\n  if (s_header.TryCopyTo(destination) &&\n    TryWriteNewlineHexadecimal(\n   _data,\n      destination.Slice(s_header.Length),\n   out int written)) {\n charsWritten = written + s_header.Length;\n return true;\n}\n\ncharsWritten = 0;\nreturn false;\n}"
  - kind: paragraph
    text: The `TryWriteNewlineHexadecimal` method itself is easily defined in terms of the `OperationStatus`-returning `WriteNewlineHexadecimal` method.
  - kind: code
    text: "public static TryWriteNewlineHexadecimal(\n  ReadOnlySpan<byte> source,\n  Span<char> data,\n  int newlineAfter,\n  out int charsWritten) {\n\n  OperationStatus status = WriteNewlineHexadecimal(\n    source, data, newlineAfter, out _, out int written));\n\n  switch (status) {\n    case OperationStatus.Done:\n      charsWritten = written;\n      return true;\n    case OperationStatus.DestinationTooSmall:\n      charsWritten = 0;\n      return false;\n    default:\n      // Depending on the operation, there may not be an\n      // InvalidData or NeedMoreData response.\n      throw new AppropriateException();\n    }\n}"
  - kind: paragraph
    text: You shouldn’t have a Try-Write alternative method if your `OperationStatus` method is capable of producing large results, but you can’t provide an API to estimate the output length.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: suggestion
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: the reason given is callers in higher-level Try-Write methods that want a simpler signature, and an application changes its own callers (as for FDG9021). Not machine-checkable: whether a Try-Write method is the alternative of an OperationStatus method is what they do, and the body leaves it out for large results without an API to estimate the output length (FDG9166).'
