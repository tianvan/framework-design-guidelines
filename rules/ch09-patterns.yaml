- id: FDG9119
  strength: CONSIDER
  text: making a sub-interface of a new generic interface if removing members would allow a generic type parameter to be covariant and the remaining members provide a coherent interface.
  context: null
  section: 9.8.2 Covariance
  anchor: sec9_8_2
  body:
  - kind: paragraph
    text: When an interface uses a generic type parameter for both input and output purposes, that parameter must be declared invariant. Any methods or properties that only use the generic type parameter in an output role could be moved to a sub-interface to empower your callers with the flexibility covariance provides. If the applicable methods wouldn’t make for a coherent interface—or set of interfaces—then don’t artificially split your new interface. Any get/set properties on the interface can be declared as get-only on the new sub-interface.
  - kind: paragraph
    text: Because interface members cannot be moved without a breaking change—only copied—and adding a sub-interface to an interface is also a breaking change, this should not be done for any public interface that has already been released.
  - kind: paragraph
    text: Had .NET supported covariance on generic interfaces when generics were originally introduced, `IList<T>` would almost certainly have been separated into `IReadOnlyList<out T>` and `IList<T>`.
  - kind: paragraph
    text: In this example, `IEasyCollection<T>` is split into `IEasyCollection<T>` and `IReadOnlyEasyCollection<out T>`. The `Clear()` method could have been declared on `IReadOnlyEasyCollection<T>`, but since `Clear()` doesn’t belong on a “read-only” collection, it was not moved. The `Clear()` method could be split off to a third interface, `IClearable`, but that method doesn’t seem to stand alone as an interface.
  - kind: code
    text: "// Instead of\npublic interface IEasyCollection<T> : IEnumerable<T> {\n  int Count { get; }\n  bool IsReadOnly { get; }\n  void Add(T item);\n  void Clear();\n}\n\n// Consider\npublic interface IReadOnlyEasyCollection<out T> : IEnumerable<T>{\n  int Count { get; }\n  bool IsReadOnly { get; }\n}\npublic interface IEasyCollection<T> : IReadOnlyEasyCollection<T> {\n  void Add(T item);\n  void Clear();\n}"
