  notes: 'Library only: the reason given (in the FDG9112 body, which covers both) is that changing a released delegate is a breaking change, so the variance is declared up front. The text has no body of its own. FDG9111 reports an invariant type parameter of an externally visible generic delegate that appears only in input positions of its signature, as the compiler does, with one exception: parameters passed by value, property setters and event types are input positions; return types, property getters and base interfaces are output positions; ref, out and in parameters, ref returns and, more strictly than the compiler, constraints of the type''s own type parameters are both; constraints of method type parameters are inputs; and in a generic type argument the position is kept for a covariant type parameter, flipped for a contravariant one and both for an invariant one. A type parameter that is not used at all could take either modifier and is not reported, and neither is one that a static member uses, so coverage is partial. Adding the modifier changes the declaration of a public type and can make existing conversions and overload resolutions ambiguous, so the fix is breaking; there is no code fix.'
- id: FDG9112
  strength: DO
  text: mark generic type parameters on generic interfaces as contravariant when the type parameter is only ever used as an input parameter to methods on the interface.
  context: null
  section: 9.8.1 Contravariance
  anchor: sec9_8_1
  body:
  - kind: paragraph
    text: These two guidelines really boil down to “declare contravariance when the compiler lets you do so.” In addition to the simple cases where the generic type parameter is used as a parameter type, the type parameter can be used as a generic type argument to covariant interfaces or delegates as methods inputs, or to contravariant interfaces or delegates as method return types.
  - kind: code
    text: "public interface ICalculator<in T> {\n int Sum(IEnumerable<T> inputs);\n}"
  - kind: paragraph
    text: Since changing the signature of a delegate and altering an interface are both breaking changes, declaring contravariance whenever it’s possible to do so doesn’t artificially limit future changes to the type.
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9112
    coverage: partial
