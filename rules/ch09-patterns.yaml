    text: public String(char c, int count);
  - kind: paragraph
    text: 'This operation generates a string of repeated characters. Its semantics would have been clearer if a static factory was provided instead, because the method name makes the operation self-explanatory, as in this example:'
  - kind: code
    text: public static String Repeat(char c, int count);
  - kind: annotation
    text: This is, in fact, the pattern we use for the same concept in `ArrayList`.
