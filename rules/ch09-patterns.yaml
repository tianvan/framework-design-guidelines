  - kind: paragraph
    text: For example, the `System.Linq.Enumerable.Count` method’s default implementation simply iterates over the collection. However, when the `IEnumerable<T>` implementation also implements `ICollection<T>`, the `Enumerable.Count` method returns the `ICollection<T>.Count` property value. Since most collection types that implement `ICollection<T>` offer an `O(1)` implementation of the `Count` property, this noticeably speeds up the `Enumerable.Count` method.
