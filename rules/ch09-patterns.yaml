  alternative: null
  analyzer: null
  notes: 'The text has no body; the body of FDG9146 gives the reason for both. Not machine-checkable: whether the purpose of a member is to store a reference to the buffer is intent. A ReadOnlySpan<T> can be stored only in a ref struct (a class field of a span type is CS8345 in a probe with SDK 10.0.402), whose constructor may keep it, as FDG9139 allows. Span<T> and Memory<T> types need .NET Core 2.1 or later, or the System.Memory package on .NET Framework and .NET Standard 2.0 (see FDG9137).'
- id: FDG9146
  strength: DO
  text: use `Memory<T>` in place of `Span<T>` for parameters when the purpose of the constructor or method is to save a reference to the buffer.
  context: null
  section: 9.12 Operating on Buffers
  anchor: sec9_12
  body:
  - kind: paragraph
    text: In general, synchronous methods written by the .NET BCL team either process the data in an array before returning or store a copy of the array to perform later work on the array contents. Holding a reference to the buffer avoids the memory and time performance penalties of “defensive copies,” but creates a cost in that the caller has to keep the contents of the buffer stable until the operation completes. In addition, the concept of “complete” can vary for each type or method.
  - kind: paragraph
    text: The `JsonDocument` class has a `Parse` method that maintains a reference to the input, without making a copy of the data. This improves performance, but places a responsibility on the caller to prevent data mutation. Since the parameter is a Memory type, the caller can expect that the `JsonDocument` instance will continue using the same buffer that was provided to the `Parse` method.
  - kind: code
    text: "public partial class JsonDocument {\n  // The returned JsonDocument holds a reference to the input\n  // buffer and reads the JSON without making unnecessary copies\n  public static JsonDocument Parse(\n    ReadOnlyMemory<byte> utf8Json,\n    JsonDocumentOptions options = default) { ... }\n}"
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether the purpose of a member is to save a reference to the buffer is intent. A Span<T> can be stored only in a ref struct (a class field of a span type is CS8345 in a probe with SDK 10.0.402), whose constructor may keep it, as FDG9139 allows. Span<T> and Memory<T> types need .NET Core 2.1 or later, or the System.Memory package on .NET Framework and .NET Standard 2.0 (see FDG9137).'
- id: FDG9147
  strength: AVOID
  text: overloading a method across `Span<T>` and `ReadOnlySpan<T>`, or `Memory<T>` and `ReadOnlyMemory<T>`.
  context: null
  section: 9.12 Operating on Buffers
  anchor: sec9_12
  body:
  - kind: paragraph
    text: If one method operates on a buffer in a read-only manner and another operates on it in a read-write manner, those methods should have different names to facilitate caller understanding on why the two methods behave differently.
  - kind: code
    text: 'public static int Sum(ReadOnlySpan<int> values) { ... }


      // Why does this one need a writable Span?

      // It must do something different, so it needs a different name.

      public static void Sum(Span<int> values) { … }'
  - kind: paragraph
    text: One exception to this guidance is when returning a slice of the input data, where the method returns the input data type, such as a `TrimEnd` method. As noted in earlier guidance, this overload set can be reduced to a single method if the method returns the slice indices instead of the sliced buffer.
  - kind: code
    text: 'public static ReadOnlySpan<char> TrimEnd(ReadOnlySpan<char> span) {...}

      public static Span<char> TrimEnd(Span<char> span) { ... }'
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9147
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Give '{0}', which takes '{1}', a different name from its overload that takes '{2}'
    category: Patterns
  notes: 'FDG9147 reports an externally visible method that has an externally visible overload in the same type with the same number of parameters, the same ref kinds and the same parameter types, except that at one or more positions it takes Span<T> where the overload takes ReadOnlySpan<T>, or Memory<T> where the overload takes ReadOnlyMemory<T>, with the same T (type parameters of generic methods are compared by position). The report is on the read-write method, the one the body asks why it needs a writable buffer. The exception of the body is not reported: each method returns the type of its own differing parameter, as TrimEnd does when it returns a slice of its input. Overloads inherited from a base type, constructors, overrides, interface implementations and overloads that also differ in other parameters are not compared, so coverage is partial. Span<T> and Memory<T> types need .NET Core 2.1 or later, or the System.Memory package on .NET Framework and .NET Standard 2.0 (see FDG9137). Renaming changes the public API, so the fix is breaking; there is no code fix.'
- id: FDG9148
  strength: AVOID
