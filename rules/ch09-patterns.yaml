- id: FDG9133
  strength: CONSIDER
  text: providing the default constructor if you want a type to work with XAML.
  context: null
  section: 9.11 XAML Readable Types
  anchor: sec9_11
  body:
  - kind: paragraph
    text: 'For example, consider the following XAML markup:'
  - kind: code
    text: <Person Name="John" Age="22" />
  - kind: paragraph
    text: 'It is equivalent to the following C# code:'
  - kind: code
    text: new Person() { Name = "John", Age = 22 };
  - kind: paragraph
    text: Consequently, for this code to work, the `Person` class needs to have a default constructor. Markup extensions, discussed in the next guideline in this section, are an alternative way of enabling XAML.
  - kind: annotation
    text: In my opinion, this one should really be a DO, not a CONSIDER. If you’re designing a new type to support XAML, it’s far more preferable to do it with a default constructor than with markup extensions or type converters.
    author: Chris Sells
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether a type is meant to work with XAML is intent, and a markup extension (FDG9134) is the other way the body names. The Sells annotation would make the rule a DO; the mapping follows the text''s CONSIDER.'
- id: FDG9134
  strength: DO
  text: provide markup extension if you want an immutable type to work with XAML readers.
  context: null
  section: 9.11 XAML Readable Types
  anchor: sec9_11
  body:
  - kind: paragraph
    text: 'Consider the following immutable type:'
  - kind: code
    text: "public class Person {\n  public Person(string name, int age){\n    Name = name;\n    Age = age;\n  }\n  public string Name { get; }\n  public int Age { get; }\n}"
  - kind: paragraph
    text: Properties of such a type cannot be set using XAML markup, because the reader does not know how to initialize the properties using the parameterized constructor. Markup extensions address this problem.
  - kind: code
    text: "[MarkupExtensionReturnType(typeof(Person))] public class PersonExtension : MarkupExtension {\n public string Name { get; set; }\n public int Age { get; set; }\n public override object ProvideValue(IServiceProvider\nserviceProvider){\n     return new Person(Name, Age);\n    }\n}"
  - kind: paragraph
    text: Keep in mind that immutable types cannot be written using XAML writers.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether an immutable type is meant to be read by XAML readers is intent.'
- id: FDG9135
  strength: AVOID
  text: defining new type converters unless the conversion is natural and intuitive. In general, limit type converter usage to the ones already provided by .NET.
  context: null
  section: 9.11 XAML Readable Types
  anchor: sec9_11
  body:
  - kind: paragraph
    text: Type converters are used to convert a value from a string to the appropriate type. They’re used by XAML infrastructure and in other places, such as graphical designers. For example, the string `"#FFFF0000"` in the following markup gets converted to an instance of a red `Brush` thanks to the type converter associated with the `Rectangle.Fill` property.
  - kind: code
    text: <Rectangle Fill="#FFFF0000"/>
  - kind: paragraph
    text: 'But type converters can be defined too liberally. For example, the `Brush` type converter should not support specifying gradient brushes, as shown in the following hypothetical example:'
  - kind: code
    text: <Rectangle Fill="HorizontalGradient White Red" />
  - kind: paragraph
    text: Such converters define new “minilanguages,” which add complexity to the system.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
