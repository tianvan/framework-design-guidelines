- id: FDG9130
  strength: DO
  text: prefer using `TimeSpan` to represent timeout time.
  context: null
  section: 9.10 Timeouts
  anchor: sec9_10
  body:
  - kind: paragraph
    text: 'Historically, timeouts have been represented by integers. Integer timeouts can be hard to use for the following reasons:'
  - kind: list
    text: '- It is not obvious what the unit of the timeout is.

      - It is difficult to translate units of time into the commonly used millisecond. (How many milliseconds are in 15 minutes?)'
  - kind: paragraph
    text: Often, a better approach is to use `TimeSpan` as the timeout type. `TimeSpan` solves the preceding problems.
  - kind: code
    text: "class Server {\n  void PerformOperation(TimeSpan timeout){\n  ...\n  }\n}\n\nvar server = new Server();\nserver.PerformOperation(TimeSpan.FromMinutes(15));"
  - kind: paragraph
    text: 'Integer timeouts are acceptable if:'
  - kind: list
    text: '- The parameter or property name can describe the unit of time used by the operation—for example, if a parameter can be called `milliseconds` without making an otherwise self-describing API cryptic.

      - The most commonly used value is small enough that users won’t have to use calculators to determine the value—for example, if the unit is milliseconds and the commonly used timeout is less than 1 second.'
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9130
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Represent the timeout '{0}' of '{1}' with TimeSpan rather than '{2}'
    category: Patterns
  notes: FDG9130 reports an externally visible parameter (of a method, constructor, indexer or delegate) or property whose type is an integer type (sbyte, byte, short, ushort, int, uint, long or ulong) and whose name ends with the word Timeout (timeout, ReadTimeout), unless a word of the name is a unit of time (Nanoseconds, Nanosecond, Ns, Milliseconds, Millisecond, Millis, Ms, Msec, Microseconds, Microsecond, Seconds, Second, Secs, Sec, Minutes, Minute, Mins, Hours, Hour, Days, Day, Ticks or Tick, as in millisecondsTimeout or msTimeout; names such as timeoutMs or timeoutInSeconds do not end with Timeout and are not reported in any case), the first case in which the body accepts integer timeouts. The second condition of the body, a commonly used value small enough to need no calculator, is not checked, so a timeout whose name gives its unit is never reported. Timeouts whose name does not end with Timeout, fields, and the parameters and properties of overrides and interface implementations, whose names and types come from another member, are not reported, so coverage is partial. The positional property of a record is reported once, through its primary constructor parameter at the same location. Changing the type changes the public signature, so the fix is breaking; there is no code fix.
- id: FDG9131
  strength: DO
  text: throw `System.TimeoutException` when a timeout elapses.
  context: null
  section: 9.10 Timeouts
  anchor: sec9_10
  body:
  - kind: paragraph
    text: A timeout equal to `TimeSpan(0)` means that the operation should throw if it cannot complete immediately. If the timeout equals `TimeSpan.MaxValue`, the operation should wait forever without timing out. Operations are not required to support either of these values, but they should throw an `ArgumentOutOfRangeException` if an unsupported timeout value is specified.
  - kind: paragraph
    text: If a timeout expires and the `System.TimeoutException` is thrown, the server class should cancel the underlying operation.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: when a timeout elapses is runtime behavior. The body''s ArgumentOutOfRangeException for an unsupported timeout value and the cancellation of the underlying operation are not checked either.'
