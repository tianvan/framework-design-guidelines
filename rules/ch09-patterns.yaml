  analyzer: null
  notes: 'Library only: the reason given is subtypes that hold resources, which users of the framework write by deriving from the class (System.IO.Stream). Not machine-checkable: whether subtypes are likely to hold unmanaged resources or disposable objects is a design judgment.'
- id: FDG9064
  strength: DO
  text: declare a protected virtual void `Dispose(bool disposing)` method to centralize all logic related to releasing managed and unmanaged resources.
  context: null
  section: 9.4.1 Basic Dispose Pattern
  anchor: sec9_4_1
  body:
  - kind: paragraph
    text: All resource cleanup should occur in this method. The method is called from both the finalizer and the `IDisposable.Dispose` method. The parameter will be false if being invoked from inside a finalizer or `DisposeAsync()`. It should be used to ensure that any code running during finalization is not accessing other finalizable objects. Details of implementing finalizers are described in section 9.4.2.
  - kind: code
    text: "protected virtual void Dispose(bool disposing) {\n  if (disposing) {\n    _resource?.Dispose();\n  }\n}"
  - kind: annotation
    text: The idea here is that `Dispose(bool)` knows whether it is being called to do explicit cleanup (the Boolean is true) versus being called due to a garbage collection (the Boolean is false). This distinction is useful because, when being disposed explicitly, the `Dispose(bool)` method can safely execute code using reference type fields that refer to other objects, knowing for sure that these other objects have not been finalized. When the Boolean is false, the `Dispose(Boolean`) method should not execute code that refers to reference type fields, because those objects might have already been finalized.
    author: Jeffrey Richter
  - kind: annotation
    text: Jeff’s comment might seem incorrect at first glance—that is, can’t you safely access reference type objects that aren’t finalizable? The answer is yes, if and only if you are certain that the object doesn’t rely on the finalizable state itself! This is a nontrivial thing to figure out and is subject to change from release to release. Unless you’re 100 percent certain, perhaps because you own the type in question, just avoid doing it.
    author: Joe Duffy
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
    - CA1063
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'CA1063 reports an unsealed class that implements IDisposable without an overridable Dispose(bool) ("Provide an overridable implementation of Dispose(bool) ... or mark the type as sealed") and a Dispose(bool) that is not protected, virtual and unsealed (probe with SDK 10.0.402). It honors api_surface: the library profile checks externally visible types and the application profile all types (probe). Sealed classes are not reported, as a sealed class cannot declare a virtual method (CS0549). Whether all cleanup logic is in Dispose(bool) is not seen, so coverage is partial. CA2215 (an override of Dispose(bool) that does not call the base method) checks the advice before the guidelines of section 9.4.1 to override Dispose(bool) when the base class already implements the pattern; no guideline states it, so it is not mapped. Adding Dispose(bool) or changing its accessibility or virtual modifier changes the public API, so the fix is breaking; CA1063 has no code fix. CA1063 is shared with FDG9062, FDG9065, FDG9066 and FDG9074.'
- id: FDG9065
  strength: DO
  text: implement the `IDisposable` interface by simply calling `Dispose(true)` followed by `GC.SuppressFinalize(this)`.
  context: null
  section: 9.4.1 Basic Dispose Pattern
  anchor: sec9_4_1
  body:
  - kind: paragraph
    text: The call to `SuppressFinalize` should only occur if `Dispose(true)` executes successfully.
  - kind: code
    text: "public void Dispose() {\n  Dispose(true);\n  GC.SuppressFinalize(this);\n}"
  - kind: annotation
    text: We had a fair amount of debate about the relative ordering of calls in the `Dispose()` method. We opted for the ordering where `SuppressFinalize` is called after `Dispose(bool)`. It ensures that `GC.SuppressFinalize()` only gets called if the `Dispose` operation completes successfully.
    author: Brad Abrams
  - kind: annotation
    text: 'I, too, wrestled back and forth with the order of these calls. Originally, I felt that `SuppressFinalize` should be called prior to `Dispose`. My thinking was this: If `Dispose` throws an exception then, it will throw the same exception when `Finalize` is called and there is no benefit to this, and the second exception should be prevented. However, I have since changed my mind, and I now agree with this guideline that `SuppressFinalize` should be called after `Finalize`. The reason is that `Dispose()` calls `Dispose(true)`, which might throw, but when `Finalize` is called later, `Dispose(false)` is called. This might be a different code path than before, and it would be good if this different code path executed. In addition, the different code path might not throw the exception.'
    author: Jeffrey Richter
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
    - CA1063
    - CA1816
    coverage: partial
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'CA1063 reports a Dispose() that does anything but call Dispose(true) and then GC.SuppressFinalize(this), the reversed order and an expression-bodied Dispose() => Dispose(true) included, but not a block-bodied Dispose() whose only statement is Dispose(true), which only CA1816 reports, and only on externally visible unsealed types, so in the application profile an internal type that omits GC.SuppressFinalize this way is reported by neither (probe with SDK 10.0.402); CA1063 reports on externally visible types in the library profile and on all types in the application profile; CA1816 reports a Dispose() that does not call GC.SuppressFinalize on an externally visible unsealed type, and did not report an internal type even with api_surface all (probe with SDK 10.0.402). A sealed class whose Dispose() calls no Dispose(bool) is reported by neither (probe), so coverage is partial. Both also report the pattern that FDG9072 recommends: CA1063 asks to make the explicit IDisposable.Dispose that calls Close public, and CA1816 reports the Close method that calls GC.SuppressFinalize (probe); such reports are not violations. CA1816 also reports a DisposeAsync that does not call GC.SuppressFinalize, which is FDG9082''s. Changing the body changes no signature, so autofix is no; neither diagnostic has a code fix.'
- id: FDG9066
  strength: DO NOT
  text: make the parameterless `Dispose` method virtual.
  context: null
  section: 9.4.1 Basic Dispose Pattern
  anchor: sec9_4_1
  body:
  - kind: paragraph
    text: The `Dispose(bool)` method is the one that should be overridden by subclasses.
  - kind: code
    text: "// bad design\npublic class DisposableResourceHolder : IDisposable {\n  public virtual void Dispose() { ... }\n  protected virtual void Dispose(bool disposing) { ... }\n}\n\n// good design\npublic class DisposableResourceHolder : IDisposable {\n  public void Dispose() { ... }\n  protected virtual void Dispose(bool disposing) { ... }\n}"
  - kind: annotation
    text: If you look hard enough, there are still places in the framework where we don’t follow this pattern. By the time we finalized the `Dispose` pattern, quite a bit of the framework had already been written. Although we scrubbed everything to the best of our ability, a few things still slipped through the cracks.
    author: Brian Pepin
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
    - CA1063
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA1063 reports a virtual Dispose() ("Ensure that ... is declared as public and sealed") on externally visible types in the library profile and on all types in the application profile (probe with SDK 10.0.402), so in the library profile an internal unsealed type is not checked and coverage is partial. It reports an explicit IDisposable.Dispose with the same message, which is not virtual; FDG9072 recommends that form together with Close, so such a report is not a violation. Removing the virtual modifier breaks overrides in derived types and changes the public signature, so the fix is breaking; CA1063 has no code fix.
- id: FDG9067
  strength: DO NOT
  text: declare any overloads of the `Dispose` method other than `Dispose()` and `Dispose(bool)`.
  context: null
  section: 9.4.1 Basic Dispose Pattern
  anchor: sec9_4_1
  body:
  - kind: paragraph
    text: '`Dispose` should be considered a reserved word to help codify this pattern and prevent confusion among implementers, users, and compilers. Some languages might choose to automatically implement this pattern on certain types.'
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9067
    coverage: full
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
