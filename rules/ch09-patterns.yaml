- id: FDG9144
  strength: DO
  text: use `Memory<T>` in place of `Span<T>` in asynchronous methods.
  context: null
  section: 9.12 Operating on Buffers
  anchor: sec9_12
  body:
  - kind: paragraph
    text: Asynchronous methods largely represent the idea of “doing work later.” Since the Span types can’t generally be stored as part of the state of pending work, the appropriate Memory type should be used instead.
  - kind: code
    text: "public partial class Stream {\n  public virtual int Read(Span<byte> buffer) { ... }\n\n  public virtual ValueTask<int> ReadAsync(\n    Memory<byte> buffer,\n    CancellationToken cancellationToken = default) { ... }\n\n  public virtual int Write(ReadOnlySpan<byte> buffer) { ... }\n\n  public virtual ValueTask<int> WriteAsync(\n    ReadOnlyMemory<byte> buffer,\n    CancellationToken cancellationToken = default) { ... }\n}"
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9144
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Use Memory<{0}> instead of Span<{0}> for the parameter '{1}' of the asynchronous method '{2}'
    category: Patterns
  notes: FDG9144 reports a Span<T> parameter of a method, of any accessibility, that returns a task-like type (as for FDG9020) or IAsyncEnumerable<T>. An async method cannot declare such a parameter (CS4012 in a probe with SDK 10.0.402), so the reports are on methods that return a task without the async keyword. Overrides and interface implementations are not reported, since their parameter types come from another member, and local functions, lambdas and delegate types are not checked, so coverage is partial. Span<T> and Memory<T> types need .NET Core 2.1 or later, or the System.Memory package on .NET Framework and .NET Standard 2.0 (see FDG9137). Changing the parameter type changes the public signature, so the fix is breaking; there is no code fix.
- id: FDG9145
  strength: DO
  text: use `ReadOnlyMemory<T>` in place of `ReadOnlySpan<T>` for parameters when the purpose of the constructor or method is to store a reference to the buffer.
  context: null
  section: 9.12 Operating on Buffers
  anchor: sec9_12
  body: []
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
