- id: FDG9137
  strength: CONSIDER
  text: using Spans as a representation of buffers.
  context: null
  section: 9.12 Operating on Buffers
  anchor: sec9_12
  body:
  - kind: paragraph
    text: 'Methods that accept a `Span<T>`, or `ReadOnlySpan<T>`, can operate on a larger range of inputs than methods that accept an array: arrays, `stackalloc` data, pointer-based data, and (for `ReadOnlySpan<char>`) strings.'
  - kind: paragraph
    text: Because the callers can slice the buffer themselves, Span-based methods do not need overloads that accept an offset and a count. As a result, they are simpler, and are spared from the rote argument validation associated with those parameters.
  - kind: code
    text: "public partial class BulkQueue<T> {\n  // A simple, array-returning method\n  public T[] DequeueMultiple(int limit) { ... }\n\n  // An overload that lets the caller reuse an array\n  public int DequeueMultiple(T[] destination) {\n    if (destination == null) {\n      throw new ArgumentNullException(nameof(destination));\n    }\n    return DequeueMultiple(destination.AsSpan());\n  }\n\n  // An overload that lets the caller use part of an array\n  public int DequeueMultiple(\n    T[] destination, int offset, int count) {\n\n    if (destination == null) {\n      throw new ArgumentNullException(nameof(destination));\n    }\n    // Defer the offset/count validation to AsSpan because the\n    // parameter names match.\n    return DequeueMultiple(destination.AsSpan(offset, count));\n  }\n\n  // The Span-based overload.\n  // The signature is simpler than (T[],int,int),\n  // but with the same functionality.\n  // This method also allows the destination to be stackalloc or\n  // pointer-based data (if those options are open to the type T).\n  public int DequeueMultiple(Span<T> destination) {\n    int count = Count;\n    int length = destination.Length;\n    if (length < count) {\n      _pending.AsSpan(_offset, count).CopyTo(destination);\n      Count = 0;\n      return count;\n    }\n    _pending.AsSpan(_offset, length).CopyTo(destination);\n    Count -= destination.Length;\n    _offset += destination.Length;\n    return destination.Length;\n  }\n}"
  - kind: paragraph
    text: If you have an existing type that already has array- or string-accepting methods, it generally makes sense to provide the Span- or Memory-based alternative as an overload on the same type, particularly for instance methods. For static methods, it may be more appropriate to have the array- or string-accepting methods on a high-level type, and to create a new low-level type for working with Span or Memory (section 2.2.4).
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: which parameters are buffers is what they mean; a string or array parameter can also be a name, a path or a list. CA1831, CA1832, CA1833, CA1845 and CA1846 are not mapped: they ask callers to use AsSpan, AsMemory or a span-based overload instead of a range indexer, Substring or string.Concat, which is usage at the call site, not the design of a buffer parameter that the body describes. Span<T>, ReadOnlySpan<T>, Memory<T> and ReadOnlyMemory<T> need .NET Core 2.1 or later, or the System.Memory package on .NET Framework and .NET Standard 2.0. No C# version beyond what the types need is required: a probe with SDK 10.0.402 compiled Span<T> and ReadOnlySpan<T> parameters and locals under LangVersion 7.0, so minLanguage is null for the rules of section 9.12.'
- id: FDG9138
  strength: DO
  text: use `ReadOnlySpan<T>` instead of `Span<T>` where possible.
  context: null
  section: 9.12 Operating on Buffers
  anchor: sec9_12
  body:
  - kind: paragraph
    text: The `System.ReadOnlySpan<T>` type does not support value mutation. When a method accepts a `ReadOnlySpan<T>` instead of a `Span<T>`, it provides a signal to the caller that the called method will not be replacing the contents of the span. Accepting a `ReadOnlySpan<T>` when possible also allows more callers to the method, because all `Span<T>` values can be freely converted to `ReadOnlySpan<T>`, but `ReadOnlySpan<T>` values cannot be converted back to `Span<T>`.
  - kind: paragraph
    text: '`String` values logically represent an immutable `char[]`, and can be converted to `ReadOnlySpan<char>`, but not `Span<char>`.'
  - kind: code
    text: "public static long Sum(ReadOnlySpan<int> values) {\n    long sum = 0;\n    for (int i = 0; i < values.Length; i++) {\n        sum += values[i];\n    }\n    return sum;\n}\n\n// Good: An array overload, either an existing method\n// or one added concurrently\npublic static long Sum(int[] values) {\n    if (values == null) {\n        throw new ArgumentNullException(nameof(values));\n    }\n    return Sum(values.AsSpan());\n}\n\n// Bad: This method suggests it writes to the parameter, but it only\n// reads. Writable spans are freely convertible to ReadOnlySpan.\npublic static long Sum(Span<int> values) {\n    return Sum((ReadOnlySpan<int>)values);\n}"
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9138
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Declare the parameter '{0}' of '{1}' as ReadOnlySpan<{2}>; the method only reads it
    category: Patterns
  notes: 'FDG9138 reports a Span<T> parameter passed by value to an externally visible method or constructor with a body when the body only reads it: every use is its Length or IsEmpty, an element read through the indexer, a conversion to ReadOnlySpan<T> (passing it to a ReadOnlySpan<T> parameter included), CopyTo, TryCopyTo, ToArray or ToString called on it, a read-only MemoryExtensions method called on it (Contains, IndexOf, LastIndexOf, IndexOfAny, LastIndexOfAny, SequenceEqual, SequenceCompareTo, StartsWith, EndsWith or BinarySearch), a foreach without ref, or nameof; a parameter that is not used at all is reported too. Any other use counts as a possible write and the parameter is not reported: assigning or incrementing an element or assigning the parameter, passing it as Span<T>, passing an element by reference or binding it to a ref local, an element as the target of a deconstruction assignment (a tuple swap), Slice, a range, and a member access on an element when T is not a reference type. So coverage is partial. Virtual, abstract and extern methods, overrides and interface implementations are not reported, since their parameter types are a contract for other implementations. A method whose body only throws (an expression body => throw, or a block whose only statement is a throw) is not reported: ReadOnlySpan<T> is not possible, as the text puts it, for a stub such as a PlatformNotSupportedException method that keeps the Span<T> signature of the implementation on other targets; this also hides throw-only methods that could take ReadOnlySpan<T>. The book''s Sum(Span<int> values) is reported. Span<T> and Memory<T> types need .NET Core 2.1 or later, or the System.Memory package on .NET Framework and .NET Standard 2.0 (see FDG9137). Changing the parameter type changes the public signature, so the fix is breaking; there is no code fix.'
- id: FDG9139
  strength: AVOID
  text: returning a `Span<T>` or `ReadOnlySpan<T>` unless the lifetime of the returned Span is very clear.
  context: null
  section: 9.12 Operating on Buffers
  anchor: sec9_12
  body:
  - kind: paragraph
    text: Because Span types can represent unmanaged memory, it is hard for a caller to understand the lifetime associated with the returned Span. Even with managed memory, it is entirely possible that the Span represents part of an array that can get repurposed for some other operation.
  - kind: paragraph
    text: When the Span was given to you by your caller, it is acceptable to return a slice of it. Usually that means the Span is a parameter on the method that returns it, but for a `ref`-like value type (`ref struct`) the Span could also come from constructor parameter.
  - kind: code
    text: "public static ReadOnlySpan<char> TrimEnd(ReadOnlySpan<char> span) {\n  int index = span.Length - 1;\n  while (index >= 0 && char.IsWhitespace(span[index]) {\n    index--;\n  }\n  return span.Slice(0, index + 1);\n}"
  - kind: paragraph
    text: If the Span is representing stack memory, it should never be returned, as that memory will likely get overwritten during the next method invocation. Also, if the Span is describing unmanaged memory, then it now has no clear owner and would seem to be a memory leak.
  - kind: annotation
    text: The C# compiler has flow analysis to try to prevent `stackalloc` values from being returned. The analysis isn’t perfect, though, so you should still be careful when returning a Span from a method that uses `stackalloc`.
    author: Jeremy Barton
  - kind: paragraph
    text: You should avoid returning a Span that represents a slice of a buffer that you have as a field in your type, except when that buffer was the argument to a constructor parameter. This is especially true if your type grows the buffer as needed, because any Span you returned will continue pointing to the previous buffer after you have moved to a new, larger one. As a result, your callers may potentially depend on observing changes in a Span you returned to them, only to have it fail sporadically based on your growth strategy, which can lead to hard-to-diagnose bugs for those callers. Stated more generally, returning a Span makes it easy for callers to depend on your internal implementation details, which can rapidly limit your ability to evolve your type.
  - kind: annotation
    text: I’d encourage you to think of returning a Span pointing to one of your fields as the same as returning the field. They both over-expose your implementation. Returning a writable Span, like exposing a writable field, can let your caller corrupt your data or state.
    author: Jeremy Barton
  - kind: paragraph
    text: The most common alternative to returning a Span is to accept a destination `Span<T>` as a parameter, and copy from your buffer to your caller’s.
  - kind: code
    text: "partial class SpanifiedQueue<T> {\n  // Bad: Returning a ReadOnlySpan over-exposes details\n  public ReadOnlySpan<T> DequeueMany(int count) {\n    ...\n    int start = _offset;\n    _offset += count;\n    return _buffer.AsSpan(start, count);\n  }\n\n  // Good: The data moves without exposing the implementation\n  public int DequeueMany(Span<T> destination) {\n    int count = Math.Min(destination.Length, Count);\n    _buffer.AsSpan(_offset, count).CopyTo(destination);\n    _offset += count;\n    return count;\n  }\n}"
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: a returned slice of a field can be found, but the text allows a Span that came from a constructor parameter, fixed data (FDG9141) and, with very clear ownership documentation (FDG9140), a Span that did not come from the caller, so whether the lifetime is very clear is judgment. The C# compiler rejects returning a stackalloc Span from the method that allocates it (CS8352 in a probe with SDK 10.0.402), the flow analysis the annotation mentions.'
- id: FDG9140
  strength: DO
  text: provide very clear documentation for the ownership rules on a Span that you return that did not come from the caller.
  context: null
  section: 9.12 Operating on Buffers
  anchor: sec9_12
  body:
  - kind: paragraph
    text: When you return a Span representing a buffer that your caller isn’t already responsible for, you need to provide *very* clear documentation for what you expect the caller to do with it. This documentation needs to state when the value must no longer be used and what, if any, follow-up action is required on the caller’s part.
  - kind: paragraph
    text: Since reading and understanding the documentation is required to properly use such a method, it is no longer part of a self-documenting framework.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether documentation states the ownership rules very clearly is judgment.'
- id: FDG9141
  strength: CONSIDER
  text: returning a `ReadOnlySpan<T>` from a get-only property or parameter-less method to represent fixed data, when `T` is an immutable type.
  context: null
  section: 9.12 Operating on Buffers
  anchor: sec9_12
  body:
  - kind: paragraph
    text: File format headers, command text, and other fixed-value sequences that you would consider exposing as a const or a static read-only field if they were a single value can safely be exposed as `ReadOnlySpan<T>` members.
  - kind: code
    text: "public static partial class ZipHeaders\n{\n  public static ReadOnlySpan<byte> LocalFile =>\n    new byte[] { 0x50, 0x4b, 0x03, 0x04 };\n  public static ReadOnlySpan<byte> DataDescriptor =>\n    new byte[] { 0x50, 0x4b, 0x07, 0x08 };\n  ...\n}"
  - kind: annotation
    text: 'While `ZipHeaders.LocalFile` may look like it creates a new array each time it’s invoked, the C# compiler has special support for methods—including property getters—that return a `ReadOnlySpan<byte>` and the method’s entire body consists only of returning a new array initialized with literals (this optimization also applies for the other single-byte literal types: `sbyte` and `bool`). For Spans of any other type, you’ll have to manually make a `private static readonly T[]` field and have the property return the array as a `ReadOnlySpan<T>`.'
    author: Jeremy Barton
  - kind: paragraph
    text: Usually you would expose these values as static properties. You may find virtual instance properties appropriate when each type in your hierarchy uses different values, but two instances of the same type don’t vary. This pattern is used for the `Preamble` property on `System.Text.Encoding`.
  - kind: code
    text: "public partial class Encoding {\n  public virtual byte[] GetPreamble() { ... }\n\n  // On any Encoding instance the sequence of bytes in the Preamble\n  // value is always the same.\n  public virtual ReadOnlySpan<byte> Preamble => GetPreamble();\n}\n\npublic sealed partial class SomeEncoding {\n  private static readonly byte[] s_preamble = { 0x05, 0xA0 };\n\n  // This encoding type optimizes the Preamble property to always\n  // use the same array.\n  public override ReadOnlySpan<byte> Preamble =>\n    _usePreamble ? s_preamble : default;\n\n  // GetPreamble() still needs to return a defensive copy.\n  public override byte[] GetPreamble() => Preamble.ToArray();\n}\n\npublic static partial class ZipHeaders\n{\n  public static ReadOnlySpan<byte> LocalFile { get; } =\n    new byte[] { 0x50, 0x4b, 0x03, 0x04 };\n  public static ReadOnlySpan<byte> DataDescriptor { get; } =\n    new byte[] { 0x50, 0x4b, 0x07, 0x08 };\n  ...\n}"
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether data is fixed and T immutable is what they mean. The annotation describes a compiler optimization for a ReadOnlySpan<byte>, ReadOnlySpan<sbyte> or ReadOnlySpan<bool> member that returns a new array of constants; no diagnostic is about it. Span<T> and Memory<T> types need .NET Core 2.1 or later, or the System.Memory package on .NET Framework and .NET Standard 2.0 (see FDG9137).'
- id: FDG9142
  strength: CONSIDER
  text: returning `System.Range` representing the bounds of a Span parameter, rather than a slice of the parameter.
  context: null
  section: 9.12 Operating on Buffers
  anchor: sec9_12
  body:
  - kind: paragraph
    text: You can convert a `Span<T>` value to a `ReadOnlySpan<T>` when you need to, but you can’t convert a `ReadOnlySpan<T>` back to a `Span<T>`. So, if you call a method that accepts a `ReadOnlySpan<T>` and returns a slice of the parameter, you can’t easily determine the equivalent slice of your writable Span.
  - kind: code
    text: "// Unless you make overloads, callers trimming a writable Span\n// now have a read-only slice when they may want a writable slice.\npublic static ReadOnlySpan<char> Trim(ReadOnlySpan<char> span) {\n  int end  = span.Length - 1;\n  while (end >= 0 && char.IsWhiteSpace(span[end])) {\n    index--;\n  }\n  int start = 0;\n  while (start < end && char.IsWhiteSpace(span[start])) {\n    start++;\n  }\n  return span.Slice(start, end – start + 1);\n}\n\nSpan<char> span = ...;\nReadOnlySpan<char> readOnlyTrimmed = Trim(span);\nSpan<char> writableTrimmed = ???;"
  - kind: paragraph
    text: If you return a `Range` instead of a slice, your callers can do the slicing themselves and easily maintain the appropriate slice of their writable Span.
  - kind: code
    text: "public static Range TrimEnd(ReadOnlySpan<char> span) {\n  int index = span.Length - 1;\n  while (index >= 0 && char.IsWhiteSpace(span[index])) {\n    index--;\n  }\n\n  int start = 0;\n  while (start < end && char.IsWhiteSpace(span[start])) {\n    start++;\n  }\n  return new Range(start, end - start + 1);\n}\n\nSpan<char> span = ...;\nRange trimRange = Trim(span);\nSpan<char> writableTrimmed = span[trimRange];"
  - kind: paragraph
    text: You could solve the problem by providing an overload like `public static Span<char> Trim(Span<char> span)`, but then you should also create overloads for `ReadOnlyMemory<char>` and `Memory<char>`. By returning the `Range` you need to have only one method that works for all of these types, as well as any other types that have a `Range`-based indexer and can be converted to a `ReadOnlySpan<char>`.
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9142
    coverage: partial
  autofix: breaking
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Consider returning a Range for the bounds of the parameter '{0}' of '{1}' rather than a slice of it
    category: Patterns
  notes: FDG9142 reports an externally visible method that returns ReadOnlySpan<T> or Span<T> and has a parameter of the same type when every return statement returns that parameter, sliced with Slice or a range indexer or whole, and at least one of them slices it, as the Trim example of the body does; the TrimEnd examples of FDG9139 and FDG9147, which the text uses to state other rules, are reported too. A slice made another way (a conditional, a new span over the parameter, a call that returns part of it), Memory parameters, overrides and interface implementations are not reported, so coverage is partial. System.Range needs .NET Core 3.0 or later (.NET Standard 2.1) and is not in the System.Memory package, so nothing is reported when the compilation has no System.Range type; callers index with a Range from C# 8.0 and use Range.GetOffsetAndLength before it. Changing the return type changes the public signature, so the fix is breaking; there is no code fix.
