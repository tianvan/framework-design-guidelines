- id: FDG9090
  strength: DO
  text: return created instances as method return values, not as `out` parameters.
  context: null
  section: 9.5 Factories
  anchor: sec9_5
  body:
  - kind: annotation
    text: Methods implementing the Try-Parse Pattern (see section 7.5.2) are factory methods that return created instances through `out` parameters. This is unfortunate, but using the return value for the Boolean is the best way to implement the pattern. This is an example showing that sometimes even **DO** and **DO NOT** guidelines need to be broken.
    author: Krzysztof Cwalina
  - kind: annotation
    text: 'The guidelines generally avoid conflict, and when they do there’s usually an ordering that makes sense. For this guideline and the Try Pattern (section 7.5.2) it looks like this: (1) Design your factory method that returns the created instance (this guideline); (2) CONSIDER the Try Pattern …; (3) observe DO create an exception-throwing member … (which means leave this method as is); and (4) DO return the value from a Try method via an `out` parameter (applies specifically to the Try method and overrides this general factory guideline). In the end, you’re left with our general Try-Parse:


      ```

      public SomeType Parse(string s) { ... }

      public bool TryParse(string s, out SomeType value) { ... }

      ```'
    author: Jeremy Barton
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
