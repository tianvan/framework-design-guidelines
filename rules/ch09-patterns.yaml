  analyzer:
    message: Remove the Dispose overload '{0}'; declare only Dispose() and Dispose(bool)
    category: Patterns
  notes: 'FDG9067 reports a method named Dispose, of any accessibility, static and extension methods included, that has parameters other than none or a single bool passed by value, or is generic; a static Dispose() or Dispose(bool) has an allowed signature and is not reported. Local functions are not checked. An extern method (a P/Invoke declaration such as Dispose(IntPtr)) is reported too: DllImport''s EntryPoint lets it take another name. Overrides and interface implementations take their signature from the member they override or implement, which is reported where it is declared in source, so they are not reported. CA1063 did not report a Dispose(int) or Dispose(string, bool) overload (probe with SDK 10.0.402). Removing or renaming a public method changes the public API, so the fix is breaking; there is no code fix.'
