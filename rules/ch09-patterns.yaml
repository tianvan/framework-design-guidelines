  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Mark the type parameter '{0}' of the interface '{1}' as contravariant (in); it is only used as input
    category: Patterns
  notes: 'Library only: the reason given is that altering a released interface is a breaking change, so the variance is declared up front. FDG9112 reports an invariant type parameter of an externally visible generic interface that appears only in input positions of its members and base interfaces, as the compiler does, with one exception: parameters passed by value, property setters and event types are input positions; return types, property getters and base interfaces are output positions; ref, out and in parameters, ref returns and, more strictly than the compiler, constraints of the type''s own type parameters are both; constraints of method type parameters are inputs; and in a generic type argument the position is kept for a covariant type parameter, flipped for a contravariant one and both for an invariant one; the body asks to declare contravariance whenever the compiler allows it. An interface that declares a class, struct or enum, directly or in a nested interface, cannot have variant type parameters (CS8427) and is not reported. The members of nested interfaces and delegates, which can use the outer type parameters and which the compiler checks (CS1961), count with the same positions. A type parameter that is not used at all could take either modifier and is not reported, and neither is one that a static member uses, so coverage is partial. Adding the modifier changes the declaration of a public type and can make existing conversions and overload resolutions ambiguous, so the fix is breaking; there is no code fix.'
- id: FDG9113
  strength: DO NOT
  text: change generic type parameters from contravariant to invariant in newer versions of your library.
