- id: FDG9071
  strength: AVOID
  text: allowing an object to regain meaningful state after a call to `Dispose()`.
  context: null
  section: 9.4.1 Basic Dispose Pattern
  anchor: sec9_4_1
  body:
  - kind: paragraph
    text: Object “rehydration” often creates hard-to-diagnose performance problems, and is an easy bug to create when the important-to-dispose portion of an object is created lazily. When an object is disposed, it should generally stay disposed. However, if the type has a method that clearly conveys new resources are being acquired, such as “Open,” it may make sense to allow the object to stop throwing `ObjectDisposedException` and resume functioning.
  - kind: code
    text: "public partial class ImplicitRehydration : IDisposable {\n  private SafeHandle _resource;\n  private string _resourceId;\n\n  public ImplicitRehydration(string resourceId) {\n    _resourceId = resourceId;\n  }\n\n  public int Size {\n    get {\n      // Because Dispose sets _resource back to null,\n      // and no other disposed state is tracked,\n      // reading this property accidentally reopens the resource\n      return GetSize(EnsureResource());\n    }\n  }\n\n  private SafeHandle EnsureResource() {\n    if (_resource == null) {\n      _resource = ...;\n    }\n    return _resource;\n  }\n\n  protected virtual void Dispose(bool disposing) {\n    if (disposing) {\n      _resource?.Dispose();\n      _resource = null;\n    }\n  }\n}"
  - kind: paragraph
    text: Rehydration is particularly problematic on unsealed types, because a derived type may have had a finalizer that is now suppressed. When rehydrating a finalizable object, be sure to call `GC.ReRegisterForFinalize(this)`, so as to undo the `GC.SuppressFinalize(this)` from `Dispose()`.
  - kind: code
    text: "public partial class ExplicitRehydration : IDisposable {\n  private IntPtr _resource;\n\n  ~ExplicitRehydration() {\n    Dispose(false);\n  }\n\n  public ExplicitRehydration(...) {\n    _resource = ...;\n  }\n\n  public int Size {\n    get {\n      if (_resource == IntPtr.Zero) {\n        throw new ObjectDisposedException(...);\n      }\n      return GetSize(_resource);\n    }\n  }\n\n  public void Open(...) {\n    ...\n    GC.ReRegisterForFinalize(this);\n  }\n}"
  - kind: annotation
    text: Object rehydration on an unsealed type is really something that you have to design for, following the extensibility principles from Chapter 6. Your `Dispose` method cleared the finalization-required marker of the derived type needed. If you rehydrate, how does the derived type know? Without some sort of event, the derived type can easily be in a corrupt state. The easiest fix? Don’t have your public types be rehydratable. Internal types have free rein, though.
    author: Jeremy Barton
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether a member recreates disposed state, as the lazily created resource of the ImplicitRehydration example does, depends on the state model of the type; a method that clearly acquires new resources, such as Open, may revive the object.'
- id: FDG9072
  strength: CONSIDER
  text: providing a `Close()` method, in addition to the `Dispose()` method, if “close” is standard terminology in the area.
  context: null
  section: 9.4.1 Basic Dispose Pattern
  anchor: sec9_4_1
  body:
  - kind: paragraph
    text: When doing so, it is important that you make the `Close` implementation identical to `Dispose` and consider implementing the `IDisposable.Dispose` method explicitly. See section 5.1.2, on implementing interfaces explicitly.
  - kind: code
    text: "public class Stream : IDisposable {\n  IDisposable.Dispose() {\n    Close();\n  }\n\n  public void Close() {\n    Dispose(true);\n    GC.SuppressFinalize(this);\n  }\n}"
  - kind: annotation
    text: Implementing `Close` and `Dispose` so that they’re semantically equivalent helps avoid a lot of confusion. More than once, I’ve had developers tell me that you shouldn’t instantiate a `SqlConnection` in a `using` statement because the resultant code will call `Dispose` but not `Close`. In reality, it’s fine to combine `using` and `SqlConnection` because `SqlConnection.Dispose` calls `SqlConnection.Close`.
    author: Jeff Prosise
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether close is standard terminology in the area is a judgment. CA1063 reports the explicit IDisposable.Dispose of the example ("Rename ... to ''Dispose'' and ensure that it is declared as public and sealed"), and CA1816 reports its Close method because it calls GC.SuppressFinalize (probe with SDK 10.0.402); for a type that follows this rule those reports are not violations (FDG9062, FDG9065, FDG9066).'
- id: FDG9073
  strength: DO NOT
  text: make public types finalizable.
  context: null
  section: 9.4.2 Finalizable Types
  anchor: sec9_4_2
  body:
  - kind: paragraph
    text: Public types that hold finalizable resources should instead make an internal, or private nested, type to be a finalizable resource holder. Prefer using existing resource wrappers, such as `SafeHandle`, to encapsulate unmanaged resources where possible.
  - kind: code
    text: "// wrong\npublic partial class NetworkCard : IDisposable {\n  private IntPtr _deviceHandle;\n\n  ~NetworkCard() {\n    Dispose(false);\n  }\n\n  public bool Dispose() => Dispose(true);\n\n  protected bool Dispose(bool disposing) {\n    if (_deviceHandle != IntPtr.Zero) {\n      Interop.CloseHandle(_deviceHandle);\n      _deviceHandle = IntPtr.Zero;\n    }\n  }\n}\n\n// right\npublic partial class NetworkCard : IDisposable {\n  private SafeDeviceHandle _deviceHandle;\n\n  public bool Dispose() => Dispose(true);\n  protected bool Dispose(bool disposing) {\n    if (disposing) {\n      _deviceHandle?.Dispose();\n    }\n  }\n}\ninternal sealed class SafeDeviceHandle :\n  SaveHandleZeroOrMinusOneIsInvalid {\n\n  internal SafeDeviceHandle()\n    : base(ownsHandle: true)\n  {\n  }\n  protected override bool ReleaseHandle() {\n    return Interop.CloseHandle(_handle);\n  }\n}"
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9073
    coverage: partial
  autofix: 'no'
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Move the finalizer of the public type '{0}' to an internal or private nested resource holder
    category: Patterns
  notes: 'Library only: the text is about public types, and moves the finalizer to an internal or private nested type. FDG9073 reports a finalizer declared in an externally visible class. A public type that inherits a finalizer, such as a public subclass of SafeHandle, is not reported, so coverage is partial. Removing an override of Finalize changes no public signature, so autofix is no; there is no code fix. On a type that already shipped with a finalizer, FDG9077 asks to keep it. CA2216 (disposable types should declare a finalizer) asks for the opposite and is not mapped.'
- id: FDG9074
  strength: DO
  text: implement the Basic Dispose Pattern on every finalizable type. See section 9.4.1 for details on the basic pattern.
  context: null
  section: 9.4.2 Finalizable Types
  anchor: sec9_4_2
  body:
  - kind: paragraph
    text: This gives users of the type a means to explicitly perform deterministic cleanup of those same resources for which the finalizer is responsible.
  - kind: paragraph
    text: Consistent use of the Basic Dispose Pattern for internal finalizable types allows new developers of your library to transfer their skills between projects, and to better interact with the few public finalizable types in .NET.
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9074
    - CA1063
    coverage: partial
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Implement the Basic Dispose Pattern on the finalizable type '{0}'
    category: Patterns
  notes: FDG9074 reports a finalizer declared in a class, of any accessibility, that does not implement IDisposable. CA1063 reports a finalizable class that implements IDisposable but whose finalizer does not call Dispose(false), and the other departures from the pattern listed for FDG9062; it honors api_surface, so the library profile checks externally visible types only (probe with SDK 10.0.402). The other parts of the pattern are FDG9064 to FDG9066. Implementing IDisposable adds to the public API without changing a signature, so autofix is no; there is no code fix.
- id: FDG9075
  strength: DO NOT
  text: access any finalizable objects in the finalizer code path, because there is significant risk that they will have already been finalized.
  context: null
  section: 9.4.2 Finalizable Types
  anchor: sec9_4_2
  body:
  - kind: paragraph
    text: For example, a finalizable object A that has a reference to another finalizable object B cannot reliably use B in A’s finalizer, or vice versa. Finalizers are called in a random order (short of a weak ordering guarantee for critical finalization).
  - kind: paragraph
    text: Also, be aware that objects stored in static variables will get collected at certain points during an application domain unload or while exiting the process. Accessing a static variable that refers to a finalizable object (or calling a static method that might use values stored in static variables) might not be safe if `Environment.HasShutdownStarted` returns true.
  - kind: annotation
    text: Finalization of all objects during shutdown was a source of intractable reliability issues in .NET Framework. The forceful finalization of all objects during process exit was removed in .NET Core. `AppDomain.ProcessExit` event can still be used to perform explicit cleanup during shutdown.
    author: Jan Kotas
  - kind: annotation
    text: Note that it is OK to touch unboxed value type fields.
    author: Jeffrey Richter
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether an object is finalizable depends on its runtime type (a Stream field can hold a finalizable FileStream), and the finalizer code path includes the part of Dispose(bool) that runs when disposing is false, which depends on the argument. Unboxed value type fields may be used (Richter annotation).'
- id: FDG9076
  strength: DO NOT
  text: let exceptions escape from the finalizer logic, except for system-critical failures.
  context: null
  section: 9.4.2 Finalizable Types
  anchor: sec9_4_2
  body:
  - kind: paragraph
    text: If an exception is thrown from a finalizer, the CLR will shut down the entire process, preventing other finalizers from executing and resources from being released in a controlled manner.
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
    - CA1065
    coverage: partial
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA1065 reports an exception created directly in a finalizer, in a type of any accessibility (probe with SDK 10.0.402). Exceptions from methods that the finalizer calls, such as Dispose(false), are not seen, and neither is the finalizer code path inside Dispose(bool), so coverage is partial; the system-critical failures the text excepts cannot be told apart. CA1821 reports a finalizer whose only statement is a throw as empty (probe); it is not mapped. CA1065 is shared with FDG9069 and the chapter 5 and 8 rules listed there. Not throwing changes no signature; CA1065 has no code fix.
- id: FDG9077
  strength: DO NOT
  text: remove a finalizer from an unsealed public type once it has one.
  context: null
  section: 9.4.2 Finalizable Types
  anchor: sec9_4_2
  body:
  - kind: paragraph
    text: Guidance from previous editions of this book suggested not redefining the finalizer when a base type was known to already implement the finalizer via the Basic Dispose Pattern. Removing the finalizer once a type has taken that dependency causes the finalizer to not run on that type, which can lead to difficult-to-diagnose resource leaks.
  - kind: paragraph
    text: Since sealed types cannot have inheritors, removing a finalizer can’t have such drastic consequences. For internal types, you are empowered to check on any derived types and move the finalizer as appropriate.
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: the text is about unsealed public types, whose derived types in other assemblies depend on the finalizer; sealed and internal types are excepted. Not machine-checkable: it needs the previous version of the type.'
- id: FDG9078
  strength: CONSIDER
  text: returning a disposable value instead of making callers manually pair “begin” and “end” methods.
  context: null
  section: 9.4.3 Scoped Operations
  anchor: sec9_4_3
  body:
  - kind: paragraph
    text: The `IndentedTextWriter` class permits increasing and decreasing the indentation level by setting a property. A very common pattern is to increase indentation, do some work, and then restore the indentation.
  - kind: code
    text: "public void WriteMethod(\n  MethodData method,\n  IndentedTextWriter writer) {\n\n  WriteMethodDeclaration(method, writer);\n  if (!method.IsAbstract) {\n    writer.Indent += 4;\n    WriteStatements(method.Statements, writer);\n    writer.Indent -= 4;\n    writer.WriteLine('}');\n  }\n}"
  - kind: paragraph
    text: If `IndentedTextWriter` had a method returning a disposable instance, such as `OpenScope`, then the caller code could more closely map lexical code scopes and logical operation scopes.
  - kind: code
    text: "public void WriteMethod(\n  MethodData method,\n  IndentedTextWriter writer) {\n\n  WriteMethodDeclaration(method, writer);\n  if (!method.IsAbstract) {\n    using (writer.OpenScope(4)) {\n      WriteStatements(method.Statements, writer);\n    }\n    writer.WriteLine('}');\n  }\n}"
  - kind: paragraph
    text: 'When making a disposable value for the scoped operation, it is important to still follow the guidance for `Dispose` methods for resource cleanup—for example, being safe to invoke these methods multiple times. One potential implementation for `OpenScope` is provided here as an example:'
  - kind: code
    text: "public partial class IndentedTextWriter {\n  public IndentationScope OpenScope(int indentAmount) {\n    if (indentAmount < 0) {\n      throw new ArgumentOutOfRangeException(nameof(indentAmount));\n    }\n    Indent += indentAmount;\n    return new IndentationScope(this, Indent, indentAmount);\n  }\n\n  public readonly struct IndentationScope : IDisposable {\n    private IndentedTextWriter _writer;\n    private int _pushedIndent;\n    private int _indentAmount;\n\n    internal IndentationScope(...) { ... }\n\n    public void Dispose() => Dispose(true);\n\n    protected void Dispose(bool disposing) {\n      // default(IndentationScope)\n      if (_writer == null) {\n        return;\n      }\n      if (_writer.Indent == _pushedIndent) {\n        _writer.Indent -= _indentAmount;\n      }\n      if (_writer.Indent > _pushedAmount) {\n        throw new InvalidOperationException(...);\n      }\n    }\n  }\n}"
  - kind: paragraph
    text: This implementation of `IndentationScope` uses a value type with no public members, other than `Dispose`, to track the disposable scope. It can use a nested type because the vast majority of callers are expected to put the `OpenScope` call in a `using` statement and not save an explicit local. This particular implementation throws an exception if the indentation is deeper than it should have been, but ignores the state when indentation is less than expected—which avoids an exception when the second of two `Dispose()` calls occurs. Other implementations, with different consequences, are also possible.
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: which pairs of methods or property changes begin and end an operation (the Indent property of IndentedTextWriter) is a design judgment.'
- id: FDG9079
  strength: CONSIDER
  text: returning a disposable value instead of making callers manually pair “begin” and “end” methods when the “end” method must be in a `finally` block for program correctness.
  context: null
  section: 9.4.3 Scoped Operations
  anchor: sec9_4_3
  body:
  - kind: paragraph
    text: In the previous `IndentedTextWriter` example, neglecting to call the “end” operation (reducing the `Indent` property back to the previous value) simply causes a functional bug. For some operations, like locking, failing to call the “end” method can result in deadlock or other difficult program states.
  - kind: paragraph
    text: In the following example, the developer did not consider the possibility that if the code between lock acquisition and lock release throws an exception, the lock is never released.
  - kind: code
    text: "public void DoStuff () {\n  _lock.EnterReadLock();\n  DoStuffCore();\n  // If DoStuffCore throws, we never get here...\n  _lock.ExitReadLock();\n}"
  - kind: paragraph
    text: The C# `using` statement, and equivalent statements in other .NET languages, calls the `Dispose()` method in a finally block. If we assume that the average caller uses a `using` statement instead of—or in addition to—manually calling `Dispose()`, then using a disposable return value for the operation starts the callers off on the more reliable path of releasing the lock in a finally block.
  - kind: code
    text: "public void DoStuff () {\n  // The expanded version of this, in IL, is to\n  // call the Dispose method in a finally block.\n  using (_lock.GetReadLock()) {\n    DoStuffCore();\n  }\n}"
  - kind: paragraph
    text: The following example implementation of a disposable-valued `GetReadLock` uses a reference type to implement the `IDisposable` operation type, and simplifies the caller understanding by declaring the return type as `IDisposable`.
  - kind: code
    text: "public partial class ReaderWriterLockSlim {\n  public IDisposable GetReadLock() {\n    HeldLock lock = new HeldLock();\n    lock.EnterReadLock(this);\n    return lock;\n  }\n\n  private sealed class HeldLock : IDisposable {\n    private ReaderWriterLockSlim _lock;\n    internal void EnterReadLock(ReaderWriterLockSlim lock) {\n      _lock = lock;\n      lock.EnterReadLock();\n    }\n\n    public void Dispose() {\n      ReaderWriterLockSlim lock =\n        Interlocked.Exchange(ref _lock, null);\n\n      lock?.ExitReadLock();\n    }\n  }\n}"
  - kind: annotation
    text: Since locking is a common, low-level operation, the disposable value would be better if it was a public value type, for the same reasons as described in the `IndentedTextWriter` example. Making a functionally correct implementation that doesn’t involve a mutable value type or per-operation allocation—but guarantees execution will occur exactly once—is difficult, but possible. It wouldn’t do any better as an example to illustrate the point, and bug-fixing print books is hard, so the example here was kept simple, even though we’d never actually write it this way in the BCL.
    author: Jeremy Barton
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether the end method must run in a finally block for correctness, as for a lock, is a judgment. The disposable value follows the Dispose guidelines, such as FDG9068.'
- id: FDG9080
  strength: DO
  text: follow the guidance for both asynchronous design (section 9.2) and synchronous `Dispose` (section 9.4), except as otherwise noted, when implementing `IAsyncDisposable`.
  context: null
  section: 9.4.4 IAsyncDisposable
  anchor: sec9_4_4
  body:
  - kind: paragraph
    text: '`IAsyncDisposable` inherits the guidance from both the “Async” and the “Disposable” portions of its name. For example, the method should be safe to call multiple times (section 9.4), should use `ConfigureAwait(false)` unless designed for an app model that requires using the ambient task scheduler (section 9.2.5.2), and should result in an `ObjectDisposedException` for many members on the type (section 9.4.1).'
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate of its own: the text points to other guidelines, which check their parts: ConfigureAwait (FDG9039 and FDG9083, CA2007), calls more than once (FDG9068), ObjectDisposedException (FDG9070), and the IAsyncDisposable guidelines FDG9081 and FDG9082.'
- id: FDG9081
  strength: DO NOT
  text: declare any overloads of `DisposeAsync()`.
  context: null
  section: 9.4.4 IAsyncDisposable
  anchor: sec9_4_4
  body:
  - kind: paragraph
    text: 'Synchronous `Dispose` recommends the Basic Dispose Pattern (section 9.4.1), deferring `Dispose()` to `Dispose(disposing: true)`, so as to allow the unification of cleanup code between `Dispose()` and any potential finalizer on the type. Since a finalizer is always executed in a synchronous context, it should only ever call the synchronous `Dispose` variant.'
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9081
    coverage: full
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Remove the DisposeAsync overload '{0}'; declare only DisposeAsync()
    category: Patterns
  notes: FDG9081 reports a method named DisposeAsync, of any accessibility, static and extension methods included, that has parameters or is generic, such as DisposeAsync(CancellationToken). Overrides and interface implementations are not reported, as for FDG9067. Removing or renaming a public method changes the public API, so the fix is breaking; there is no code fix.
- id: FDG9082
  strength: DO
  text: implement `DisposeAsync` as only calling and awaiting `Dispose-AsyncCore()`, calling `Dispose(false)`, and calling `GC.SuppressFinalize(this)`, in that order—except on sealed types.
  context: null
  section: 9.4.4 IAsyncDisposable
  anchor: sec9_4_4
  body:
  - kind: paragraph
    text: In the Basic Dispose Pattern (section 9.4.1), the only code unique to the zero-argument `Dispose()` method is the call to `GC.SuppressFinalize(this)`. Providing virtual `DisposeAsync` via the Template Method Pattern (section 9.9) enables you to ensure that `DisposeAsync` performs as an asynchronous equivalent to `Dispose` when it comes to finalizable types, keeping `Dispose` and `DisposeAsync` as synchronous and asynchronous versions of the same functionality, respectively. The call to `Dispose(false)` ensures that any finalizer-specific code that was intermixed in the `Dispose` implementation of a base class still gets invoked. In most type hierarchies, it will have no effect, but it’s necessary to complete the functional equivalence from synchronous `Dispose`.
  - kind: code
    text: "public partial class SomeType : IDisposable, IAsyncDisposable {\n  public void Dispose() {\n    Dispose(true);\n    GC.SuppressFinalize(this);\n  }\n\n  protected virtual void Dispose(bool disposing) { ... }\n\n  public async ValueTask DisposeAsync() {\n    await DisposeAsyncCore();\n    Dispose(false);\n    GC.SuppressFinalize(this);\n  }\n\n  protected virtual ValueTask DisposeAsyncCore() { ... }\n}"
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
    - FDG9082
    coverage: partial
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Implement '{0}' as only {1}, in that order
    category: Patterns
  notes: FDG9082 reports the implementation of IAsyncDisposable.DisposeAsync, explicit or not, declared in an unsealed class of any accessibility, whose body is not exactly an await of DisposeAsyncCore() on the same instance, with or without ConfigureAwait (FDG9083 asks for it), then Dispose(false), then GC.SuppressFinalize(this). When neither the class nor its base classes declare a Dispose(bool) method, the Dispose(false) call is not expected, since there is none to call; the text gives its reason as finalizer code in the Dispose implementation of a base class. Sealed classes and structs are excepted by the text. An override of DisposeAsync, and an abstract one, which has no body, are not reported, so coverage is partial; neither is a DisposeAsync that a class inherits from a base class that does not implement IAsyncDisposable. CA1816 also reports a DisposeAsync that does not call GC.SuppressFinalize, on externally visible unsealed types (probe with SDK 10.0.402); CA1816 is listed for FDG9065 only, so that its report on DisposeAsync is attributed to one rule. Changing the body changes no signature, so autofix is no; there is no code fix.
- id: FDG9083
  strength: DO
  text: use the `ConfigureAwait` modifier when using `await using` in the same way that you would with `await`.
  context: null
  section: 9.4.4.1 Usage Guidelines for await using
  anchor: sec9_4_4_1
  body:
  - kind: paragraph
    text: The `ConfigureAwait` extension method for `IAsyncDisposable` produces a value that proxies the `ConfigureAwait` modifier to `DisposeAsync()`. You should use it the same way, and in the same situations, as the `ConfigureAwait` modifier for Tasks (see section 9.2.5.2).
  - kind: paragraph
    text: Invoking `ConfigureAwait` means that you can’t use the variable assignment syntax of `await using`. Instead, the value has to be saved to a local variable first.
  - kind: code
    text: "// (possibly) incorrect\nawait using (var value = new SomeType()) {\n   ...\n}\n\n// (probably) correct\n// Extra braces were added to preserve the restricted scope of\n// the \"value\" variable\n{\n  var value = new SomeType();\n  using (value.ConfigureAwait(false)) {\n    ..\n  }\n}"
  - kind: paragraph
    text: Be aware that if an exception is thrown between the local variable assignment and the `await using` statement, the `DisposeAsync` method will not be invoked. As of C# 8.0, there is no easy way to get the statement-by-statement safety of “stacked usings” while also invoking the `ConfigureAwait` modifier. The blockless “simplified using” syntax comes closest to this goal.
  - kind: code
    text: "// (possibly) incorrect: no use of ConfigureAwait\nawait using (var value1 = new SomeType())\n// If this statement throws, value1 still has DisposeAsync called\nawait using (var value2 = ValueFactory.BuildSomeOtherType()) {\n   ...\n}\n// Uses ConfigureAwait, but does not call value1.DisposeAsync\n// when ValueFactory.BuildSomeOtherType() throws\n{\n  var value1 = new SomeType();\n  var value2 = ValueFactory.BuildSomeOtherType();\n  using (value.ConfigureAwait(false))\n  using (value.ConfigureAwait(false)) {\n    ..\n  }\n}\n\n// Fixes the problem with not calling value1.DisposeAsync, but may\n// violate your project's style guidelines\n{\n  var value1 = new SomeType();\n  await using var ignored = value1.ConfigureAwait(false);\n  var value2 = ValueFactory.BuildSomeOtherType();\n  await using (value2.ConfigureAwait(false)) {\n    ..\n  }\n}"
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
    - CA2007
    coverage: partial
  autofix: 'no'
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: as for FDG9039, ConfigureAwait is used in the same situations as for tasks, and the text excepts application models that depend on the synchronization context. CA2007 reports an await using statement or declaration whose resource is created in it without ConfigureAwait, and not one that uses ConfigureAwait(false) or ConfigureAwait(true) (probe with SDK 10.0.402); an await using of an existing variable without ConfigureAwait, such as await using (value), is not reported, so coverage is partial. The CA2007 code fix adds ConfigureAwait(false), but whether the code needs the context is judgment, so autofix is no, as for FDG9039. CA2007 is shared with FDG9039 and FDG9050.'
- id: FDG9084
  strength: DO
  text: prefer constructors to factories, because they are generally more usable, consistent, and convenient than specialized construction mechanisms.
  context: null
  section: 9.5 Factories
  anchor: sec9_5
  body:
  - kind: paragraph
    text: Factories sacrifice discoverability, usability, and consistency for implementation flexibility. For example, IntelliSense will guide a user through the instantiation of a new object using its constructors, but it won’t point users in the direction of factory methods.
  - kind: annotation
    text: I often hear criticism that we take tool support into account when making API design decisions. To answer this, I have to say that I strongly believe that a modern framework is more than just a piece of stand-alone reusable code. It is a part of a large ecosystem of runtimes, languages, documentation packages, support networks, and, finally, tools. All parts of the ecosystem must influence each other to provide an optimal solution. A modern framework designed outside of its ecosystem loses its competitive potential.
    author: Krzysztof Cwalina
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether a factory is needed (FDG9085 to FDG9088) is a design judgment.'
- id: FDG9085
  strength: CONSIDER
  text: using a factory if you need more control than can be provided by constructors over the creation of the instances.
  context: null
  section: 9.5 Factories
  anchor: sec9_5
  body:
  - kind: paragraph
    text: For example, consider the Singleton, Builder, or other similar patterns that constrain the ways in which objects are created. A constructor is very limited in its ability to enforce rich patterns such as these, whereas a factory method can easily perform caching, throttling, and sharing of objects, for example.
  - kind: annotation
    text: 'The advantage of the factory pattern is that `SomeClass.GetReader` can return an object whose runtime type is derived from `SomeReader`.


      ```

      SomeClass c = new SomeClass(...)

      SomeReader r = c.GetReader(...);

      ```


      The choice of an actual runtime type can be based on state in the `SomeClass` instance as well as on arguments passed to `GetReader`. Say, for example, that a `SomeClass` can represent a local file or a URL. `GetReader` could then return instances of either `FileReader` or `UrlReader`, both of which are derived from `SomeReader`. The folks building the managed `XmlReader` and `XmlWriter` switched from constructors in .NET Framework 1.1 to a factory pattern in .NET Framework 2.0 for exactly this reason. Another advantage of the factory pattern is that `GetReader` isn’t required to return a fresh instance—it could cache objects and return previously allocated instances.


      The advantages of the constructor pattern are simplicity and the extensibility argument given previously. Most users find the constructor pattern simpler and more discoverable because they are used to objects being created by constructors. The disadvantage is that you can’t dynamically decide the runtime type of what you return, nor can you return a previously allocated instance. If you are confident you will never need these capabilities, then constructors are probably the better choice. Simplicity is always a good thing.


      In short: Factory patterns give you more degrees of freedom, but constructors are simpler for the user.


      Now, pick your poison ;-)'
    author: Anders Hejlsberg
  - kind: annotation
    text: Factories have both advantages and disadvantages when it comes to performance. In terms of advantages, factories enable developers to create custom implementations tailored to specific scenarios; for example, the `System.Threading.Channels` library uses a factory method to create a channel instance that is optimized based on various constraints the caller specifies, and a future implementation of the library could specialize even more combinations with additional concrete implementations. In terms of disadvantages, it can be very difficult for a tool like a tree shaker/linker to determine exactly which code paths inside of a factory are reachable, and thus which concrete types are actually used by an app; this can lead to larger app sizes when such a tool is being used to minimize code size by removing all unused code paths.
    author: Stephen Toub
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether creation needs more control than a constructor gives (caching, throttling, sharing, the Singleton or Builder patterns) is a design judgment.'
