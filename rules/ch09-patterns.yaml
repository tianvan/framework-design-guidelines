    text: This might sometimes be a better option, because interfaces are more difficult to evolve (see section 4.3). On the other hand, some problems can arise with using abstract classes for the root. Abstract class members cannot be implemented explicitly, and the subtypes need to use the `new` modifier. This makes it tricky to implement the root’s members by delegating to the generic type members.
