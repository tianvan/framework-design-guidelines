- id: FDG9001
  strength: CONSIDER
  text: providing aggregate components for commonly used feature areas.
  context: null
  section: 9.1.3 Aggregate Component Guidelines
  anchor: sec9_1_3
  body:
  - kind: paragraph
    text: Aggregate components provide high-level functionality and are starting points for exploring given technology. They should provide shortcuts for common operations and add significant value over what is already provided by factored types. They should not simply duplicate the functionality. Many main scenario code samples should start with an instantiation of an aggregate component.
  - kind: annotation
    text: An easy trick to increase the visibility of an aggregate component is to choose the most “attractive” name for the component and less attractive names for the corresponding factored types. For example, a name representing a well-known system entity like `File` will attract more attention than `StreamReader`.
    author: Krzysztof Cwalina
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: which feature areas are commonly used, and whether a type is an aggregate component (a facade over factored types, section 9.1), is a design judgment. Kept in the application profile, as FDG2015 and FDG2016 are: an application''s own components are used by its developers too.'
