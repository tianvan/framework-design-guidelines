- id: FDG9128
  strength: DO
  text: only perform argument and state validation unique to the derived type in the virtual member of the Template Method Pattern. That is, do not repeat validation from the nonvirtual member.
  context: null
  section: 9.9 Template Method
  anchor: sec9_9
  body:
  - kind: paragraph
    text: Any argument states that would surprise callers if they varied across implementations should be performed in the public member. This includes throwing exceptions for arguments that cannot be null, index and count values that don’t make sense for the target collection, and state exceptions like `ObjectDisposedException`. If the derived type has additional invalid states, or needs to restrict arguments further than the base class did, then it should add those checks as with any other method.
  - kind: paragraph
    text: By moving the common checks into the public member, a developer for the derived type only needs to focus on the logic for their specific implementation. This approach eliminates the entire class of bugs associated with argument validation being slightly different, or outright missing, in a specific derived type.
  - kind: code
    text: "public void SetBounds(int left, int right) {\n  if (left < MinLeft || left >= right) {\n    throw new ArgumentOutOfRangeException(nameof(left));\n  }\n  if (right > MaxRight) {\n    throw new ArgumentOutOfRangeException(nameof(right));\n  }\n  if (_disposed) {\n    throw new ObjectDisposedException(...);\n  }\n  SetBoundCore(left, right);\n}\n\nprotected virtual void SetBoundsCore(int left, int right){ ... }"
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: 'no'
  severity:
    library: warning
    application: warning
    test: none
