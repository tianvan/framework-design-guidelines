- id: FDG9114
  strength: CONSIDER
  text: making a sub-interface of a new generic interface if removing members would allow a generic type parameter to be contravariant and the remaining members provide a coherent interface.
  context: null
  section: 9.8.1 Contravariance
  anchor: sec9_8_1
  body:
  - kind: paragraph
    text: When an interface uses a generic type parameter for both input and output purposes, that parameter must be declared as invariant. Any methods that only use the generic type parameter in an input role could be moved to a sub-interface to empower your callers with the flexibility that contravariance provides. If the applicable methods wouldn’t make for a coherent interface—or set of interfaces—then don’t artificially split your new interface.
  - kind: paragraph
    text: Because interface members cannot be moved without a breaking change—only copied—and adding a sub-interface to an interface is also a breaking change, this should not be done for any public interface that has already been released.
  - kind: code
    text: "// Instead of\npublic interface IEqualityCollection<T> : ICollection<T> {\n  bool SequenceEqual(IEnumerable<T> other);\n}\n\n// Consider\npublic interface ISequenceEqual<in T> {\n  bool SequenceEqual(IEnumerable<T> other);\n}\npublic interface IEqualityCollection<T> :\n  ICollection<T>, ISequenceEqual<T> {\n}"
  status: verified
