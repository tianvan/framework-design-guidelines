- id: FDG5053
  strength: DO
  text: make static constructors private.
  context: null
  section: 5.3.1 Type Constructor Guidelines
  anchor: sec5_3_1
  body:
    - kind: paragraph
      text: A static constructor, also called a class constructor, is used to initialize a type. The CLR calls the static constructor before the first instance of the type is created or any static members of that type are called. The user has no control over when the static constructor is called. If a static constructor is not private, it can be called by code other than the CLR. Depending on the operations performed in the constructor, this can cause unexpected behavior.
    - kind: paragraph
      text: The C# compiler forces static constructors to be private.
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not checked: the C# compiler forces static constructors to be private, as the body says.'
- id: FDG5054
  strength: DO NOT
  text: throw exceptions from static constructors.
  context: null
  section: 5.3.1 Type Constructor Guidelines
  anchor: sec5_3_1
  body:
    - kind: paragraph
      text: If an exception is thrown from a type constructor, the type is not usable in the current application domain.
    - kind: annotation
      text: The only time it’s OK to throw from a static constructor is if the type must never again be used in this application domain. You are basically making the type off-limits in the application domain where you throw, so you’d better have a good reason—such as if some important invariant is broken and your application would not be secure if such usage were permitted.
      author: Christopher Brumme
    - kind: annotation
      text: To be clear on this rule, it does not apply to just explicitly throwing, but to any exception. This implies that if the body of the class constructor has the potential to make method calls (and this is very likely the case), you need a “try-catch” around the body of your class constructor.
      author: Vance Morrison
    - kind: annotation
      text: |-
        In addition to not throwing exceptions from static constructors, it’s also a good idea to avoid locking in static constructors, or employing any other form of cross-thread dependency. A static constructor on a type is only invoked once, which means if multiple threads are trying to initialize a type concurrently, the runtime may need to lock to provide this guarantee. If the runtime locks while invoking the static constructor, and then the code in the static constructor also locks, it’s possible to end up with lock inversion that leads to deadlock. For example, this seemingly simple app will deadlock and never complete (at least on current implementations of .NET):

        ```
        using System.Threading;

        class Test
        {
           static void Main() { }

           static Test()
           {
              var t = new Thread(ThreadStart);
              t.Start();
              t.Join();
           }

           static void ThreadStart() { }
        }
        ```
      author: Stephen Toub
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1065
    coverage: partial
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA1065 reports an exception created in a static constructor. Exceptions from methods the constructor calls (the Morrison annotation) are not seen. The Brumme annotation allows throwing when the type must never again be used in the application domain; such reports are not violations. Property getters are FDG5031. CA1065 has no code fix. CA1065 also reports Equals, GetHashCode, ToString, operators, finalizers and Dispose, which sections 8.9 and 9.4.1 cover; the one noise-sample report (Dispose) belongs there.
- id: FDG5055
  strength: CONSIDER
  text: initializing static fields inline rather than explicitly using static constructors, because the runtime is able to optimize the performance of types that don’t have an explicitly defined static constructor.
  context: null
  section: 5.3.1 Type Constructor Guidelines
  anchor: sec5_3_1
  body:
    - kind: code
      text: |-
        // unoptimized code
        public class Foo {
          public static readonly int Value;
          static Foo() {
            Value = 63;
          }
          public static void PrintValue() {
            Console.WriteLine(Value);
          }
        }

        // optimized code
        public class Foo {
          public static readonly int Value = 63;
          public static void PrintValue() {
             Console.WriteLine(Value);
          }
        }
    - kind: annotation
      text: Be aware that initializing static fields inline has very loose guarantees about when the fields will be initialized. The guarantee is that the fields will be initialized before the first time they are accessed, but it could potentially occur much earlier. The CLR reserves the right to do the initialization before the program even starts running (e.g., using NGEN techniques). Explicit static constructors make a very precise guarantee. They are run before the first static member (code or data) is accessed, but no earlier.
      author: Christopher Brumme
    - kind: annotation
      text: Generally, doing nontrivial work in a class constructor is bad because if it fails, you make the class unavailable, and you have made some nontrivial semantic effect happen at a potentially surprising time (do all your users know the rules for precise class construction?). Thus you should seriously reconsider any design that does nontrivial work in class constructors. Initializing statics is really the reason class constructors exist, and for that you *don’t* need the static class {} syntax (use static initialization functions instead). It has fewer guarantees, but you should not need stronger guarantees, and the flexibility you give the runtime allows class construction to be more efficient.
      author: Vance Morrison
    - kind: annotation
      text: The nonpredictable timing of static fields initialized inline was an endless source of subtle compatibility issues. .NET Core runtimes and recent versions of .NET Framework no longer take advantage of the loose guarantees, but instead execute the static constructor precisely on the first static field access. Defining fields inline still offers a performance advantage because the static constructor is triggered by the static field access only—and not by access to other members—but it comes without the warning about nonpredictable timing now.
      author: Jan Kotas
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1810
      - CA2207
    coverage: partial
  autofix: no
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA1810 (reference types) and CA2207 (value types) report an explicit static constructor that initializes static fields. Moving the initialization inline changes when the fields are initialized (the Brumme and Kotas annotations), so neither has a code fix; the change is to behavior, not to a public signature.
