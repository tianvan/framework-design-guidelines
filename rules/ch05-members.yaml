    category: Members
  notes: 'FDG5111 reports a call to Enum.IsDefined, generic or not, whose value argument is a parameter of the calling member and whose result, negated or combined with && or || or not, is the condition of an if statement or a conditional expression with a branch that throws: a throw statement, a block with a throw statement among its statements, or a throw expression. That is an enum range check of an argument. Other calls are not reported, since the Rector annotation finds Enum.IsDefined appropriate for asking whether a value is one of the defined ones. CA2263 is not mapped: it only prefers the generic overload. The fix, a comparison with the bounds the member needs, changes no signature; there is no code fix.'
