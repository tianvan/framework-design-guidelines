- id: FDG5049
  strength: DO
  text: throw exceptions from instance constructors, if appropriate.
  context: null
  section: 5.3 Constructor Design
  anchor: sec5_3
  body:
    - kind: annotation
      text: When an exception propagates out of a constructor, the object is already created despite the fact that the new operator does not return the object reference. If the type defines a `Finalize` method, the method will run when the object becomes eligible for garbage collection. This means that you should make sure the `Finalize` method can run on partially constructed objects.
      author: Christopher Brumme
    - kind: annotation
      text: |-
        Alternatively, you could call `GC.SuppressFinalize` from within the constructor itself to avoid having the `Finalize` method called and to improve performance.

        ```
        // finalizable type constructor that can throw
        public FinalizableType(){
          try{
             SomeOperationThatCanThrow();
             handle = ... // allocate resource that needs to be finalized
          }
          catch(Exception){
             GC.SuppressFinalize(this);
             throw;
          }
        }
        ```
      author: Jeffrey Richter
    - kind: annotation
      text: Note that if your constructor throws an exception, the finalizer for your type will still run! So the finalizer and the `Dispose(false)` code path in your type must be prepared to handle an uninitialized state. Worse yet, if your app must deal with asynchronous exceptions such as `ThreadAbortException` or `OutOfMemoryException`, your finalizer may have to deal with partially initialized state if your constructor threw an exception halfway through! This surprising fact is usually pretty easy to deal with, but it may take you several years to realize it.
      author: Brian Grunkemeyer
    - kind: annotation
      text: A related constructor anti-pattern can lead to the same problem that Chris describes. If a constructor prematurely shares the `this` reference, the object may be accessible even if it has thrown an exception before it was fully constructed. This could happen by setting a field on an object passed in as an argument, or via a static variable, for example. Avoid doing this at all costs.
      author: Joe Duffy
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: when throwing is appropriate is a design decision.'
- id: FDG5050
  strength: DO
  text: explicitly declare the public default constructor in classes, if such a constructor is required.
  context: null
  section: 5.3 Constructor Design
  anchor: sec5_3
  body:
    - kind: paragraph
      text: 'If you don’t explicitly declare any constructors on a type, many languages (such as C#) will automatically add a public default constructor. (Abstract classes get a protected constructor.) For example, the following two declarations are equivalent in C#:'
    - kind: code
      text: |-
        public class Customer {
        }

        public class Customer {
          public Customer(){}
        }
    - kind: paragraph
      text: 'Adding a parameterized constructor to a class prevents the compiler from adding the default constructor. This often causes accidental breaking changes. Consider a class defined as shown in the following example:'
    - kind: code
      text: |-
        public class Customer {
        }
    - kind: paragraph
      text: Users of the class can call the default constructor, which the compiler automatically added in this case, to create an instance of the class.
    - kind: code
      text: var customer = new Customer();
    - kind: paragraph
      text: 'It is quite common to add a parameterized constructor to an existing type with a default constructor. If the addition is not done carefully, however, the default constructor might no longer be emitted. For example, the following addition to the type just declared will “remove” the default constructor:'
    - kind: code
      text: |-
        public class Customer {
          public Customer(string name) { ... }
        }
    - kind: paragraph
      text: This will break code relying on the default constructor, and such a problem is unlikely to be caught in a code review. Therefore, the best practice is to always specify the public default constructor explicitly.
    - kind: paragraph
      text: Note that this does not apply to structs. Structs implicitly get default constructors even if they have a parameterized constructor defined.
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: the body is about accidental breaking changes for callers that rely on the default constructor. Not an analyzer candidate: whether such a constructor is required is a design decision that symbols do not show.'
- id: FDG5051
  strength: AVOID
  text: explicitly defining default constructors on structs.
  context: null
  section: 5.3 Constructor Design
  anchor: sec5_3
  body:
    - kind: paragraph
      text: Many CLR languages do not allow developers to define default constructors on value types.<sup>1</sup> Users of these languages are often surprised to learn that `default(SomeStruct)` and `new SomeStruct()` don’t necessarily produce the same value. Even if your language does allow defining a default constructor on a value type, it probably isn’t worth the confusion it would cause if you did so.
    - kind: paragraph
      text: 1. A struct without an explicitly defined constructor still gets a default constructor that is provided by the CLR implicitly; it assigns all fields to their “zero” value (0, false, null).
    - kind: code
      text: |-
        public struct Token {
          public Token(Guid id) { this.id = id; }
          internal Guid id;
        }
        ...
        var token = new Token(); // this compiles and executes just fine
    - kind: paragraph
      text: The runtime will initialize all of the fields of the struct to their default values (`0`/`null`).
    - kind: annotation
      text: The default constructors on structs were enabled for C# 6 previews. We kept discovering cases where parameterless struct constructors caused inconsistent behaviors and decided to pull them out. It is not clear whether they will ever come back.
      author: Jan Kotas
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: The same case as FDG4026 (section 4.7), whose analyzer reports an explicit parameterless constructor on a struct. An fdg rule lists only its own diagnostic, so this rule is judgment and relies on FDG4026.
- id: FDG5052
  strength: AVOID
  text: calling virtual members on an object inside its constructor.
  context: null
  section: 5.3 Constructor Design
  anchor: sec5_3
  body:
    - kind: paragraph
      text: Calling a virtual member will cause the most derived override to be called, even if the constructor of the most derived type has not been fully run yet.
    - kind: paragraph
      text: 'Consider the following example, which prints out “What is wrong?” when a new instance of `Derived` is created. The implementer of the derived class assumes that the value will be set before anyone can call `Method`. However, that is not true: The `Base` constructor is called before the `Derived` constructor finishes, so any calls it makes to `Method` might operate on data that is not yet initialized.'
    - kind: code
      text: |-
        public abstract class Base {
          public Base() {
             Method();
          }
          public abstract void Method();
        }

        public class Derived: Base {
          private int value;
          public Derived() {
            value = 1;
          }

          public override void Method() {
            if (value == 1){
               Console.WriteLine("All is good");
            }
            else {
                Console.WriteLine("What is wrong?");
            }
          }
        }
    - kind: paragraph
      text: Occasionally, the benefits associated with calling virtual members from a constructor might outweigh the risks. An example is a helper constructor that initializes virtual properties using parameters passed to the constructor. It’s acceptable to call virtual members from constructors, given that all the risks are carefully analyzed and you document the virtual members that you call for the users overriding the virtual members.
    - kind: annotation
      text: |-
        In unmanaged C++, the vtable is updated during the construction so that a call to a virtual function during construction only calls to the level of the object hierarchy that has been constructed.

        It’s been my experience that many programmers are as confused by the C++ behavior as they are about the managed behavior. The fact is that most programmers don’t think about the semantics of virtual calls during construction and destruction until they have just finished debugging a failure related to this.

        Either behavior is appropriate for some programs and inappropriate for others. Both behaviors can be logically defended. For the CLR, the decision is ultimately based on our desire to support extremely fast object creation.
      author: Christopher Brumme
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA2214
    coverage: partial
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
