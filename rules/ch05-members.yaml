- id: FDG5085
  strength: DO NOT
  text: provide operator overloads unless at least one of the operands is of the type defining the overload.
  context: null
  section: 5.7 Operator Overloads
  anchor: sec5_7
  body:
    - kind: paragraph
      text: In other words, operators should operate on types that define them. The C# compiler enforces this guideline.
    - kind: code
