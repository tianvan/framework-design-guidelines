- id: FDG5029
  strength: DO
  text: allow properties to be set in any order, even if this results in a temporary invalid state of the object.
  context: null
  section: 5.2 Property Design
  anchor: sec5_2
  body:
    - kind: paragraph
      text: It is common for two or more properties to be interrelated to a point where some values of one property might be invalid given the values of other properties on the same object. In such cases, exceptions resulting from the invalid state should be postponed until the interrelated properties are actually used together by the object.
    - kind: annotation
      text: This happens a lot in business objects used in a three-tier system. You cannot do much more than basic validation of the properties when they are set. You have to provide an explicit “commit” method of some kind so that you know the caller is completely done with the update. Avoid validation that you cannot do with local knowledge (e.g., don’t go to the database). Remember that there is a strong expectation that setting a property will not be much more expensive than setting a field.
      author: Rico Mariani
    - kind: annotation
      text: While working on the code generator for the Windows Forms designer, I had a lot of people ask me for a way to tell the code generator how to order properties. I stubbornly refused every time, because it adds a huge amount of complexity for developers. It’s easy to dictate an order for your properties, but how does your property ordering mix in with classes that derive from you? Also, if it is complicated to describe to a code generator how things need to be ordered, imagine how complicated it will be to explain this to developers.
      author: Brian Pepin
    - kind: annotation
      text: One place where order-dependent property setting comes up is when assigning property A changes property B. You generally want to avoid doing that, since the confusion it costs is probably worse than the potential error state it was avoiding.
      author: Jeremy Barton
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether setting properties depends on their order is behavior.'
