- id: FDG5125
  strength: AVOID
  text: doing expensive argument checking for pointer arguments.
  context: null
  section: 5.8.5 Pointer Parameters
  anchor: sec5_8_5
  body:
    - kind: paragraph
      text: In general, argument checking is well worth the cost, but for APIs that are performance-critical enough to require using pointers, the overhead is often not worth it.
    - kind: annotation
      text: This is right in line with my general advice. Put the argument checking at the right level of your abstraction stack. That will get you the best diagnostics at the best price. After you get this close to the metal, those extra tests can be a significant fraction of the job at hand.
      author: Rico Mariani
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not checked: whether argument checking is expensive, and whether an API is performance-critical enough, is a design judgment.'
- id: FDG5126
  strength: DO
  text: follow common pointer-related conventions when designing members with pointers.
  context: null
  section: 5.8.5 Pointer Parameters
  anchor: sec5_8_5
  body:
    - kind: paragraph
      text: For example, there is no need to pass the start index, because simple pointer arithmetic can be used to accomplish the same result.
    - kind: code
      text: |-
        //Bad practice
        public unsafe int GetBytes(char* chars, int charIndex, int charCount,
         byte* bytes, int byteIndex, int byteCount)

        //Better practice
        public unsafe int GetBytes(char* chars, int charCount,
         byte* bytes, int byteCount)

        //Example call site
        GetBytes(chars + charIndex, charCount, bytes + byteIndex, byteCount);
    - kind: annotation
      text: For developers working with pointer-based APIs, it is more natural to think of the world with a pointer-oriented mindset. Although it is common in “safe” managed code, passing an index is uncommon in pointer-based code; it is more natural to use pointer arithmetic.
      author: Brad Abrams
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not checked: the conventions are a matter of design; an index parameter next to a pointer parameter, the example of the body, does not always duplicate pointer arithmetic.'
- id: FDG5127
  strength: DO
  text: prefer descriptive types over tuples, `System.Tuple<T1, ...>`, and `System.ValueTuple<T1, ...>`; they improve discoverability and can better evolve over time.
  context: null
  section: 5.9 Using Tuples in Member Signatures
  anchor: sec5_9
  body:
    - kind: annotation
      text: Neither discoverability nor evolution is particularly important for internals. It’s good to remember that the guidelines here are about public APIs. Tuples (and the syntax C# provides for them) are really handy in implementation and are a convenient way of passing around multiple pieces of related data, including when providing multiple return values from methods.
      author: Stephen Toub
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: the Toub annotation says that the tuple guidelines are about public APIs, and that tuples are handy in implementation. Analyzer candidate rejected: the body of FDG5128 allows a named tuple for a method so specialized that its result would never be amended and would only be deconstructed, which is intent. FDG5128, FDG5130, FDG5131 and FDG5132 report the mechanical cases.'
- id: FDG5128
  strength: DO
  text: prefer named tuples over unnamed tuples (including `System.Tuple<T1, ...>` and `System.ValueTuple<T1, ...>`).
  context: null
  section: 5.9 Using Tuples in Member Signatures
  anchor: sec5_9
  body:
    - kind: paragraph
      text: 'The previous section shows why descriptive types are better than named tuples in public API, as well as why named tuples are better than unnamed tuples. However, occasionally a method is so specialized that it would never make sense to amend the returned data, a custom descriptive type would only ever be deconstructed into locals, and the method name really is sufficient for documentation. When all of these conditions are true for a method’s return type, then a named tuple might make more sense. For example, .NET Standard 2.1 added `System.Range`, which has a utility method to compute the total length and initial offset for a range:'
    - kind: code
      text: |-
        public partial struct Range {
           public (int Offset, int Length) GetOffsetAndLength(int length);
        }
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG5128
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: "7.0"
  alternative: Before C# 7.0 there are no named tuples; use a descriptive type (FDG5127).
  analyzer:
    message: 'Name the elements of the tuple type ''{0}'' in the signature of ''{1}'''
    category: Members
  notes: 'Library only: see FDG5127. FDG5128 reports, once per member, an externally visible method, constructor, delegate, operator, property, indexer, field or event whose signature uses an unnamed tuple: System.Tuple<...>, or a value tuple with an element that has no name, such as (int, int) or ValueTuple<int, int>, also as a type argument or an array element type. Overrides and interface implementations are not reported. Replacing System.Tuple with a named tuple changes the type, so the fix is breaking; only adding names to a value tuple is not. There is no code fix.'
- id: FDG5129
  strength: DO
  text: name elements of a named tuple using PascalCase, as if they were properties.
  context: null
  section: 5.9 Using Tuples in Member Signatures
  anchor: sec5_9
  body:
    - kind: paragraph
      text: Named tuples in C# allow access to their elements via the same syntax as accessing a property or field on a descriptive type, so they should be named accordingly.
  status: draft
