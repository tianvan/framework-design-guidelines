- id: FDG5098
  strength: DO
  text: define inequality operators consistent with their mathematical properties.
  context: null
  section: 5.7.3 Inequality Operators
  anchor: sec5_7_3
  body:
    - kind: paragraph
      text: 'Custom inequality operators should all behave as they do on built-in numeric types:'
    - kind: list
      text: |-
        - The *transitive* property: If `a < b` and `b < c`, then `a < c`.
        - The *reversal* property: If `a < b`, then `b > a`.
        - The *irreflexive* property: If `a < a` is `false`, then `a > a` is `false`.
        - The *asymmetric* property: If `a < b` is `true`, then `b < a` is `false`.
    - kind: paragraph
      text: Following this guideline allows developers using your operators to write code, and their reviewers to read it, and apply the same logical analysis they would to your type as they would to the built-in numeric types.
    - kind: paragraph
      text: Using the inequality operators for a projective map, or for any purpose other than Boolean mathematical comparisons, makes code harder to reason about.
    - kind: code
      text: |-
        // Almost everyone believes that the type of x here is Boolean.
        // Therefore it should be for any inequality operator you define.
        var x = a < b;
