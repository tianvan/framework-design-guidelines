- id: FDG5043
  strength: CONSIDER
  text: providing simple, ideally default, constructors.
  context: null
  section: 5.3 Constructor Design
  anchor: sec5_3
  body:
    - kind: paragraph
      text: A simple constructor has a very small number of parameters, and all parameters are primitives or enums. Such simple constructors increase the usability of the framework.
    - kind: annotation
      text: |-
        If you have a type that has a required dependency on another type—that is, if an instance of your type won’t work if it doesn’t have a proper instance of the other type—then you should allow passing that type in via a constructor parameter.

        I see the constructor parameter list as defining the set of required dependencies for your type. Following this approach makes your type more amenable to dependency injection.

        At the same time, I think it’s a good practice to have default constructors that provide reasonable defaults for these required dependencies.
      author: Phil Haack
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: a design option, and the Haack annotation adds that required dependencies belong in constructor parameters, so a constructor with parameters is not a violation.'
- id: FDG5044
  strength: CONSIDER
  text: using a static factory method instead of a constructor if the semantics of the desired operation do not map directly to the construction of a new instance, or if following the constructor design guidelines feels unnatural.
  context: null
  section: 5.3 Constructor Design
  anchor: sec5_3
  body:
    - kind: paragraph
      text: See section 9.5 for more details on factory method design.
    - kind: annotation
      text: Factory methods can also afford significantly more flexibility in the future, as they enable returning a type derived from the return type rather than forcing it to be exactly the return type. An example near and dear to me is `Task`. With 20/20 hindsight, if we could do it over, we would not have added constructors that take a delegate to `System.Threading.Tasks.Task`. In doing so, we’ve made it extremely difficult for ourselves to optimize `Task` for scenarios that don’t require a delegate, such as when `Task` is used as the return type of an `async` method. If we didn’t have such constructors and only had factories (e.g. `Task.Run`), we could have put the delegate onto a derived type rather than onto the base type, and reduced the size of the `Task` object for all other cases where a delegate isn’t needed.
      author: Stephen Toub
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether an operation maps to the construction of a new instance is a matter of meaning. Factory method design is in section 9.5.'
- id: FDG5045
  strength: DO
  text: use constructor parameters as shortcuts for setting main properties.
  context: null
  section: 5.3 Constructor Design
  anchor: sec5_3
  body:
    - kind: paragraph
      text: 'There should be no difference in semantics between using the empty constructor followed by some property sets and using a constructor with multiple arguments. The following three code examples are equivalent:'
    - kind: code
      text: |-
        //1
        var applicationLog = new EventLog();
        applicationLog.MachineName = "BillingServer";
        applicationLog.Log = "Application";

        //2
        var applicationLog = new EventLog("Application");
        applicationLog.MachineName = "BillingServer";

        //3
        var applicationLog = new EventLog("Application", "BillingServer");
  status: verified
