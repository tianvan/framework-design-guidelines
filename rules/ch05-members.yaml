- id: FDG5001
  strength: DO
  text: try to use descriptive parameter names to indicate the default used by shorter overloads.
  context: null
  section: 5.1.1 Member Overloading
  anchor: sec5_1_1
  body:
    - kind: paragraph
      text: In a family of members overloaded on the number of parameters, the longer overload should use parameter names that indicate the default value used by the corresponding shorter member. This is mostly applicable to Boolean parameters. For example, in the following code, the first short overload does a case-sensitive look-up. The second, longer overload adds a Boolean parameter that controls whether the look-up is case sensitive. The parameter is named `ignoreCase` rather than `caseSensitive` to indicate that the longer overload should be used to ignore case and that the shorter overload probably defaults to the opposite, a case-sensitive look-up.
    - kind: code
      text: |-
        public class Type {
          public MethodInfo GetMethod(string name); //ignoreCase = false
          public MethodInfo GetMethod(string name, Boolean ignoreCase);
        }
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: whether a parameter name tells the default of the shorter overload (ignoreCase rather than caseSensitive) is a matter of meaning that symbols do not show.'
- id: FDG5002
  strength: DO NOT
  text: arbitrarily vary parameter names in overloads. If a parameter in one overload represents the same input as a parameter in another overload, the parameters should have the same name.
  context: null
  section: 5.1.1 Member Overloading
  anchor: sec5_1_1
  body:
    - kind: code
      text: |-
        public class String {
           // correct
           public int IndexOf (string value) { ... }
           public int IndexOf (string value, int startIndex) { ... }

           // incorrect
           public int IndexOf (string value) { ... }
           public int IndexOf (string str, int startIndex) { ... }
        }
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: whether two parameters represent the same input is a matter of meaning, so a check by type and position would guess. CA1725 compares the parameter names of an override with its base declaration, not overloads with each other, so it is not mapped. FDG5003 checks that parameters with the same name keep their position.'
- id: FDG5003
  strength: AVOID
  text: being inconsistent in the ordering of parameters in overloaded members. Parameters with the same name should appear in the same position in all overloads.
  context: null
  section: 5.1.1 Member Overloading
  anchor: sec5_1_1
  body:
    - kind: code
      text: |-
        public class EventLog {
           public EventLog();
           public EventLog(string logName);
           public EventLog(string logName, string machineName);
           public EventLog(string logName, string machineName, string source);
        }
    - kind: paragraph
      text: In some specific cases, this otherwise very strict guideline can be broken. For example, a `params` array parameter has to be the last parameter in a parameter list. If a `params` array parameter appears in an overloaded member, the API designer might need to make a trade-off and either settle for inconsistent parameter ordering or not use the `params` modifier. For more information on the `params` array parameters, see section 5.8.4.
    - kind: paragraph
      text: Another case where the guideline might need to be violated is when the parameter list contains `out` parameters. These parameters should typically appear at the end of the parameter list, which again means that the API designer might need to settle for a slightly inconsistent order of parameters in overloads with `out` parameters. See section 5.8 for more information on `out` parameters.
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG5003
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Put the parameter '{0}' at the same position in every overload of '{1}'
    category: Members
  notes: FDG5003 reports a parameter of an externally visible method or constructor whose position differs from that of the parameter with the same name in another overload declared in the same type. `params` arrays and `out` parameters are left out, as the body allows, and so are CancellationToken parameters, which section 9.2.2 keeps last. In constructors of an exception type, a leading `string message` and a trailing `Exception innerException` (or `inner`) are left out before positions are compared, because section 7.4 fixes where the common forms `(string message)` and `(string message, Exception innerException)` put them; the parameters between them are compared. Overrides and interface implementations take their signature from another member and are not reported, and overloads inherited from a base type are not compared. There is no code fix; moving a parameter changes the public signature, so the fix is breaking.
- id: FDG5004
  strength: DO
  text: make only the longest overload virtual (if extensibility is required). Shorter overloads should simply call through to a longer overload.
  context: null
  section: 5.1.1 Member Overloading
  anchor: sec5_1_1
  body:
    - kind: code
      text: |-
        public class Encoding {
           public bool IsAlwaysNormalized(){
             return IsAlwaysNormalized(NormalizationForm.FormC);
           }
           public virtual bool IsAlwaysNormalized(NormalizationForm form){
             //do real work here
           }
        }
    - kind: paragraph
      text: For more information on the design of virtual members, see Chapter 6.
    - kind: annotation
      text: Remember that you can apply this pattern to abstract classes, too. In your abstract class, you can perform all necessary argument checking in nonabstract, nonvirtual methods and then provide a single abstract method for the developer to implement.
      author: Brian Pepin
    - kind: annotation
      text: |-
        I love this guideline, not only because it makes the library code easier to reason about, but also because it makes it easier for me to write. If I have to implement each overload from scratch instead of making the less complicated ones call the more complicated ones, then I have to test and maintain all that copied code, too, which I’m far too lazy to do properly.

        Further, if I’ve got more than two overloads, I always make the less complicated ones call the next more complicated one and not the most complicated one, like the three overloads of `IsAlwaysNormalized` shown previously for `Encoding`. That way, I’m not hard-coding defaults in more than one place—if I had to do that, I’d probably get it wrong.
      author: Chris Sells
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG5004
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Make only the longest overload of '{0}' virtual and have this overload call it
    category: Members
  notes: 'FDG5004 reports a virtual or abstract method of an externally visible class when another overload in the same type starts with the same parameters (names, types and modifiers) and adds more, whatever the accessibility of either: the rule is for overriders, who also see protected overloads, so a public virtual method beside a longer protected virtual overload is reported (the pattern of the body makes the shorter one nonvirtual). Overloads whose parameter lists differ otherwise, and overrides, are not reported; whether the shorter overload calls the longer one is not checked. There is no code fix; making a public method nonvirtual changes the public API, so the fix is breaking.'
- id: FDG5005
  strength: DO NOT
  text: use `ref`, `out`, or `in` modifiers to overload members.
  context: null
  section: 5.1.1 Member Overloading
  anchor: sec5_1_1
  body:
    - kind: paragraph
      text: 'For example, you should not do the following:'
    - kind: code
      text: |-
        public class SomeType {
          public void SomeMethod(string name){ ... }
          public void SomeMethod(out string name){ ... }
        }
    - kind: paragraph
      text: Some languages cannot resolve calls to overloads like this. In addition, such overloads usually have completely different semantics and probably should not be overloads at all, but rather two separate methods.
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG5005
    coverage: full
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Do not overload '{0}' on the '{1}' modifier of the parameter '{2}'
    category: Members
  notes: FDG5005 reports a parameter with a `ref`, `out`, `in` or `ref readonly` modifier when another overload in the same type has the same parameter types without that modifier at that position. Overrides and interface implementations are not reported. There is no code fix; renaming or removing an overload changes the public API, so the fix is breaking.
- id: FDG5006
  strength: DO NOT
  text: have overloads with parameters at the same position and similar types, yet with different semantics.
  context: null
  section: 5.1.1 Member Overloading
  anchor: sec5_1_1
  body:
    - kind: paragraph
      text: 'The following example is a bit extreme, but it does illustrate the point:'
    - kind: code
      text: |-
        public class SomeType {
          public void Print(long value, string terminator){
            Console.Write("{0}{1}",value,terminator);
          }
          public void Print(int repetitions, string str){
            for(int i=0; i< repetitions; i++){
                Console.Write(str);
            }
          }
        }
    - kind: paragraph
      text: The methods just presented should not be overloads. They should have two different names.
    - kind: paragraph
      text: 'It’s difficult in some languages (in particular, dynamically typed languages) to resolve calls to these kinds of overloads. In most cases, if two overloads called with a number and a string would do exactly the same thing, it would not matter which overload is called. For example, the following is fine, because these methods are semantically equivalent:'
    - kind: code
      text: |-
        public static class Console {
          public void WriteLine(long value){ ... }
          public void WriteLine(int value){ ... }
        }
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: whether two overloads have different semantics is a matter of meaning. The Console.WriteLine overloads of the body have the same shape and are fine.'
- id: FDG5007
  strength: DO
  text: allow `null` to be passed for optional arguments.
  context: null
  section: 5.1.1 Member Overloading
  anchor: sec5_1_1
  body:
    - kind: paragraph
      text: 'If a method takes optional arguments that are reference types, allow `null` to be passed to indicate that the default value should be used. This avoids the problem of having to check for `null` before calling an API, as shown here:'
    - kind: code
      text: |-
        if (geometry==null) DrawGeometry(brush, pen);
        else DrawGeometry(brush, pen, geometry);
    - kind: annotation
      text: Notice that this guideline is not intended to encourage developers to use `null` as a magic constant, but rather to help them avoid explicit checking, as previously described. In fact, whenever you have to use literal `null` when calling an API, it indicates an error in your code or in the framework not providing the appropriate overload.
      author: Brad Abrams
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: whether a method accepts null for an optional reference argument is behavior, not part of the signature.'
- id: FDG5008
  strength: DO NOT
  text: have overloads with a generic type parameter in one method and a specific type in another.
  context: null
  section: 5.1.1 Member Overloading
  anchor: sec5_1_1
  body:
    - kind: paragraph
      text: 'When designing methods on a generic type, it may sometimes seem appropriate to have a generic-based overload and a `System.String-`based overload, as in this example:'
    - kind: code
      text: |-
        public class PrettyPrinter<T> {
          public void PrettyPrint(string format){ ... }
          public void PrettyPrint(T otherPrinter){ ... }
          public void PrettyPrint(T otherPrinter, string format){ ... }
        }
    - kind: paragraph
      text: However, when the generic type is itself `System.String`, the overload that uses the generic type parameter becomes uncallable.
    - kind: code
      text: |-
        PrettyPrinter<string> printer = new PrettyPrinter<string>();
        ...
        // C# overload resolution says this is PrettyPrint(string),
        // not PrettyPrint(T).
        // There's no way to call PrettyPrint(T) from C#.
        printer.PrettyPrint("hello, world");
    - kind: annotation
      text: This guidance doesn’t apply as strongly for generic methods (as opposed to non-generic methods on a generic types), because a generic method can be explicitly invoked by specifying the generic type arguments. But it still can cause unpleasant syntax, may not be possible to solve in all CLR languages, and is far more likely to have different semantics between the two methods with the same name.
      author: Jeremy Barton
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG5008
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: The overload of '{0}' that takes '{1}' cannot be called when '{1}' is '{2}'
    category: Members
  notes: FDG5008 reports an overload, declared on a generic type, that takes a type parameter of the type at a position where another overload of the same name takes a specific type, so that it cannot be called when the type argument is that type. Only top-level parameter types are compared. Type parameters with a constraint that the specific type cannot be shown to meet are not reported, nor are a generic method's own type parameters (the Barton annotation says the guideline applies less strongly to them). There is no code fix; removing or renaming an overload changes the public API, so the fix is breaking.
- id: FDG5009
  strength: CONSIDER
  text: using default parameters on the longest overload of a method.
  context: null
  section: 5.1.1 Member Overloading
  anchor: sec5_1_1
  body:
    - kind: paragraph
      text: Default parameters are available in C#, F#, and VB.NET, but they are not CLS-compliant and may not be well supported by all languages that can use .NET libraries.
    - kind: paragraph
      text: For the languages that do support default parameters, the use of default parameters can reduce the number of overloads that becomes possible for expressing every combination of optional parameters while still allowing the caller to use a somewhat minimal method invocation.
    - kind: code
      text: |-
        public static BigInteger Parse(
           ReadOnlySpan<char> value,
           NumberStyles style = NumberStyles.Integer,
           IFormatProvider provider = null) { ... }
        ...
        BigInteger val = BigInteger.Parse(input, provider: formatCulture);
    - kind: annotation
      text: |-
        It’s worth considering the performance implications of default parameters. A method such as `Parse` (in the preceding example) likely needs to validate all of its arguments and also have all of the branches necessary to support any valid combination of those arguments, even when it’s called with the default values for all of the optional arguments. In contrast, if this example used multiple overloads, the overload that just took `value` wouldn’t need to validate either `style` or `provider`, and it could delegate directly to the internal implementation that’s able to handle the equivalent of `NumberStyles.Integer` when no format provider is specified. For methods called on hot code paths in high-performance scenarios, that difference can be measurable.

        When looking at tools for tree shaking/linking, overloads with lots of default parameters can also be problematic. Let’s say the `Parse` method had different implementations to handle integer and hex number styles. A linker that sees this overload being used might end up keeping both the integer and hex support, even if it’s only ever called with the default integer argument. If this were instead an overload that didn’t take a style at all, a linker has a better chance of being able to strip away portions of the implementation that go unused.
      author: Stephen Toub
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: whether to use default parameters is a design choice, and the Toub annotation weighs them against overloads for hot paths and trimming. FDG5010, FDG5011, FDG5013 and FDG5015 check their misuses.'
- id: FDG5010
  strength: DO
  text: provide a simple overload, with no default parameters, for any method with two or more defaulted parameters.
  context: null
  section: 5.1.1 Member Overloading
  anchor: sec5_1_1
  body:
    - kind: paragraph
      text: Usability studies have shown that default parameters are a comparatively advanced feature. Many developers are confused with the presentation in IntelliSense, and sometimes think that they have to provide the defaulted arguments as exactly the value shown by IntelliSense. Providing the simple overload makes your method easier to approach for users who need only the default behaviors.
    - kind: code
      text: |-
        public static BigInteger Parse(ReadOnlySpan<char> value)
           // Since a provider is 'specified' this calls the overload
           // which uses default parameters.
           => Parse(value, provider: null);

        public static BigInteger Parse(
           ReadOnlySpan<char> value,
           NumberStyles style = NumberStyles.Integer,
           IFormatProvider provider = null) { ... }
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG5010
    coverage: partial
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Provide a simple overload of '{0}' without default parameters
    category: Members
  notes: FDG5010 reports an externally visible method or constructor with two or more default parameters when no externally visible overload in the same type has no default parameters and at most as many parameters as its required ones. The types of the simple overload are not compared. The fix is a new overload with a body, so there is no code fix; adding an overload changes no existing signature, so it is not breaking.
- id: FDG5011
  strength: DO NOT
  text: use default parameters, for any parameter type other than `CancellationToken`, on interface methods or virtual methods on classes.
  context: null
  section: 5.1.1 Member Overloading
  anchor: sec5_1_1
  body:
    - kind: paragraph
      text: A disagreement between an interface declaration and the implementation on a default value creates an unnecessary source of confusion for your users. The same confusion also arises when a virtual method and an override of that method disagree on the default values for a parameter. The most straightforward solution to this problem is to avoid the situation, and only use default parameters on nonvirtual methods.
    - kind: paragraph
      text: '`CancellationToken` is specifically exempted from this guideline, because the guidance for asynchronous methods (section 9.2) is to always have a `CancellationToken` parameter with a default value. Since there’s only one legal default value for a `CancellationToken`— that is, `default(CancellationToken)`—no default value disagreement is possible between implementations.'
    - kind: code
      text: |-
        public interface IExample {
         void PrintValue(int value = 5);
        }

        public class Example : IExample {
         public virtual void PrintValue(int value = 10) {
           Console.WriteLine(value);
         }
        }
        public class DerivedExample : Example {
         public override void PrintValue(int value = 20) {
           base.PrintValue(value);
         }
        }

        ...

        // What gets printed?
        // If you have to think about it, the API is not self-documenting.
        DerivedExample derived = new DerivedExample();
        Example e = derived;
        IExample ie = derived;
        derived.PrintValue();
        e.PrintValue();
        ie.PrintValue();
    - kind: paragraph
      text: For types that use the Template Method Pattern (section 9.9), the longest overload of the public nonvirtual method can use default parameters when appropriate, then defer to the virtual implementation method without using default parameters.
    - kind: code
      text: |-
        public partial class Control {
         // The public method uses a default parameter
         public void SetBounds(
           int x,
           int y,
           int width,
           int height,
           BoundsSpecified specified = BoundsSpecified.All) {
           ...
           SetBoundsCore(x, y, width, height, specified);
         }

         // The protected (virtual) method does not use default parameters
         protected virtual void SetBoundsCore(
           int x,
           int y,
           int width,
           int height,
           BoundsSpecified specified) {
           // Do the real work here.
         }
        }
    - kind: paragraph
      text: Default parameters can be provided for interface methods via extension methods.
    - kind: code
      text: |-
        public interface IExample {
         void PrintValue(int value);
        }

        public static class ExampleExtensions : IExample {
         public static void PrintValue(
           this IExample example,
           int value = 10) {

           // While this may look like a recursive call,
           // the C# method resolution rules say the instance member
           // from the interface is a better match than this extension
           // method.
           example.PrintValue(value);
         }
    - kind: paragraph
      text: 'One proposed alternative to not using default parameters in virtual methods was to say that virtual overrides should always match the defaults from the original method declaration. However, that guideline leads to versioning problems when derived types exist in a different assembly:'
    - kind: list
      text: |-
        - Changing the last required parameter of a method to be a default parameter is generally not a breaking change, but would cause the override to provide a different set of defaults.
        - The guidance for adding a new default parameter to an existing method (provided next) calls for removing the defaults from the current method overload, which can result in ambiguous method compile-time failures due to the overrides that have yet to be updated.
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG5011
    coverage: full
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Do not give the parameter '{0}' of the virtual or interface member '{1}' a default value
    category: Members
  notes: FDG5011 reports a parameter with a default value, other than one of type CancellationToken, on an externally visible interface member or on a virtual, abstract or override method of a class. The Template Method Pattern of the body (a nonvirtual public method with the defaults that calls a protected virtual method without them) and extension methods are not reported. An override is not reported for a default that repeats the explicit default of the nearest overridden member declared in a referenced assembly, since it only follows a declaration the user cannot change; an override that adds or changes a default is reported, including one that repeats a default changed by a class in source between them. A project reference counts as a referenced assembly. There is no code fix; removing a default value breaks callers that omit the argument, so the fix is breaking.
- id: FDG5012
  strength: DO NOT
  text: change the default value for a parameter once it has been publicly released.
  context: null
  section: 5.1.1 Member Overloading
  anchor: sec5_1_1
  body:
    - kind: paragraph
      text: Default parameters do not create logical overloads in the assembly that defines them, but are just a convenience mechanism to enable the compiler to fill in any missing values for the calling code at compile-time. When the value changes between two releases of a library, any existing callers will use the old value until they recompile, at which point they will switch to the new value. This can lead to confusion when diagnosing issues raised by users, when their reproduction cases don’t exhibit the bad behavior due to the changed default value.
    - kind: paragraph
      text: If you want to be able to change the value over time, use an otherwise illegal sentinel value such as zero or `-1` to indicate the runtime default value should be used instead.
    - kind: code
      text: |-
        // In this method, the style parameter should continue to use
        // NumberStyles.Integer in all future versions of the library.
        //
        // Since the provider parameter has a default value of null,
        // the library can change the default as an implementation detail
        // (assuming that's an acceptable breaking change for the method).
        public static BigInteger Parse(
           ReadOnlySpan<char> value,
           NumberStyles style = NumberStyles.Integer,
           IFormatProvider provider = null) { ... }
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: callers inside an application are recompiled with the new default. Not machine-checkable without a baseline of the released API.'
- id: FDG5013
  strength: DO NOT
  text: have two overloads of a method with “compatible” required parameters that both use default parameters.
  context: null
  section: 5.1.1 Member Overloading
  anchor: sec5_1_1
  body: []
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG5013
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Another overload of '{0}' with compatible required parameters also uses default parameters
    category: Members
  notes: 'FDG5013 reports the later of two overloads in the same type that both have default parameters when a call with only the required arguments of one matches the other: the required parameters of one are, by type and modifier, the leading parameters of the other, and the other needs no more of them. Compatibility through implicit conversions is not checked. There is no code fix; moving the defaults changes the public signatures, so the fix is breaking.'
- id: FDG5014
  strength: AVOID
  text: having two overloads of the same method that both use default parameters.
  context: null
  section: 5.1.1 Member Overloading
  anchor: sec5_1_1
  body: []
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not a separate analyzer candidate: the FDG5015 body allows two overloads with default parameters when their required parameters have incompatible signatures. FDG5013 reports the compatible case, which is the one this rule warns about.'
- id: FDG5015
  strength: DO NOT
  text: have different defaults for the same parameter in two overloads of the same method.
  context: null
  section: 5.1.1 Member Overloading
  anchor: sec5_1_1
  body:
    - kind: paragraph
      text: The only time that two overloads of the same method should both have default parameters is when their required parameters have incompatible signatures. The parameters shared in common by the two overloads should have the same default values, or no default value. This makes it abundantly clear which overload is being called.
    - kind: code
      text: |-
        // Given this overload already exists
        public static OperationStatus DecodeFromUtf8(
         ReadOnlySpan<byte> utf8,
         Span<byte> bytes,
         out int bytesConsumed,
         out int bytesWritten,
         bool isFinalBlock = true) { ... }

        // OK: default parameters have the same value,
        // and the signatures are incompatible
        public static byte[] DecodeFromUtf8(
         byte[] utf8,
         out int bytesConsumed,
         bool isFinalBlock = true) { ... }

        // BAD: default parameters have a different value
        public static byte[] DecodeFromUtf8(
         byte[] utf8,
         out int bytesConsumed,
         bool isFinalBlock = false) { ... }

        // BAD: This longer overload's required parameters are compatible
        // with the original overload
        public static OperationStatus DecodeFromUtf8(
         ReadOnlySpan<byte> utf8,
         Span<byte> bytes,
         out int bytesConsumed,
         out int bytesWritten,
         bool isFinalBlock = true,
         int bufferSize = 512) { ... }
  status: verified
  style: false
