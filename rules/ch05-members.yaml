- id: FDG5121
  strength: CONSIDER
  text: providing special overloads and code paths for calls with a small number of arguments in extremely performance-sensitive APIs.
  context: null
  section: 5.8.4 Members with Variable Number of Parameters
  anchor: sec5_8_4
  body:
    - kind: paragraph
      text: This makes it possible to avoid creating array objects when the API is called with a small number of arguments. Name the parameters by taking a singular form of the array parameter and adding a numeric suffix.
    - kind: code
      text: |-
        void Format (string formatString, object arg1)
          void Format (string formatString, object arg1, object arg2)
        ...
          void Format (string formatString, params object[] args)
    - kind: paragraph
      text: You should do this only if you are going to treat the entire code path as a special case, not just create an array and call the more general method.
    - kind: annotation
      text: You might also do this if you want to specialize the code path at some point, even if you can’t do it in your first release. That way, you can change your internal implementation without having your clients recompile, and you can do the most important specializations first.
      author: Rico Mariani
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not checked: whether an API is extremely performance-sensitive, and whether the special overloads have their own code path, is a design decision. The parameter names of the body (a singular form with a numeric suffix) are not checked.'
- id: FDG5122
  strength: DO
  text: be aware that `null` could be passed as a params array argument.
  context: null
  section: 5.8.4 Members with Variable Number of Parameters
  anchor: sec5_8_4
  body:
    - kind: paragraph
      text: You should validate that the array is not null before processing it.
    - kind: code
      text: |-
        static void Main() {
          Sum(1, 2, 3, 4, 5); //result == 15
          Sum(null);
        }
        static int Sum(params int[] values) {
          if(values==null) throw ArgumentNullException(...);
          int sum = 0;
          foreach (int value in values) {
            sum += value;
          }
          return sum;
        }
    - kind: annotation
      text: Very low-level functions (those doing only a tiny amount of work) will find the cost of temporary array creation and array validation a significant burden. All of this argues in favor of using the params construct higher up in your stack—in bigger functions that are doing more work.
      author: Rico Mariani
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1062
    coverage: partial
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'CA1062 reports a params array parameter of an externally visible method that is dereferenced without a null check: in a probe with SDK 10.0.402 it reported a public Sum(params int[] values) that loops over values, the example of the body. It accepts any null check before the dereference (see FDG5108). CA1062 has no code fix; adding the check changes no signature.'
- id: FDG5123
  strength: DO NOT
  text: use the `varargs` methods, otherwise known as the ellipsis.
  context: null
  section: 5.8.4 Members with Variable Number of Parameters
  anchor: sec5_8_4
  body:
    - kind: paragraph
      text: Some CLR languages, such as C++, support an alternative convention for passing variable parameter lists called `varargs` methods. This convention should not be used in frameworks, because it is not CLS-compliant.
    - kind: annotation
      text: Of course, “never” in this context means not in the framework APIs—`varargs` wasn’t added lightly to C++. If `varargs` helps you in your internal implementation, by all means use it. Just remember it isn’t CLS-compliant, so it’s bad form to use it in public APIs.
      author: Rico Mariani
    - kind: annotation
      text: The runtime support for `varargs` is just enough to make managed C++ work on Windows. The performance is not great, and it has not been implemented for non-Windows platforms. For these reasons, I would not recommend using it even for internal implementations. Several teams have done experiments with it, only to find that it is worse across the board than the alternatives.
      author: Jan Kotas
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG5123
    coverage: full
  autofix: breaking
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: 'Do not use a varargs (__arglist) parameter list in ''{0}'''
    category: Members
  notes: 'Library only: the reason is CLS compliance, which matters to callers of a framework in other languages. The Kotas annotation advises against varargs in internal code too, but the text is about frameworks. FDG5123 reports an externally visible method or constructor declared with __arglist. Removing __arglist changes the public API, so the fix is breaking; there is no code fix.'
- id: FDG5124
  strength: DO
  text: provide an alternative for any member that takes a pointer argument, because pointers are not CLS-compliant.
  context: null
