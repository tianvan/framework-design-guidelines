    category: Members
  notes: 'Library only: see FDG5127. FDG5129 reports each element name of a tuple in the signature of an externally visible method, constructor, delegate, operator, property, indexer, field or event that does not start with an uppercase letter. The rest of PascalCase is not checked. Overrides and interface implementations are not reported. Callers read the elements by name, so renaming them breaks their source and the fix is breaking; there is no code fix.'
- id: FDG5130
  strength: DO NOT
  text: use tuples with more than three fields.
  context: null
  section: 5.9 Using Tuples in Member Signatures
  anchor: sec5_9
  body:
    - kind: paragraph
      text: Tuples are a convenient way to represent a data pair or triplet that will be separated into the individual fields, such as via the C# deconstruction language feature. Once more than three fields are being returned together, it seems more likely that the values will stay grouped together, and be passed to other methods or stored in a look-up table—a role better suited to descriptive types.
    - kind: annotation
      text: Named tuples are internally represented as structs. Having more than three fields would often make the named tuple instance size too big and negatively impact performance.
      author: Jan Kotas
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG5130
    coverage: full
  autofix: breaking
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: 'Use a descriptive type in place of the tuple with {0} fields in the signature of ''{1}'''
    category: Members
  notes: 'Library only: see FDG5127. FDG5130 reports, once per member, an externally visible method, constructor, delegate, operator, property, indexer, field or event whose signature uses a tuple with more than three elements: a value tuple, named or not, or System.Tuple (an eight-argument System.Tuple counts the elements of its last one), also as a type argument or an array element type. Overrides and interface implementations are not reported. Replacing the tuple with a descriptive type changes the public API, so the fix is breaking; there is no code fix.'
- id: FDG5131
  strength: DO NOT
  text: use tuples as method parameters.
  context: null
  section: 5.9 Using Tuples in Member Signatures
  anchor: sec5_9
  body:
    - kind: paragraph
      text: When a tuple is used as a parameter, it introduces extra syntax for both the method declaration and the caller, but does not provide much value in return.
    - kind: paragraph
      text: Accepting a collection based on tuples (such as `(string FirstName, string LastName, int Age)[] people`) is more justifiable than accepting a single tuple value parameter. However, operating on a collection suggests a level of complexity that would be better served by descriptive types—validating constructors, instance methods, and the ability to add to the type without a breaking change. Callers of the method may also be forced to use awkward syntax to get their data into the right shape.
    - kind: paragraph
      text: This guideline does not mean that library authors should go out of their way to prohibit named tuples or unnamed tuples to be specified as generic type parameters, even though that could cause a violation after generic substitution.
    - kind: code
      text: |-
        // OK
        public static T Max(IComparer<T> comparer, T first, T second, T third) {...}

        // OK
        var first = (Base: 1, Exponent: 2);
        var second = (Base: 2, Exponent: 1);
        var third = (Base: 3, Exponent: -5);
        (int Base, int Exponent) max = Max(comparer, first, second, third);

        // Not OK if explicitly defined this way
        public static (int Base, int Exponent) Max(
         IComparer<(int Base, int Exponent)> comparer, ...) { ... }
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG5131
    coverage: full
  autofix: breaking
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: 'Do not use a tuple in the type of the parameter ''{0}'' of ''{1}'''
    category: Members
  notes: 'Library only: see FDG5127. FDG5131 reports a parameter of an externally visible method, constructor, delegate, operator or indexer whose type is or contains a tuple (a value tuple or System.Tuple), a collection of tuples included, which the body says is better served by descriptive types. The this parameter of an extension method over a tuple is left to FDG5132. A type parameter that callers substitute with a tuple is not reported, as the body allows, and neither are overrides and interface implementations, whose tuple can come from such a substitution in the member they override or implement. Replacing the parameter type changes the public API, so the fix is breaking; there is no code fix.'
- id: FDG5132
  strength: DO NOT
  text: define extension methods over tuples.
  context: null
  section: 5.9 Using Tuples in Member Signatures
  anchor: sec5_9
  body:
    - kind: paragraph
      text: This is a special case of not using tuples as method parameters, but is worth mentioning in its own right.
    - kind: paragraph
      text: 'Suppose we were to define a method to calculate the dot product of two tuples used to represent a vector on the *X-Y* plane:'
    - kind: code
      text: |-
        public static int DotProduct(this (int X, int Y) first,
        (int X, int Y) second) {
           return first.X * second.X + first.Y * second.Y;
        }
    - kind: paragraph
      text: 'This extension method would also show up in IntelliSense on the `(int Base, int Exponent)` variables from the previous example, and the following code would compile:'
    - kind: code
      text: |-
        (int Base, int Exponent) value = (2, 20);
        ValueTuple<int, int> otherValue = ValueTuple.Create(5, 7);
        int dotProduct = value.DotProduct(otherValue);
    - kind: paragraph
      text: This is because the C# language (and VB.NET) considers all tuples, as well as `System.ValueTuple<T1,...>`, to be the same type if their ordered list of element types is the same.
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG5132
    coverage: full
  autofix: breaking
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: 'Do not define the extension method ''{0}'' over the tuple type ''{1}'''
    category: Members
  notes: 'Library only: see FDG5127. FDG5132 reports an externally visible extension method whose this parameter is a tuple: a value tuple, named or not, or System.Tuple. Moving the method off the tuple changes the public API, so the fix is breaking; there is no code fix.'
- id: FDG5133
  strength: CONSIDER
  text: adding an appropriate `Deconstruct` method to any type that was chosen as an alternative to a tuple.
  context: null
  section: 5.9 Using Tuples in Member Signatures
  anchor: sec5_9
  body:
    - kind: paragraph
      text: 'By adding a `void` method on our `Person` class named `Deconstruct`, we can use the C# 7.0 deconstruction feature:'
    - kind: code
      text: |-
        public partial struct Person {
           public void Deconstruct(out string firstName, out string lastName,
        out int age) {
               firstName = FirstName;
               lastName = LastName;
               age = Age;
           }
        }
    - kind: paragraph
      text: 'The `Deconstruct` method enables us to build our target heart rate message with the following code:'
    - kind: code
      text: |-
        (string firstName, string lastName, int age) = GetPerson();
        string message = $"{firstName} {lastName}'s target heart rate is
        {220 - age}."
    - kind: paragraph
      text: This same code works for all four representations of the person because `System.Tuple<T1, ...>`, `System.ValueTuple<T1, ...>`, and named tuples all have similar `Deconstruct` methods and the deconstruction language feature does not require any similarity in the `out` parameter names and the local variable names.
    - kind: paragraph
      text: The deconstruction syntax is especially nice for tuples, as their lack of methods means that any logic operating on a tuple has to first break it down to some (or all) of its element values. If a tuple was a candidate for the return type of a method, then even for the descriptive type, a likely common operation for callers will be to break the type down to its element values.
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: none
    test: none
  config: []
  minLanguage: "7.0"
  alternative: Before C# 7.0 there is no deconstruction syntax; callers read the properties of the type.
  analyzer: null
  notes: 'Library only: see FDG5127. Not checked: whether a type was chosen as an alternative to a tuple is intent.'
