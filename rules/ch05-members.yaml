    category: Members
  notes: 'FDG5076 reports an externally visible extension method declared in the namespace of the type it extends when that type is declared in the same assembly, is not an interface, and the method does not restrict a generic type: the extended type is not generic, or every type argument is a type parameter of the method without constraints. The three exceptions of the text are interfaces, generic type restriction and dependency management; for the last the body says the extension methods are in a different assembly, and since symbols do not show why an assembly extends another assembly''s type in that type''s namespace, extended types from other assemblies are not reported at all. Moving a public class to another namespace changes the public API, so the fix is breaking.'
- id: FDG5077
  strength: AVOID
  text: defining two or more extension methods with the same signature, even if they reside in different namespaces.
  context: null
  section: 5.6 Extension Methods
  anchor: sec5_6
  body:
    - kind: paragraph
      text: For example, if two different namespaces defined the same extension method on the same type, it would be impossible to import both namespaces in the same file. The compiler would report an ambiguity if one of the methods was called.
    - kind: code
      text: |-
        namespace A {
          public static class AExtensions {
            public static void ExtensionMethod(this Foo foo){...}
          }
        }
        namespace B {
          public static class BExtensions {
            public static void ExtensionMethod(this Foo foo){...}
          }
        }
    - kind: annotation
      text: |-
        There can be reasons to violate this guideline. For example, there might be a framework that allowed developers to choose

        ```
        using SomeType.Routing.SpeedOptimized;
        ```

        or

        ```
        using SomeType.Routing.SpaceOptimized;
        ```

        In this case, both namespaces could offer the same services, and developers simply choose which flavor to use.

        The key here is that a natural mutual exclusion exists for a given consumer of the extension so that it avoids the ambiguity. If you tried to use both, you would want to see the error so that you would realize you have a conflict.
      author: Rico Mariani
    - kind: annotation
      text: |-
        Such a situation may occur when using a mix of third-party libraries. To resolve it, import in a file only one namespace defining extension methods on a type, and use fully qualified static method calls for extension methods defined on the same type in a different namespace.

        ```
        using A;
        ...
        T someObj = ...
        someObj.ExtentionMethod(); //this calls AExtensions.ExtensionMethod
        // To avoid compilation errors,
        // we call explicitly the extension method defined in namespace B
        B.BExtensions.ExtensionMethod(someObj);
        ```
      author: Mircea Trofin
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG5077
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: 'The extension method ''{0}'' has the same signature as an extension method in ''{1}'''
    category: Members
  notes: 'FDG5077 reports externally visible extension methods of one assembly that have the same name, the same number of type parameters and the same parameter types, this parameter included, in different classes. Methods in other assemblies are not seen. The Mariani annotation describes namespaces that offer the same services as mutually exclusive flavors; such pairs are reported, and the text keeps them under AVOID. Renaming or removing a public method changes the public API, so the fix is breaking.'
