    message: Name the parameter '{0}' like the property '{1}' that it sets
    category: Members
  notes: FDG5046 reports a parameter of an externally visible constructor that is used only to set a property of the instance, through `P = p;`, `this.P = p;` or `P = p ?? throw ...;` in the constructor or, for a primary constructor, through a property initializer `= p`, when the names differ in more than casing. Uses inside nameof do not count. Parameters that set a field are not checked. There is no code fix; renaming a public parameter breaks callers that use named arguments, so the fix is breaking.
- id: FDG5047
  strength: CONSIDER
  text: adding a property for each parameter in a constructor.
  context: null
  section: 5.3 Constructor Design
  anchor: sec5_3
  body:
    - kind: paragraph
      text: Developers generally find it helpful when they can inspect the state of an object for debugging or logging purposes. While a debugger can usually inspect the private fields of an object, that isn’t easy to do with logging. Exposing at least a get-only property for each constructor parameter enables users to incorporate the state of your object into their diagnostic flow.
    - kind: paragraph
      text: Constructor parameters typed as mutable reference types may not be suitable for exposing as properties, particularly when your type is stateful and modifying that parameter can invalidate your state. You should also be mindful of the guidance for when to use a method instead of a property (see section 5.1.3).
    - kind: paragraph
      text: You may have other reasons, such as data hiding, for not exposing constructor parameters via properties. Even so, you should generally start from an expectation of adding the properties and then justify why doing so is not appropriate in context.
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: the body names reasons not to expose a parameter (mutable reference types, data hiding), which are a matter of intent.'
