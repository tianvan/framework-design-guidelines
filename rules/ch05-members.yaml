- id: FDG5105
  strength: DO
  text: use enums if a member would otherwise have two or more Boolean parameters.
  context: null
  section: 5.8.1 Choosing Between Enum and Boolean Parameters
  anchor: sec5_8_1
  body:
    - kind: paragraph
      text: 'Enums are much more readable when it comes to books, documentation, source code reviews, and so on. For example, look at the following method call:'
    - kind: code
      text: Stream stream = File.Open("foo.txt", true, false);
    - kind: paragraph
      text: 'This call gives the reader no context within which to understand the meaning of `true` and `false`. The call would be much more usable if it were to use enums, as follows:'
    - kind: code
      text: |-
        Stream stream = File.Open("foo.txt", CasingOptions.CaseSensitive,
        FileMode.Open);
    - kind: annotation
      text: Some have asked why we don’t have a similar guideline for integers, doubles, and so on. Should we find a way to “name” them as well? There is a big difference between numeric types and Booleans. You almost always use constants and variables to pass numeric values around, because it is good programming practice and you don’t want to have “magic numbers.” However, if you take a look at real-life source code, this is almost never true of Booleans. Eighty percent of the time a Boolean argument is passed in as a literal constant, and its intention is to turn a piece of behavior on or off. We could alternatively try to establish a coding guideline that you should never pass a literal value to a method or constructor, but I don’t think it would be practical. I certainly don’t want to define a constant for each Boolean parameter I’m passing in.
      author: Anthony Moore
    - kind: annotation
      text: Methods with two Boolean parameters, like the one in the preceding example, allow developers to inadvertently switch the arguments, and the compiler and static analysis tools can’t help you find this error. Even with just one parameter, I tend to believe it’s still somewhat easier to make a mistake with Booleans—let’s see, does `true` mean case-insensitive or case-sensitive?
      author: Jon Pincus
    - kind: annotation
      text: The worst example of an unreadable Boolean parameter that I had to deal with was the `CWnd::UpdateData` method in MFC. It takes a Boolean that indicates whether a dialog is being initialized or data is being retrieved. I always had to look up whether to pass `true` or `false` to this method each time I called it. Likewise, each time I read code that called the method, I had to look it up to see what it meant.
      author: Steven Clarke
    - kind: annotation
      text: |-
        This guidance was written before C# added support for naming arguments at the call site. It’s true that the code

        ```
        File.Open("foo.txt", true, false);
        ```

        gives no context with which to understand the meaning of those Boolean arguments. But in the code

        ```
        File.Open("foo.txt", caseSensitive: true, create: false);
        ```

        the name of the arguments makes it clear. I still agree with the general guidance, but the ramifications of not following it aren’t as stark as they once were.
      author: Stephen Toub
  status: verified
  style: false
