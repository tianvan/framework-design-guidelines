- id: FDG5040
  strength: DO
  text: return the declaring type from an indexer that accepts `System.Range`.
  context: null
  section: 5.2.1 Indexed Property Design
  anchor: sec5_2_1
  body:
    - kind: paragraph
      text: Range-based indexers on a collection should return a collection of the same type as the type that declares them. This includes implicit indexers created by having a `Slice` method with the appropriate signature. Instead of violating this guideline when your goal is to create a different type, provide a separate conversion method. For example, arrays produce a copy of the requested range in the `Range` indexer, but arrays also have the `array.AsSpan(Range)` extension method to produce a `Span<T>` for the same range of indices.
    - kind: code
      text: |-
        // OK: Returns the declaring type from a Range-based indexer
        public partial class SomeCollection {
          public SomeCollection this[Range range] { get { ... } }
        }

        // OK: Returns the declaring type from Slice(int, int), which
        // makes an implicit indexer in C#
        public partial class SomeCollection {
          public SomeCollection Slice(int offset, int length) { ... }
        }

        // BAD: Returns the wrong type from a Range-based indexer
        public partial class SomeCollection {
          public SomeValue[] this[Range range] { get { ... } }
        }

        // BAD: Returns the wrong type from Slice(int, int), which
        // makes an implicit indexer in C#
        public partial class SomeCollection {
          public SomeValue[] Slice(int offset, int length) { ... }
        }
    - kind: annotation
      text: The behavior of the `System.Range` indexer for arrays was a subject of long debate. Making it very easy to produce copies of potentially large arrays seems to be a performance trap. In the end, the copying behavior was chosen for consistency. The future will tell whether it was a wise choice.
      author: Jan Kotas
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG5040
    coverage: full
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Return '{0}' from '{1}'
    category: Members
  notes: FDG5040 reports an externally visible indexer whose only parameter is a System.Range, and an externally visible Slice(int, int) method of a type that has an int Length or Count property and no Range indexer (C# then uses Slice as the range indexer), when it returns a type other than the declaring type. Members that override or implement another member are not reported. There is no code fix; changing the return type changes the public API, so the fix is breaking.
- id: FDG5041
  strength: CONSIDER
  text: raising change notification events when property values in high-level APIs (usually designer components) are modified.
  context: null
  section: 5.2.2 Property Change Notification Events
  anchor: sec5_2_2
  body:
    - kind: paragraph
      text: If there is a good scenario for a user to know when a property of an object is changing, the object should raise a change notification event for the property.
    - kind: paragraph
      text: However, it is unlikely to be worth the overhead to raise such events for low-level APIs such as base types or collections. For example, `List<T>` would not raise such events when a new item is added to the list and the `Count` property changes.
    - kind: annotation
      text: Because `List<T>` doesn’t implement any of the notification APIs for data binding, and because I like data binding, I find myself using `ObservableCollection<T>` instead, which implements `INotifyCollectionChanged`.
      author: Chris Sells
  status: verified
