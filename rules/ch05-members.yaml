  analyzer: null
  notes: 'CA1802 reports a static readonly field of a primitive type or string that is initialized with a constant and could be const. With its default api_surface it reports only fields that are not externally visible (a probe with SDK 10.0.402 reported internal and private fields and not a public one), where the body''s compatibility risk does not arise because every caller is in the same assembly; do not widen api_surface, since a public value that may change in a later version should stay static readonly. Instance fields and constants that are not fields are not seen. The code fix makes the field const, which changes no public API.'
- id: FDG5067
  strength: CONSIDER
  text: using public `static readonly` fields for predefined object instances.
  context: null
  section: 5.5 Field Design
  anchor: sec5_5
  body:
    - kind: paragraph
      text: If there are predefined instances of the type, declare them either as public `static readonly` fields or as get-only properties on the type itself.
    - kind: code
      text: |-
        public struct Color{
          public static readonly Color Red = new Color(0x0000FF);
          public static readonly Color Green = new Color(0x00FF00);
          public static readonly Color Blue = new Color(0xFF0000);
          ...
        }
    - kind: paragraph
      text: 'When a type has a significant number of predefined instances, but few are used in any application, you may prefer to use get-only properties. Because the .NET Runtime will initialize all of the static fields at the same time, a type with many predefined instances can suffer from visible start-up performance. When exposed as properties, the predefined values can be built on demand, like the `System.Text.Encoding.UTF8` value:'
    - kind: code
      text: |-
        public static Encoding UTF8 {
           get {
              return _utf8Encoding ??= new UTF8Encoding();
           }
        }
    - kind: annotation
      text: |-
        While the example here shows `Color.Red` as a `static readonly` field, the real `System.Drawing.Color.Red` is a get-only property. For value types, like `Color`, using an auto-property with a default value is just as good as a field after the JIT inlines the call:

        ```
        public static Color Red { get; } = new Color(0x0000FF);
        ```
      author: Jeremy Barton
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not checked: whether a type has predefined instances, and whether static readonly fields or get-only properties suit them, is a design choice. CA2211 (non-constant visible static fields) is not mapped: no guideline of 5.5 states it; the section introduction exempts constant and static readonly fields from the rule that fields be private.'
- id: FDG5068
  strength: DO NOT
  text: assign instances of mutable types to public or protected `readonly` fields.
  context: null
  section: 5.5 Field Design
  anchor: sec5_5
  body:
    - kind: paragraph
      text: A mutable type is a type with instances that can be modified after they are instantiated. For example, arrays, most collections, and streams are mutable types, but `System.Int32`, `System.Uri`, and `System.String` are all immutable. The `readonly` modifier on a reference type field prevents the instance stored in the field from being replaced, but it does not prevent the field’s instance data from being modified by calling members changing the instance. The following example shows how it is possible to change the value of an object referred to by a `readonly` field.
    - kind: code
      text: |-
        public class SomeType {
          public static readonly int[] Numbers = new int[10];
        }
        ...
        SomeType.Numbers[5] = 10; // changes a value in the array
    - kind: annotation
      text: The real distinction here is between *deep* versus *shallow* immutability. A deeply immutable type is one whose fields are all `readonly`, and each field is of a type that itself is also deeply immutable. This ensures that a whole object graph is transitively immutable. While deep immutability is certainly the most useful kind, shallow immutability can also be useful. What this guideline is trying to protect you from is believing you’ve exposed a deeply immutable object graph when in fact it is shallow, and then writing code that assumes the whole graph is immutable.
      author: Joe Duffy
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG5068
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
