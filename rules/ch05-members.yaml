- id: FDG5100
  strength: DO
  text: use the least derived parameter type that provides the functionality required by the member.
  context: null
  section: 5.8 Parameter Design
  anchor: sec5_8
  body:
    - kind: paragraph
      text: For example, suppose you want to design a method that enumerates a collection and prints each item to the console. Such a method should take `IEnumerable<T>` as the parameter, not `List<T>` or `IList<T>`, for example.
    - kind: code
      text: |-
        public void WriteItemsToConsole(IEnumerable<object> items) {
           foreach(object item in items) {
             Console.WriteLine(item.ToString());
           }
        }
    - kind: paragraph
      text: None of the specific `IList<T>` members needs to be used inside the method. Typing the parameter as `IEnumerable<T>` allows the end user to pass collections that implement only `IEnumerable<T>` and not `IList<T>`.
    - kind: annotation
      text: Interface isn’t everything. If your algorithm needs a more specialized type to get decent performance, there’s no point in pretending that you only need a base type. Best to make your needs clear—ask for the type that is required to get the designed behavior. Likewise, if your method requires certain thread-safety or security features provided by subtypes, insist on those features in the contract. There’s no point in allowing users to make calls that won’t work.
      author: Rico Mariani
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not checked: which members of a parameter type a member needs, and whether it needs a more derived type for performance, thread safety or security (the Mariani annotation), is a design decision that symbols do not show. CA1859 is not mapped: it asks for more concrete types in non-public code, the opposite direction.'
