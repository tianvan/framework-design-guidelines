- id: FDG5113
  strength: AVOID
  text: using `out` or `ref` parameters except when implementing patterns that require them, such as the Try pattern (section 7.5.2).
  context: null
  section: 5.8.3 Parameter Passing
  anchor: sec5_8_3
  body:
    - kind: paragraph
      text: Using `out` or `ref` parameters requires experience with pointers, understanding how value types and reference types differ, and handling methods with multiple return values. Also, the difference between `out` and `ref` parameters is not widely understood. Framework architects designing for a general audience should not expect users to master the challenge of working with `out` or `ref` parameters.
    - kind: annotation
      text: As a rule, I am not too crazy about `ref` and `out` parameters in APIs. Such APIs compose very poorly, forcing you to declare temporary variables. I much prefer functional designs that convey the entire result in the return value.
      author: Anders Hejlsberg
    - kind: annotation
      text: If you need to return several pieces of data from a call, wrap that data up into a class or struct. For example, .NET has an API to perform hit testing of controls that returns a `HitTestResult` object.
      author: Brian Pepin
    - kind: annotation
      text: Generics and `ref`/`out` parameters interact very nicely. Normally, the variable used to make a `ref` call must be an exact type match, which can be inconvenient. However, if the method is defined with a generic argument that is merely constrained to the required base type, then variables of derived types can be used to make the call. Meanwhile, inference by the compiler makes it unlikely that the caller is impacted by the generic syntax for the method. Very nice!
      author: Jason Clark
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1021
    coverage: partial
  autofix: breaking
