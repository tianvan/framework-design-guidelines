- id: FDG5120
  strength: DO
  text: try to order parameters to make it possible to use the `params` keyword.
  context: null
  section: 5.8.4 Members with Variable Number of Parameters
  anchor: sec5_8_4
  body:
    - kind: paragraph
      text: 'Consider the following overloads on `PropertyDescriptorCollection`:'
    - kind: code
      text: |-
        Sort()
        Sort(IComparer comparer)
        Sort(string[] names, IComparer comparer)
        Sort(params string[] names)
    - kind: paragraph
      text: Because of the order of parameters on the third overload, the opportunity to use the `params` keyword has been lost. The parameters could be reordered to allow for this keyword in both overloads.
    - kind: code
