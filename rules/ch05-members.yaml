  notes: 'FDG5118 reports the params array parameter of an externally visible method or constructor when its body, lambdas and local functions included, assigns an element of the array: a simple, compound, null-coalescing or deconstruction assignment, or an increment or decrement. Overrides and interface implementations are not reported. Changes made through calls, such as Array.Sort or Array.Clear, or through ref arguments, are not seen, and neither are params collections other than arrays (C# 13). The text asks not to use params for such a member, so the fix removes params, which callers that pass the elements inline rely on; it is breaking, and there is no code fix.'
- id: FDG5119
  strength: CONSIDER
  text: using the `params` keyword in a simple overload, even if a more complex overload could not use it.
  context: null
  section: 5.8.4 Members with Variable Number of Parameters
  anchor: sec5_8_4
  body:
    - kind: paragraph
      text: 'Ask yourself if users would value having the params array in one overload, even if it wasn’t in all overloads. Consider the following overloaded method:'
    - kind: code
      text: |-
        public class Graphics {
          FillPolygon(Brush brush, params Point[] points) { ... }
          FillPolygon(Brush brush, Point[] points, FillMode fillMode) {
            ...
          }
        }
    - kind: paragraph
      text: The array parameter of the second overload is not the last parameter in the parameter list, so it cannot use the `params` keyword. This does not mean that the keyword should not be used in the first overload, where it is the last parameter. If the first overload is used often, users will appreciate the addition.
