- id: FDG5057
  strength: DO
  text: use `System.EventHandler<T>` instead of manually creating new delegates to be used as event handlers.
  context: null
  section: 5.4 Event Design
  anchor: sec5_4
  body:
    - kind: code
      text: |-
        public class NotifyingContactCollection : Collection<Contact> {
          public event EventHandler<ContactAddedEventArgs> ContactAdded;
           ...
        }
    - kind: paragraph
      text: If you’re adding new events to an existing feature area that uses traditional event handlers, then continue using the existing event handler types to remain consistent within the feature area, and use new custom event handler types if using the generic handler feels inconsistent with the feature area. For example, when defining new events related to types in the `System.Windows.Forms` namespace, you might want to continue using manually created handlers.
    - kind: annotation
      text: You wouldn’t believe how long we debated this. On the one hand, `EventHandler<T>` doesn’t really buy you that much over the one-line declaration of your own event handler. In fact, the syntax is quite a bit more confusing. On the other hand, reducing the number of classes that need to be loaded by your code improves performance. I’ve never been a big fan of choosing performance over ease of use (performance gets better over time; ease of use doesn’t). The current round of compilers allows you to leave out the new `EventHandler<ContactAddedEventArgs>()` business, however, so this doesn’t really impact ease of use that much. We also solved the last hurdle—getting the Visual Studio designers to understand generic events—so I’ll be glad to finally put this debate to bed.
      author: Brian Pepin
    - kind: paragraph
      text: Creating new custom event handlers is rare, and the guidance has been archived to Appendix B.
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1003
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
