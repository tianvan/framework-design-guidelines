- id: FDG5065
  strength: DO NOT
  text: provide instance fields that are public or protected.
  context: null
  section: 5.5 Field Design
  anchor: sec5_5
  body:
    - kind: paragraph
      text: You should provide properties for accessing fields instead of making them public or protected.
    - kind: paragraph
      text: Very trivial property accessors, as shown here, can be inlined by the Just-in-Time (JIT) compiler and provide performance on par with that of accessing a field.
    - kind: code
      text: |-
        public struct Point{
           private int x;
           private int y;

           public Point(int x, int y){
              this.x = x;
              this.y = y;
           }

           public int X {
             get{ return x; }
          }

           public int Y{
             get{ return y; }
           }
        }
    - kind: paragraph
      text: 'By not exposing fields directly to the developer, the type can be versioned more easily, and for the following reasons:'
    - kind: list
      text: |-
        - A field cannot be changed to a property while maintaining binary compatibility.
        - The presence of executable code in get and set property accessors allows later improvements, such as on-demand creation of an object for usage of the property, or a property change notification.
    - kind: annotation
      text: Fields are the bane of my existence. Because reflection treats fields and properties as different constructs, any system that walks an object graph must special-case both of them. Data binding always looks only at properties; runtime serialization looks only at fields. The fact that we didn’t unify these two (treating properties as smart fields) is definitely a regret of mine. However, as Rico Mariani would say, properties have additional overhead. And as I would say, fields don’t version. You can never promote a field to be a property when you want to add validation, change notification, put it in an interface, and so on. Fields are private data; they are the stores behind your public contract, which should be implemented with properties, methods, and events.
      author: Chris Anderson
    - kind: annotation
      text: Personally, I always make my fields private. I don’t even expose fields as internal, because doing so would give me no protection from code in my own assembly.
      author: Jeffrey Richter
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1051
    coverage: full
  autofix: breaking
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: the body''s reasons are versioning (a field cannot become a property while keeping binary compatibility). CA1051 reports public and protected instance fields of externally visible types; in a probe with SDK 10.0.402 it reported fields of structs and readonly fields too, and no static fields, as the text says. CA1051 has no code fix, and making a public field a property changes the public API, so the fix is breaking.'
- id: FDG5066
  strength: DO
  text: use constant fields for constants that will never change.
  context: null
  section: 5.5 Field Design
