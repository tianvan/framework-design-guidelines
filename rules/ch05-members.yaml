- id: FDG5104
  strength: DO
  text: be consistent in naming parameters when overriding members or implementing interface members.
  context: null
  section: 5.8 Parameter Design
  anchor: sec5_8
  body:
    - kind: paragraph
      text: This better communicates the relationship between the methods.
    - kind: code
      text: |-
        public interface IComparable<T> {
          int CompareTo(T other);
        }

        public class Nullable<T> : IComparable<Nullable<T>> {
          // correct
          public int CompareTo(Nullable<T> other) { ... }
          // incorrect
          public int CompareTo(Nullable<T> nullable) { ... }
        }

        public class Object {
