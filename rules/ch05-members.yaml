  notes: 'CA1021 reports an out parameter of an externally visible method; in a probe with SDK 10.0.402 it did not report a Try method that returns bool, the pattern the text names, nor a Deconstruct method. Other patterns that require out parameters are not known to it, and ref parameters are not checked. CA1045 (ref parameters) is not mapped, a narrowing after the noise run: all 3 of its reports on the samples were a protected Set<T>(ref T field, T value, string propertyName) helper of the property change notification pattern, a pattern that requires ref, which the text excepts; CA1045 reports every ref parameter, a generic Swap<T>(ref T, ref T) included, and cannot tell such patterns apart. FDG5114 reports ref parameters of reference types. Removing an out parameter changes the public API, so the fix is breaking; CA1021 has no code fix.'
- id: FDG5114
  strength: DO NOT
  text: pass reference types by reference (`ref` or `in`).
  context: null
  section: 5.8.3 Parameter Passing
  anchor: sec5_8_3
  body:
    - kind: paragraph
      text: There are some limited exceptions to the rule, such as when a method can be used to swap references. There is no reason to pass a reference type with the `in` modifier (`ref readonly` semantics).
    - kind: code
      text: |-
        public static class Reference {
          public void Swap<T>(ref T obj1, ref T obj2){
            T temp = obj1;
            obj1 = obj2;
            obj2 = temp;
          }
        }
    - kind: annotation
      text: Swap always comes up in these discussions, but I have not written code that actually needed a swap function since college. Unless you’ve got a very good reason, avoid `out` and `ref` altogether.
      author: Chris Sells
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG5114
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: 'Do not pass the reference type parameter ''{0}'' of ''{1}'' by reference'
    category: Members
  notes: 'FDG5114 reports a ref, in or ref readonly parameter of a reference type (a class, interface, delegate, array or string, or a type parameter constrained to a reference type) of an externally visible method, constructor, delegate, operator or indexer. Overrides and interface implementations are not reported. The swap exception of the body is recognized by its shape: ref parameters are not reported when the member has two or more ref parameters of the same type. Other limited exceptions, such as a helper that assigns a caller''s field through a ref parameter of a class-constrained type parameter (LazyInitializer.EnsureInitialized, Interlocked.Exchange, a property setter helper), are reported; such reports are false positives. in and ref readonly parameters are always reported, since the body says there is no reason for them. An unconstrained type parameter, as in the Swap<T> example, is not a reference type and is not reported. CA1045 is not mapped (see FDG5113). Changing how a public parameter is passed changes the public API, so the fix is breaking; there is no code fix.'
- id: FDG5115
  strength: DO NOT
  text: pass value types by read-only reference (`in`).
  context: null
  section: 5.8.3 Parameter Passing
  anchor: sec5_8_3
  body:
    - kind: paragraph
      text: The main benefit of passing a value type by read-only reference is to reduce the cost of copying the value when the type is large. Since the guidance for value types is that they should be small (section 4.2), the performance benefit is slight. Conversely, if your method reads a property or invokes a method—without the appropriate `readonly` modifier—on an `in` parameter, you end up paying the cost silently. Once the compiler has made two defensive copies (or one copy if the type is small), your API now pays a performance penalty for the modifier, rather than receiving a performance boost.
    - kind: paragraph
      text: This performance penalty risk, combined with some CLR languages having unpleasant syntax for passing by reference, means you should rarely, if ever, use the `in` modifier in public or protected methods.
    - kind: annotation
      text: The `in` modifier, like large structs, can be useful in private or internal code. The edge cases and gotchas to this modifier can be noticed in private code and changed to pass-by-value or “full” `ref`. Since public (and protected) members can’t freely change from `in` to `ref`—or from `in` to by-value—when performance testing says to do so, we advise against using the `in` modifier in those members.
      author: Jeremy Barton
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG5115
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: 'Do not pass the value type parameter ''{0}'' of ''{1}'' by read-only reference'
    category: Members
  notes: 'Library only: the text and the Barton annotation are about public and protected members, which cannot change the modifier later without breaking callers; in private or internal code the in modifier can be useful. FDG5115 reports an in or ref readonly parameter of a value type (a struct, an enum, or a type parameter constrained to a value type) of an externally visible method, constructor, delegate, operator or indexer. Overrides and interface implementations are not reported, and neither is an in parameter of an unconstrained type parameter. Changing the modifier changes the public API, so the fix is breaking; there is no code fix.'
- id: FDG5116
