- id: FDG5019
  strength: CONSIDER
  text: implementing interface members explicitly to simulate variance (change parameters or return types in “overridden” members).
  context: null
  section: 5.1.2 Implementing Interface Members Explicitly
  anchor: sec5_1_2
  body:
    - kind: paragraph
      text: For example, `IList` implementations often change the type of the parameters and returned values to create strongly typed collections by explicitly implementing (hiding) the loosely typed member and adding the publicly implemented strongly typed member.
    - kind: code
      text: |-
        public class StringCollection : IList {
          public string this[int index]{ ... }
          object IList.this[int index] { ... }
          ...
        }
  status: verified
