- id: FDG5080
  strength: DO NOT
  text: define extension methods implementing a feature in namespaces normally associated with other features. Instead, define them in the namespace associated with the feature they belong to.
  context: null
  section: 5.6 Extension Methods
  anchor: sec5_6
  body:
    - kind: paragraph
      text: Similar to the guidance that the name of the class containing the extension method definitions should reflect its functionality, choose the namespace of the defining class to match the functionality instead of based on the fact that it is providing extension methods.
    - kind: paragraph
      text: Remember that not all languages can use extension invocation, and consider the static method invocation experience.
    - kind: annotation
      text: |-
        Section 2.2.4.1 covers the topic of layering in namespaces, which I think applies well to extension methods.

        One scenario I’ve seen is to put functionality that is more advanced or esoteric in a separate namespace. That way, for core scenarios, these extra methods do not “pollute” the API. Developers who know about the namespace, or need these alternative scenarios, can add the namespace and gain access to these extra methods.

        The drawback, of course, is that this results in a “hidden” API that is not very discoverable.
      author: Phil Haack
  status: verified
