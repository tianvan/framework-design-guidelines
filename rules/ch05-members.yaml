- id: FDG5016
  strength: DO
  text: move all default parameters to the new, longer overload when adding optional parameters to an existing method.
  context: null
  section: 5.1.1 Member Overloading
  anchor: sec5_1_1
  body:
    - kind: paragraph
      text: In the previous example, when adding the `bufferSize` parameter, the existing `DecodeFromUtf8` method should change to no longer have a default value for the `isFinalBlock` parameter when the new overload is added. This method cannot be deleted without introducing a runtime breaking change (a `MissingMethodException`) in upgrade scenarios. Since having a simple parameter after an `out` parameter makes this `DecodeFromUtf8` overload no longer conform to design guidelines, it is advisable to attribute it as `[EditorBrowsable(EditorBrowsableState.Never)]`. IntelliSense will only show the new overload with the additional optional parameters.
    - kind: code
      text: |-
        // This overload no longer has a default value for isFinalBlock,
        // and has been marked as hidden from IntelliSense.
        [EditorBrowsable(EditorBrowsableState.Never)]
        public static OperationStatus DecodeFromUtf8(
         ReadOnlySpan<byte> utf8,
         Span<byte> bytes,
         out int bytesConsumed,
         out int bytesWritten,
         bool isFinalBlock) { /* call the longer overload */ }

        public static OperationStatus DecodeFromUtf8(
         ReadOnlySpan<byte> utf8,
         Span<byte> bytes,
         out int bytesConsumed,
         out int bytesWritten,
         bool isFinalBlock = true,
         int bufferSize = 512) { ... }
  status: verified
