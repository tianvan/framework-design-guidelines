  notes: 'Not an analyzer candidate: whether a new name is better is a matter of judgment, and the body asks for it to be done extremely sparingly.'
- id: FDG5021
  strength: DO NOT
  text: use explicit members as a security boundary.
  context: null
  section: 5.1.2 Implementing Interface Members Explicitly
  anchor: sec5_1_2
  body:
    - kind: paragraph
      text: Such members can be called by any code by simply casting an instance to the interface.
    - kind: annotation
      text: Generally, objects that have security issues should expose the fewest possible interfaces and inherit as little as possible. Get your code reuse by encapsulation rather than by inheritance, and seal as much as you can. My biggest dissent with the guidelines is that they do not recommend sealing as often as I believe they should. Where there are security issues, be more careful and consider sealing more aggressively, inheriting less aggressively, and using explicit (sealed) implementations of those interfaces you need to offer.
      author: Rico Mariani
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether a member is meant as a security boundary is a matter of intent.'
- id: FDG5022
  strength: DO
  text: provide a protected virtual member that offers the same functionality as the explicitly implemented member if the functionality is meant to be specialized by derived classes.
  context: null
  section: 5.1.2 Implementing Interface Members Explicitly
  anchor: sec5_1_2
  body:
    - kind: paragraph
      text: Explicitly implemented members cannot be overridden. They can be redefined, but then subtypes cannot call the base method’s implementation. It is recommended that you name the protected member by either using the same name or affixing `Core` to the interface member name.
    - kind: code
      text: |-
        [Serializable]
        public class List<T> : ISerializable {
          ...
           void ISerializable.GetObjectData(
            SerializationInfo info, StreamingContext context) {
            GetObjectData(info,context);
           }

           protected virtual void GetObjectData(
            SerializationInfo info, StreamingContext context) {
            ...
           }
        }
    - kind: annotation
      text: Classes designed to be subclassed in normal use need extra care. The times when the `Core` functions are called is part of the contract, so document it well and try not to change it. Access to protected members might allow partially trusted code to do bad things to the internal state. You must code with the expectation that the subclass will be hostile.
      author: Rico Mariani
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1033
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA1033 reports an explicit interface implementation in an unsealed externally visible type when the type has no externally visible method of the same name for derived classes. It cannot tell whether the functionality is meant to be specialized. It accepts only a derived-visible member with the same name; it also reports an explicit implementation that delegates to a protected virtual XxxCore member, which the body allows ("the same name or affixing Core"), and such reports are not violations. In a probe with SDK 10.0.402 it did not report explicit implementations with an empty body. Its fix seals the type or changes the members, which changes the public API, so it is breaking.
