- id: FDG5031
  strength: AVOID
  text: throwing exceptions from property getters.
  context: null
  section: 5.2 Property Design
  anchor: sec5_2
  body:
    - kind: paragraph
      text: Property getters should be simple operations and should not have any preconditions. If a getter can throw an exception, it should probably be redesigned to be a method. Notice that this rule does not apply to indexers, where we do expect exceptions as a result of validating the arguments.
    - kind: annotation
      text: Notice that this guideline only applies to property getters. It is OK to throw an exception in a property setter. It is very much like setting an array element, which can throw as well (and not just when checking the index bound, but also when checking for a type mismatch between the value and the array element type).
      author: Patrick Dussud
    - kind: annotation
      text: Patrick’s guidance speaks to one of the key reasons that exceptions and object-oriented programming environments go hand in hand. Object-oriented environments impose many circumstances in which the developer of a method has limited or no control of the methods signature. Properties, events, constructors, virtual overrides, and operator overloads are examples of this. What exceptions do is take the error response of a method call out of band of the signature or return type. This introduces the necessary flexibility to both reflect and react to failure in any method regardless of the syntax sugar that restricts signature decisions.
      author: Jason Clark
    - kind: annotation
      text: Another pattern to avoid is blocking the thread inside of a property, because of either I/O or some synchronization operation. This is the extreme example of “doing too much work” inside of a property. In the worst case (deadlock), the property may never actually return to the caller. If the property accesses shared state, it may be necessary to acquire a lock to access it safely, but anything more complicated (like waiting on a `WaitHandle`) is an indication that a method is a better design choice.
      author: Joe Duffy
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1065
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA1065 reports an exception created in a property getter, except InvalidOperationException, NotSupportedException and their subclasses, and, in an indexer getter, also ArgumentException and KeyNotFoundException, which the indexer exception of the body allows. The exceptions it allows are still to be avoided, and exceptions thrown by called methods are not seen. Static constructors are FDG5054. CA1065 has no code fix, and the redesign the body asks for (a method instead of the property) removes the property, which changes the public API, so the fix is breaking. CA1065 also reports Equals, GetHashCode, ToString, operators, finalizers and Dispose, which sections 8.9 and 9.4.1 cover; the one noise-sample report (Dispose) belongs there.
