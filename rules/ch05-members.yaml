- id: FDG5017
  strength: AVOID
  text: implementing interface members explicitly without having a strong reason to do so.
  context: null
  section: 5.1.2 Implementing Interface Members Explicitly
  anchor: sec5_1_2
  body:
    - kind: paragraph
      text: Explicitly implemented members can be confusing to developers because such members don’t appear in the list of public members and can also cause unnecessary boxing of value types.
    - kind: annotation
      text: You need to be especially careful when considering explicitly implementing members on value types. Casting a value type to an interface causes boxing.
      author: Krzysztof Cwalina
    - kind: annotation
      text: |-
        It’s true that casting a value type to an interface causes boxing. However, in some cases the runtime is able to undo it. In other cases, boxing can be avoided via generics and generic specialization. Consider the method:

        ```
        public int CallToInt32<T>(T convertible) where T : IConvertible =>
           convertible.ToInt32();
        ```

        When calling this method with a value type that implements `IConvertible`, even explicitly, it shouldn’t be boxed.
      author: Stephen Toub
    - kind: annotation
      text: Value types are often very simple types with very simple operations on them. You must be especially careful about incurring extra dispatching costs on any of these operations. If the main work at hand is something as simple as comparing one value to another or reinterpreting an integer in another format, then just the cost of the function calls might be more than the actual work you have to do. Keep this in mind or you might find that you have created a value type that is fundamentally unusable for its primary (cheap) purpose.
      author: Rico Mariani
    - kind: annotation
      text: |-
        In general, the reason to explicitly implement an interface method is if your type also has another method with the same name and parameters but with a different return type. For example:

        ```
        class Collection : IEnumerable {
          IEnumerator IEnumerable.GetEnumerator() { ... }
          public MyEnumerator GetEnumerator() { ... }
        }
        ```

        The `Collection` class can’t have two methods called `GetEnumerator` that differ only in return value unless the version that returns an `IEnumerator` is an explicitly implemented interface method (as shown earlier). Now, if someone calls `GetEnumerator`, they are calling the strongly typed version of the method that returns `MyEnumerator`. Aside from this example, there are few other reasons to implement an interface method explicitly.
      author: Jeffrey Richter
    - kind: annotation
      text: One common observation we have made in the API usability studies is that many developers assume that the reason members have been implemented explicitly is that they are not supposed to be used in common scenarios. Thus, they sometimes have a tendency to avoid using these members and spend time looking for some other way to accomplish their task.
      author: Steven Clarke
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: whether there is a strong reason (a member called only through the interface, simulated variance or a better name, FDG5018 to FDG5020) is a matter of intent.'
- id: FDG5018
  strength: CONSIDER
  text: implementing interface members explicitly if the members are intended to be called only through the interface.
  context: null
  section: 5.1.2 Implementing Interface Members Explicitly
  anchor: sec5_1_2
  body:
    - kind: paragraph
      text: This includes mainly members supporting framework infrastructure, such as data binding or serialization. For example, `ICollection<T>. IsReadOnly` is intended to be accessed mainly by the data-binding infrastructure through the `ICollection<T>` interface. It is almost never accessed directly when using types implementing the interface. Therefore, `List<T>` implements the member explicitly.
  status: verified
