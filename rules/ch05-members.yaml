- id: FDG5059
  strength: DO
  text: use a protected virtual method to raise each event. This is applicable only to nonstatic events on unsealed classes—not to structs, sealed classes, or static events.
  context: null
  section: 5.4 Event Design
  anchor: sec5_4
  body:
    - kind: paragraph
      text: For each event, include a corresponding protected virtual method that raises the event. The purpose of the method is to provide a way for a derived class to handle the event using an override. Overriding is a more flexible, faster, and more natural way to handle base class events in derived classes. By convention, the name of the method should start with “On” and be followed with the name of the event.
    - kind: annotation
      text: |-
        Note that using an event handler mechanism gives you maximum flexibility in terms of code that can receive the event—in principle, any object could be notified. Sometimes all that’s necessary is for the object to notify itself or more generally the subtype. If that’s the case, an event might be overkill and all you need is a virtual protected `OnWhatever()` method. This is both cheaper and simpler than an event.

        ```
        public class AlarmClock {
           public event EventHandler<AlarmRaisedEventArgs> AlarmRaised;

           protected virtual void OnAlarmRaised(AlarmRaisedEventArgs e){
             EventHandler<AlarmRaisedEventArgs> handler = AlarmRaised;
             if (handler != null) {
                handler(this, e);
             }
          }
        }
        ```
      author: Rico Mariani
    - kind: paragraph
      text: The derived class can choose not to call the base implementation of the method in its override. Be prepared for this by not including any processing in the method that is required for the base class to work correctly.
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG5059
    coverage: partial
  autofix: no
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: 'Add a protected virtual method ''On{0}'' that raises the event ''{0}'''
    category: Members
  notes: 'Library only: the protected virtual method is for derived classes outside the library, an extensibility point of public API. FDG5059 reports an externally visible instance event declared in an unsealed class when neither the class nor a base class has a protected (or protected internal) virtual, abstract or override method named "On" followed by the event name, the convention the body gives. Structs, sealed and static classes and static events are not reported, as the text says. Override, abstract and explicitly implemented events are not reported: they declare no new event that the class can raise. A raising method with another name is reported; the body names the convention. Adding a protected virtual method changes no existing signature, so the fix is not breaking, but there is no code fix.'
