- id: FDG5069
  strength: AVOID
  text: frivolously defining extension methods, especially on types outside your library or framework.
  context: null
  section: 5.6 Extension Methods
  anchor: sec5_6
  body:
    - kind: paragraph
      text: If you do own source code of a type, consider using regular instance methods instead. If you don’t own the type, but you want to add a method, be very careful. Liberal use of extension methods has the potential to clutter APIs with types that were not designed to have these methods.
    - kind: paragraph
      text: Another thing to consider is that extension methods are a compile-time facility, and not all languages provide support for them. Callers using languages without extension method support will have to use the regular static method call syntax to call your extension methods.
    - kind: paragraph
      text: There are, of course, scenarios in which extension methods should be employed. These are outlined in the guidelines that follow.
    - kind: annotation
      text: |-
        When working on the implementation of the WPF designer for Visual Studio, we made careful use of extension methods. In many places in our code we needed to identify properties based on the values of certain attributes defined for XAML. For example, the content property of a control can be identified by looking for a `ContentPropertyAttribute` on the type, and then using the value of that attribute to look for a property on the type. Having this code everywhere was cumbersome, so we wrote a set of internal extension methods to `Type` to do the work for us:

        ```
        internal static class XamlTypeExtensions {
          internal static PropertyInfo GetContentProperty(this Type source) {
            var attrs = source.GetCustomAttributes(typeof
                                        (ContentPropertyAttribute), true);
            if (attrs.Length > 0) {
              return source.GetProperty(((ContentPropertyAttribute)
                                          attrs[0]).Name);
            }
            return null;
          }
        }
        ```

        Centralizing these types of operations in a set of internal extension methods allowed our code to be much cleaner and allowed us to optimize implementations in one place.
      author: Brian Pepin
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not checked: whether an extension method is frivolous, and whether the extended type belongs to the library, are design judgments. FDG5074 reports extension methods on System.Object.'
- id: FDG5070
  strength: CONSIDER
  text: using extension methods to provide helper functionality relevant to every implementation of an interface.
  context: null
  section: 5.6 Extension Methods
  anchor: sec5_6
  body:
    - kind: paragraph
      text: The primary example of a feature using this guidance is the `System.Linq` namespace. The methods defined on `System.Linq.Enumerable`— such as `Select`, `OrderBy`, `First`, and `Last`—are both *capable of* operating on any `IEnumerable<T>` implementation and *relevant to* any `IEnumerable<T>` instance.
    - kind: paragraph
      text: Many of the methods on the `Enumerable` class do runtime type checks to use more efficient implementations. For example, `IList<T>` has a positional indexer and a `Count` property, so the `Last` method can call that property to execute much faster than doing a `foreach` over everything in the `IEnumerable<T>`. This highlights the main drawback of using extension methods for interface functionality—the lack of polymorphism. If polymorphism is required for the helper functionality to be practical, then providing functionality via an extension method will just set your users up for a bad experience.
    - kind: annotation
      text: |-
        The value of this guideline cannot be overstated. Extension methods provide you with a way to give interfaces not just one default implementation but as many as you need, and you can choose between them simply by bringing the right namespace(s) into your lexical scope with `using`. However, this could be easily abused in the same way that complex `#include` combinations in C++ can make the final code hard to read.

        Another interesting feature of this manner of adding functionality to a class is that you could potentially partition (extension) methods of the same class into different assemblies for performance reasons. Again, this should not be done lightly, because you could cause great confusion.

        This is one of the many times I like to quote from *Spiderman*: “With great power comes great responsibility.”
      author: Rico Mariani
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not checked: whether a helper is relevant to every implementation of an interface is a design judgment.'
- id: FDG5071
  strength: CONSIDER
  text: using extension methods when an instance method would introduce an unwanted dependency.
  context: null
  section: 5.6 Extension Methods
  anchor: sec5_6
  body:
    - kind: paragraph
      text: For example, when the `ReadOnlySpan<T>` type was originally introduced, it was in a stand-alone library. Rather than waiting for an opportunity for `String` to depend on `ReadOnlySpan<char>` for the `AsSpan()` method and having a strong dependency between these types, the `AsSpan` method for `String` was written as an extension method in the library that defined `ReadOnlySpan<T>`.
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not checked: whether an instance method would add an unwanted dependency is a design judgment about layering.'
- id: FDG5072
  strength: CONSIDER
  text: using generic extension methods when an instance method on a generic type is not well defined for all possible type parameters.
  context: null
  section: 5.6 Extension Methods
  anchor: sec5_6
  body:
    - kind: paragraph
      text: For example, a collection of integers has a well-defined behavior for a method like `GetMinimumValue`, but the method is less well defined when the collection contains `HttpContext` values. By using a generic extension method, the `GetMinimumValue` method can specify more restrictive type constraints than the collection generic type.
    - kind: code
      text: |-
        // The collection type has no type restrictions
        public class SomeCollection<T> { ... }

        // A non-generic extensions class
        public sealed class SomeCollectionComparisons {
           // This method is only defined when the collection is
           // of comparable values
           public static T GetMinimumValue<T>(
              this SomeCollection<T> source) where T : IComparable<T> {
              ...
           }
        }
    - kind: paragraph
      text: In addition to making use of generic constraints to restrict applicable types, some methods only make sense on specific generic instantiations, such as the `IsWhiteSpace` method for `ReadOnlySpan<char>`.
    - kind: code
      text: public static bool IsWhiteSpace(this ReadOnlySpan<char> span) {...}
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: suggestion
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not checked: whether an instance method is well defined for every type argument is a design judgment.'
- id: FDG5073
  strength: DO
  text: throw an `ArgumentNullException` when the `this` parameter in an extension method is `null`.
  context: null
  section: 5.6 Extension Methods
  anchor: sec5_6
  body:
    - kind: paragraph
      text: Extension methods are just static methods with some extra “syntactic sugar” in C# and some other languages, and they should perform argument validation like any other method. The guidance for `NullReferenceException` from section 7.3.5 says it should never be thrown from a publicly callable method, and that also applies to extension methods even when invoked in “instance” syntax.
    - kind: paragraph
      text: Silently operating on `null` inputs, and throwing no exception at all, generally confuses developers debugging “impossible” states in their program—when the actually failing code is “clearly” unreachable, because if this was a `null` value the previous statement would have thrown instead. Even if the method would be well behaved with a `null` input as a simple static method, once the `this` modifier is added the method should throw an exception for a `null` first argument.
    - kind: code
      text: |-
        // This should throw an ArgumentNullException
        SomeExtensions.SomeMethod(null);

        // This is the same at runtime,
        // so it should throw the same kind of exception.
        ((SomeType)null).SomeMethod();
  status: verified
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1062
    coverage: partial
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'CA1062 reports a parameter of an externally visible method, the this parameter of an extension method included, that is dereferenced without a null check. It does not report a this parameter that the method never dereferences, which the body asks to validate too, nor one passed on to another method. It also reports the other parameters of every externally visible method; those reports belong to argument validation in 5.8.2, not to this rule. Do not set exclude_extension_method_this_parameter. CA1062 accepts any null check before the dereference: a this parameter that is checked and then silently ignored (return or default), or checked with a different exception, is not reported, although the text asks for ArgumentNullException. CA1062 has no code fix; adding the check changes no signature.'
- id: FDG5074
  strength: AVOID
  text: defining extension methods on `System.Object`.
  context: null
  section: 5.6 Extension Methods
  anchor: sec5_6
  body:
    - kind: paragraph
      text: 'VB users will not be able to call such methods on object references using the extension method syntax, because VB does not support calling such methods. In VB, declaring a reference as `Object` forces all method invocations on it to be late bound (the actual member called is determined at runtime), while bindings to extension methods are determined at compile-time (early bound). For example:'
    - kind: code
      text: |-
        // C# declaration of the extension method
        public static class SomeExtensions{
          static void SomeMethod(this object o){...}
        }

        ' VB will fail to compile as VB.NET does not support calling extension
        ' methods on reference types as Object
        Dim o As Object = ...
        o.SomeMethod();
    - kind: paragraph
      text: VB users will have to call the method using the regular static method call syntax.
    - kind: code
      text: SomeExtensions.SomeMethod(o)
    - kind: paragraph
      text: Note that this guideline applies to other languages where the same binding behavior is present, or where extension methods are not supported.
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG5074
    coverage: full
  autofix: breaking
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: 'Do not define the extension method ''{0}'' on System.Object'
    category: Members
  notes: 'Library only: the reason is callers in VB and other languages that cannot call such methods with extension syntax. FDG5074 reports an externally visible extension method whose this parameter is System.Object. Changing the extended type changes the public API, so the fix is breaking.'
- id: FDG5075
  strength: CONSIDER
  text: naming the type that holds extension methods for its functionality—for example, use “Routing” instead of “[ExtendedType] Extensions.”
  context: null
  section: 5.6 Extension Methods
  anchor: sec5_6
  body:
    - kind: paragraph
      text: In other words, design the static class that holds the extension methods as you would any other static class; then make some of the methods be extension methods, when appropriate.
    - kind: paragraph
      text: This provides for a much better experience in languages without extension syntax, and allows the static class to be the correct choice for where a related method should go even when it can’t be used in extension syntax.
    - kind: code
      text: |-
        // Bad: This class has too many purposes
        public static class SomeCollectionExtensions {

         public static T GetMinimumValue<T>(
           this SomeCollection<T> source) where T : IComparable<T> { ... }

         public static T GetMaximumValue<T>(
           this SomeCollection<T> source) where T : IComparable<T> { ... }

         public static SomeCollection<TNested> Flatten(
           this SomeCollection<TOuter> source)
           where TOuter : IEnumerable<TNested> { ... }
        }

        // Good: These classes each have one purpose
        public static class SomeCollectionComparisons {
         public static T GetMinimumValue<T>(
           this SomeCollection<T> source) where T : IComparable<T> { ... }

         public static T GetMaximumValue<T>(
           this SomeCollection<T> source) where T : IComparable<T> { ... }
        }

        public static class SomeCollectionNestedOperations {
         public static SomeCollection<TNested> Flatten(
           this SomeCollection<TOuter> source)
           where TOuter : IEnumerable<TNested> { ... }
        }
    - kind: annotation
      text: |-
        Many developers love the power and expressivity of extension methods and are tempted to use them in ways that clearly violate these guidelines. In many ways, this seems a lot like operator overloading in the early days of C++, where there was initially vigorous and “creative” use of operators for nonintuitive cases, including the runtime libraries of the language.

        Over time the painful lesson was learned, and operator overloading was one of the features that many companies using C++ all but banned. It provides a one-off saving of some typing at the expense of future transparency of the code, and code is read a lot more times than it is written. Using extension methods for reasons other than the scenarios for interfaces or layering is very similar to this situation.

        As an example, I’ve had some frustrating experiences with using APIs that enthusiastically use extensions. On a multilanguage project I found that a pleasant and intuitive object model in one language was awkward in a language without support for extension methods. I’ve also had cases where I was misled about the type of an instance because some local code was injecting extensions into it.

        Please use extension methods with caution.
      author: Anthony Moore
  status: verified
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG5075
    coverage: partial
  autofix: breaking
  severity:
    library: suggestion
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: 'Name the class ''{0}'' that holds extension methods for its functionality'
    category: Members
  notes: 'Library only: the reason is the experience in languages without extension syntax, where callers see the class name. FDG5075 reports an externally visible static class named "[ExtendedType]Extensions", the pattern of the text: "Extensions" alone, or after the name of a type that one of its extension methods extends (for an interface, with or without its leading I). A name that adds the functionality before the extended type ("[Feature][ExtendedType]Extensions") names the class for its functionality and is not reported. A class named for its extended type in another way (a Helpers suffix, for example) is not seen. Renaming a public class changes the public API, so the fix is breaking.'
- id: FDG5076
  strength: DO NOT
  text: put extension methods in the same namespace as the extended type unless the intention is to add methods to interfaces, for generic type restriction, or for dependency management.
  context: null
  section: 5.6 Extension Methods
  anchor: sec5_6
  body:
    - kind: paragraph
      text: Of course, in the case of dependency management, the type with the extension methods would be in a different assembly.
