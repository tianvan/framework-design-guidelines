- id: FDG5020
  strength: CONSIDER
  text: implementing interface members explicitly to hide a member and add an equivalent member with a better name.
  context: null
  section: 5.1.2 Implementing Interface Members Explicitly
  anchor: sec5_1_2
  body:
    - kind: paragraph
      text: You can say that this amounts to renaming a member. For example, `System.Collections.Concurrent.ConcurrentQueue<T>` implements `IProducerConsumerCollection<T>.TryTake` explicitly and renames it to `TryDequeue`.
    - kind: code
      text: |-
        partial class ConcurrentQueue<T> : IProducerConsumerCollection<T> {
          bool IProducerConsumerCollection<T>.TryTake(out T item) =>
            TryDequeue(out item);

          public bool TryDequeue(out T result) { ... }
        }
    - kind: paragraph
      text: Such member renaming should be done extremely sparingly. In most cases, the added confusion is a bigger problem than the suboptimal name of the interface member.
  status: verified
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
