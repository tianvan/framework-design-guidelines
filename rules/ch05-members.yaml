- id: FDG5099
  strength: AVOID
  text: defining inequality operators against different types.
  context: null
  section: 5.7.3 Inequality Operators
  anchor: sec5_7_3
  body:
    - kind: paragraph
      text: The *reversal* property of inequality says that for any `a < b` that returns `true`, `b > a` should also return `true`. Therefore, to be consistent with the expected inequality behaviors, you need to define both `ThisType < ThatType` and `ThatType > ThisType`. The *asymmetric* property, and the guidance for implementing operators symmetrically, means that you also have to define `ThisType > ThatType` and `ThatType < ThisType`. The *transitive* property says you also have to define `ThisType > ThisType` and `ThisType < ThisType` if you haven’t already. Finally, the guidance about implementing `IComparable<T>` says that both `ThisType` and `ThatType` should be `IComparable<T>` against each other (and themselves)—a task that can be accomplished only when `ThisType` and `ThatType` are in the same assembly.
    - kind: paragraph
      text: 'Rather than implementing six different operators (and even more if `<=` is supported), two interfaces, and two methods, consider making use of a conversion operator (section 5.7.2) or a method or property that converts one type to another. For example, `DateTimeOffset` and `DateTime` can be compared via inequality:'
    - kind: code
      text: |-
        DateTimeOffset a = GetDateTimeOffset();
        DateTime b = GetDateTime();

        // This compiles and behaves as expected
        if (a < b) {
          ...
        }
    - kind: paragraph
      text: '`DateTimeOffset` doesn’t define an `operator <` to compare against a `DateTime`, but instead has an implicit conversion operator to convert a `DateTime` into a `DateTimeOffset` and an `operator <` to compare two `DateTimeOffset` values:'
    - kind: code
      text: |-
        public partial struct DateTimeOffset {
         public static implicit operator DateTimeOffset(DateTime dateTime) {...}

         public static operator <(DateTimeOffset left, DateTimeOffset right){...}
        }
    - kind: paragraph
      text: '`DateTimeOffset` values can be compared to `DateTime` values (the other direction) by using the `DateTimeOffset.UtcDateTime` property.'
    - kind: code
      text: |-
        public partial struct DateTimeOffset {
         public DateTime UtcDateTime { get { ... } }
        }
  status: verified
