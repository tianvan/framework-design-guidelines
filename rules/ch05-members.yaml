- id: FDG5110
  strength: DO
  text: validate enum parameters.
  context: null
  section: 5.8.2 Validating Arguments
  anchor: sec5_8_2
  body:
    - kind: paragraph
      text: Do not assume enum arguments will be in the range defined by the enum. The CLR allows casting any integer value into an enum value even if the value is not defined in the enum.
    - kind: code
      text: |-
        public void PickColor(Color color) {
          if(color > Color.Black || color < Color.White){
            throw new ArgumentOutOfRangeException(...);
          }
        ...
        }
    - kind: annotation
      text: I am not a believer in always validating `[Flags]` enums. Typically, all you can usefully do for them is to confirm that “unused” flags are not used, but this also makes your code unnecessarily fragile (now adding a new flag is a breaking change!). Your code “naturally” would simply ignore unused flags, and I think that is a reasonable semantic. However, if certain combinations of flags are illegal, that should certainly be checked and an appropriate error thrown.
      author: Vance Morrison
  status: verified
