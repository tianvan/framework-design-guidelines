      text: The compiler burns the values of `const` fields directly into calling code. Therefore, `const` values can never be changed without the risk of breaking compatibility.
    - kind: code
      text: |-
        public struct Int32 {
           public const int MaxValue = 0x7fffffff;
           public const int MinValue = unchecked((int)0x80000000);
        }
  status: verified
  style: false
