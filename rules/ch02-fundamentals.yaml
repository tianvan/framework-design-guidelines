- id: FDG2010
  strength: DO NOT
  text: rely solely on standard design methodologies when designing the public API layer of a framework.
  context: null
  section: 2.2.1 The Principle of Scenario-Driven Design
  anchor: sec2_2_1
  body:
    - kind: paragraph
      text: Standard design methodologies (including object-oriented design methodologies) are optimized for the maintainability of the resulting implementation, not for the usability of the resulting APIs. Scenario-driven design, together with prototyping, usability studies, and some amount of iteration, is a much better approach.
    - kind: annotation
      text: Each developer has his or her own methodology, and although there isn’t anything fundamentally wrong with using other modeling approaches, the problem generally is the output. Starting by writing the code you want a developer to write is almost always the best approach—think of it as a form of test-driven development. You write the perfect code and then work backward to figure out the object model that you would want.
      author: Chris Anderson
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: the rule text scopes it to the public API layer of a framework. A design-process rule; not machine-checkable.'
- id: FDG2011
  strength: DO
  text: organize usability studies to test APIs in main scenarios.
  context: null
  section: 2.2.1.1 Usability Studies
  anchor: sec2_2_1_1
  body:
    - kind: paragraph
      text: These studies should be organized early in the development cycle, because the most severe usability problems often require substantial design changes. Most developers should be able to write code for the main scenarios without major problems; if they cannot, you need to redesign the API. Although redesign is a costly practice, we have found that it actually saves resources in the long run because the cost of fixing an unusable API without introducing changes that break existing code is enormous.
    - kind: paragraph
      text: The next section describes the importance of designing APIs so that the initial encounter is not discouraging. This is called the principle of low barrier to entry.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: usability studies with outside developers presuppose a framework with external users. A design-process rule; not machine-checkable.'
- id: FDG2012
  strength: DO
  text: ensure that each main feature area namespace contains only types that are used in the most common scenarios. Types used in advanced scenarios should be placed in subnamespaces.
  context: null
  section: 2.2.2 The Principle of Low Barrier to Entry
  anchor: sec2_2_2
  body:
    - kind: paragraph
      text: For example, the `System.Net` namespace provides networking mainline-scenario APIs. The more advanced socket APIs are placed in the `System.Net.Sockets` subnamespace.
    - kind: annotation
      text: |-
        The converse of this is also true, which could be stated as, “Don’t bury a commonly used type in a namespace with much less commonly used types.” `StringBuilder` is an example of something we later wished we had included in the `System` namespace. It lives in `System.Text` but is much more commonly used than the other types in there and is not closely related to them.

        That being said, this is the only thing in the `System` namespace that suffers from the converse of this rule. For the most part, we suffered from having too many infrequently used types in there.
      author: Anthony Moore
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: which types belong to the most common scenarios is a design judgment. Kept in the application profile for an application''s namespaces.'
- id: FDG2013
