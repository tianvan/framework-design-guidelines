- id: FDG2022
  strength: DO
  text: make the discussion about identifier naming choices a significant part of specification reviews.
  context: null
  section: 2.2.3.1 Naming
  anchor: sec2_2_3_1
  body:
    - kind: paragraph
      text: What are the types most scenarios start with? What are the names most people will think of first when trying to implement this scenario? Are the names of the common types what users will think of first? For example, because “File” is the name most people think of when dealing with file I/O scenarios, the main type for accessing files should be named `File`.
    - kind: paragraph
      text: Also, you should discuss the most commonly used methods of the most commonly used types and all of their parameters. Can anybody who is familiar with your technology, but not this specific design, recognize and call those methods quickly, correctly, and easily?
  status: draft
  style: false
