- id: FDG2021
  strength: DO
  text: provide code samples illustrating how to use your most important APIs in common scenarios.
  context: null
  section: 2.2.3 The Principle of Self-Documenting Object Models
  anchor: sec2_2_3
  body:
    - kind: paragraph
      text: Not all APIs can be self-explanatory, and some developers will want to thoroughly understand the APIs before they start using them.
    - kind: paragraph
      text: To make a framework self-documenting, care must be taken when choosing names and types, designing exceptions, and so on. The following sections describe some of the most important considerations related to the design of self-documenting APIs.
  status: draft
