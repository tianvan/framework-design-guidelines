- id: FDG2014
  strength: DO NOT
  text: have members intended for advanced scenarios on types intended for mainline scenarios.
  context: null
  section: 2.2.2 The Principle of Low Barrier to Entry
  anchor: sec2_2_2
  body:
    - kind: annotation
      text: One of the important principles in designing the .NET Framework was the notion of addition through subtraction. That is, by removing features from (or never adding them to) the framework, we could actually make developers more productive because there would be fewer concepts to deal with. Leaving out multiple inheritance is a classic example of addition through subtraction at the CLR level.
      author: Brad Abrams
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: which members are advanced and which types are mainline is a design judgment.'
- id: FDG2015
  strength: DO NOT
  text: require users to explicitly instantiate more than one type in the most basic scenarios.
  context: null
  section: 2.2.2 The Principle of Low Barrier to Entry
  anchor: sec2_2_2
  body:
    - kind: annotation
      text: 'Book publishers say that the number of copies a book will sell is inversely proportional to the number of equations in the book. The framework designer version of this law is this: The number of developers who will use your framework is inversely proportional to the number of explicit constructor invocations required to implement the top ten simple scenarios.'
      author: Krzysztof Cwalina
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: needs the main scenarios.'
- id: FDG2016
  strength: DO NOT
  text: require that users perform any extensive initialization before they can start programming basic scenarios.
  context: null
  section: 2.2.2 The Principle of Low Barrier to Entry
  anchor: sec2_2_2
  body:
    - kind: paragraph
      text: Mainline-scenario APIs should be designed to require minimal initialization. Ideally, a default constructor or a constructor with one simple parameter should be sufficient to start working with a type designed for the basic scenarios.
    - kind: code
      text: |-
        var zipCodes = new Dictionary<string,int>();
        zipCodes.Add("Redmond",98052);
        zipCodes.Add("Sammamish",98074);
    - kind: paragraph
      text: If some initialization is necessary, the exception that results from not performing the initialization should clearly explain what needs to be done.
    - kind: annotation
      text: |-
        Since the first edition of this book was published, we have done significant usability studies in this area. Time and time again, we observe that types that require extensive initialization significantly raise the barrier to entry. The consequences of this are that some developers will decide not to use those types and will look for something else that might do the job instead, some developers will end up using the type incorrectly, and only a few developers will eventually figure out how to use the type correctly.

        `ADO.NET` is an example of a feature area that our users found difficult to use because of the extensive initialization it requires. Even in the simplest scenarios, users are expected to understand complex interactions and dependencies between several types. To use this feature, even in simple scenarios, users must instantiate and hook up several objects (instances of `DataSet`, `DataAdapter`, `SqlConnection`, and `SqlCommand`). Note that many of these problems were addressed in .NET Framework 2.0 through the addition of helper classes, which greatly simplified basic scenarios.
      author: Steven Clarke
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: needs the main scenarios. The body''s exception message advice is FDG2018 and FDG2026.'
- id: FDG2017
  strength: DO
  text: provide good defaults for all properties and parameters (using convenience overloads), if possible.
  context: null
  section: 2.2.2 The Principle of Low Barrier to Entry
  anchor: sec2_2_2
  body:
    - kind: paragraph
      text: '`System.Messaging.MessageQueue` is a good illustration of this concept. The component can send messages after passing just a path string to the constructor and calling the `Send` method. The message priority, encryption algorithms, and other message properties can be customized by adding code to the simple scenario.'
    - kind: code
      text: |-
        var ordersQueue = new MessageQueue(path);
        ordersQueue.Send(order); // uses default priority, encryption, etc.
    - kind: paragraph
      text: These recommendations cannot be applied blindly. Framework designers should avoid providing defaults if the default can lead the user astray. For example, a default should never result in a security hole or horribly performing code.
    - kind: annotation
      text: When deciding on “defaults,” it’s also critical to understand the primary use cases for the API, and—to whatever extent possible—try to predict expected use cases in the future. One of my top ten “I wish I could do that over again” cases is from `System.Threading. Tasks`. We’d initially designed the APIs with a focus on CPU-based parallelism, but over time the primary use cases ended up being much more focused on IO-based asynchrony, and some of our initial defaults lent themselves much better to the former to the detriment of the latter. In time we addressed these issues as part of adding easier-to-consume APIs, but the initial issues and resulting difficulties persist for developers who find themselves consuming the original APIs.
      author: Stephen Toub
    - kind: annotation
      text: The counterpoint here is very important, and it can be hard to find the right balance. The .NET Cryptography APIs include a number of types that provide defaults to try to be both friendly and secure. Unfortunately, “friendly” persists, but “secure” is a moving target. Sometimes you’re doing your users a favor by providing defaults, and sometimes you’re doing them harm.
      author: Jeremy Barton
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether a default is good (and never insecure or slow, as the body says) is a design judgment.'
- id: FDG2018
  strength: DO
  text: communicate incorrect usage of APIs using exceptions.
  context: null
  section: 2.2.2 The Principle of Low Barrier to Entry
  anchor: sec2_2_2
  body:
    - kind: paragraph
      text: The exceptions should clearly describe their cause and the way the developer should modify the code to get rid of the problem. For example, the `EventLog` component requires the `Source` property to be set before events can be written. If the `Source` is not set before `WriteEntry` is called, an exception is thrown that states, `"Source property was not set before writing to the event log."`
    - kind: annotation
      text: We’ve observed many developers in our usability studies who consider exceptions like these to be the best kind of documentation an API can provide. The guidance provided is always in the context of what the developer is trying to achieve, and it really supports the learning-by-doing approach favored by many developers.
      author: Steven Clarke
    - kind: paragraph
      text: The next section describes the importance of making the object model as self-documenting as possible.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether a message says how to fix the code is judgment. CA2208 (argument exceptions without a message) is left to the chapter 7 exception rules.'
