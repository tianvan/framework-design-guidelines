  text: writing main scenario code samples using a dynamically typed language such as PowerShell or IronPython.
  context: null
  section: 2.2.1 The Principle of Scenario-Driven Design
  anchor: sec2_2_1
  body:
    - kind: paragraph
      text: It is easy to design APIs that don’t work well with dynamically typed languages. Such languages often have problems dealing with some generic methods, as well as APIs that rely on applying attributes or creating strongly typed types.
  status: draft
