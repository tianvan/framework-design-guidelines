- id: FDG2005
  strength: DO
  text: define top usage scenarios for each major feature area.
  context: null
  section: 2.2.1 The Principle of Scenario-Driven Design
  anchor: sec2_2_1
  body:
    - kind: paragraph
      text: The API specification should include a section that describes the main scenarios and shows code samples implementing these scenarios. This section should appear immediately after the executive overview section. The average feature area (such as file I/O) should have five to ten main scenarios.
  status: draft
