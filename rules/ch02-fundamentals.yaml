- id: FDG2025
  strength: CONSIDER
  text: reserving the best type names for the most commonly used types.
  context: null
  section: 2.2.3.1 Naming
  anchor: sec2_2_3_1
  body:
    - kind: paragraph
      text: If you believe you will add more high-level APIs in a future version, don’t be afraid to reserve the best name in the first version of your framework for future APIs.
    - kind: annotation
      text: There are other reasons to avoid names that are too general, even if you never anticipate using the name later. More-specific names help to make the API more understandable and readable. If someone sees a general name in code, that person is likely to assume that it has a very general application, so it is misleading to use a general name for something more specialized. A more descriptive name can also help identify what scenario or technology a type is associated with.
      author: Anthony Moore
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
