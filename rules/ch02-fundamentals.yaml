- id: FDG2027
  strength: DO
  text: provide strongly typed APIs if at all possible.
  context: null
  section: 2.2.3.3 Strong Typing
  anchor: sec2_2_3_3
  body:
    - kind: paragraph
      text: Do not rely exclusively on weakly typed APIs such as property bags. In cases in which a property bag is required, provide strongly typed properties for the most common properties in the bag.
    - kind: annotation
      text: The strong typing (and thus much better Intelli-Sense) is a crucial reason why .NET frameworks are easier to “learn by programming” than your typical COM API. From time to time, I still need to use functionality exposed through COM, and as long as it stays strongly typed, I do fine. But all too often APIs return or take a generic object or string parameter or passed DWORD when an enumeration is needed, and it takes me ten times longer to discover what exactly needs to be passed.
      author: Vance Morrison
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: object, string or property-bag parameters are sometimes required (the body allows property bags), so a check would have to guess intent.'
- id: FDG2028
  strength: DO
  text: ensure consistency with .NET and other frameworks your users are likely to interact with.
  context: null
  section: 2.2.3.4 Consistency
  anchor: sec2_2_3_4
  body:
    - kind: paragraph
      text: Consistency is great for general usability. If a user is familiar with some part of a framework that your API resembles, he or she will see your design as natural and intuitive. Your API should differ from other .NET APIs only in places where there is something unique about your particular API.
  status: draft
