    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'A design-review rule; not machine-checkable. Kept in the application profile for an application''s layer contracts.'
- id: FDG2023
  strength: DO NOT
  text: be afraid to use verbose identifier names when doing so makes the API self-documenting.
  context: null
  section: 2.2.3.1 Naming
  anchor: sec2_2_3_1
  body:
    - kind: paragraph
      text: Most identifier names should clearly state what each method does and what each type and parameter represents.
    - kind: annotation
      text: |-
        Developers read identifier names hundreds, if not thousands, of times more than they type them. Modern editors even make the typing chore minimal. Longer names allow developers to find the right type or member via IntelliSense more quickly. Additionally, code using types with well-chosen identifier names is more understandable and maintainable over the long term.

        A note to C-based language developers especially: Free yourselves from the shackles of reduced productivity induced by cryptic identifier naming habits.
      author: Brent Rector
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable. It complements FDG3014 (no abbreviations) and FDG3008 (readable names).'
