- id: FDG2006
  strength: DO
  text: ensure that the scenarios correspond to an appropriate abstraction level. They should roughly correspond to the end-user use cases.
  context: null
  section: 2.2.1 The Principle of Scenario-Driven Design
  anchor: sec2_2_1
  body:
    - kind: paragraph
      text: For example, reading from a file is a good scenario. Opening a file, reading a line of text from a file, or closing a file are not good scenarios; they are too granular.
  status: draft
