- id: FDG2001
  strength: DO
  text: design frameworks that are both powerful and easy to use.
  context: null
  section: "2"
  anchor: ch02
  body:
    - kind: paragraph
      text: A well-designed framework makes implementing simple scenarios easy. At the same time, it does not prohibit implementing more advanced scenarios, though these might be more difficult. As Alan Kay said, “Simple things should be simple and complex things should be possible.”
    - kind: paragraph
      text: This guideline is also related to the Pareto principle (the 80/20 rule), which says that in any situation, 20 percent will be important, and 80 percent will be trivial. When designing a framework, concentrate on the important 20 percent of scenarios and APIs. In other words, invest in the design of the most commonly used parts of the framework.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'A design principle for the whole API; not machine-checkable. Applies to an application''s internal layers too (design §5.1, layer contracts).'
- id: FDG2002
  strength: DO
  text: understand and explicitly design for a broad range of developers with different programming styles, requirements, and skill levels.
  context: null
  section: "2"
  anchor: ch02
  body:
    - kind: annotation
      text: There is no magic bullet when designing frameworks for Visual Basic developers. Our users run the gamut from people who are picking up a programming tool for the first time to industry veterans building large-scale commercial applications. The key to designing a framework that appeals to Visual Basic developers is to focus on allowing them to get the job done with the minimum amount of fuss and bother. Designing a framework that uses the minimum number of concepts is a good idea, not because VB developers can’t handle concepts, but because having to stop and think about concepts extraneous to the task at hand interrupts workflow. The goal of a VB developer usually is not to learn some interesting or exciting new concept or to be impressed with the intellectual purity and simplicity of your design, but to get the job done and move on.
      author: Paul Vick
    - kind: annotation
      text: It is easy to design for users who are like you, and very difficult to design for somebody unlike you. There are too many APIs that are designed by domain experts and, frankly, they are only good for domain experts. The problem is that most developers are not, will never be, and do not need to be experts in all technologies used in modern applications.
      author: Krzysztof Cwalina
    - kind: annotation
      text: Although the famous Hewlett-Packard motto “Build for the engineer at the next bench” is useful for driving quality and completeness into software projects, it is misleading for API design. For example, the developers on the Microsoft Word team have a clear understanding that they are not the target customers for Word. My mom is much more the target customer. Therefore the Word team puts in many more features that my mom might find helpful rather than the features the development team finds helpful. Although that is obvious in the case of applications such as Word, we often tend to miss the principle when designing APIs. We tend to design APIs only for ourselves instead of thinking clearly about the customer scenarios.
      author: Brad Abrams
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable. Kept in the application profile: an application''s internal layers are also used by developers of different skill levels.'
- id: FDG2003
  strength: DO
  text: understand and design for the broad variety of programming languages.
  context: null
  section: "2"
  anchor: ch02
  body:
    - kind: paragraph
      text: Many programming language implementations are available that support the Common Language Runtime (CLR) and .NET. Some of these languages might be very different from the language you are using to implement your APIs. Often special care needs to be taken to ensure that your APIs can work well with a variety of languages.
    - kind: paragraph
      text: For example, developers using dynamically typed languages with the capability of interacting with .NET (such as PowerShell, IronPython, and others) might have problems using APIs that require them to create a custom type with attributes.
    - kind: paragraph
      text: As another example, the F# language does not honor user-defined implicit conversion operators. In consequence, APIs designed with implicit conversions to facilitate calling patterns will not necessarily be easy to use in F#.
    - kind: annotation
      text: Designing for the least common denominator of existing programming languages started to hamper evolution of the .NET platform. It was deemphasized in recent years to enable innovations such as `Span<T>`. C# and F# introduced new language features to enable `Span<T>`. Other traditional .NET-targeting languages (such as Visual Basic) have not enabled it, however, and the new Span-based APIs cannot be used from them.
      author: Jan Kotas
    - kind: annotation
      text: While it’s true that we added `Span<T>` without language support from VB, the guidance for using the Span types—found in section 9.12—recommends having array-based alternative methods. That recommendation is based partly on usability, but ultimately comes back to this guideline and the variety of languages that can interact with the .NET CLR.
      author: Jeremy Barton
    - kind: paragraph
      text: Other special considerations for various programming languages are described throughout the book.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: an application''s internal layers are consumed from the application''s own language. CA1014 (CLSCompliant) is not mapped, because the body asks for nothing about CLS compliance. The body''s F# example (implicit conversions) is left to the chapter 5 operator overload rules (CA2225 checks named alternates), and keywords of other languages by FDG3012.'
