- id: FDG2007
  strength: DO
  text: design APIs by first writing code samples for the main scenarios and then defining the object model to support the code samples.
  context: null
  section: 2.2.1 The Principle of Scenario-Driven Design
  anchor: sec2_2_1
  body:
    - kind: paragraph
      text: 'For example, when designing an API to measure elapsed time, you might write the following scenario code samples:'
    - kind: code
      text: |-
        // scenario #1 : measure time elapsed
        Stopwatch watch = Stopwatch.StartNew();
        DoSomething();
        Console.WriteLine(watch.Elapsed);

        // scenario #2 : reuse stopwatch
        Dim watch As Stopwatch = Stopwatch.StartNew()
        DoSomething();
        Console.WriteLine(watch.ElapsedMilliseconds)

        watch.Reset()
        watch.Start()
        DoSomething()
        Console.WriteLine(watch.Elapsed)
    - kind: paragraph
      text: 'These code samples lead to the following object model:'
    - kind: code
      text: |-
        public class Stopwatch {
           public static Stopwatch StartNew();

           public void Start();
           public void Reset();

           public TimeSpan Elapsed { get; }
           public long ElapsedMilliseconds { get; }
           ...
        }
    - kind: annotation
      text: 'As software developers, we enjoy creating fun and powerful new capabilities, and sharing them with other developers. That’s one of the reasons API design is so enjoyable. But it’s also incredibly difficult to step back and objectively assess whether some new capability that you’re particularly passionate about has utility in the real world. Using scenarios is the best way I know of to identify the need for and ideal usage of new capabilities. Developing scenarios is in fact incredibly *hard*, for good reason: It requires a unique combination of technical skill and customer understanding. When you’re finished, you could make a series of decisions based only on gut feel and intuition, and perhaps deliver some useful APIs, but the risk that you will make a decision you will later regret is far greater. When in doubt, it’s best to leave a feature out and decide to add it later when a compelling need is better understood.'
      author: Joe Duffy
    - kind: annotation
      text: It’s fun to add new APIs. But every new one that’s added comes with a cost. Sometimes that cost is “just” the cost of designing, developing, testing, documenting, and maintaining the functionality (plus the associated run-time costs). It’s unfortunately common, however, that adding an API actually inhibits one’s ability in the future to add other potentially much more desirable or impactful functionality, because such functionality would conflict with the functionality exposed by that API. This is one of the reasons we’re so deliberate in choosing what new APIs to expose, because we might be sealing our fate on some future innovation. If asked, I’m sure many of us have a favorite example of an API we wish we’d never added; I know I have several.
      author: Stephen Toub
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'A design-process rule; not machine-checkable. Kept in the application profile: scenario code first also suits an application''s layer contracts.'
- id: FDG2008
  strength: DO
  text: write main scenario code samples in at least two different language families (e.g., C# and F#).
  context: null
  section: 2.2.1 The Principle of Scenario-Driven Design
  anchor: sec2_2_1
  body:
    - kind: paragraph
      text: It is best to ensure that the languages chosen have significantly different syntax, style, and capabilities.
    - kind: annotation
      text: If you are writing a framework to be used by multiple languages, it is helpful to actually know more than one programming language (and knowing more than one C-style language doesn’t count). We’ve found that sometimes an API works well only in one language, and that’s because the person designing the API (and testing the API) only really knew that one language. Learn several .NET languages and really work with them the way they were designed to be used. Expecting the whole world to speak your language does not work well on a multilanguage platform like the .NET Framework.
      author: Paul Vick
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: none
    test: none
