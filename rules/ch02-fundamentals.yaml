- id: FDG2029
  strength: AVOID
  text: many abstractions in mainline-scenario APIs.
  context: null
  section: 2.2.3.5 Limiting Abstractions
  anchor: sec2_2_3_5
  body:
    - kind: annotation
      text: Abstractions are almost always necessary, but too many abstractions indicate overengineered systems. Framework designers should be careful to design for customers, not for their own intellectual pleasure.
      author: Krzysztof Cwalina
    - kind: annotation
      text: A design with too many abstractions can impact performance, too. I once worked with a customer that reengineered its product to incorporate a heavily object-oriented design. They modeled *everything* as a class and ended up with some ridiculously deeply nested object hierarchies. Part of the intent of the redesign was to improve performance, but the “improved” software ran four times slower than the original!
      author: Jeff Prosise
    - kind: annotation
      text: Anyone who has had the “pleasure” of debugging through the C++ STL libraries knows that abstraction is a double-edged sword. Too much abstraction and code gets very difficult to understand, because you have to remember what all the abstract names really mean in your scenario. Going overboard with generics and inheritance are common symptoms that you may have overgeneralized.
      author: Vance Morrison
    - kind: annotation
      text: It’s often said that any problem in computer science can be solved by adding a layer of abstraction. Unfortunately, problems of developer education are often caused by them.
      author: Chris Sells
  status: draft
