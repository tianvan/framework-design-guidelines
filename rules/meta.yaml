repositoryUrl: https://github.com/tianvan/framework-design-guidelines
chapters:
  - token: "2"
    file: ch02.xhtml
    rules: ch02-fundamentals.yaml
    title: Framework Design Fundamentals
    testProfile: off
    nonGuideline:
      - section: "2"
        disposition: background
        note: "The chapter introduction (a framework for a broad range of developers, one programming model for every kind of application and language) is background for FDG2001 to FDG2003, which follow it."
      - section: "2.1"
        disposition: background
        note: "Progressive Frameworks: the history of multiframework platforms, Figures 2-1 and 2-2 (learning curves) and the Hejlsberg and Vick annotations are background for the chapter's aim of one framework with a gradual learning curve. No guideline is stated."
      - section: "2.2"
        disposition: rationale
        note: "The section introduction, the Mariani annotation and the Pit of Success sidebar explain why the principles of 2.2.1 to 2.2.4 exist (VB.NET usability problems, making the right way the easy way). They are rationale for all of the chapter's rules."
      - section: "2.2.1"
        disposition: rationale
        note: "The Framework Design Principle box (frameworks must be designed starting from usage scenarios and code samples), the narrative on scenario-driven API specifications and language-specific samples, and footnote 3 (TDD and use cases) are rationale for FDG2004 to FDG2010."
      - section: "2.2.1.1"
        disposition: rationale
        note: "The narrative and annotations on formal and informal usability studies are rationale for FDG2011."
      - section: "2.2.2"
        disposition: rationale
        note: "The Framework Design Principle box (a low barrier to entry through ease of experimentation) and the list of what an API must do to be easy to experiment with are rationale for FDG2012 to FDG2018."
      - section: "2.2.3"
        disposition: rationale
        note: "The Framework Design Principle box (in simple scenarios, frameworks must be usable without documentation) and the Sells and Cwalina annotations are rationale for FDG2019 to FDG2021."
      - section: "2.2.3.1"
        disposition: rationale
        note: "The narrative on reserving simple names for common types (the File and NtfsFile example) and on descriptive names is rationale for FDG2022 to FDG2025."
      - section: "2.2.3.2"
        disposition: rationale
        note: "The EventLog example of an exception message is rationale for FDG2026; chapter 7 holds the exception guidelines."
      - section: "2.2.3.3"
        disposition: rationale
        note: "The narrative on strong typing and on property bags as an exception to the rule is rationale for FDG2027."
      - section: "2.2.3.4"
        disposition: rationale
        note: "The narrative on consistency with familiar APIs is rationale for FDG2028."
      - section: "2.2.3.5"
        disposition: rationale
        note: "The narrative on abstractions in common-scenario APIs (and their place in testability and extensibility, see chapter 6) is rationale for FDG2029."
      - section: "2.2.4"
        disposition: rationale
        note: "The Framework Design Principle box (layered design gives both power and ease of use), the narrative on low-level and high-level APIs and the JSON example are rationale for FDG2030 to FDG2032."
      - section: "2.2.4.1"
        disposition: rationale
        note: "Exposing layers in separate namespaces, the networking example and the remark that most frameworks should factor namespaces this way have no guideline icon. They are rationale for FDG2031, which advises against the alternative of 2.2.4.2 when the low-level APIs are complex."
      - section: "2.2.4.2"
        disposition: rationale
        note: "The narrative on layers in one namespace (the System.Text example) and the Clarke annotation on runtime behavior across layers are rationale for FDG2030 to FDG2032."
      - section: "Summary"
        disposition: background
        note: "The chapter summary restates the chapter's aim and states no guideline."
  - token: "3"
    file: ch03.xhtml
    rules: ch03-naming.yaml
    title: Naming Guidelines
    testProfile: off
    nonGuideline:
      - section: "3.1.1"
        disposition: background
        note: "Brad Abrams' annotation on the history of Table 3-1 (the dropped convention for instance field names) is background; it is kept in the body of FDG3002."
      - section: "3.4"
        disposition: background
        note: "The narrative that introduces the namespace categories (application model, core, technology groups) is background for the rules of 3.4.1; the category definitions themselves are not guidelines."
      - section: "3.6.4"
        disposition: background
        note: "The opening text scopes the field guidelines to static public and protected fields (internal and private fields are not covered, and public or protected instance fields are disallowed by the member design guidelines in chapter 5). It is background for the field rules that follow."
  - token: "4"
    file: ch04.xhtml
    rules: ch04-types.yaml
    title: Type Design Guidelines
    testProfile: off
    references:
      - { file: ch04-types-4-1-to-4-4, sections: ["4", "4.1", "4.2", "4.3", "4.4"] }
      - { file: ch04-types-4-5-on, sections: ["4.5", "4.6", "4.7", "4.8", "4.9", "4.10", "4.11"] }
    nonGuideline:
      - section: "4"
        disposition: background
        note: "The chapter introduction and Figure 4-1 (the logical grouping of types: classes, interfaces, structs, enums, static classes, and the special reference types discussed elsewhere) are background for the whole chapter; FDG4001 follows them."
      - section: "4.1"
        disposition: rationale
        note: "The narrative on top-down factoring of a large framework into namespaces is rationale for FDG4002 to FDG4006; the namespace naming guidelines are in section 3.4."
      - section: "4.2"
        disposition: rationale
        note: "The comparison of reference and value types (allocation, arrays, boxing, assignment, parameter passing), footnote 1 on immutable types and the Mariani and Sells annotations are rationale for FDG4007 and FDG4008."
      - section: "4.3"
        disposition: rationale
        note: "The narrative on evolving class-based and interface-based APIs (the Stream timeout example, the three StreamReader options, `CollectionContract<T>`), the Barton annotation on default interface methods and the Cwalina annotation on interfaces as contracts are rationale for FDG4009 to FDG4012. The Barton annotation's proto-guideline on default interface methods has no icon and is not a rule."
      - section: "4.5"
        disposition: rationale
        note: "The definition of static classes, the C# and C++ examples and the narrative on their use (shortcuts, extension method holders) are rationale for FDG4016 to FDG4019."
      - section: "4.6"
        disposition: rationale
        note: "The narrative on interfaces as the CLR's substitute for multiple inheritance and as a common API for value types (the Component, Boolean and String examples) is rationale for FDG4020 and FDG4021."
      - section: "4.7"
        disposition: background
        note: "The introduction defines a struct as the general-purpose value type and points to section 4.8 for enums. It is background for FDG4026 to FDG4033."
      - section: "4.8"
        disposition: rationale
        note: "The definitions of simple and flag enums with the Color and AttributeTargets examples, the Abrams and Clarke annotations and the narrative on enums replacing integer constants are rationale for FDG4034 to FDG4043."
      - section: "4.8.1"
        disposition: background
        note: "The Richter annotation on using flag enums is background for FDG4044 to FDG4049."
      - section: "4.8.2"
        disposition: rationale
        note: "The narrative on the compatibility risk of adding a value that an existing API returns is rationale for FDG4050."
      - section: "4.9"
        disposition: rationale
        note: "The definition of nested types, the OuterType example and the narrative on when nested types suit implementation details are rationale for FDG4051 to FDG4056."
      - section: "4.10"
        disposition: background
        note: "The introduction, which says several attributes should be applied to assemblies with public types, is background for FDG4057 to FDG4062."
      - section: "4.11"
        disposition: rationale
        note: "The narrative on the gap between enums and strings (the RSACryptoServiceProvider.SignData example), footnote 6 and the HashAlgorithmName example of a strongly typed string are rationale for FDG4063 to FDG4070."
      - section: "Summary"
        disposition: background
        note: "The chapter summary states no guideline."
  - token: "5"
    file: ch05.xhtml
    rules: ch05-members.yaml
    title: Member Design
    testProfile: off
    references:
      - { file: ch05-members-general, sections: ["5.1"] }
      - { file: ch05-members-properties-constructors, sections: ["5.2", "5.3"] }
      - { file: ch05-members-events-fields, sections: ["5.4", "5.5"] }
      - { file: ch05-members-extensions-operators, sections: ["5.6", "5.7"] }
      - { file: ch05-members-parameters, sections: ["5.8", "5.9"] }
    nonGuideline:
      - section: "5"
        disposition: background
        note: "The chapter introduction (methods, properties, events, constructors and fields are members; members can be virtual or nonvirtual, concrete or abstract, static or instance; chapter 6 adds the guidelines for extensibility) is background for the whole chapter."
      - section: "5.1"
        disposition: background
        note: "The section introduction lists the member kinds that the general guidelines of 5.1 cover. It states no guideline."
      - section: "5.1.1"
        disposition: rationale
        note: "The definition of member overloading and its signature rules, the WriteLine example, the Rector annotation and the DateTime example are rationale for FDG5001 to FDG5016; operator overloading is covered in section 5.7."
      - section: "5.1.2"
        disposition: background
        note: "The definition of explicit interface member implementation, its example and the Hejlsberg annotation are background for FDG5017 to FDG5022."
      - section: "5.1.3"
        disposition: rationale
        note: "The narrative on the two API styles, properties and methods, and when each reads better is rationale for FDG5023 to FDG5025."
      - section: "5.2"
        disposition: background
        note: "The section introduction (properties are smart fields, with the syntax of fields and the flexibility of methods) is background for FDG5026 to FDG5031."
      - section: "5.2.1"
        disposition: background
        note: "The definition of an indexer, the String example, the sentence that indexers should be used only in APIs that provide access to items in a logical collection, and the Mariani annotation are background for FDG5032 to FDG5040; FDG5034 and FDG5035 rely on the logical-collection sentence."
      - section: "5.2.2"
        disposition: background
        note: "The TextChanged example of a property change notification event and the Mariani and Sells annotations are background for FDG5041 and FDG5042."
      - section: "5.3"
        disposition: background
        note: "The section introduction (type constructors and instance constructors, the Customer example, default constructors, and constructors as the most natural way to create instances) is background for FDG5043 to FDG5052."
      - section: "5.3.1"
        disposition: background
        note: "The definition of a type (static) constructor and when the runtime runs it is background for FDG5053 to FDG5055."
      - section: "5.4"
        disposition: background
        note: "The section introduction (events as the most common callbacks, event handlers and event handling methods, the sender and event arguments convention, pre-events and post-events, and the AlarmClock example) is background for FDG5056 to FDG5064; FDG5064 relies on the definition of pre-events."
      - section: "5.5"
        disposition: rationale
        note: "The encapsulation principle (fields should be private so that they can change without breaking other code), with constant and static read-only fields excluded, is rationale for FDG5065 to FDG5068. CA2211 is not mapped, because no guideline states the principle for static fields."
      - section: "5.6"
        disposition: background
        note: "The definition of extension methods, the StringExtensions example and the requirement that the holding class be static and its namespace imported are background for FDG5069 to FDG5080."
      - section: "5.7"
        disposition: rationale
        note: "The System.Decimal example, the warning that operator overloads are often abused and the Sells annotation (operators do not show up in IntelliSense) are rationale for FDG5081 to FDG5087."
      - section: "5.7.1"
        disposition: background
        note: "The section only says that overloading operator == is complicated and refers to sections 8.9.1 and 8.13, whose rules cover it (CA1046 and CA2231 belong there)."
      - section: "5.7.2"
        disposition: background
        note: "The definition of implicit and explicit conversion operators and the RangedInt32 example are background for FDG5088 to FDG5093."
      - section: "5.7.3"
        disposition: background
        note: "The section introduction (inequality operators should be consistent with the built-in operators; != belongs with == in section 8.13) is background for FDG5094 to FDG5099."
      - section: "5.8"
        disposition: background
        note: "The section introduction (broad guidelines on parameter design and argument checks, and a pointer to the parameter naming guidelines of chapter 3) is background for FDG5100 to FDG5104."
      - section: "5.8.1"
        disposition: rationale
        note: "The introduction (favor enums when they make client code more readable, especially in commonly used APIs, and use Booleans when enums would add unneeded complexity or the API is very rarely used) is rationale for FDG5105 to FDG5107."
      - section: "5.8.2"
        disposition: rationale
        note: "The introduction (rigorous argument checks are crucial in reusable libraries, and users accept their cost for better error reporting when arguments are validated high on the call stack) and the Mariani annotation (low in the stack, as in comparison and hashing functions, validation can cost too much) are rationale for FDG5108 to FDG5112. The FDG5108 notes record that CA1062 still reports such functions."
      - section: "5.8.3"
        disposition: background
        note: "The four groups of parameters (by-value, ref, in and out) and their semantics, the Add, Swap and Uri.TryParse examples, and the Vick and Mariani annotations are background for FDG5113 to FDG5115."
      - section: "5.8.4"
        disposition: background
        note: "The description of variable numbers of arguments through array parameters, the String.Format examples, and the note that params can be added only to the last parameter are background for FDG5116 to FDG5123."
      - section: "5.8.5"
        disposition: rationale
        note: "The introduction (pointers should not appear in the public surface area of a managed framework except where interoperability requires them, and Span<T> and ReadOnlySpan<T> are preferred when possible, see section 9.12) is rationale for FDG5124 to FDG5126 and for FDG5102."
      - section: "5.9"
        disposition: rationale
        note: "The four tuple mechanisms (System.Tuple, System.ValueTuple, named tuples and descriptive types), the GetPerson and target heart rate examples, the benefits of descriptive types and the note that changing the number of tuple elements is a breaking change are rationale for FDG5127 to FDG5133."
      - section: "Summary"
        disposition: background
        note: "The chapter summary states no guideline."
  - token: "6"
    file: ch06.xhtml
    rules: ch06-extensibility.yaml
    title: Designing for Extensibility
    testProfile: off
    nonGuideline:
      - section: "6"
        disposition: background
        note: "The chapter introduction (extensibility needs a careful look at the costs and benefits of each mechanism: subclassing, events, virtual members, callbacks; the design details are in other sections, which the chapter cross-references; a good understanding of object-oriented programming is assumed) is background for the whole chapter."
      - section: "6.1"
        disposition: rationale
        note: "The section introduction (mechanisms range from less powerful and less costly to very powerful and expensive; choose the least costly one that meets the requirements, since extensibility can be added later but never taken away without breaking changes) is rationale for FDG6001 to FDG6016."
      - section: "6.1.1"
        disposition: rationale
        note: "The definition of sealed and unsealed classes, the String and TraceSource example, and the narrative that subclasses can add members, apply attributes and implement interfaces, while protected and virtual members are costly, so an unsealed class without them is inexpensive extensibility, are rationale for FDG6001."
      - section: "6.1.2"
        disposition: rationale
        note: "The narrative that protected members make subclassing more powerful without complicating the main public interface, the SourceSwitch.Value and FlowSwitch example, and the warning that \"protected\" gives a false sense of security, so the defensive practices of public members apply, are rationale for FDG6002 and FDG6003."
      - section: "6.1.3"
        disposition: rationale
        note: "The definitions of callbacks and events, the RemoveAll and Timer examples, the pointer to section 5.4, and the comparison with virtual members (more approachable, customizable at runtime, but slower, using more memory, and running arbitrary code that needs a security, correctness and compatibility analysis) are rationale for FDG6004 to FDG6010."
      - section: "6.1.4"
        disposition: rationale
        note: "The narrative on virtual members (similar to callbacks in extensibility, faster, natural for specialization, fixed at compile time, costly to design, test and maintain) and on limiting their extensibility is rationale for FDG6011 to FDG6013. The Cwalina annotation (overrides must preserve the contract of the base class, which rarely requires calling the base implementation) is background."
      - section: "6.1.5"
        disposition: rationale
        note: "The definition of an abstraction (Stream, IEnumerable<T>, Object), extension by implementing one, the narrative on the high design cost of abstractions and on too many abstractions hurting usability, the Richter annotation on the undocumented contract of ICloneable, and the narrative on the power of abstractions (plug-ins, inversion of control, pipelines, testability) are rationale for FDG6014 to FDG6016."
      - section: "6.2"
        disposition: rationale
        note: "The definition of a base class, the IList<T>, Collection<T> and OrderCollection example, the narrative that base classes hold too much implementation to serve as abstractions, the Cwalina annotation on using Collection<T> directly, and the narrative that base classes add surface area and depth, so they should provide significant value to users (with delegation to an internal implementation when they would help only the implementers), are rationale for FDG6017 to FDG6019. That last advice has no icon and is not a rule."
      - section: "6.3"
        disposition: rationale
        note: "The narrative on the power and danger of extensible design, the Cwalina annotation on limiting a hierarchy to a fixed set of classes with an internal constructor (the LivingOrganism, Animal and Plant example), the definition of sealing classes and members with the NonNullCollection example, and the advice to seal only with good reasons are rationale for FDG6020 to FDG6022."
      - section: "Summary"
        disposition: background
        note: "The chapter summary states no guideline."
  - token: "7"
    file: ch07.xhtml
    rules: ch07-exceptions.yaml
    title: Exceptions
    testProfile: on
    nonGuideline:
      - section: "7"
        disposition: rationale
        note: "The chapter introduction and its list of the benefits of exceptions over return-value error reporting (they fit object-oriented constructs such as constructors, properties and operators, keep APIs consistent, let handling code be placed near or far from the failure, cannot be silently ignored, carry rich information such as the call stack, allow unhandled exception handlers, and support instrumentation), with the Richter, Sells, Clarke, Abrams, Rector, Barton and Brumme annotations, are rationale for FDG7001, FDG7002 and the whole chapter. The Brumme and Richter annotations on unhandled exception filters (only applications with application-specific work should register one) have no icon and are not rules."
      - section: "7.1"
        disposition: rationale
        note: "The definition of execution failure (a member cannot do what its name implies), the Cwalina annotation (exceptions communicate error conditions, not exceptional conditions), the narrative on the two usual excuses for error codes (syntax and performance, the latter answered in 7.5) and the Richter annotation on syntax are rationale for FDG7001 to FDG7011. The closing sentence of the section (it covered throwing; 7.2 covers the type to throw) follows FDG7011 and is kept in its body by the extractor; it states no guideline."
      - section: "7.2"
        disposition: rationale
        note: "The classification of error conditions into usage errors, execution errors, program errors and system failures, with the File.Open and ArgumentNullException examples and footnote 1 (the CLR shuts the process down when the JIT compiler runs out of memory), is rationale for FDG7012 to FDG7018. The closing sentence (now focus on the message) follows FDG7018 and is kept in its body by the extractor."
      - section: "7.2.1"
        disposition: background
        note: "The one-sentence introduction (these guidelines define best practices for exception message text) is background for FDG7019 to FDG7024."
      - section: "7.2.2"
        disposition: rationale
        note: "The definitions of handling an exception (a catch of a specific type whose consequences are fully understood, such as falling back to a default configuration when the file is missing) and of swallowing one (a catch of a generic type that continues without understanding the failure) are rationale for FDG7025 to FDG7033."
      - section: "7.2.3"
        disposition: rationale
        note: "The narrative on wrapping lower-layer exceptions that would be meaningless at a higher layer (the transaction management and TypeInitializationException examples) and the Clarke annotation (terminology in error messages must make sense where they are read) are rationale for FDG7034 to FDG7036."
      - section: "7.3"
        disposition: background
        note: "The one-sentence introduction (the section covers the standard .NET exceptions and is not exhaustive) is background for FDG7037 to FDG7054."
      - section: "7.4"
        disposition: background
        note: "The introduction (custom exceptions are needed when existing ones cannot be used, as 7.2 decides) is background for FDG7055 to FDG7060."
      - section: "7.5"
        disposition: rationale
        note: "The introduction (throwing can be orders of magnitude slower, but good performance is possible without error codes through two patterns) is rationale for FDG7061 to FDG7070."
      - section: "7.5.1"
        disposition: background
        note: "The ICollection<T>.Add and IsReadOnly example and the definitions of tester and doer are background for FDG7062."
      - section: "7.5.2"
        disposition: background
        note: "The description of the Try pattern with the DateTime.Parse and TryParse example, and the ConcurrentDictionary.TryAdd example of the pattern solving the race condition of Tester-Doer, are background for FDG7063 to FDG7070."
      - section: "Summary"
        disposition: background
        note: "The chapter summary states no guideline."
  - token: "8"
    file: ch08.xhtml
    rules: ch08-usage.yaml
    title: Usage Guidelines
    testProfile: on
    nonGuideline:
      - section: "8"
        disposition: background
        note: "The chapter introduction (guidelines for using common types in publicly accessible APIs: direct use of built-in types such as Collection<T> and the serialization attributes, implementing common interfaces, inheriting from common base classes, and overloading common operators in the last section) is background for the whole chapter."
      - section: "8.1"
        disposition: background
        note: "The one-sentence introduction (the section covers arrays in publicly accessible APIs) is background for FDG8001 to FDG8004."
      - section: "8.2"
        disposition: rationale
        note: "The introduction defines custom attributes (System.Attribute, the NameAttribute example), their properties, required arguments (set through constructor parameters, the ConditionalAttribute example) and optional arguments (set through property setters, the AttributeUsageAttribute example). These definitions are rationale for FDG8005 to FDG8012."
      - section: "8.3"
        disposition: rationale
        note: "The definition of a collection (a type designed to manipulate a group of objects with a common characteristic, which in this section means a type implementing IEnumerable or IEnumerable<T>) is rationale for FDG8013 to FDG8043."
      - section: "8.3.1"
        disposition: background
        note: "The one-sentence introduction (the subsection covers collections used as parameters) is background for FDG8018 and FDG8019."
      - section: "8.3.2"
        disposition: background
        note: "The one-sentence introduction (the subsection covers collections returned from methods and property getters) is background for FDG8020 to FDG8026."
      - section: "8.3.2.1"
        disposition: rationale
        note: "The definitions of snapshot collections (a state at some point in time, such as the rows a database query returned) and live collections (always the current state, such as the items of a ComboBox) are rationale for FDG8027 and FDG8028."
      - section: "8.3.3"
        disposition: background
        note: "The introduction (arrays and collections are used in very similar ways but differ in performance, usability and versioning) is background for FDG8029 to FDG8032."
      - section: "8.3.4"
        disposition: background
        note: "The one-sentence introduction (follow these guidelines when implementing custom collections) is background for FDG8033 to FDG8037."
      - section: "8.3.4.1"
        disposition: rationale
        note: "The two reasons for creating collections (a new data structure with its own operations, such as List<T>, LinkedList<T> or Stack<T>, used mostly inside implementations; and a specialized collection for a specific set of items, such as StringCollection, exposed in APIs) are rationale for FDG8038 to FDG8043."
      - section: "8.4"
        disposition: background
        note: "The introduction (DateTime stores a local or UTC time; DateTimeOffset adds the offset from UTC and so represents a point in time more precisely), the Moore annotation on naming DateTimeOffset (Date + Time + Offset) and the listing of the main properties of the two types are background for FDG8044 to FDG8049."
      - section: "8.5"
        disposition: rationale
        note: "The description of ICloneable (a single Clone method), of deep and shallow copies, and the reason not to implement it (its contract does not say which copy it makes, so consumers cannot rely on it), with the Cwalina annotation (never ship an interface without both implementations and consumers; the framework had no consumer of ICloneable), are rationale for FDG8050 to FDG8052."
      - section: "8.6"
        disposition: background
        note: "The introduction (IComparable<T> specifies ordering and is used mainly for sorting; IEquatable<T> specifies equality and is used mainly for look-ups) with the two interface definitions is background for FDG8053 to FDG8058."
      - section: "8.7"
        disposition: background
        note: "The section only says that IDisposable is the Dispose Pattern of section 9.3; it states no guideline."
      - section: "8.8"
        disposition: background
        note: "The introduction (Nullable<T> represents value types with null values; C# has aliases, lifted operators and the null-coalescing operator for it) with its two code examples is background for FDG8059 to FDG8062."
      - section: "8.9"
        disposition: background
        note: "The one-sentence introduction (System.Object has several commonly overridden members, covered in the following subsections) is background for FDG8063 to FDG8085."
      - section: "8.9.1"
        disposition: rationale
        note: "The definitions of value equality (the default Equals of value types, which compares all fields through reflection and is often unacceptably inefficient) and of reference equality (the default Equals of reference types, which some types such as String override with value equality) are rationale for FDG8063 to FDG8070."
      - section: "8.9.2"
        disposition: rationale
        note: "The introduction (a hash code corresponds to the identity of an object as an associated implementation of equality determines it, and hashtables use hash codes) is rationale for FDG8071 to FDG8075."
      - section: "8.9.3"
        disposition: rationale
        note: "The introduction (ToString is meant for general display and debugging; the default implementation returns the type name, is not very useful and should be overridden) is rationale for FDG8076 to FDG8085."
      - section: "8.10"
        disposition: background
        note: "The introduction (serialization converts an object into a form that can be persisted or transported; .NET has many serialization technologies, and most of the serialization guidance of the second edition moved to Appendix B because formats change quickly) is background for FDG8086 to FDG8090."
      - section: "8.11"
        disposition: background
        note: "The introduction (System.Uri represents URIs, which strings can also represent; the section helps choose between Uri and String) is background for FDG8091 to FDG8095."
      - section: "8.11.1"
        disposition: background
        note: "The one-sentence introduction (the subsection helps implement code that uses System.Uri) is background for FDG8094 and FDG8095."
      - section: "8.12"
        disposition: background
        note: "The one-sentence introduction (the section covers System.Xml types that can represent XML data) is background for FDG8096 to FDG8098."
      - section: "8.13"
        disposition: background
        note: "The introduction (operator== and operator!= are called the equality operators) is background for FDG8099 to FDG8107. The closing sentence of the chapter (the next chapter covers design patterns) follows FDG8107 and is kept in its body by the extractor; it states no guideline."
    references:
      - { file: ch08-usage-arrays-attributes-collections, sections: ["8.1", "8.2", "8.3"] }
