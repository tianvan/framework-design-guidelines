    title: Glossary
    entries:
      - section: Glossary
        disposition: background
        note: "Definitions of the terms the rules use, such as abstract type, application model, assembly and attached dependency property. Background for reading the rules. No guideline is stated."
  - source: app05.xhtml
    title: Credits
    entries:
      - section: Credits
        disposition: background
        note: "Credits for two quotations in chapters 5 and 7 and for the icons of appendix D. No technical content and no guideline."
