        note: "The introduction (operations such as encoding, cryptography, serialization and escaping take an array and return a new array; the costs of copying part of an array or a string and of returning a precisely sized array; Span<T>, ReadOnlySpan<T>, Memory<T> and ReadOnlyMemory<T> as slices of arrays, stackalloc data, pointers and strings; the FromHexadecimal overload set) and the Barton annotation are rationale for FDG9137 to FDG9155; FDG9137 states the package requirement of the types."
      - section: "9.12.1"
