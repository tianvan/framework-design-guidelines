        note: "The introduction (operations that feature I/O benefit from asynchronous APIs; .NET has three asynchronous API patterns: the Classic, Event-Based and Task-Based Async Patterns) is background for FDG9018 to FDG9050."
      - section: "9.2.1"
        disposition: rationale
        note: "The history of the patterns (the Event-Based Async Pattern optimized for usability and designers, the Classic Async Pattern for power and small surface area) and the conclusion that both are now legacy patterns, not suitable for new types, are rationale for FDG9018 and FDG9019."
      - section: "9.2.2"
        disposition: rationale
        note: "The definition of the Task-Based Async Pattern (a naming, signature and behavioral convention based on Task and Task<TResult>), its elements (the -Async method, the returned task, an optional CancellationToken parameter, with the File.ReadAllBytesAsync example) and the Barton annotation (the async keyword is a good start but does not enforce naming, usage exceptions, parameter alignment or cancellation) are rationale for FDG9020 to FDG9029."
      - section: "9.2.3"
        disposition: rationale
        note: "The four predefined task-like return types, footnote 1 (async void methods resemble the Event-Based Async Pattern more, and the book advises against them in public code; no guideline icon states it), footnote 2 (the versions that introduced Task<TResult> and ValueTask<TResult>), the motivation and usability costs of ValueTask<TResult>, and the simple flow (no result: Task; commonly completes synchronously: ValueTask<TResult>; otherwise Task<TResult>) are rationale for FDG9030 to FDG9032."
      - section: "9.2.4"
