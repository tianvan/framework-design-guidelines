        note: "The chapter introduction (guidelines and discussion for a few patterns that .NET APIs use often) is background for the whole chapter."
      - section: "9.1"
        disposition: rationale
        note: "The definition of an aggregate component (a facade over lower-level factored types that supports component-oriented design and is the entry point for exploring its namespace), the It-Just-Works principle with its limit (do not open a file implicitly and then require an explicit close), the File.ReadAllLines example of a single call that does a whole task, the point that users should not have to implement interfaces or edit configuration files to get started (default implementations, optional settings with sensible defaults, tool support), support for the Visual Studio designers through IComponent or a UI element base class, and the Cwalina annotations (HttpClient and other examples; hide complexity completely or not at all; System.ServiceProcess would reach more developers with event handlers than with overrides) are rationale for FDG9001 to FDG9017."
      - section: "9.1.1"
        disposition: rationale
        note: "The definition of component-oriented design and the Create-Set-Call Pattern (with the MessageQueue and PerformanceCounter examples), the advice to report invalid states with InvalidOperationException when an operation is performed rather than from the constructor or a setter, the Clarke and Nasarre annotations, and the list of additional requirements of aggregate components (a simple constructor, constructor parameters that initialize properties, properties with getters, setters and sensible defaults, options as properties, callbacks as events) are rationale for FDG9006 to FDG9010."
      - section: "9.1.2"
        disposition: rationale
        note: "The definition of factored types (the richer types under an aggregate component, without modes and with clear lifetimes), the SerialPort.BaseStream example and the Haack annotation (factored types with an explicit lifetime could implement IDisposable) are rationale for FDG9014 and FDG9017."
      - section: "9.1.3"
        disposition: background
        note: "The one-sentence introduction (it says the guidelines below are for aggregate component design) is background for FDG9001 to FDG9017."
      - section: "9.2"
