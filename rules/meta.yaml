  - token: "A"
    file: app01.xhtml
    rules: appA-coding-style.yaml
    title: C# Coding Style Conventions
    testProfile: on
    nonGuideline:
      - section: "A"
        disposition: rationale
        note: "The appendix introduction says that these coding style conventions, unlike the rest of the book's guidelines, are optional suggestions rather than requirements, because they hardly affect the users of a framework directly. This is why every appendix A rule has style: true, is enabled by the profiles, and can be overridden. The three principles (clarity wins over brevity, the form that reduces noise in a future diff is preferred, few rules with few exceptions) are rationale for FDGA004, FDGA006, FDGA038, FDGA039 and FDGA042; the Barton annotation and the note that the numbered chapters' code uses a compact paper-friendly style instead of these conventions are background."
      - section: "A.1.1"
        disposition: background
        note: "The section introduction (the .NET BCL team braces in Allman style and requires braces in general, even where the language makes them optional, with the exceptions in the guidance) is background for FDGA001 to FDGA007."
      - section: "A.1.5"
        disposition: rationale
        note: "The section introduction gives the BCL team's canonical modifier order, from the visibility modifiers through static, extern, the member slot modifiers, readonly, unsafe and volatile to async, which FDGA028 to FDGA037 express in detail and csharp_preferred_modifier_order follows. The list puts volatile after unsafe, but FDGA034 puts it immediately after static; the configuration follows FDGA034."
      - section: "A.2"
        disposition: background
        note: "The section introduction (the Framework Design Guidelines govern identifier names, with additional conventions and exceptions for internal and private identifiers) is background for FDGA051 to FDGA058."
      - section: "A.3"
        disposition: rationale
        note: "The section introduction (comments describe intent, algorithmic overview and logical flow; there is no minimum comment requirement, but most nontrivial routines should have comments that reflect the programmer's intent) is rationale for FDGA059 to FDGA063."
  - token: "D"
