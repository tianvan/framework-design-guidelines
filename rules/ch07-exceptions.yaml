- id: FDG7018
  strength: DO
  text: throw the most specific (the most derived) exception that makes sense.
  context: null
  section: 7.2 Choosing the Right Type of Exception to Throw
  anchor: sec7_2
  body:
    - kind: paragraph
      text: For example, throw `ArgumentNullException` and not its base type, `ArgumentException`, if a null argument is passed.
    - kind: annotation
      text: Throwing `System.Exception`, the base class of all CLS-compliant exceptions, is always the wrong thing to do.
      author: Jeffrey Richter
    - kind: annotation
      text: As described in more detail later, catching `System.Exception` is nearly always the wrong thing to do as well.
      author: Brent Rector
    - kind: paragraph
      text: Now that you have chosen the correct exception type, you can focus on ensuring that the error message your exception delivers says what you need it to say.
  status: draft
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA2201
    coverage: partial
  autofix: no
  severity:
    library: warning
    application: warning
    test: warning
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA2201 reports creating System.Exception, System.SystemException and System.ApplicationException, which are never the most specific exception (the Richter annotation). Whether another type is the most derived one that makes sense, such as ArgumentNullException rather than ArgumentException, is not checked, so coverage is partial. CA2201's reports of runtime-reserved types belong to FDG7045 to FDG7049. CA2201 has no code fix.
- id: FDG7019
  strength: DO
  text: provide a rich and meaningful message text targeted at the developer when throwing an exception.
  context: null
  section: 7.2.1 Error Message Design
  anchor: sec7_2_1
