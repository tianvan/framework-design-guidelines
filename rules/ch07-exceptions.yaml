- id: FDG7070
  strength: DO
  text: return `false` on null inputs to a method of the form `static bool TryParse(string, out T value)`.
  context: null
  section: 7.5.2.1 Static TryParse(string, out T) Methods
  anchor: sec7_5_2_1a
  body:
    - kind: paragraph
      text: The “kind of reason” for failure that is common to all static `TryParse` methods that take only a single string input is “the input is not a valid string representation of this type.” All static `TryParse` methods in the .NET BCL types consider a null input as “not a valid string representation” rather than a usage error. For consistency with the rest of .NET, your static `TryParse` methods should do the same.
    - kind: paragraph
      text: Argument validation should still be performed for any parameters other than the main string input parameter in overloads of a `TryParse` method.
