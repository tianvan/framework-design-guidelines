- id: FDG7009
  strength: CONSIDER
  text: using exception builder methods.
  context: null
  section: 7.1 Exception Throwing
  anchor: sec7_1
  body:
    - kind: paragraph
      text: It is common practice to throw the same exception from different places. To avoid code bloat, use helper methods that create exceptions and initialize their properties.
    - kind: paragraph
      text: 'Also, members that throw exceptions are less likely to be inlined. Moving the throw statement inside the builder might allow the member to be inlined. For example:'
    - kind: code
      text: |-
        class File{
          string fileName;

          public byte[] Read(int bytes){
            if (!ReadFile(handle, bytes)) ThrowNewFileIOException(...);
          }

          void ThrowNewFileIOException(...){
            string description = // build localized string
            throw new FileIOException(description);
          }
        }
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: suggestion
    test: suggestion
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: a design option. Builder methods that return the exception must not be public (FDG7008).'
- id: FDG7010
  strength: DO NOT
  text: throw exceptions from exception filter blocks.
  context: null
  section: 7.1 Exception Throwing
  anchor: sec7_1
  body:
    - kind: paragraph
      text: When an exception filter raises an exception, the exception is caught by the CLR, and the filter returns `false`. This behavior is indistinguishable from the filter executing and returning `false` explicitly, so it is very difficult to debug.
    - kind: code
      text: |-
        ' VB sample
        ' This is bad design. The exception filter (When clause)
        ' may throw an exception when the InnerException property
        ' returns null.
        Try
           ...
        Catch e As ArgumentException _
        When e.InnerException.Message.StartsWith("File")
         ...
        End Try
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG7010
    coverage: partial
  autofix: no
  severity:
    library: warning
    application: warning
    test: warning
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Do not throw from the exception filter
    category: Exceptions
  notes: FDG7010 reports a throw expression in the when clause of a catch, outside lambdas, anonymous methods and local functions, which run later. Exceptions that members called by the filter throw are not seen; the body's example is one (InnerException can be null), so coverage is partial. CA2219 does not report filters (probe with SDK 10.0.402). There is no code fix.
