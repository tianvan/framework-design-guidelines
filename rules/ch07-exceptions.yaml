- id: FDG7029
  strength: DO NOT
  text: overcatch. Exceptions should often be allowed to propagate up the call stack.
  context: null
  section: 7.2.2 Exception Handling
  anchor: sec7_2_2
  body:
    - kind: annotation
      text: This can’t be stressed enough. Far too many times I’ve seen developers catch an exception, which basically hides a bug in their program. Do not catch; flush out the bugs during testing and ship a better, more robust product.
      author: Jeffrey Richter
    - kind: annotation
      text: Exception handling is robust by default—every exception that is thrown will propagate up, looking for a handler. Every place you write an exception handler is a chance for you to remove robustness from the system, and if you make a mistake it will often be hard to track down. So be minimal about it.
      author: Eric Gunnerson
  status: draft
  style: false
