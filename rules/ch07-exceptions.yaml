    - kind: paragraph
      text: The message should explain the cause of the exception and clearly describe what needs to be done to avoid the exception.
    - kind: annotation
      text: This guideline applies to frameworks. It is likely quite appropriate in application code for the exception message to be targeted at an admin or even an end user. The high-level advice is that the message text should be targeted at whoever will have to make sense out of it.
