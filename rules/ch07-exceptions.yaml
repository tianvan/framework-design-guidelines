  context: null
  section: 7.3.10 FormatException
  anchor: sec7_3_10
  body:
    - kind: paragraph
      text: '`DateTimeOffset.Parse(string input)` throws a `FormatException` as an execution error indicating that the input value, which is generally read as data, cannot be parsed into a `DateTimeOffset` value. Conversely, `DateTimeOffset.ToString(string format)` throws a `Format Exception` as a usage error indicating that the format specifier, which is generally a value explicitly specified in the calling code, is not a value that is supported. The dual usage of this exception can be ambiguous for methods like `DateTimeOffset.ParseExact(string input, string format, IFormatProvider formatProvider)`, but only when both the input value and the format value were read as data. When the format value is specified explicitly in calling code, the developer can use the message to debug an invalid format specifier once; then all future calls that result in a `FormatException` are a result of the input value.'
