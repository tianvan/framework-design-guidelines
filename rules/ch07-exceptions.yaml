  notes: 'Library only: the text concerns components that other developers use. Not machine-checkable: whether the users speak other languages is judgment. CA1303 is not mapped: it reports literals passed to parameters marked as localizable, and in a probe with SDK 10.0.402 it did not report a literal exception message.'
- id: FDG7025
  strength: DO NOT
  text: swallow errors by catching nonspecific exceptions, such as `System.Exception`, `System.SystemException`, and so on, in framework code.
  context: null
  section: 7.2.2 Exception Handling
  anchor: sec7_2_2
  body:
    - kind: code
      text: |-
        try{
          File.Open(...);
        }
        catch(Exception e){ } // swallow "all" exceptions - don't do this!
    - kind: paragraph
      text: A legitimate reason for catching a nonspecific exception is so that you can transfer that exception to another thread. This can happen, for example, when a GUI application transfers an operation to the UI thread, when doing asynchronous programming, using thread pool operations, and so on. Obviously, if you are transferring an exception to another thread, you aren’t actually swallowing it.
    - kind: annotation
      text: When transferring exceptions across threads, it is imperative that you have put safeguards in place that prevent the exception from getting missed. For example, if you catch the exception and stuff it into a list that no other thread in the system ever gets around to checking, you have essentially swallowed it. And the effects can be as disastrous as ignoring an error code in Win32.
      author: Joe Duffy
  status: draft
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1031
    coverage: partial
  autofix: no
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Library only: the text scopes it to framework code; FDG7026 is the rule for application code. CA1031 reports a catch of System.Exception or System.SystemException, or a parameterless catch, whose block does not throw; a filtered catch is not reported. CA1031 also reports a catch that transfers the exception to another thread, which the body allows (for example a catch that passes it to TaskCompletionSource.SetException, probe with SDK 10.0.402), and other nonspecific types ("and so on") are not seen unless listed in its disallowed_symbol_names option, so coverage is partial. CA1031 has no code fix.'
- id: FDG7026
  strength: AVOID
  text: swallowing errors by catching nonspecific exceptions, such as `System.Exception`, `System.SystemException`, and so on, in application code.
  context: null
  section: 7.2.2 Exception Handling
  anchor: sec7_2_2
  body:
    - kind: paragraph
      text: There are cases when swallowing errors in applications is acceptable, but such cases are rare.
    - kind: paragraph
      text: If you decide to swallow exceptions, you must realize that you don’t know exactly what went wrong, so you generally cannot predict what state might now be inconsistent. By swallowing exceptions, you are making a trade-off that the value of continuing to execute code in this application domain or process exceeds the risk of executing in the face of inconsistencies. Because a security attack might be able to exploit those inconsistencies, your decision here has deep consequences.
    - kind: annotation
      text: |-
        There is surprisingly little you can do when catching an exception unless you know the following:

        - Exactly what component threw it, and what the contract was (what state the object was left in)
        - The WHOLE call stack between the thrower and the catcher, and you have determined that every method in that stack properly cleaned up any global state changes before returning

        If you don’t know these two items, then you don’t know that some global state has been left in a “half done” state, which will cause strange errors if the program continues. This is *especially* true for exceptions like `OutOfMemoryException`, `StackOverflowException`, and `ThreadAbortException`, which can happen in a great many places.

        In practice, you don’t know the whole call stack unless the caller and the thrower are right next to each other. This means that if you are trying to catch “any” exception, you should not continue execution. You should only be doing things like error logging and persisting critical information as a prelude to shutting down (and possibly relaunching the process). These latter operations are best done in a finally block.
      author: Vance Morrison
  status: draft
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA1031
    coverage: partial
  autofix: no
  severity:
    library: warning
    application: warning
    test: warning
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'CA1031 reports the same catches as for FDG7025. The body accepts rare cases of swallowing in applications, and the Morrison annotation allows logging and saving state before shutting down; CA1031 cannot tell these apart, so coverage is partial. The library profile keeps it on: in a library, FDG7025 asks for the same with DO NOT. CA1031 has no code fix.'
