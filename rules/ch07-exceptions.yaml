- id: FDG7069
  strength: AVOID
  text: writing to the `out` parameter from a Try method when throwing an exception.
  context: null
  section: 7.5.2.1 Value-Producing Try Methods
  anchor: sec7_5_2_1
  body:
    - kind: paragraph
      text: Because the exception indicates that an error occurred, no additional value should be produced. If a Try method “leaks” a partially complete value on failure, then callers could potentially depend on the partially complete value for either error recovery or their main program flow. Once callers are depending on the internal state of your method, it becomes much harder to alter the otherwise private implementation details of the method without causing a runtime breaking change for someone. This situation is compounded when the caller is writing the `out` to a static field, since the value will persist if the exception is handled.
    - kind: paragraph
      text: It’s good practice to exclusively assign the `out` parameter a value immediately prior to a return statement in the method. This helps to avoid leaking implementation details in the event of an exception.
    - kind: code
      text: |-
        public static bool TryDecode(byte[] data, out ParsedType value) {
         // Careful: The caller might depend on this value being
         // non-null on an exception from LoadFields.
         value = new ParsedType();
         if (!LoadFields(value, data)) {
           value = null;
           return false;
         }
         return true;
        }

        public static bool TryDecode(byte[] data, out ParsedType value) {
         // This variant hides the implementation details better
         ParsedType parsedType = new ParsedType();
         if (!LoadFields(parsedType, data)) {
           value = null;
           return false;
         }
         value = parsedType;
         return true;
        }
  status: draft
