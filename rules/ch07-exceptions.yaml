- id: FDG7067
  strength: DO
  text: “return” the value from a Try method via an `out` parameter.
  context: null
  section: 7.5.2.1 Value-Producing Try Methods
  anchor: sec7_5_2_1
  body:
    - kind: paragraph
      text: Unlike `CountdownEvent.TryAddCount`, most Try methods are expected to produce an additional value from the method—the return value of the exception-throwing alternative member. Since the Try pattern reserves the return value for reporting success or failure, the additional value must be returned via an `out` parameter (see section 5.8 for more information on `out` parameters).
