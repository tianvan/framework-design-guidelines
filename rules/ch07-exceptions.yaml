  notes: 'Not machine-checkable: overcatching a specific exception is judgment. Catches of nonspecific exceptions are FDG7025, FDG7026, FDG7038 and FDG7039 (CA1031).'
- id: FDG7030
  strength: DO
  text: use try-finally and avoid using try-catch for cleanup code. In well-written exception code, try-finally is far more common than try-catch.
  context: null
  section: 7.2.2 Exception Handling
  anchor: sec7_2_2
  body:
    - kind: paragraph
      text: It might seem counterintuitive at first, but catch blocks are not needed in a surprising number of cases. However, you should always consider whether try-finally could be of use for cleanup to ensure a consistent state of the system when an exception is thrown. Usually, the cleanup logic rolls back resource allocations.
    - kind: code
      text: |-
        FileStream stream = null;
        try{
          stream = new FileStream(...);
           ...
        }finally{
          if(stream != null) stream.Close();
        }
    - kind: paragraph
      text: C# and VB.NET provide the `using` statement, which can be used instead of a plain try-finally statement to clean up objects implementing the `IDisposable` interface.
    - kind: code
      text: |-
        using(var stream = new FileStream(...)){
          ...
        }
    - kind: annotation
      text: If you use catch clauses for cleanup, you should know that any code that comes after the end of the catch might not be executed. In CLR 2.0, the finally and catch blocks get special protection from thread aborts. Code after a catch does not.
      author: Christopher Brumme
    - kind: annotation
      text: Don’t use catch blocks for cleanup code. Use catch blocks for error recovery code and finally blocks for cleanup code. A catch block only runs when an exception of a particular type occurs within the try block. A finally block always runs. If you always need to clean up (the typical case), you need to perform that logic in a finally block.
      author: Brent Rector
    - kind: annotation
      text: I completely agree with this guideline. I recommend that almost all cleanup code go inside finally blocks, and it is quite convenient that C# and VB.NET offer many language constructs that emit try-finally blocks automatically for you. Examples are C#/VB’s `using` statement, C#’s `lock` statement, VB’s `SyncLock` statement, C#’s `foreach` statement, and VB’s `For Each` statement. In addition, when you define a finalizer in C#, the compiler makes sure that the base class’s `Finalize` is called by placing the call within a finally block. In fact, I have designed many of my own types to have methods that return an `IDisposable` object so that they can be easily used with C#/VB’s `using` statement.
      author: Jeffrey Richter
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: warning
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Analyzer candidate rejected: whether a catch block holds cleanup code or error recovery code (the Rector annotation) is intent.'
- id: FDG7031
  strength: DO
  text: prefer using an empty throw when catching and rethrowing an exception. This is the best way to preserve the exception call stack.
  context: null
  section: 7.2.2 Exception Handling
  anchor: sec7_2_2
  body:
    - kind: code
      text: |-
        public void DoSomething(FileStream file){
          long position = file.Position;
          try{
             ... // do some reading with the file
          }catch{
            file.Position = position; // unwind on failure
            throw; // rethrow
          }
        }
    - kind: annotation
      text: Every time you catch and throw and rethrow, you impact the debuggability of the system. Debugging of exceptions is based on the notion that we detect exceptions going unhandled during the first pass, when no state changes have occurred. By attaching a debugger at that time, we see the state at the time when the exception was thrown. If there is a series of catch and throw and rethrow segments up the stack, then debugging might be limited to inspecting the very last segment. This is an arbitrary distance from the original fault. The same state changes will reduce the effectiveness of Watson dumps.
      author: Christopher Brumme
    - kind: annotation
      text: In addition, when you throw a new exception (versus rethrowing the original exception), you are reporting a different failure than the failure that actually occurred. This also hurts your ability to debug the application. Therefore, always prefer a rethrow to a throw, and try to avoid catching and (re)throwing altogether.
      author: Jeffrey Richter
  status: draft
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA2200
    coverage: full
  autofix: yes
  severity:
    library: warning
    application: warning
    test: warning
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: CA2200 reports throw e; where e is the caught exception, and its code fix replaces it with throw;, which changes no signature.
- id: FDG7032
  strength: DO
  text: use `ExceptionDispatchInfo` when rethrowing an exception from a different context.
  context: null
  section: 7.2.2 Exception Handling
  anchor: sec7_2_2
  body:
    - kind: paragraph
      text: If you need to move an exception to a different thread, or anything else that prevents using the empty throw, the `ExceptionDispatchInfo` class persists the call stack across the rethrow.
    - kind: code
      text: |-
        private ExceptionDispatchInfo _savedExceptionInfo;

        private void BackgroundWorker() {
          try {
             ...
          } catch (Exception e) {
            _savedExceptionInfo = ExceptionDispatchInfo.Capture(e);
          }
        }
        public object GetResult() {
         if (_done) {
           if (_savedExceptionInfo != null) {
             _savedExceptionInfo.Throw();

             // The method throws,
             // but the compiler flow doesn't understand that,
             // so an extra return statement is required.
             return null;
           }
           ...
         }
         ...
        }
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
