- id: FDG7041
  strength: DO
  text: throw an `InvalidOperationException` if the object is in an inappropriate state.
  context: null
  section: 7.3.3 InvalidOperationException
  anchor: sec7_3_3
  body:
    - kind: paragraph
      text: The `System.InvalidOperationException` exception should be thrown if a property set or a method call is not appropriate given the object’s current state. An example of this is writing to a `FileStream` that’s been opened for reading.
    - kind: annotation
      text: The difference between `InvalidOperationException` and `ArgumentException` is that `ArgumentException` does not rely on the state of any other object besides the argument itself to determine whether it needs to be thrown. For example, if client code tries to access a nonexistent resource, `InvalidOperationException` should be thrown. On the other hand, if client code tries to access a resource using a malformed identifier, `ArgumentException` should be thrown.
      author: Krzysztof Cwalina
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
