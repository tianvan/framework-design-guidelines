- id: FDG7024
  strength: CONSIDER
  text: localizing the exception messages thrown by your components if you expect your components to be used by developers speaking different languages.
  context: null
  section: 7.2.1 Error Message Design
  anchor: sec7_2_1
  body:
    - kind: annotation
      text: |-
        Exception messages are not relevant when an exception is handled; they only come into play when an exception is unhandled. An unhandled exception indicates a real bug in the application because the application will be terminated. The only way to fix the application now is to have the failure reported, the source code modified and recompiled, and the deployments in the field updated. So the error messages should be geared toward helping developers fix bugs in their code. End users should not see these messages.

        When a Microsoft Office application gets an unhandled exception, all the dialog box says is something like this: “Microsoft Word has encountered a problem and needs to close. We are sorry for the inconvenience.” There is a bit more to the message, but there is nothing computerese in the message. The user does have the option of clicking a button that will show what’s in the error report that gets sent back to Microsoft, and this error report is very geeky.
      author: Jeffrey Richter
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
