- id: FDG7062
  strength: CONSIDER
  text: the Tester–Doer Pattern for members that might throw exceptions in common scenarios to avoid performance problems related to exceptions.
  context: null
  section: 7.5.1 The Tester–Doer Pattern
  anchor: sec7_5_1
  body:
    - kind: annotation
      text: Consider this when the “test” is much cheaper than the “do.”
      author: Rico Mariani
    - kind: annotation
      text: This pattern needs to be used carefully. A potential problem occurs when you have multiple threads accessing the object at the same time. For example, one thread could execute the tester method, which reports that all is OK, and before the doer method executes, another thread could change the object, causing the doer to fail. Although this pattern might improve performance, it might introduce race conditions and must be used with extreme caution.
      author: Jeffrey Richter
    - kind: annotation
      text: |-
        Jeff’s comment about races is true, but only rarely should it impact your design. The reason is that unless you specifically designed your class to be threadsafe (operate properly while multiple threads simultaneously use it), it almost certainly is not. Of the thousands of classes in .NET, only a handful are designed to be threadsafe (and this is specifically noted in the documentation). If your class is not threadsafe (the default), any user must use locks to ensure that only one thread uses it at a time. As long as both the “test” and the “do” are done under the same lock (this will typically happen naturally), there is not a problem.

        Thus, Jeff’s concern only applies to the design of threadsafe classes.
      author: Vance Morrison
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
