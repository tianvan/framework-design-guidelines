- id: FDG7028
  strength: CONSIDER
  text: catching a specific exception when you understand why it was thrown in a given context and can respond to the failure programmatically.
  context: null
  section: 7.2.2 Exception Handling
  anchor: sec7_2_2
  body:
    - kind: annotation
      text: You should only catch an exception when you know you can gracefully recover from it. When performing some operation, you might know why an exception was thrown—but if you don’t know how you’d recover from it, do not catch it.
      author: Jeffrey Richter
