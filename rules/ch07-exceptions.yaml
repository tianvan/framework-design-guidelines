- id: FDG7012
  strength: DO NOT
  text: create new exception types to communicate usage errors. Throw one of the existing base library exceptions instead. See section 7.3 for detailed usage guidelines for the most common standard exception types.
  context: null
  section: 7.2 Choosing the Right Type of Exception to Throw
  anchor: sec7_2
  body:
    - kind: paragraph
      text: 'Usage errors need to be communicated to the developer calling the API and should not be handled directly in code. The exception type is generally less important to developers trying to fix their code than the message string. Therefore, for exceptions that are thrown as a result of usage errors, you should concentrate on designing a really good (i.e., explanatory) exception message and using one of the existing .NET Framework exception types: `ArgumentNullException`, `ArgumentException`, `InvalidOperationException`, `NotSupportedException`, and so on.'
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: warning
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether an error is a usage error is judgment. The standard exception types are in section 7.3.'
- id: FDG7013
  strength: CONSIDER
  text: creating and throwing custom exceptions if you have a program error condition that can be programmatically handled in a different way than any other existing exception. Otherwise, throw one of the existing exceptions. See section 7.4 for details on creating custom exceptions.
  context: null
  section: 7.2 Choosing the Right Type of Exception to Throw
  anchor: sec7_2
  body:
    - kind: paragraph
      text: Program errors are errors that can be, and often are, handled in code. The way to handle such errors is to catch the exception and execute some “compensating” logic. Whether the catch statement executes is determined by the type of the exception the catch block claims it can handle. Thus, a program error is an error condition (actually the only error condition) where the exception type matters, so you should consider creating a new exception type.
    - kind: paragraph
      text: If you think you are dealing with a program error, validate this belief by actually writing code or describing very precisely what the catch handler would do when it catches the exception to allow the program to continue its execution. If you cannot describe it, or if the error can be avoided by changing the calling code, you are probably dealing with a usage error or a system failure.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: suggestion
    test: suggestion
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether a handler would treat the error differently is judgment.'
- id: FDG7014
  strength: DO NOT
  text: create a new exception type if the exception would not be handled differently than an existing framework exception. Throw the existing framework exception in such case. See section 7.3 for detailed usage guidelines for the most common standard exception types.
  context: null
  section: 7.2 Choosing the Right Type of Exception to Throw
  anchor: sec7_2
  body:
    - kind: paragraph
      text: Of course, the existing exception type must make sense for your error condition. For example, you don’t want to throw `FileNotFoundException` from an API unrelated to accessing files.
    - kind: paragraph
      text: Also, make sure that reusing the exception will not make an error condition ambiguous. That is, make sure that the code that wants to handle the specific error will always be able to tell whether the exception was thrown because of the error or because of some other error that happens to use the same exception. For example, you don’t want to throw (reuse) `FileNotFoundException` from a routine that calls the built-in file I/O APIs, and so can throw the same exception, unless it does not matter to the calling code whether your code or the underlying framework method threw the exception.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: warning
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: how handlers would treat the exception is judgment.'
- id: FDG7015
  strength: DO
  text: create a new exception type to communicate a unique program error that cannot be communicated using an existing framework exception. See section 7.4 for details on creating custom exceptions.
  context: null
  section: 7.2 Choosing the Right Type of Exception to Throw
  anchor: sec7_2
  body:
    - kind: annotation
      text: Keep in mind that it’s not a breaking change to change an exception your code throws to a subtype of that exception. For example, if the first version of your framework throws `FooException`, in any future version of your library, you can start throwing a subtype for `FooException` without breaking code that was compiled against the previous version of your library. This means, when in doubt, I would consider not creating new exception types until you are sure you need them. At that point, you can create a new exception type by inheriting from the currently thrown type. Sometimes it might result in slightly strange exception hierarchy (e.g., a custom exception inheriting from `InvalidOperationException`), but it’s not a big deal in comparison to the cost of having unnecessary exception types in your library, which makes the library more complex, adds development cost, increases the working set, and so on.
      author: Krzysztof Cwalina
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: warning
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether an existing exception can communicate the error is judgment.'
- id: FDG7016
  strength: AVOID
  text: creating APIs that when called can result in a system failure. If such a failure can occur, call `Environment.FailFast` instead of throwing an exception when the system failure occurs.
  context: null
  section: 7.2 Choosing the Right Type of Exception to Throw
  anchor: sec7_2
  body:
    - kind: paragraph
      text: System failures are errors that cannot be handled by the developer or the program. The good thing is that system failures are extremely rare in reusable libraries. They are mostly caused by the execution engine. The best way to shut down a process in such cases is to call `Environment.FailFast`, which logs the state of the system— something that is very useful in diagnosing the problem.
  status: draft
  style: false
