- id: FDG7007
  strength: DO NOT
  text: have public members that can either throw or not throw based on some option.
  context: null
  section: 7.1 Exception Throwing
  anchor: sec7_1
  body:
    - kind: code
      text: |-
        // bad design
        public Type GetType(string name, bool throwOnError)
    - kind: annotation
      text: An API such as this one usually reflects the inability of the framework designer to make a decision. A method either completes successfully or it does not, in which case it should throw an exception. Failure to decide forces the decision on the caller of the API, which likely does not have enough context on implementation details of the API to make an informed decision.
      author: Brad Abrams
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG7007
    coverage: partial
  autofix: breaking
  severity:
    library: warning
    application: none
    test: none
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Do not let the parameter '{0}' decide whether '{1}' throws
    category: Exceptions
  notes: "Library only: the text scopes it to public members, whose callers outside the library would have to make the decision (the Abrams annotation). FDG7007 reports a bool parameter whose first word is \"throw\" (throwOnError, throwIfNotFound), as in the body's GetType example, on an externally visible method, constructor or indexer. Overrides and interface implementations are not reported, since their parameters come from the member they override or implement. Options of other types (an enum or a settings object) are not seen, so coverage is partial. Removing the parameter changes the public signature, so the fix is breaking; there is no code fix."
- id: FDG7008
