- id: FDG7035
  strength: AVOID
  text: catching and wrapping nonspecific exceptions.
  context: null
  section: 7.2.3 Wrapping Exceptions
  anchor: sec7_2_3
  body:
    - kind: paragraph
      text: The catch and wrap practice is often undesired and is just another form of swallowing errors. Exceptions to this rule include cases in which the wrapper exception communicates a severe condition that is much more interesting to the caller than the actual type of the original exception. For example, the `TypeInitializationException` wraps all exceptions propagating from static constructors.
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: warning
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: "Analyzer candidate rejected: the body's exception (a wrapper that communicates a severe condition more interesting to the caller than the original type, as TypeInitializationException does) cannot be told from syntax. CA1031 does not report a catch that wraps, since its block throws (probe with SDK 10.0.402)."
- id: FDG7036
  strength: DO
  text: specify the inner exception when wrapping exceptions.
  context: null
  section: 7.2.3 Wrapping Exceptions
  anchor: sec7_2_3
  body:
    - kind: code
      text: throw new ConfigurationFileMissingException(...,e);
    - kind: annotation
      text: It cannot be stressed enough how carefully this needs to be thought through. When in doubt, do not wrap an exception with another. An example in the CLR where wrapping is known to cause all kinds of trouble is with reflection. When you invoke a method using reflection, if that method throws an exception, the CLR catches it and throws a new `TargetInvocationException`. This is incredibly annoying because it hides the actual method and location in the method that had the problem. I have wasted much time trying to debug my code because of this exception wrapping.
      author: Jeffrey Richter
  status: draft
  style: false
  check:
    kind: fdg
    diagnostics:
      - FDG7036
    coverage: partial
  autofix: no
  severity:
    library: warning
    application: warning
    test: warning
  config: []
  minLanguage: null
  alternative: null
  analyzer:
    message: Pass the caught exception as the inner exception of '{0}'
    category: Exceptions
  notes: FDG7036 reports a new exception created in a throw statement or throw expression inside a catch block, outside lambdas, anonymous methods and local functions, when the exception type has an accessible constructor with a System.Exception parameter and no argument of the creation is an exception. A parameterless catch, or a catch without a variable, is reported too, since it could declare one. An argument for an optional inner exception parameter that the creation leaves out does not count. Wrapping through a builder method (FDG7009) is not seen, so coverage is partial. There is no code fix.
