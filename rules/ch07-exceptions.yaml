- id: FDG7065
  strength: DO
  text: pick one kind of reason for why your Try method can return `false`, and throw an exception for any other failure reason.
  context: null
  section: 7.5.2 The Try Pattern
  anchor: sec7_5_2
  body:
    - kind: paragraph
      text: 'Many methods have only one kind of failure: a string either represents a `DateTime` or it doesn’t; when using a Dictionary the key was either present or it wasn’t; and a `ConcurrentQueue` is either empty or not. In the `CountdownEvent` class, however, the `AddCount` method has several possible errors: the object may have already counted down to done, the requested increment could overflow the counter, or the object could have already been disposed—all in addition to the usage error of providing a negative count. The most likely error is the counter having reached zero, and this is the only error for which `TryAddCount` will return `false`. Developers who call the method can write a handler for the failure case and understand what state it represents, while the less likely errors continue to throw exceptions.'
  status: draft
