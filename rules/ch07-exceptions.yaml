- id: FDG7040
  strength: DO NOT
  text: throw or derive from `System.ApplicationException`.
  context: null
  section: 7.3.2 ApplicationException
  anchor: sec7_3_2
  body:
    - kind: annotation
      text: '`System.ApplicationException` is a class that should not be part of .NET. The original idea was that classes derived from `SystemException` would indicate exceptions thrown from the CLR (or system) itself, whereas non-CLR exceptions would be derived from `ApplicationException`. However, a lot of exception classes didn’t follow this pattern. For example, `TargetInvocationException` (which is thrown by the CLR) is derived from `ApplicationException`. So the `ApplicationException` class lost all meaning. The reason to derive from this base class is to allow some code higher up the call stack to catch the base class. It was no longer possible to catch all application exceptions.'
      author: Jeffrey Richter
  status: draft
  style: false
  check:
    kind: sdk
    diagnostics:
      - CA2201
      - CA1058
    coverage: full
  autofix: breaking
  severity:
