- id: FDG7001
  strength: DO NOT
  text: return error codes.
  context: null
  section: 7.1 Exception Throwing
  anchor: sec7_1
  body:
    - kind: paragraph
      text: Exceptions are the primary means of reporting errors in frameworks. The beginning section of the chapter describes the benefits of exceptions in detail.
    - kind: annotation
      text: 'It’s OK for exceptions to have a property returning some kind of error code, but I would be very careful about this. Each exception can carry two main pieces of information: the exception message explaining to the developer what went wrong and how to fix it, and the exception type that should be used by handlers to decide what programmatic action to take. If you think you need to have a property on your exception that would return additional error code, ask yourself who this code is for. Is it for the developer or for the exception handler? If for the developer, add additional information to the message. If for the handlers, add a new exception type.'
      author: Krzysztof Cwalina
    - kind: annotation
      text: The error code property in a `System.Exception` is useful when you need to bind the issue to external documentation that details how to fix the problem. This is particularly important with different layers of a framework where the upper layer does not always (and should not) know how the lower layer is implemented. For example, a Web service call could get an exception because the associated database on the server is not started. In that case, you don’t expect the client code to explain how to restart the database when the exception is caught. Instead, you provide a pointer to the documentation and the right section where the whole restarting process is explained.
      author: Christophe Nasarre
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: warning
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not an analyzer candidate: an int, enum or bool return value cannot be told apart from an error code by its type. The Cwalina and Nasarre annotations allow an error code property on an exception. FDG7061 is the same rule for performance reasons.'
- id: FDG7002
  strength: DO
  text: report execution failures by throwing exceptions.
  context: null
  section: 7.1 Exception Throwing
  anchor: sec7_1
  body:
    - kind: paragraph
      text: If a member cannot successfully do what it is designed to do, it should be considered an execution failure, and an exception should be thrown.
    - kind: annotation
      text: A good rule of thumb is that if a method does not do what its name suggests, it should be considered a method-level failure, resulting in an exception. For example, a method called `ReadByte` should throw an exception if there are no more bytes left in a stream to be read. Meanwhile, a method named `ReadChar` should not throw an exception when it reaches end of stream, because EOF is a valid char (in most character sets) that can be returned in this case while still achieving what the method’s name suggests. So a char can be “read” successfully at the end of a stream, whereas a byte cannot.
      author: Jason Clark
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: warning
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'The book shows the cross icon here; the strength word is used. Not machine-checkable: whether a member did what it was designed to do (the Clark annotation: what its name suggests) is judgment.'
- id: FDG7003
  strength: CONSIDER
  text: terminating the process by calling `System.Environment.FailFast` instead of throwing an exception if your code encounters a situation where immediate process termination is necessary.
  context: null
  section: 7.1 Exception Throwing
  anchor: sec7_1
  body:
    - kind: annotation
      text: |-
        An example of the operating system performing a fail fast occurs when the stack is so corrupt that the operating system cannot propagate exceptions through it. In this case, the invariant expectations of the application (i.e., that exceptions propagate) can no longer be satisfied, so the application must terminate.

        An example of the CLR performing a fail fast occurs when the Garbage Collector (GC) heap is so corrupt that we can no longer track managed objects. In this case, a process-wide resource is required for further processing, but it is now corrupt and cannot be returned to a functional state.

        Similar legitimate reasons for fail fast can occur in managed code. For example, if the application cannot revert a security impersonation on a thread (i.e., exceptions are thrown from `WindowsImpersonationContext.Dispose`), that thread must be doomed. But if there is no good way for the application to ensure that no more code runs on this thread— perhaps because it is the Finalizer thread or a ThreadPool thread—then the process must be destroyed. `Environment.FailFast` can be used for this purpose.
      author: Christopher Brumme
    - kind: annotation
      text: '`Environment.FailFast` is a very big hammer and shouldn’t be wielded without thought. FailFast will cause all threads and I/O to terminate immediately, which might leave half-written files or other data corruption and server processes will just cease replying to their clients. If you’ve somehow detected that you’re leaking data across tenant partitions, *maybe* it’s worth an immediate shutdown.'
      author: Jeremy Barton
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: suggestion
    test: suggestion
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'The book shows the cross icon here; the strength word is used. Not machine-checkable: whether immediate termination is necessary is judgment (the Brumme and Barton annotations).'
- id: FDG7004
  strength: DO NOT
  text: use exceptions for the normal flow of control, if possible. Prefer Tester–Doer or the Try pattern to throwing exceptions in common cases.
  context: null
  section: 7.1 Exception Throwing
  anchor: sec7_1
  body:
    - kind: paragraph
      text: Except for system failures and operations with potential race conditions, framework designers should design APIs so users can write code that does not throw exceptions. For example, you can provide a way to check preconditions before calling a member so users can write code that does not throw exceptions.
    - kind: code
      text: |-
        ICollection<int> collection = ...
        if(!collection.IsReadOnly){
           collection.Add(additionalNumber);
        }
    - kind: paragraph
      text: The member used to check preconditions of another member is often referred to as a tester, and the member that actually does the work is called a doer. See section 7.5.1 for more information on the Tester–Doer Pattern.
    - kind: paragraph
      text: Sometimes the Tester–Doer Pattern can have an unacceptable performance overhead. In such cases, consider the Try Pattern instead (see section 7.5.2 for more information).
    - kind: annotation
      text: The Tester–Doer Pattern should be used with caution. The potential problem occurs when you have multiple threads accessing the object at the same time. For example, one thread could execute the tester method, which reports that all is OK, and before the doer method executes, another thread could change the object, causing the doer to fail. Although this pattern might improve performance, it introduces race conditions and must be used with extreme caution.
      author: Jeffrey Richter
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: warning
    application: warning
    test: warning
  config: []
  minLanguage: null
  alternative: null
  analyzer: null
  notes: 'Not machine-checkable: whether a throw is part of the normal flow of control is judgment. CA1854 and CA1864 are not mapped: they ask callers to use TryGetValue and TryAdd instead of a second dictionary lookup, not to avoid exceptions for control flow. The Tester-Doer and Try patterns are FDG7062 and FDG7063.'
