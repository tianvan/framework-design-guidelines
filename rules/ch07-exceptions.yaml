- id: FDG7034
  strength: CONSIDER
  text: wrapping specific exceptions thrown from a lower layer in a more appropriate exception if the lower layer is just an implementation detail for the operation.
  context: null
  section: 7.2.3 Wrapping Exceptions
  anchor: sec7_2_3
  body:
    - kind: paragraph
      text: Such wrapping should be quite rare in a typical framework. It will likely have a negative impact on the ability to debug.
    - kind: code
      text: |-
        try {
           // read the transaction file
        }
        catch(FileNotFoundException e) {
           throw new TransactionFileMissingException(...,e);
        }
    - kind: annotation
      text: 'Chris Brumme’s previous annotation on rethrowing also applies to this context. The example given illustrates the point nicely: For rethrowing to help, the original exception context has to be nearly meaningless and certainly uninteresting to debug. That the original call stack was uninteresting is the controlling factor, in my opinion. In this case, nobody thinks that there is anything wrong with the file opening services— you might as well rethrow something more meaningful to indicate where we had trouble opening files and what file we were trying to open.'
      author: Rico Mariani
    - kind: annotation
      text: 'Another way of stating this is: “Don’t wrap if your users will ever want to look at the inner exception.” By far the worst position to be in is to have to look at an inner exception and base your behavior on the type of the inner exception.'
      author: Eric Gunnerson
  status: draft
  style: false
  check:
    kind: judgment
    diagnostics: []
    coverage: none
  autofix: no
  severity:
    library: suggestion
    application: suggestion
    test: suggestion
  config: []
