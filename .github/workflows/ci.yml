name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same build and tests before it publishes.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: dotnet build -c Release

      # The generated files are committed. Regenerating them must not change anything.
      - name: Generated files are up to date
        run: |
          dotnet run -c Release --no-build --project src/Fdg.Generator -- generate
          git diff --exit-code
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "::error::Generation left uncommitted changes:"
            echo "$dirty"
            exit 1
          fi

      # Includes the Integration tests, which pack the package and the CLI into temporary feeds.
      - name: Test
        run: dotnet test -c Release --no-build --logger trx --results-directory TestResults

      # There is no book in CI, so this validates the rule mappings against the installed SDK only.
      - name: Check rule mappings
        run: dotnet run -c Release --no-build --project src/Fdg.Generator -- check

      - name: Install the Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code@2.1.303

      - name: Validate the marketplace
        run: claude plugin validate --strict .

      - name: Validate the plugin
        run: claude plugin validate --strict plugins/framework-design-guidelines

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

  # The package and the CLI must work on the oldest SDK they support. The repository builds with the SDK in global.json
  # (10.0.402); the integration tests pin FDG_TEST_SDK in the global.json of every sample workspace they create.
  integration-minimum-sdk:
    name: integration-minimum-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      FDG_TEST_SDK: 10.0.100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.402
            10.0.100

      - name: Integration tests on the minimum SDK
        run: dotnet test tests/Fdg.IntegrationTests -c Release -nologo
